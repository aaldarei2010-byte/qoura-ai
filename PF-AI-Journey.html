const DATA={"ST":[{"id":"1","day":1,"h":53,"ic":"layers","nm":{"en":"AI fundamentals","ar":"أساسيات الذكاء الاصطناعي"},"sub":{"en":"Opening, history and the AI family tree","ar":"الافتتاح والتاريخ وشجرة عائلة الذكاء الاصطناعي"},"tools":{"en":["Concepts"],"ar":["مفاهيم"]},"en":["Start with you, then see what AI is, where it came from and why it matters to PF now.","",["Let's start with you: your name, department and what fills your week; how often you use Copilot or AI; what you want to learn in these three days","Your three days in three minutes: the roadmap, what you walk out with, and the timings (9:00 to 14:00)","History quiz: when was the field of AI discovered (1956)? When did generative AI begin (2018)? 2017 versus 2022","The AI family tree: AI, machine learning (the Judge), deep learning, generative AI (the Artist) and LLMs, then the same tree at Presidential Flight","Data is the fuel. The golden rule: garbage in, garbage out","Traditional versus generative AI: analysis versus creation. GenAI helps you start from a draft, not a blank page","Which layer is it? Sort six PF examples: ML, DL, GenAI, DL & GenAI, or none","Why it matters: from analysis to action (see, predict, create, execute, decide and act), the national 50% agentic AI target, and the WEF core skills for 2030","AI will not replace you. People using AI will."],"Your own words on what AI is, what it is not, and where each layer shows up at PF.","",""],"ar":["نبدأ بك، ثم نرى ما الذكاء الاصطناعي، ومن أين جاء، ولماذا يهمّ طيران الرئاسة الآن.","",["لنبدأ بك: اسمك، وإدارتك، وما يملأ أسبوعك؛ وكم مرة تستخدم Copilot أو الذكاء الاصطناعي؛ وما تريد تعلّمه في هذه الأيام الثلاثة","أيامك الثلاثة في ثلاث دقائق: خريطة البرنامج، وما ستخرج به، والتوقيت (من 9:00 إلى 14:00)","اختبار التاريخ: متى نشأ مجال الذكاء الاصطناعي (1956)؟ ومتى بدأ الذكاء الاصطناعي التوليدي (2018)؟ 2017 مقابل 2022","شجرة عائلة الذكاء الاصطناعي: الذكاء الاصطناعي، وتعلّم الآلة (القاضي)، والتعلّم العميق، والذكاء الاصطناعي التوليدي (الفنان)، والنماذج اللغوية الكبيرة، ثم الشجرة نفسها في طيران الرئاسة","البيانات هي الوقود. القاعدة الذهبية: مدخلات رديئة تعني مخرجات رديئة","الذكاء الاصطناعي التقليدي مقابل التوليدي: التحليل مقابل الإبداع. التوليدي يجعلك تبدأ من مسودة لا من صفحة بيضاء","في أي طبقة؟ صنّف ستة أمثلة من طيران الرئاسة: تعلّم آلة، أو تعلّم عميق، أو توليدي، أو تعلّم عميق وتوليدي معاً، أو لا شيء","لماذا يهمّ: من التحليل إلى التنفيذ (نرى، نتنبأ، ننشئ، ننفّذ، يقرّر وينفّذ)، والمستهدف الوطني بنقل 50% إلى الذكاء الاصطناعي الوكيلي، ومهارات 2030 الأساسية من المنتدى الاقتصادي العالمي","لن يحلّ الذكاء الاصطناعي محلّك، بل سيحلّ محلّك من يستخدمه."],"فهمك بكلماتك لما هو الذكاء الاصطناعي وما ليس هو، وأين تظهر كل طبقة في طيران الرئاسة.","",""],"P":[],"wide":false,"br":{"en":["AI","ML","DL","GenAI"],"ar":["الذكاء الاصطناعي","تعلّم الآلة","التعلّم العميق","التوليدي"]},"nochips":true,"fmt":{"en":"Activity, input and quiz","ar":"نشاط وعرض واختبار"},"tn":{"en":["Learning moments today: AI predicts, it does not think; the prompt decides the answer; approved does not mean verified; Copilot works better when it knows you; long and messy becomes clear and checked.","Agree the finish time with the room this morning. If they ask for 13:30, the Day 1 overflow moves to Day 2.","Which layer is it, answers: 1 catering demand forecast = ML; 2 handwritten form scanner = DL; 3 meeting notes to action-item email = GenAI; 4 leave request rejected by balance rule = NONE (a validation rule); 5 drone flags damaged roof panels and writes the note = DL & GenAI; 6 face unlock = DL.","50% target source: WAM, April 2026. WEF Future of Jobs Report 2025 for core skills."],"ar":["لحظات التعلّم اليوم: الذكاء الاصطناعي يتنبأ ولا يفكّر؛ الأمر يحدّد الإجابة؛ المعتمد لا يعني المُتحقَّق منه؛ يعمل Copilot أفضل عندما يعرفك؛ الطويل والمبعثر يصبح واضحاً ومُدقَّقاً.","اتفق مع الحضور صباح اليوم على وقت الانتهاء. إن طلبوا 13:30 ينتقل ما يزيد من اليوم الأول إلى اليوم الثاني.","إجابات «في أي طبقة؟»: 1 توقّع طلب التموين = تعلّم آلة؛ 2 قارئ النماذج المكتوبة بخط اليد = تعلّم عميق؛ 3 ملاحظات اجتماع إلى بريد بالمهام = توليدي؛ 4 رفض طلب إجازة لتجاوز الرصيد = لا شيء (قاعدة تحقق)؛ 5 طائرة مسيّرة ترصد ألواح السقف التالفة وتكتب الملاحظة = تعلّم عميق وتوليدي؛ 6 فتح الهاتف بالوجه = تعلّم عميق.","مصدر مستهدف 50%: وام، أبريل 2026. ومهارات 2030 من تقرير مستقبل الوظائف 2025."]}},{"id":"2","day":1,"h":18,"ic":"cpu","nm":{"en":"How Copilot works","ar":"كيف يعمل Copilot"},"sub":{"en":"Tokens, grounding and the model picker","ar":"الرموز والمصادر واختيار النموذج"},"tools":{"en":["Microsoft 365 Copilot"],"ar":["Microsoft 365 Copilot"]},"en":["See what happens between your prompt and Copilot's answer, and which source it is drawing on.","",["How GenAI works: input text is broken into tokens, and the model predicts the next most probable token","Tokenizer and QuickDraw on the trainer's laptop, then the car wash test","Grounding: Work (your email, calendar, Teams and files, only what you can already access), Web (public results with links; switch it off for internal questions), and what you give it (files, pasted text, the open document)","Same question, different grounding, different answer. Check which one you used","The model picker: Auto (start here), Quick (drafts and rewrites), Think deeper (analysis, planning, trade-offs). Which models you see is set by PF IT","Right tool, right job: Microsoft 365 Copilot is your work tool. No PF data outside Copilot. Ever."],"You know where Copilot gets its answers and which mode to pick for each job.","",""],"ar":["شاهد ما يحدث بين أمرك وإجابة Copilot، ومن أي مصدر يستقي إجابته.","",["كيف يعمل الذكاء الاصطناعي التوليدي: يُقسَّم النص إلى رموز، ويتنبأ النموذج بالرمز التالي الأكثر احتمالاً","أداة تقسيم الرموز وQuickDraw على حاسوب المدرب، ثم اختبار مغسلة السيارات","مصادر الإجابة: العمل (بريدك وتقويمك ومحادثات Teams وملفاتك، وفق صلاحياتك فقط)، والويب (نتائج عامة مع روابط؛ أوقفه للأسئلة الداخلية)، وما تعطيه أنت (ملفات مرفقة، نص ملصوق، المستند المفتوح)","السؤال نفسه بمصدر مختلف يعطي إجابة مختلفة. تحقّق من المصدر الذي استخدمته","اختيار النموذج: تلقائي (ابدأ به)، سريع (مسودات وإعادة صياغة)، تفكير أعمق (تحليل وتخطيط وموازنة). النماذج المتاحة يحددها قسم تقنية المعلومات","الأداة المناسبة للمهمة المناسبة: Microsoft 365 Copilot هو أداة عملك. لا بيانات لطيران الرئاسة خارج Copilot. أبداً."],"تعرف من أين يأتي Copilot بإجاباته، وأي وضع تختار لكل مهمة.","",""],"P":[],"wide":false,"br":{"en":["Work","Web","What you give it"],"ar":["العمل","الويب","ما تعطيه"]},"fmt":{"en":"Demo","ar":"عرض عملي"},"tn":{"en":["Run the tokenizer and QuickDraw on the trainer laptop only.","Right tool, right job table: Copilot = work tool, all PF data stays here; ChatGPT = personal use, public info only; Claude = not approved at PF; Gemini, Grok = personal use only; Perplexity = personal use, public info only."],"ar":["شغّل أداة الرموز وQuickDraw على حاسوب المدرب فقط.","جدول الأداة المناسبة: Copilot أداة العمل وكل بيانات طيران الرئاسة تبقى فيه؛ ChatGPT للاستخدام الشخصي والمعلومات العامة فقط؛ Claude غير معتمد في طيران الرئاسة؛ Gemini وGrok للاستخدام الشخصي فقط؛ Perplexity للاستخدام الشخصي والمعلومات العامة فقط."]}},{"id":"3","day":1,"h":30,"ic":"shield","nm":{"en":"Responsible use","ar":"الاستخدام المسؤول"},"sub":{"en":"Ahmed or Khalid, and the traffic light","ar":"أحمد أم خالد، وإشارة المرور"},"tools":{"en":["Discussion"],"ar":["نقاش"]},"en":["Decide what goes into AI, what never does, and how fast is too fast.","",["The choice is yours: do you want to be Ahmed or Khalid?","Dilemma 01: two directors, one deadline (below). Read, share a view, discuss, challenge, debrief","Four boundaries of AI: misinformation and inaccuracy, systematic bias, data protection, shadow AI","The traffic light. RED, never unless officially approved: VIP and passenger names, schedules and movements, employee personal data, passwords, contracts and prices. AMBER, Copilot only: internal procedures, draft reports, operational data, meeting notes. GREEN, safe: public documents, anonymised or invented examples, your own general questions, industry research","If you are not sure, treat it as red and ask","Sort it, red, amber or green: 1 a published industry report on AI in aviation; 2 next week's VIP flight schedule; 3 your notes from a team meeting on a training plan; 4 a procurement decision not yet announced; 5 a made-up vendor enquiry email; 6 your laptop password; 7 a vendor price list from a live tender; 8 last month's attendance figures","Cyber risks you now own: data leaving, prompt injection, AI-generated phishing, over-sharing with assistants"],"The traffic light in your head: red, amber or green before anything goes into AI.","",""],"ar":["قرّر ما يدخل إلى الذكاء الاصطناعي وما لا يدخل أبداً، ومتى تصبح السرعة تهوّراً.","",["القرار لك: هل تريد أن تكون أحمد أم خالد؟","المعضلة 01: مديران وموعد واحد (أدناه). اقرأ، شارك رأيك، ناقش، تحدَّ، ثم الخلاصة","حدود الذكاء الاصطناعي الأربعة: المعلومات المضللة وعدم الدقة، والتحيّز المنهجي، وحماية البيانات، والذكاء الاصطناعي الخفي","إشارة المرور. الأحمر، أبداً إلا بموافقة رسمية: أسماء كبار الشخصيات والمسافرين وجداولهم وتنقلاتهم، والبيانات الشخصية للموظفين، وكلمات المرور، والعقود والأسعار. الأصفر، في Copilot فقط: الإجراءات الداخلية، ومسودات التقارير، والبيانات التشغيلية، وملاحظات الاجتماعات. الأخضر، آمن: الوثائق العامة، والأمثلة المجهّلة أو المختلقة، وأسئلتك العامة، وأبحاث القطاع","إذا لم تكن متأكداً فاعتبره أحمر واسأل","صنّفها أحمر أو أصفر أو أخضر: 1 تقرير منشور عن الذكاء الاصطناعي في الطيران؛ 2 جدول رحلات كبار الشخصيات للأسبوع القادم؛ 3 ملاحظاتك من اجتماع فريق عن خطة تدريب؛ 4 قرار مشتريات لم يُعلن بعد؛ 5 بريد استفسار مختلق من مورّد؛ 6 كلمة مرور حاسوبك؛ 7 قائمة أسعار مورّد من مناقصة قائمة؛ 8 أرقام الحضور للشهر الماضي","مخاطر سيبرانية أصبحت مسؤوليتك: تسرّب البيانات، وحقن الأوامر، والتصيّد المكتوب بالذكاء الاصطناعي، والإفراط في المشاركة مع المساعدات الذكية"],"إشارة المرور في ذهنك: أحمر أو أصفر أو أخضر قبل أن يدخل أي شيء إلى الذكاء الاصطناعي.","",""],"P":[],"wide":false,"br":{"en":["Red","Amber","Green"],"ar":["أحمر","أصفر","أخضر"]},"dl":[{"n":"01","t":{"en":"Two directors, one deadline","ar":"مديران وموعد واحد"},"s":{"en":"The CEO needs a one-page view of next year's priorities for an 8:00 meeting. Khalid uses Copilot, spot-checks two figures and sends at 7:30; his page shapes the decision. Ahmed verifies every figure and sends at 8:20, after the meeting has started. One of Khalid's figures was 4% off. It did not change the decision.","ar":"يحتاج الرئيس التنفيذي إلى صفحة واحدة بأولويات العام القادم لاجتماع الساعة 8:00. يستخدم خالد Copilot، ويتحقق من رقمين عشوائياً، ويرسلها 7:30؛ فتشكّل صفحته القرار. أما أحمد فيتحقق من كل رقم ويرسلها 8:20 بعد بدء الاجتماع. كان أحد أرقام خالد مختلفاً بنسبة 4%، ولم يغيّر ذلك القرار."},"q":{"en":"“For time-critical briefs, speed with spot checks should be the standard. Full verification is a luxury.”","ar":"«في الموجزات العاجلة يجب أن تكون السرعة مع التحقق العشوائي هي المعيار. التحقق الكامل ترف.»"},"x":{"en":"Which documents need full verification, and which can go with spot checks? Who decides?","ar":"أي المستندات تحتاج تحققاً كاملاً، وأيها يكفيه التحقق العشوائي؟ ومن يقرّر؟"}}],"fmt":{"en":"Input, discussion and activity","ar":"عرض ونقاش ونشاط"},"tn":{"en":["Dilemma flow: read in silence (1 min), share a view round the table (1 min), discuss (4 min), challenge (2 min), debrief (2 min). No sides, no votes. The CEO speaks last.","Sort it, answers: 1 GREEN, 2 RED, 3 AMBER, 4 RED, 5 GREEN, 6 RED, 7 RED, 8 AMBER.","Cyber risks: new AI models are cleared through the UAE Cyber Security Council (H.E. Dr Mohamed Al Kuwaiti)."],"ar":["مسار المعضلة: قراءة صامتة (دقيقة)، رأي كل مشارك (دقيقة)، نقاش (4 دقائق)، تحدٍّ (دقيقتان)، خلاصة (دقيقتان). لا فرق ولا تصويت. الرئيس التنفيذي يتحدث أخيراً.","إجابات «صنّفها»: 1 أخضر، 2 أحمر، 3 أصفر، 4 أحمر، 5 أخضر، 6 أحمر، 7 أحمر، 8 أصفر.","المخاطر السيبرانية: تُعتمد نماذج الذكاء الاصطناعي الجديدة عبر مجلس الأمن السيبراني (سعادة الدكتور محمد الكويتي)."]}},{"id":"4","day":1,"h":45,"ic":"terminal","nm":{"en":"Your role, with CRAFT","ar":"دورك مع CRAFT"},"sub":{"en":"Exercise 1 · How will AI impact your role?","ar":"التمرين 1 · كيف سيؤثر الذكاء الاصطناعي على دورك؟"},"tools":{"en":["Copilot Chat"],"ar":["Copilot Chat"]},"en":["Ask the same question twice, first in your own words and then with CRAFT, and compare the two answers side by side.","",["What is prompting: the prompt (what you ask and everything you give it), the language model, the output. The quality of the prompt decides the quality of the output","Types of GenAI output: text, image, audio, video, synthetic data","How Copilot reads a photo (OCR), then the live demo: four receipts to an expense report (prompt 4.C)","Ask Copilot in your own words: “How will AI impact [your role]?” (prompt 4.A)","Anatomy of a prompt, CRAFT: Context, Role, Action, Format, Target","Ask again with CRAFT (prompt 4.B) and compare the two answers side by side","Demo: start your prompt library. Create a Copilot Page called ‘My prompt library’, paste your CRAFT prompt, label it, share one with a colleague this week","Other frameworks: D-R-E-A-M, S-O-L-V-E, C-A-R-E, R-A-C-E","No input, no output: what would you give AI first for a delayed spare-part email, a 60-page regulation, and three different handovers?"],"A role-impact plan with quick wins and a 30-60-90 day plan, and the first prompt in your library.","",""],"ar":["اطرح السؤال نفسه مرتين، أولاً بكلماتك ثم بإطار CRAFT، وقارن الإجابتين جنباً إلى جنب.","",["ما هو الأمر: الأمر (ما تطلبه وكل ما تعطيه)، والنموذج اللغوي، والمخرجات. جودة الأمر تحدد جودة المخرجات","أنواع مخرجات الذكاء الاصطناعي التوليدي: نص، وصورة، وصوت، وفيديو، وبيانات اصطناعية","كيف يقرأ Copilot الصورة (التعرّف الضوئي على النصوص)، ثم العرض المباشر: أربعة إيصالات إلى تقرير مصروفات (الأمر ⁦4.C⁩)","اسأل Copilot بكلماتك: «كيف سيؤثر الذكاء الاصطناعي على [دورك الوظيفي]؟» (الأمر ⁦4.A⁩)","تشريح الأمر، CRAFT: السياق، والدور، والمهمة، والصيغة، والمعيار","اسأل مرة أخرى بإطار CRAFT (الأمر ⁦4.B⁩) وقارن الإجابتين جنباً إلى جنب","عرض: ابدأ مكتبة أوامرك. أنشئ صفحة Copilot باسم «مكتبة أوامري»، والصق أمر CRAFT، وصنّفه، وشارك أمراً واحداً مع زميل هذا الأسبوع","أطر أخرى: D-R-E-A-M وS-O-L-V-E وC-A-R-E وR-A-C-E","لا مدخلات، لا مخرجات: ماذا تعطي الذكاء الاصطناعي أولاً في بريد عن قطعة غيار متأخرة، ولائحة من 60 صفحة، وثلاث طرق مختلفة للتسليم؟"],"خطة لأثر الذكاء الاصطناعي على دورك بمكاسب سريعة وخطة 30-60-90 يوماً، وأول أمر في مكتبتك.","",""],"P":[["4.A","In your own words","بكلماتك","Copilot Chat","How will AI impact [your role]?","كيف سيؤثر الذكاء الاصطناعي على [دورك الوظيفي]؟"],["4.B","The same question, with CRAFT","السؤال نفسه بإطار CRAFT","Copilot Chat","Context: I work at Presidential Flight, a UAE government aviation operator. My core tasks include [2–3 daily tasks]. My goal is to cut manual admin and make better use of Copilot.\nRole: Act as an expert career coach and analyst for the aviation sector. Tone: direct, practical, encouraging.\nAction: Analyse how AI will affect my role as [your role] over the next 12 months. Give daily quick wins and longer-term opportunities, and name the type of AI behind each.\nFormat: Bold headings. Top 3 time-savers, 2 risks, and a 30-60-90 day plan. Under 250 words.\nTarget: No sci-fi predictions, no corporate jargon. Every quick win must be doable today in Microsoft 365 Copilot.","السياق: أعمل في طيران الرئاسة، وهي جهة حكومية إماراتية لتشغيل الطيران. تشمل مهامي الأساسية [2–3 مهام يومية]. هدفي تقليل الأعمال الإدارية اليدوية والاستفادة أكثر من Copilot.\nالدور: تصرّف كمدرّب مهني ومحلّل خبير في قطاع الطيران. النبرة: مباشرة، وعملية، ومشجّعة.\nالمهمة: حلّل كيف سيؤثر الذكاء الاصطناعي على دوري بصفتي [دورك الوظيفي] خلال الأشهر الاثني عشر القادمة. أعطني مكاسب يومية سريعة وفرصاً على المدى الأطول، واذكر نوع الذكاء الاصطناعي وراء كل منها.\nالصيغة: عناوين بخط عريض. أهم 3 أمور توفّر الوقت، وخطران، وخطة 30-60-90 يوماً. أقل من 250 كلمة.\nالمعيار: لا توقعات خيالية ولا مصطلحات إدارية مبهمة. يجب أن يكون كل مكسب سريع قابلاً للتنفيذ اليوم في Microsoft 365 Copilot."],["4.C","Live demo: receipts to an expense report","عرض مباشر: من الإيصالات إلى تقرير مصروفات","Copilot Chat","Read every receipt. Extract date, vendor, amount, currency and category into a table.\n\nThen: Build an expense report with totals by category in AED. Mark anything you cannot read as [unclear].","اقرأ كل إيصال. استخرج التاريخ، والمورّد، والمبلغ، والعملة، والفئة في جدول.\n\nثم: أعدّ تقرير مصروفات بالإجماليات حسب الفئة بالدرهم الإماراتي. ضع [غير واضح] على أي شيء لا تستطيع قراءته."]],"wide":false,"fmt":{"en":"Input, demo and exercise","ar":"عرض وعرض عملي وتمرين"},"tn":{"en":["Receipt demo: photograph four fictional receipts (taxi, meal, hotel, parking), one in USD and one hard to read. Check three words or numbers against the original. Never photograph passports, VIP schedules or anything restricted.","Timing: prompting basics 15 min, Exercise 1 20 min, prompt library demo 3 min, frameworks and no input, no output 7 min."],"ar":["عرض الإيصالات: صوّر أربعة إيصالات افتراضية (تاكسي، وجبة، فندق، موقف)، أحدها بالدولار وآخر صعب القراءة. تحقق من ثلاث كلمات أو أرقام مقابل الأصل. لا تصوّر جوازات السفر أو جداول كبار الشخصيات أو أي شيء مقيّد.","التوقيت: أساسيات الأوامر 15 دقيقة، التمرين 1 عشرون دقيقة، عرض مكتبة الأوامر 3 دقائق، الأطر و«لا مدخلات لا مخرجات» 7 دقائق."]}},{"id":"5","day":1,"h":10,"ic":"user","nm":{"en":"Introduce yourself","ar":"عرّف Copilot بنفسك"},"sub":{"en":"Exercise 2 · Flip the script","ar":"التمرين 2 · اقلب الأدوار"},"tools":{"en":["Copilot Chat","Memory"],"ar":["Copilot Chat","الذاكرة"]},"en":["Let Copilot interview you about your role and priorities, so it writes a short profile and every future answer fits your job.","",["Open a new chat and paste the interview prompt (5.A)","Answer Copilot's questions one at a time. Work only: nothing confidential or personal","Read the profile it writes. Correct anything wrong or vague","Save it in Copilot's personalisation and memory settings","Test it: ask a work question in a new chat. Does the answer now fit your role?"],"A short “how I work” profile saved in Copilot, so every chat starts with your context.","",""],"ar":["دع Copilot يجري معك مقابلة عن دورك وأولوياتك، ليكتب ملفاً مختصراً تناسب بعده كل إجاباته عملك.","",["افتح محادثة جديدة والصق أمر المقابلة (⁦5.A⁩)","أجب عن أسئلة Copilot واحداً تلو الآخر. معلومات العمل فقط: لا شيء سرّي أو شخصي","اقرأ الملف الذي يكتبه. صحّح أي شيء خاطئ أو مبهم","احفظه في إعدادات التخصيص والذاكرة في Copilot","اختبره: اطرح سؤال عمل في محادثة جديدة. هل تناسب الإجابة دورك الآن؟"],"ملف مختصر بعنوان «كيف أعمل» محفوظ في Copilot، لتبدأ كل محادثة وهي تعرف سياقك.","",""],"P":[["5.A","The interview prompt","أمر المقابلة","Copilot Chat","Context: I want you to know how I work so your answers fit my role from the first message.\nRole: Act as an executive assistant on your first day with a new manager.\nAction: Interview me one question at a time, up to eight questions, about my role, my team, my stakeholders, my recurring tasks and how I like information presented.\nFormat: When we finish, write a ‘My working context’ profile in bullet points, under 200 words, that I can save in Copilot.\nTarget: Do not guess. If an answer is vague, ask one follow-up. Leave out anything confidential or personal.","السياق: أريدك أن تعرف كيف أعمل لتناسب إجاباتك دوري من أول رسالة.\nالدور: تصرّف كمساعد تنفيذي في يومه الأول مع مدير جديد.\nالمهمة: أجرِ معي مقابلة بسؤال واحد في كل مرة، حتى ثمانية أسئلة، عن دوري وفريقي والجهات التي أتعامل معها ومهامي المتكررة والطريقة التي أفضّل أن تُعرض بها المعلومات.\nالصيغة: عندما ننتهي، اكتب ملفاً بعنوان «سياق عملي» في نقاط، بأقل من 200 كلمة، يمكنني حفظه في Copilot.\nالمعيار: لا تخمّن. إذا كانت الإجابة مبهمة فاسأل سؤال متابعة واحداً. استبعد أي شيء سرّي أو شخصي."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["Check before the session that saved memories are enabled on the PF tenant."],"ar":["تأكد قبل الجلسة من تفعيل الذاكرة المحفوظة في بيئة طيران الرئاسة."]}},{"id":"6","day":1,"h":25,"ic":"plane","nm":{"en":"The Kenya departure","ar":"رحلة كينيا"},"sub":{"en":"Exercise 3 · Plan it together","ar":"التمرين 3 · خطّطوا معاً"},"tools":{"en":["Copilot Chat","Outlook","Teams"],"ar":["Copilot Chat","Outlook","Teams"]},"en":["In groups, plan a VVIP departure with Copilot, from a whiteboard brainstorm to a timed plan, a risk list and a team briefing. VVIP families fly to Kenya on Thursday; PF owns everything from arrival to take-off. Fictional case: no real names, schedules or movements.","",["Brainstorm together: what must go right, from arrival to take-off. Write it on the whiteboard","Photograph the whiteboard. Ask Copilot for a timed plan with owners: reception, boarding, catering, baggage, pre-flight checks (6.A)","Ask: “What could go wrong?” Get the top risks, with a contingency for each (6.B)","Ask for a one-page briefing for the ground and cabin team, in English and Arabic (6.C)","In Copilot Chat, ask it to book the prep meetings: title, roles invited, agenda, Teams link (6.D)","Debrief, what you just used: read (deep learning turns handwriting into text), analyse (machine learning turns steps into a timeline), create (GenAI writes the checklist)"],"A timed plan, a risk list, a bilingual briefing and the prep meetings in your calendar.","",""],"ar":["في مجموعات، خطّطوا لمغادرة كبار الشخصيات مع Copilot، من عصف ذهني على السبورة إلى خطة زمنية وقائمة مخاطر وإحاطة للفريق. عائلات من كبار الشخصيات تسافر إلى كينيا يوم الخميس، وطيران الرئاسة مسؤول عن كل شيء من الوصول حتى الإقلاع. حالة افتراضية: لا أسماء أو جداول أو تنقلات حقيقية.","",["اعصفوا ذهنياً معاً: ما الذي يجب أن يسير على ما يرام من الوصول حتى الإقلاع؟ اكتبوه على السبورة","صوّروا السبورة، واطلبوا من Copilot خطة زمنية بالمسؤولين: الاستقبال، والصعود، والتموين، والأمتعة، وفحوص ما قبل الرحلة (⁦6.A⁩)","اسألوا: «ما الذي قد يسوء؟» واحصلوا على أهم المخاطر مع خطة بديلة لكل منها (⁦6.B⁩)","اطلبوا إحاطة من صفحة واحدة للفريق الأرضي وطاقم الضيافة، بالعربية والإنجليزية (⁦6.C⁩)","في Copilot Chat اطلبوا حجز اجتماعات التحضير: العنوان، والأدوار المدعوة، وجدول الأعمال، ورابط Teams (⁦6.D⁩)","الخلاصة، ما استخدمتموه للتو: القراءة (التعلّم العميق يحوّل الخط اليدوي إلى نص)، والتحليل (تعلّم الآلة يحوّل الخطوات إلى جدول زمني)، والإنشاء (التوليدي يكتب قائمة التحقق)"],"خطة زمنية، وقائمة مخاطر، وإحاطة بلغتين، واجتماعات التحضير في تقويمك.","",""],"P":[["6.A","Whiteboard to timed plan","من السبورة إلى خطة زمنية","Copilot Chat","[Attach the whiteboard photo] This is our brainstorm for a fictional VVIP departure to Kenya on Thursday. PF owns everything from arrival to take-off. Turn it into a timed plan with an owner for each step: reception, boarding, catering, baggage and pre-flight checks. Format: a table with time, step, owner and notes. Mark anything you cannot read on the photo as [unclear].","[أرفق صورة السبورة] هذا عصفنا الذهني لمغادرة افتراضية لكبار الشخصيات إلى كينيا يوم الخميس. طيران الرئاسة مسؤول عن كل شيء من الوصول حتى الإقلاع. حوّله إلى خطة زمنية بمسؤول لكل خطوة: الاستقبال، والصعود، والتموين، والأمتعة، وفحوص ما قبل الرحلة. الصيغة: جدول بالوقت والخطوة والمسؤول والملاحظات. ضع [غير واضح] على أي شيء لا تستطيع قراءته في الصورة."],["6.B","What could go wrong?","ما الذي قد يسوء؟","Copilot Chat","What could go wrong? Give me the top risks in this plan, with a contingency for each.","ما الذي قد يسوء؟ أعطني أهم المخاطر في هذه الخطة، مع خطة بديلة لكل منها."],["6.C","Bilingual team briefing","إحاطة الفريق بلغتين","Copilot Chat","Write a one-page briefing for the ground and cabin team based on this plan, in English and Arabic.","اكتب إحاطة من صفحة واحدة للفريق الأرضي وطاقم الضيافة بناءً على هذه الخطة، بالعربية والإنجليزية."],["6.D","Book the prep meetings","احجز اجتماعات التحضير","Copilot Chat (Work)","Book the prep meetings for this departure in my calendar: a title, the roles to invite, an agenda and a Teams link for each.","احجز اجتماعات التحضير لهذه الرحلة في تقويمي: لكل اجتماع عنوان، والأدوار المدعوة، وجدول أعمال، ورابط Teams."]],"wide":false,"br":{"en":["Read","Analyse","Create"],"ar":["اقرأ","حلّل","أنشئ"]},"fmt":{"en":"Group exercise","ar":"تمرين جماعي"},"tn":{"en":["Room needs a whiteboard. Groups photograph it on their own phones; nothing real goes on the board.","Check meeting booking from Copilot Chat is enabled on the tenant before the session."],"ar":["تحتاج القاعة إلى سبورة. تصوّر المجموعات السبورة بهواتفها؛ ولا يُكتب عليها أي شيء حقيقي.","تحقق قبل الجلسة من تفعيل حجز الاجتماعات من Copilot Chat في البيئة."]}},{"id":"7","day":1,"h":10,"ic":"mail","nm":{"en":"Your executive assistant","ar":"مساعدك التنفيذي"},"sub":{"en":"Exercise 4 · The email sweep","ar":"التمرين 4 · فرز البريد"},"tools":{"en":["Copilot Chat","Outlook"],"ar":["Copilot Chat","Outlook"]},"en":["Use Copilot as your executive assistant: it sorts your inbox, shows you what you missed and drafts a reply for you to check.","",["Open Copilot Chat (Work mode) and paste the email sweep prompt (7.A)","Read the three lists and ‘What you missed’. Is anything wrong or missing?","Ask Copilot to draft a reply to one ‘needs action’ email (7.B)","Edit the draft until it sounds like you. Do not send","Never project your inbox: work on your own screen"],"Your inbox sorted, what you missed flagged, and a reply drafted in Copilot.","",""],"ar":["استخدم Copilot كمساعدك التنفيذي: يفرز بريدك، ويبيّن لك ما فاتك، ويكتب مسودة رد تراجعها أنت.","",["افتح Copilot Chat (وضع العمل) والصق أمر فرز البريد (⁦7.A⁩)","اقرأ القوائم الثلاث و«ما فاتك». هل هناك خطأ أو شيء ناقص؟","اطلب من Copilot مسودة رد على بريد واحد من «يحتاج إجراء» (⁦7.B⁩)","عدّل المسودة حتى تشبه أسلوبك. لا ترسلها","لا تعرض بريدك على الشاشة الكبيرة: اعمل على شاشتك"],"بريدك مفروزاً، وما فاتك محدداً، ورداً مكتوباً كمسودة في Copilot.","",""],"P":[["7.A","The email sweep prompt","أمر فرز البريد","Copilot Chat (Work)","Context: I am [your role] at Presidential Flight. I receive a high volume of email and need to see quickly what needs me.\nRole: Act as my executive assistant. Concise and direct.\nAction: Review my unread emails from the last 7 days and sort them: needs my action, important to know, can wait. Then list anything I was asked to do and have not answered.\nFormat: Three short lists with sender, subject and one line each. Then ‘What you missed’ with the date it was asked. Under 250 words.\nTarget: Use only my mailbox. Do not send, delete or move anything. Mark anything uncertain as [check].","السياق: أنا [دورك الوظيفي] في طيران الرئاسة. يصلني بريد كثير وأحتاج أن أرى بسرعة ما يحتاجني.\nالدور: تصرّف كمساعدي التنفيذي. باختصار ومباشرة.\nالمهمة: راجع رسائلي غير المقروءة في آخر 7 أيام وصنّفها: يحتاج إجراءً مني، ومهم للاطلاع، ويمكن أن ينتظر. ثم اذكر أي شيء طُلب مني ولم أرد عليه.\nالصيغة: ثلاث قوائم قصيرة بالمرسل والموضوع وسطر واحد لكل رسالة. ثم «ما فاتك» مع تاريخ الطلب. أقل من 250 كلمة.\nالمعيار: استخدم صندوق بريدي فقط. لا ترسل أو تحذف أو تنقل أي شيء. ضع [تحقّق] على أي شيء غير مؤكد."],["7.B","Draft one reply","مسودة رد واحد","Copilot Chat (Work)","Draft a reply to [the ‘needs action’ email]. Keep it short and in my tone. Do not send it.","اكتب مسودة رد على [البريد الذي يحتاج إجراءً]. اجعله قصيراً وبأسلوبي. لا ترسله."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["Use the Qoura M365 demo account for any Outlook demo on the projector."],"ar":["استخدم حساب Qoura التجريبي في Microsoft 365 لأي عرض لـ Outlook على الشاشة."]}},{"id":"8","day":1,"h":5,"ic":"repeat","nm":{"en":"Make it weekly","ar":"اجعله أسبوعياً"},"sub":{"en":"Exercise 5 · Schedule the sweep","ar":"التمرين 5 · جدولة الفرز"},"tools":{"en":["Copilot Chat","Scheduled prompts"],"ar":["Copilot Chat","الأوامر المجدولة"]},"en":["Make Copilot run your inbox sweep automatically every Sunday morning, so your week starts sorted without you asking.","",["Take the email sweep prompt you just used","Schedule it: every Sunday at 7:00, same time every week","Choose where the result lands: in Copilot Chat or by email","Run it once now to test it","Add one check you care about, for example anything from the CEO's office (8.A)"],"A weekly email sweep that runs itself every Sunday at 7:00.","",""],"ar":["اجعل Copilot يشغّل فرز بريدك تلقائياً صباح كل أحد، لتبدأ أسبوعك مرتباً دون أن تطلب.","",["خذ أمر فرز البريد الذي استخدمته للتو","جدوله: كل أحد الساعة 7:00، في الوقت نفسه كل أسبوع","اختر أين تصل النتيجة: في Copilot Chat أو بالبريد","شغّله مرة الآن لتختبره","أضف فحصاً واحداً يهمك، مثل أي شيء من مكتب الرئيس التنفيذي (⁦8.A⁩)"],"فرز أسبوعي للبريد يعمل وحده كل أحد الساعة 7:00.","",""],"P":[["8.A","The extra check","الفحص الإضافي","Copilot Chat (scheduled)","Add to the sweep: list anything from [the CEO's office] first, even if it is already read.","أضف إلى الفرز: اعرض أولاً أي شيء من [مكتب الرئيس التنفيذي]، حتى لو كان مقروءاً."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["Scheduled prompts must be enabled on the tenant. If not, show it on the demo account."],"ar":["يجب أن تكون الأوامر المجدولة مفعّلة في البيئة، وإلا فاعرضها على الحساب التجريبي."]}},{"id":"9","day":1,"h":10,"ic":"doc","nm":{"en":"The director brief","ar":"موجز المدير"},"sub":{"en":"Exercise 6 · 65 pages in two minutes","ar":"التمرين 6 · 65 صفحة في دقيقتين"},"tools":{"en":["Copilot Chat","OneDrive"],"ar":["Copilot Chat","OneDrive"]},"en":["Turn a 65-page IATA report into a one-page brief your director can read in two minutes, with every figure checked.","",["Open the IATA Annual Review 2026 on OneDrive and attach it to Copilot","Paste the director brief prompt (9.A)","Check two figures against the page Copilot cites","Push back once (9.B): “What did you leave out that my director would want?”","Save the final brief"],"A one-page brief a director can read in two minutes, with every figure traced to a page.","",""],"ar":["حوّل تقرير IATA من 65 صفحة إلى موجز من صفحة واحدة يقرؤه مديرك في دقيقتين، مع التحقق من كل رقم.","",["افتح التقرير السنوي لـ IATA لعام 2026 من OneDrive وأرفقه في Copilot","الصق أمر موجز المدير (⁦9.A⁩)","تحقق من رقمين مقابل الصفحة التي يستشهد بها Copilot","اعترض مرة واحدة (⁦9.B⁩): «ما الذي أغفلته ويريده مديري؟»","احفظ الموجز النهائي"],"موجز من صفحة واحدة يقرؤه المدير في دقيقتين، وكل رقم فيه مرتبط بصفحته.","",""],"P":[["9.A","The director brief prompt","أمر موجز المدير","Copilot Chat","Context: The IATA Annual Review 2026 is long and written for specialists. My director will not read it. They need what changed, what is a problem and what needs a decision, with the numbers attached.\nRole: Act as a performance analyst supporting the leadership of a UAE government aviation operator. Tone: concise, factual, decision-oriented.\nAction: Read the attached report and extract the key insights as a one-page brief my director can read in two minutes.\nFormat: Five plain-language bullets. Then a table of 5–6 indicators: metric, figure, direction (↑ ↓ →) and a one-line ‘so what’. Then the top 3 issues needing a decision.\nTarget: Use only the attached document. Give the page or section for every figure. If something is not clearly stated, write [not stated] instead of estimating.","السياق: التقرير السنوي لـ IATA لعام 2026 طويل ومكتوب للمتخصصين، ولن يقرأه مديري. يحتاج أن يعرف ما الذي تغيّر، وما المشكلة، وما الذي يحتاج قراراً، مع الأرقام.\nالدور: تصرّف كمحلّل أداء يدعم قيادة جهة حكومية إماراتية لتشغيل الطيران. النبرة: موجزة، وواقعية، وموجّهة للقرار.\nالمهمة: اقرأ التقرير المرفق واستخرج أهم الرؤى في موجز من صفحة واحدة يقرؤه مديري في دقيقتين.\nالصيغة: خمس نقاط بلغة بسيطة. ثم جدول من 5–6 مؤشرات: المؤشر، والرقم، والاتجاه (↑ ↓ →)، وسطر واحد «وماذا يعني ذلك». ثم أهم 3 قضايا تحتاج قراراً.\nالمعيار: استخدم المستند المرفق فقط. اذكر الصفحة أو القسم لكل رقم. إذا لم يُذكر شيء بوضوح فاكتب [غير مذكور] بدلاً من التقدير."],["9.B","Push back once","اعترض مرة واحدة","Copilot Chat","What did you leave out that my director would want?","ما الذي أغفلته ويريده مديري؟"]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["File on PF OneDrive: IATA Annual Review 2026. It feeds Exercise 7 too."],"ar":["الملف على OneDrive طيران الرئاسة: التقرير السنوي لـ IATA لعام 2026، ويُستخدم أيضاً في التمرين 7."]}},{"id":"10","day":1,"h":10,"ic":"slides","nm":{"en":"Two slides, with motion","ar":"شريحتان متحركتان"},"sub":{"en":"Exercise 7 · The brief on screen","ar":"التمرين 7 · الموجز على الشاشة"},"tools":{"en":["Copilot Chat","PowerPoint"],"ar":["Copilot Chat","PowerPoint"]},"en":["Turn your director brief into two short slides and animate them, so the key message lands in seconds.","",["In Copilot Chat or PowerPoint, ask for two slides from your brief: the headline, then the decisions (10.A)","Rewrite each title as the takeaway, not the topic","Open the slides in PowerPoint and use the motion command to animate them","Play it once. Cut anything that distracts","Show your two slides to your neighbour in one minute"],"Two animated slides that carry your brief in seconds.","",""],"ar":["حوّل موجز المدير إلى شريحتين قصيرتين وحرّكهما، لتصل الرسالة الأساسية في ثوانٍ.","",["في Copilot Chat أو PowerPoint اطلب شريحتين من موجزك: العنوان الرئيسي، ثم القرارات (⁦10.A⁩)","أعد كتابة عنوان كل شريحة كخلاصة لا كموضوع","افتح الشرائح في PowerPoint واستخدم أمر الحركة لتحريكها","شغّلها مرة. احذف كل ما يشتت","اعرض شريحتيك على زميلك في دقيقة واحدة"],"شريحتان متحركتان تنقلان موجزك في ثوانٍ.","",""],"P":[["10.A","Two slides from the brief","شريحتان من الموجز","Copilot Chat or PowerPoint","Create two slides from this brief: first the headline, then the decisions needed. Write each slide title as the takeaway, not the topic.","أنشئ شريحتين من هذا الموجز: الأولى للعنوان الرئيسي، والثانية للقرارات المطلوبة. اكتب عنوان كل شريحة كخلاصة لا كموضوع."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["Check the PowerPoint motion command is available on the tenant."],"ar":["تحقق من توفر أمر الحركة في PowerPoint في البيئة."]}},{"id":"11","day":1,"h":20,"ic":"contract","nm":{"en":"Two vendor contracts","ar":"عقدا المورّدين"},"sub":{"en":"Exercise 8 · Compare, clause by clause","ar":"التمرين 8 · مقارنة بنداً ببند"},"tools":{"en":["Copilot Chat","OneDrive"],"ar":["Copilot Chat","OneDrive"]},"en":["Ask Copilot to compare two catering contracts clause by clause, check what it flags, and decide which one you would sign.","",["Open the two fictional catering contracts on OneDrive: Vendor A and Vendor B","Attach both to Copilot and paste the comparison prompt (11.A)","Check three flagged differences against the clause in each contract","Ask (11.B): “Which would you sign, and what would you negotiate first?”","Keep the chat: on Day 3 it becomes your first skill"],"A clause-by-clause comparison with every discrepancy flagged and traced.","",""],"ar":["اطلب من Copilot مقارنة عقدي تموين بنداً ببند، وتحقق مما يرصده، وقرّر أيهما توقّع.","",["افتح عقدي التموين الافتراضيين على OneDrive: المورّد أ والمورّد ب","أرفق العقدين في Copilot والصق أمر المقارنة (⁦11.A⁩)","تحقق من ثلاثة فروق رصدها مقابل البند في كل عقد","اسأل (⁦11.B⁩): «أيهما توقّع، وما أول ما تفاوض عليه؟»","احتفظ بالمحادثة: في اليوم الثالث تصبح أول مهارة لك"],"مقارنة بنداً ببند، وكل اختلاف فيها مرصود ومرتبط ببنده.","",""],"P":[["11.A","The comparison prompt","أمر المقارنة","Copilot Chat","Context: Attached are two vendor contracts for VVIP in-flight catering at a UAE government VIP flight operator. Procurement must recommend one this week.\nRole: Act as a senior procurement and contracts manager. Precise and sceptical.\nAction: Compare the two contracts clause by clause and flag every discrepancy: price, service levels, food safety, liability, penalties, term and termination.\nFormat: A side-by-side table: clause, Vendor A, Vendor B, risk (high, medium, low). Then the top 3 points to negotiate. Under 300 words.\nTarget: Quote the clause number for every point. If a clause is missing from one contract, say so. Do not assume terms that are not written.","السياق: مرفق عقدان من مورّدين لتموين رحلات كبار الشخصيات في جهة حكومية إماراتية لتشغيل رحلات كبار الشخصيات. على المشتريات أن توصي بأحدهما هذا الأسبوع.\nالدور: تصرّف كمدير أول للمشتريات والعقود. دقيق ومتشكك.\nالمهمة: قارن العقدين بنداً ببند وارصد كل اختلاف: السعر، ومستويات الخدمة، وسلامة الغذاء، والمسؤولية، والغرامات، والمدة والإنهاء.\nالصيغة: جدول متقابل: البند، والمورّد أ، والمورّد ب، والخطورة (عالية، متوسطة، منخفضة). ثم أهم 3 نقاط للتفاوض. أقل من 300 كلمة.\nالمعيار: اذكر رقم البند لكل نقطة. إذا غاب بند عن أحد العقدين فقل ذلك. لا تفترض شروطاً غير مكتوبة."],["11.B","Which would you sign?","أيهما توقّع؟","Copilot Chat","Which would you sign, and what would you negotiate first?","أي العقدين توقّع، وما أول ما تفاوض عليه؟"]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["Files on PF OneDrive: Vendor A and Vendor B catering contracts (fictional). Facilitator keys stay with the trainers.","Tell participants to keep this chat: Day 3 Exercise 1 turns it into a skill."],"ar":["الملفات على OneDrive طيران الرئاسة: عقدا التموين للمورّد أ والمورّد ب (افتراضيان). مفاتيح الإجابة تبقى مع المدربين.","ذكّر المشاركين بالاحتفاظ بهذه المحادثة: التمرين 1 في اليوم الثالث يحوّلها إلى مهارة."]}},{"id":"12","day":1,"h":22,"ic":"target","nm":{"en":"Your three pain points","ar":"نقاط الألم الثلاث"},"sub":{"en":"Exercise 9 · An AI-enabled day","ar":"التمرين 9 · يوم مدعوم بالذكاء الاصطناعي"},"tools":{"en":["Copilot Chat"],"ar":["Copilot Chat"]},"en":["Map a typical working day and pick three tasks AI could take off your plate. You will solve them over the next three days.","",["Your work, four types: write (emails, reports, procedures), read (documents, regulations, threads), analyse (data, trends, comparisons), coordinate (meetings, follow-ups, scheduling)","Pick a typical working day next week and map six moments, from the first email to the last meeting","Run the delegation test on each: give to AI (repetitive, text-heavy, template-driven, first draft), partly (AI drafts, you check and decide), keep human (judgement, sensitive relationships, accountability)","Choose three pain points: P1 (today), P2 (tomorrow), P3 (your agent on Day 3)","Write a rough one-line prompt for P1","Four techniques that change the output: master prompting, flip the script, step-back, tree of thought","Gemini demo: image generation and image to video. For video, prompt the subject, the action, the camera and style, and the sound and length"],"Your P1, P2 and P3: the thread through the next two days.","",""],"ar":["ارسم يوم عمل معتاداً واختر ثلاث مهام يمكن أن يتولاها الذكاء الاصطناعي عنك. ستحلّها خلال الأيام الثلاثة.","",["عملك أربعة أنواع: الكتابة (رسائل وتقارير وإجراءات)، والقراءة (مستندات ولوائح ومراسلات)، والتحليل (بيانات واتجاهات ومقارنات)، والتنسيق (اجتماعات ومتابعات وجدولة)","اختر يوم عمل معتاداً في الأسبوع القادم وارسم ست لحظات فيه، من أول بريد إلى آخر اجتماع","طبّق اختبار التفويض على كل لحظة: أعطها للذكاء الاصطناعي (متكررة، كثيفة النص، قائمة على نموذج، مسودة أولى)، أو جزئياً (يكتب المسودة وأنت تراجع وتقرّر)، أو تبقى بشرية (حكم، علاقات حساسة، مساءلة)","اختر ثلاث نقاط ألم: P1 (اليوم)، وP2 (غداً)، وP3 (وكيلك في اليوم الثالث)","اكتب أمراً تقريبياً من سطر واحد لـ P1","أربع تقنيات تغيّر المخرجات: الأمر المتقن، وقلب الأدوار، والخطوة إلى الخلف، وشجرة الأفكار","عرض Gemini: توليد الصور وتحويل الصورة إلى فيديو. للفيديو، صِف الموضوع، والحركة، والكاميرا والأسلوب، والصوت والمدة"],"نقاط الألم P1 وP2 وP3: الخيط الذي يربط اليومين القادمين.","",""],"P":[["12.A","Gemini demo: a multi-element image","عرض Gemini: صورة متعددة العناصر","Gemini","Create a scenario image for guests entering a local event: a welcome desk, a branded backdrop with an invented logo, two hosts greeting guests, soft evening light. Realistic photo style. No real people, logos or places.","أنشئ صورة لمشهد دخول الضيوف إلى فعالية محلية: مكتب استقبال، وخلفية بشعار مختلق، ومضيفان يرحّبان بالضيوف، وإضاءة مسائية ناعمة. أسلوب صورة واقعية. دون أشخاص أو شعارات أو أماكن حقيقية."],["12.B","Gemini demo: image to video","عرض Gemini: من صورة إلى فيديو","Gemini","Subject: [who or what is on screen, and where].\nAction: [what happens, in order, beat by beat].\nCamera and style: [the shot, the camera movement, the look and the light].\nSound and length: [music, voice-over, and length in seconds].","الموضوع: [من أو ما الذي يظهر على الشاشة، وأين].\nالحركة: [ما الذي يحدث، بالترتيب، لقطة بلقطة].\nالكاميرا والأسلوب: [اللقطة، وحركة الكاميرا، والمظهر، والإضاءة].\nالصوت والمدة: [الموسيقى، والتعليق الصوتي، والمدة بالثواني]."]],"wide":false,"br":{"en":["P1","P2","P3"],"ar":["P1","P2","P3"]},"fmt":{"en":"Exercise, input and demo","ar":"تمرين وعرض وعرض عملي"},"tn":{"en":["Gemini demo is led by Abdulla on the trainer laptop.","Timing: Exercise 9 13 min, four techniques 4 min, Gemini demo 5 min."],"ar":["يقدّم عبدالله عرض Gemini على حاسوب المدرب.","التوقيت: التمرين 9 ثلاث عشرة دقيقة، والتقنيات الأربع 4 دقائق، وعرض Gemini 5 دقائق."]}},{"id":"13","day":1,"h":25,"ic":"chart","nm":{"en":"Write down, sell or keep?","ar":"شطب أم بيع أم إبقاء؟"},"sub":{"en":"Exercise 10 · The cabin inventory","ar":"التمرين 10 · مخزون المقصورة"},"tools":{"en":["Copilot in Excel","Copilot Chat"],"ar":["Copilot in Excel","Copilot Chat"]},"en":["Use Copilot to analyse a 5,000-line cabin inventory, check the data first, and find the three findings that matter most.","",["Open PF_Cabin_Inventory_Oct2026.xlsx (5,000 lines) with Copilot in Excel, or attach it in Copilot Chat. Your choice","Paste the data-check prompt (13.A). Read the quality note before the charts","Ask for the three most important findings, one chart each (13.B)","Recalculate one number yourself. Does it match?","Wrap up: what you built today"],"A checked dataset and three findings you can defend. Tomorrow you decide: write down, sell, repair or keep.","",""],"ar":["استخدم Copilot لتحليل مخزون مقصورة من 5,000 سطر، وتحقق من البيانات أولاً، ثم استخرج أهم ثلاث نتائج.","",["افتح PF_Cabin_Inventory_Oct2026.xlsx (5,000 سطر) في Copilot in Excel أو أرفقه في Copilot Chat. الخيار لك","الصق أمر فحص البيانات (⁦13.A⁩). اقرأ ملاحظة الجودة قبل الرسوم البيانية","اطلب أهم ثلاث نتائج، مع رسم بياني لكل منها (⁦13.B⁩)","أعد حساب رقم واحد بنفسك. هل يتطابق؟","الختام: ما بنيته اليوم"],"بيانات مُدقَّقة وثلاث نتائج تستطيع الدفاع عنها. وغداً تقرّر: شطب، أو بيع، أو إصلاح، أو إبقاء.","",""],"P":[["13.A","The data-check prompt","أمر فحص البيانات","Copilot in Excel or Copilot Chat","Context: Attached is our cabin inventory extract (31 Oct 2026). Finance wants to write down slow stock; Engineering wants to keep it. My director meets both on Thursday, with two minutes.\nRole: Act as an operations data analyst. Direct and visual.\nAction: Before anything else, tell me what the columns contain, the period covered, and any gaps or quality issues. Then give me the three most important findings.\nFormat: A short data-quality note, then three findings with one chart each, and the formulas you used.\nTarget: Work only from the file. If a column is unreliable, say so instead of charting it.","السياق: مرفق مستخرج مخزون المقصورة لدينا (31 أكتوبر 2026). تريد المالية شطب المخزون بطيء الحركة، وتريد الهندسة الإبقاء عليه. يلتقي مديري بالطرفين يوم الخميس، ولديه دقيقتان.\nالدور: تصرّف كمحلّل بيانات تشغيلية. مباشر ومرئي.\nالمهمة: قبل أي شيء، أخبرني بما تحتويه الأعمدة، والفترة التي تغطيها، وأي فجوات أو مشكلات في الجودة. ثم أعطني أهم ثلاث نتائج.\nالصيغة: ملاحظة قصيرة عن جودة البيانات، ثم ثلاث نتائج مع رسم بياني لكل منها، والمعادلات التي استخدمتها.\nالمعيار: اعمل من الملف فقط. إذا كان عمود ما غير موثوق فقل ذلك بدلاً من رسمه."],["13.B","Three findings, one chart each","ثلاث نتائج برسم لكل منها","Copilot in Excel or Copilot Chat","Give me the three most important findings in this data, one chart each, and show the formula behind every number.","أعطني أهم ثلاث نتائج في هذه البيانات، مع رسم بياني لكل منها، وبيّن المعادلة وراء كل رقم."]],"wide":false,"fmt":{"en":"Exercise and close","ar":"تمرين وختام"},"tn":{"en":["Timing risk: Day 1 runs about 35 to 40 minutes over a 14:00 finish. If short of time, move this exercise to the start of the Day 2 dashboard exercise.","Close: what you built today, then the printing press story told verbally, no slides.","They leave Day 1 with: a Copilot profile, a role-impact plan, a prompt library, a Kenya departure plan, a weekly inbox sweep, a two-minute director brief, two animated slides, a vendor contract comparison, three checked stock findings, and P1 to P3."],"ar":["خطر التوقيت: يتجاوز اليوم الأول موعد 14:00 بنحو 35 إلى 40 دقيقة. عند ضيق الوقت انقل هذا التمرين إلى بداية تمرين لوحة المؤشرات في اليوم الثاني.","الختام: ما بنيته اليوم، ثم قصة المطبعة تُروى شفهياً دون شرائح.","يخرجون من اليوم الأول بـ: ملف في Copilot، وخطة أثر على الدور، ومكتبة أوامر، وخطة رحلة كينيا، وفرز أسبوعي للبريد، وموجز مدير في دقيقتين، وشريحتين متحركتين، ومقارنة عقود، وثلاث نتائج مُدقَّقة عن المخزون، وP1 إلى P3."]}},{"id":"14","day":2,"h":20,"ic":"plug","nm":{"en":"Myths and connectors","ar":"خرافات وموصلات"},"sub":{"en":"Yesterday in your words","ar":"الأمس بكلماتك"},"tools":{"en":["Microsoft 365 Copilot","Outlook","Teams","OneDrive"],"ar":["Microsoft 365 Copilot","Outlook","Teams","OneDrive"]},"en":["Share what happened when you tried AI on real work, bust five myths, then see Copilot work across your Microsoft 365.","",["Yesterday, in your words: what you tried, what changed (time, quality or confidence), what got in the way (data, tool access or habit)","AI myths: “if it sounds confident, it's probably right”; “AI understands what it's saying”; “the more polite you are, the better the answer”; “anything I type into AI is private”; “AI is objective because it's a machine”","Connectors: Outlook mail (read, sort and draft, as on Day 1), calendar and Teams (find time, book meetings, recap what you missed), OneDrive and SharePoint (find a file, then move it to the right folder)","What is switched on: PF IT decides which connectors you have"],"Five myths you can now spot, and Copilot working across your mail, calendar, Teams and files.","",""],"ar":["شارك ما حدث عندما جرّبت الذكاء الاصطناعي على عمل حقيقي، وفكّك خمس خرافات، ثم شاهد Copilot يعمل عبر Microsoft 365.","",["الأمس بكلماتك: ما الذي جرّبته، وما الذي تغيّر (الوقت أو الجودة أو الثقة)، وما الذي أعاقك (البيانات أو صلاحيات الأدوات أو العادة)","خرافات الذكاء الاصطناعي: «إذا بدا واثقاً فهو غالباً محق»؛ «الذكاء الاصطناعي يفهم ما يقول»؛ «كلما كنت أكثر تهذيباً كانت الإجابة أفضل»؛ «كل ما أكتبه للذكاء الاصطناعي خاص»؛ «الذكاء الاصطناعي موضوعي لأنه آلة»","الموصلات: بريد Outlook (قراءة وفرز وصياغة كما في اليوم الأول)، والتقويم وTeams (إيجاد وقت، وحجز اجتماعات، وتلخيص ما فاتك)، وOneDrive وSharePoint (إيجاد ملف ثم نقله إلى المجلد الصحيح)","ما هو مفعّل: قسم تقنية المعلومات في طيران الرئاسة يحدد الموصلات المتاحة لك"],"خمس خرافات تستطيع الآن رصدها، وCopilot يعمل عبر بريدك وتقويمك وTeams وملفاتك.","",""],"P":[["14.A","Recap what you missed","لخّص ما فاتني","Copilot Chat (Work)","Recap what I missed in [the Teams chat or meeting] this week: decisions made, actions assigned to me, and open questions.","لخّص ما فاتني في [محادثة أو اجتماع Teams] هذا الأسبوع: القرارات المتخذة، والمهام المسندة إليّ، والأسئلة المفتوحة."],["14.B","Find a file, then move it","اعثر على ملف ثم انقله","Copilot Chat (Work)","Find the latest version of [file name] in my OneDrive, then move it to [the right folder].","اعثر على أحدث نسخة من [اسم الملف] في OneDrive، ثم انقله إلى [المجلد الصحيح]."]],"wide":false,"fmt":{"en":"Activity and demo","ar":"نشاط وعرض عملي"},"tn":{"en":["Learning moments today: research you can defend; your team's knowledge in one place; data a director can explore, and judgement a formula cannot replace; a second opinion from a fresh critic; agents that plan and act.","Connectors walkthrough is led by Abdulla (5 min). Use the Qoura M365 demo account."],"ar":["لحظات التعلّم اليوم: بحث تستطيع الدفاع عنه؛ معرفة فريقك في مكان واحد؛ بيانات يستكشفها المدير، وحكم لا تعوّضه معادلة؛ رأي ثانٍ من ناقد جديد؛ وكلاء يخطّطون وينفّذون.","يقدّم عبدالله جولة الموصلات (5 دقائق). استخدم حساب Qoura التجريبي في Microsoft 365."]}},{"id":"15","day":2,"h":10,"ic":"palette","nm":{"en":"Brand and deck","ar":"هوية وعرض"},"sub":{"en":"Exercise 1 · Pitch your team's AI training","ar":"التمرين 1 · اعرض تدريب فريقك"},"tools":{"en":["Copilot Chat","PowerPoint"],"ar":["Copilot Chat","PowerPoint"]},"en":["Create a mini brand for an AI training programme you want your team to do, then pitch it in a five-slide deck.","",["In Copilot Chat, ask for the programme's name, tagline, three colours and tone (15.A)","In PowerPoint, ask Copilot for a five-slide deck that pitches this programme to your director (15.B)","Apply your brand. Rewrite each headline as a takeaway, not a topic","Present your deck to your table in one minute","Keep your brand: you reuse it for every deck from now on"],"A branded five-slide deck that pitches your team's AI training programme.","",""],"ar":["أنشئ هوية مصغّرة لبرنامج تدريب على الذكاء الاصطناعي تريده لفريقك، ثم اعرضه في خمس شرائح.","",["في Copilot Chat اطلب اسم البرنامج، وعبارته التعريفية، وثلاثة ألوان، والنبرة (⁦15.A⁩)","في PowerPoint اطلب من Copilot عرضاً من خمس شرائح يقدّم البرنامج لمديرك (⁦15.B⁩)","طبّق هويتك. أعد كتابة كل عنوان كخلاصة لا كموضوع","اعرض شرائحك على طاولتك في دقيقة واحدة","احتفظ بهويتك: ستعيد استخدامها في كل عرض من الآن"],"عرض من خمس شرائح بهويتك يقدّم برنامج تدريب فريقك على الذكاء الاصطناعي.","",""],"P":[["15.A","A mini brand","هوية مصغّرة","Copilot Chat","I want my team at [your department] to take an AI training programme. Suggest a name, a one-line tagline, three colours (with hex codes) and the tone it should use. Give three options, then recommend one.","أريد أن يلتحق فريقي في [إدارتك] ببرنامج تدريب على الذكاء الاصطناعي. اقترح اسماً، وعبارة تعريفية من سطر واحد، وثلاثة ألوان (مع رموزها)، والنبرة المناسبة. أعطني ثلاثة خيارات ثم أوصِ بواحد."],["15.B","The five-slide pitch","عرض الشرائح الخمس","PowerPoint (Copilot)","Create a five-slide deck that pitches the [programme name] AI training programme to my director: the problem, what the team will learn, what changes in our work, what it needs, and the decision I am asking for. Use the brand colours [hex codes]. Write every headline as the takeaway, not the topic.","أنشئ عرضاً من خمس شرائح يقدّم برنامج [اسم البرنامج] للتدريب على الذكاء الاصطناعي لمديري: المشكلة، وما سيتعلمه الفريق، وما الذي سيتغيّر في عملنا، وما يحتاجه البرنامج، والقرار الذي أطلبه. استخدم ألوان الهوية [الرموز]. اكتب كل عنوان كخلاصة لا كموضوع."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"}},{"id":"16","day":2,"h":20,"ic":"search","nm":{"en":"Low-cost AI moves","ar":"خطوات ذكية منخفضة التكلفة"},"sub":{"en":"Exercise 2 · Researcher","ar":"التمرين 2 · Researcher"},"tools":{"en":["Researcher","Microsoft 365 Copilot"],"ar":["Researcher","Microsoft 365 Copilot"]},"en":["Use Researcher to find low-cost AI moves that peer operators have made, check which results are proven, and pick one to copy.","",["Researcher: multi-step research across the web and your work files, returned as a cited report. It can take minutes; launch it and keep working","Pick the lens that matches your job: flight operations and planning; engineering and maintenance; finance and procurement; corporate and guest services","Paste the Researcher brief (16.A) and run it","While it runs: polished is not the same as proven. Open the link, find the claim, check the date, redo one number","Read the table: which results are claimed, and which are measured? Open three sources and check each claim yourself (16.B)","Pick the one move you could copy within 90 days, and say why","Dilemma 02: the polished audit response (below)"],"Five low-cost AI moves by peers worldwide, checked, and one you could start within 90 days.","",""],"ar":["استخدم Researcher لإيجاد خطوات ذكاء اصطناعي منخفضة التكلفة نفّذها نظراء، وتحقق مما ثبتت نتائجه، واختر واحدة لتطبيقها.","",["Researcher: بحث متعدد الخطوات في الويب وملفات عملك، يعود بتقرير موثّق المصادر. قد يستغرق دقائق؛ أطلقه وتابع عملك","اختر العدسة التي تناسب عملك: عمليات الطيران والتخطيط؛ الهندسة والصيانة؛ المالية والمشتريات؛ الخدمات المؤسسية وخدمات الضيوف","الصق موجز Researcher (⁦16.A⁩) وشغّله","أثناء التشغيل: المصقول ليس بالضرورة مُثبتاً. افتح الرابط، وابحث عن الادعاء، وتحقق من التاريخ، وأعد حساب رقم واحد","اقرأ الجدول: أي النتائج مُدّعاة وأيها مقاسة؟ افتح ثلاثة مصادر وتحقق من كل ادعاء بنفسك (⁦16.B⁩)","اختر الخطوة التي يمكنك تطبيقها خلال 90 يوماً، وبيّن السبب","المعضلة 02: الرد المصقول على التدقيق (أدناه)"],"خمس خطوات ذكاء اصطناعي منخفضة التكلفة من نظراء حول العالم، مُتحقَّق منها، وواحدة تبدأ بها خلال 90 يوماً.","",""],"P":[["16.A","The Researcher brief","موجز Researcher","Researcher","Context: I work in [your department and role] at a UAE government VIP aviation operator. We want efficiency gains that cost little and start within 90 days, using tools we already have.\nRole: Act as an operations improvement consultant specialising in AI adoption in aviation. Tone: practical and sceptical.\nAction: Find five AI initiatives by airlines, VIP and business aviation operators, MRO providers or government entities worldwide, in the last 24 months, that improved efficiency in [your lens] without a large technology build. Recommend the one I should test first.\nFormat: A table: organisation, what they did, cost level (low, medium, high), result, and whether the result is claimed or measured. Then three lines on the one to test first. Under 250 words.\nTarget: Named organisations only, with a source link for each. Flag any result that comes from a vendor press release. If you cannot find five, give fewer and say so.","السياق: أعمل في [إدارتك ودورك] في جهة حكومية إماراتية لتشغيل رحلات كبار الشخصيات. نريد مكاسب كفاءة قليلة التكلفة تبدأ خلال 90 يوماً، بالأدوات المتوفرة لدينا.\nالدور: تصرّف كمستشار لتحسين العمليات متخصص في تبنّي الذكاء الاصطناعي في الطيران. النبرة: عملية ومتشككة.\nالمهمة: ابحث عن خمس مبادرات ذكاء اصطناعي نفّذتها شركات طيران، أو مشغّلو طيران كبار الشخصيات وطيران الأعمال، أو مزوّدو الصيانة والإصلاح والعَمرة، أو جهات حكومية حول العالم، خلال آخر 24 شهراً، وحسّنت الكفاءة في [عدستك] دون بناء تقني كبير. أوصِ بالمبادرة التي أختبرها أولاً.\nالصيغة: جدول: الجهة، وما فعلته، ومستوى التكلفة (منخفض، متوسط، مرتفع)، والنتيجة، وهل النتيجة مُدّعاة أم مقاسة. ثم ثلاثة أسطر عن المبادرة التي أختبرها أولاً. أقل من 250 كلمة.\nالمعيار: جهات مسمّاة فقط، مع رابط مصدر لكل منها. نبّه إلى أي نتيجة مصدرها بيان صحفي لمورّد. إذا لم تجد خمساً فأعطني أقل وقل ذلك."],["16.B","Check the numbers","تحقق من الأرقام","Researcher or Copilot Chat","For each key number in your report, give the source, the calculation and your confidence.","لكل رقم أساسي في تقريرك، اذكر المصدر، وطريقة الحساب، ودرجة ثقتك."]],"wide":false,"br":{"en":["Operations","Engineering","Finance","Corporate"],"ar":["العمليات","الهندسة","المالية","المؤسسية"]},"nochips":true,"dl":[{"n":"02","t":{"en":"The polished audit response","ar":"الرد المصقول على التدقيق"},"s":{"en":"A team member uses Copilot to draft the response to an internal audit finding and sends it to Quality before anyone reviews it. Quality replies that two procedure references are wrong.","ar":"يستخدم أحد أعضاء الفريق Copilot لصياغة الرد على ملاحظة تدقيق داخلي، ويرسله إلى إدارة الجودة قبل أن يراجعه أحد. تردّ الجودة بأن مرجعين من مراجع الإجراءات خاطئان."},"q":{"en":"“Stop using AI for audit responses.”","ar":"«أوقفوا استخدام الذكاء الاصطناعي في الردود على التدقيق.»"},"x":{"en":"Did the tool fail, the person, or the process? What review step would you add, and who owns it?","ar":"هل أخفقت الأداة أم الشخص أم الإجراء؟ ما خطوة المراجعة التي تضيفها، ومن المسؤول عنها؟"}}],"fmt":{"en":"Exercise and discussion","ar":"تمرين ونقاش"},"tn":{"en":["Launch Researcher first, then cover ‘polished is not proven’ while it runs.","Dilemma 02: open discussion, the CEO last (10 min)."],"ar":["أطلق Researcher أولاً، ثم اشرح «المصقول ليس مُثبتاً» أثناء تشغيله.","المعضلة 02: نقاش مفتوح، والرئيس التنفيذي يتحدث أخيراً (10 دقائق)."]}},{"id":"17","day":2,"h":20,"ic":"book","nm":{"en":"A team notebook","ar":"دفتر الفريق"},"sub":{"en":"Exercise 3 · Your workspace","ar":"التمرين 3 · مساحة عملك"},"tools":{"en":["Copilot Notebooks"],"ar":["Copilot Notebooks"]},"en":["Build a shared workspace that holds all the information needed to manage a project, and share it with your team.","",["Watch the demo: one notebook, many sources, then a podcast, a mind map and a study guide","In your group, pick one real project you all work on. No red data","Collect what it needs: approved documents, notes, emails, recent reports","Build the notebook, then ask it the three questions your director would ask (17.A)","Generate one output to share: a briefing, an audio overview or an FAQ (17.B)"],"A working project notebook your team can keep using after today.","",""],"ar":["ابنِ مساحة عمل مشتركة تضم كل المعلومات اللازمة لإدارة مشروع، وشاركها مع فريقك.","",["شاهد العرض: دفتر واحد ومصادر كثيرة، ثم بودكاست وخريطة ذهنية ودليل دراسي","في مجموعتك، اختاروا مشروعاً حقيقياً تعملون عليه جميعاً. لا بيانات حمراء","اجمعوا ما يحتاجه: مستندات معتمدة، وملاحظات، ورسائل، وتقارير حديثة","ابنوا الدفتر، ثم اسألوه الأسئلة الثلاثة التي سيطرحها مديركم (⁦17.A⁩)","أنشئوا مخرجاً واحداً للمشاركة: إحاطة، أو ملخصاً صوتياً، أو أسئلة شائعة (⁦17.B⁩)"],"دفتر مشروع يعمل ويستطيع فريقك مواصلة استخدامه بعد اليوم.","",""],"P":[["17.A","The director's three questions","أسئلة المدير الثلاثة","Copilot Notebooks","Using only the sources in this notebook, answer the three questions our director would ask about [project]: where we are, what is at risk, and what decision is needed. Cite the source for each answer.","اعتماداً على مصادر هذا الدفتر فقط، أجب عن الأسئلة الثلاثة التي سيطرحها مديرنا عن [المشروع]: أين وصلنا، وما المعرّض للخطر، وما القرار المطلوب. اذكر المصدر لكل إجابة."],["17.B","One output to share","مخرج واحد للمشاركة","Copilot Notebooks","Create a one-page briefing on [project] for a new team member, using only this notebook. Then list the ten questions they are most likely to ask, with answers.","أنشئ إحاطة من صفحة واحدة عن [المشروع] لعضو جديد في الفريق، اعتماداً على هذا الدفتر فقط. ثم اذكر الأسئلة العشرة التي يُرجّح أن يطرحها مع إجاباتها."]],"wide":false,"fmt":{"en":"Demo and exercise","ar":"عرض عملي وتمرين"},"tn":{"en":["Check Notebooks (audio overview, mind map, study guide) on the tenant. Demo notebook is in the demo kit."],"ar":["تحقق من توفر Notebooks (الملخص الصوتي، والخريطة الذهنية، والدليل الدراسي) في البيئة. دفتر العرض ضمن عُدّة العرض."]}},{"id":"18","day":2,"h":15,"ic":"radar","nm":{"en":"Your stakeholder radar","ar":"رادار الجهات المعنية"},"sub":{"en":"Exercise 4 · A weekly news scan","ar":"التمرين 4 · مسح أسبوعي للأخبار"},"tools":{"en":["Copilot Chat","Scheduled prompts"],"ar":["Copilot Chat","الأوامر المجدولة"]},"en":["Save a weekly scan of public news about the organisations that matter to your department, as a scheduled prompt.","",["Who to watch: key suppliers and manufacturers, aviation authorities and regulators, peer operators in the UAE and the GCC, policy changes affecting your department","Paste the radar prompt (18.A) and fill the brackets","Schedule it for every Monday at 07:00, or save it to your prompt library","Dilemma 03: the free app that works better (below)"],"A stakeholder radar that briefs you every Monday.","",""],"ar":["احفظ مسحاً أسبوعياً للأخبار العامة عن الجهات المهمة لإدارتك، كأمر مجدول.","",["من تراقب: المورّدون والمصنّعون الرئيسيون، وسلطات الطيران والجهات التنظيمية، والمشغّلون النظراء في الإمارات والخليج، وتغييرات السياسات التي تمس إدارتك","الصق أمر الرادار (⁦18.A⁩) واملأ الأقواس","جدوله لكل يوم اثنين الساعة 07:00، أو احفظه في مكتبة أوامرك","المعضلة 03: التطبيق المجاني الأفضل أداءً (أدناه)"],"رادار للجهات المعنية يُطلعك كل يوم اثنين.","",""],"P":[["18.A","The stakeholder radar","رادار الجهات المعنية","Copilot Chat (scheduled)","Every Monday at 07:00, search public news from the last seven days about [suppliers, aviation authorities, peer operators and government entities].\n\nFor each item: what happened, why it matters to my department, and one suggested action. Group by organisation, most important first, with the source link for every item.\n\nPublic sources only. If there is nothing new, say so. Never invent news.","كل يوم اثنين الساعة 07:00، ابحث في الأخبار العامة لآخر سبعة أيام عن [المورّدين، وسلطات الطيران، والمشغّلين النظراء، والجهات الحكومية].\n\nلكل خبر: ما الذي حدث، ولماذا يهم إدارتي، وإجراء واحد مقترح. صنّف حسب الجهة، الأهم أولاً، مع رابط المصدر لكل خبر.\n\nمصادر عامة فقط. إذا لم يكن هناك جديد فقل ذلك. لا تختلق أخباراً أبداً."]],"wide":false,"dl":[{"n":"03","t":{"en":"The free app that works better","ar":"التطبيق المجاني الأفضل أداءً"},"s":{"en":"An engineer gets better translations of vendor correspondence from a free app on his phone than from Copilot. He pastes vendor emails into it, and others have started to copy him.","ar":"يحصل مهندس على ترجمات أفضل لمراسلات المورّدين من تطبيق مجاني على هاتفه مقارنة بـ Copilot. يلصق فيه رسائل المورّدين، وبدأ آخرون يقلّدونه."},"q":{"en":"“Ban the app and remind everyone of the policy.”","ar":"«احظروا التطبيق وذكّروا الجميع بالسياسة.»"},"x":{"en":"What does a ban solve, and what does it lose? What rule would you write instead?","ar":"ماذا يحلّ الحظر، وماذا يُفقِد؟ وما القاعدة التي تكتبها بدلاً منه؟"}}],"fmt":{"en":"Exercise and discussion","ar":"تمرين ونقاش"},"tn":{"en":["Dilemma 03: open discussion, the CEO last (10 min)."],"ar":["المعضلة 03: نقاش مفتوح، والرئيس التنفيذي يتحدث أخيراً (10 دقائق)."]}},{"id":"19","day":2,"h":23,"ic":"dash","nm":{"en":"Excel to a live dashboard","ar":"من Excel إلى لوحة حيّة"},"sub":{"en":"Exercise 5 · Data into decisions","ar":"التمرين 5 · من البيانات إلى القرارات"},"tools":{"en":["Analyst","Excel"],"ar":["Analyst","Excel"]},"en":["Turn the cabin inventory into an interactive dashboard your director can explore, then decide what to do with the top 20 lines.","",["Reasoning models changed the rules: drop “think step by step”, ask for the method instead, separate the critic, verify what matters","Reopen PF_Cabin_Inventory_Oct2026.xlsx and yesterday's three findings","Fix what Day 1 flagged: duplicates, missing costs, USD lines, misspelled categories","Open the Analyst agent, attach the file and paste the dashboard prompt (19.A)","Open the HTML file. Test every filter. Does the idle value match your Excel?","For the top 20 lines, decide: write down, sell, repair or keep. Watch for the traps"],"An interactive inventory dashboard and a line-by-line decision you can defend.","",""],"ar":["حوّل مخزون المقصورة إلى لوحة مؤشرات تفاعلية يستكشفها مديرك، ثم قرّر ماذا تفعل بأعلى 20 سطراً.","",["نماذج الاستدلال غيّرت القواعد: تخلَّ عن «فكّر خطوة بخطوة»، واطلب المنهجية بدلاً منها، وافصل الناقد، وتحقق مما يهم","أعد فتح PF_Cabin_Inventory_Oct2026.xlsx ونتائج الأمس الثلاث","أصلح ما رُصد في اليوم الأول: التكرارات، والتكاليف الناقصة، والأسطر بالدولار، والفئات المكتوبة خطأً","افتح وكيل Analyst، وأرفق الملف، والصق أمر لوحة المؤشرات (⁦19.A⁩)","افتح ملف HTML. اختبر كل مرشّح. هل تطابق قيمة المخزون الراكد ما في Excel؟","لأعلى 20 سطراً قرّر: شطب، أو بيع، أو إصلاح، أو إبقاء. انتبه للأفخاخ"],"لوحة مؤشرات تفاعلية للمخزون، وقرار لكل سطر تستطيع الدفاع عنه.","",""],"P":[["19.A","The dashboard prompt","أمر لوحة المؤشرات","Analyst","Context: Attached is our cabin inventory extract (31 Oct 2026). My director must decide what to write down, sell, repair or keep, and wants to explore the data directly.\nRole: Act as a data analyst and front-end developer. Clear, visual, no clutter.\nAction: Build one interactive HTML dashboard from this data, as a file I can open in a browser.\nFormat: Filters at the top: date range, fleet type toggles, status, category. Four KPIs, idle value by fleet type, a top-20 table and a write-down / sell / repair / keep summary. Everything updates with the filters.\nTarget: Values in AED (USD at 3.6725). Exclude duplicates and lines with missing cost, and show how many. Work only from the file.","السياق: مرفق مستخرج مخزون المقصورة لدينا (31 أكتوبر 2026). على مديري أن يقرّر ما يُشطب أو يُباع أو يُصلح أو يُبقى عليه، ويريد استكشاف البيانات بنفسه.\nالدور: تصرّف كمحلّل بيانات ومطوّر واجهات. واضح ومرئي ودون ازدحام.\nالمهمة: ابنِ لوحة مؤشرات HTML تفاعلية واحدة من هذه البيانات، كملف أفتحه في المتصفح.\nالصيغة: المرشّحات في الأعلى: الفترة الزمنية، ومفاتيح نوع الأسطول، والحالة، والفئة. أربعة مؤشرات أداء، وقيمة المخزون الراكد حسب نوع الأسطول، وجدول لأعلى 20 سطراً، وملخص شطب / بيع / إصلاح / إبقاء. كل شيء يتحدّث مع المرشّحات.\nالمعيار: القيم بالدرهم الإماراتي (الدولار = 3.6725). استبعد التكرارات والأسطر ذات التكلفة الناقصة، واذكر عددها. اعمل من الملف فقط."],["19.B","Ask for the method","اطلب المنهجية","Analyst","Show me the assumptions, formulas, sources and checks you used for the idle value.","بيّن لي الافتراضات والمعادلات والمصادر والفحوص التي استخدمتها لحساب قيمة المخزون الراكد."]],"wide":false,"br":{"en":["Write down","Sell","Repair","Keep"],"ar":["شطب","بيع","إصلاح","إبقاء"]},"nochips":true,"fmt":{"en":"Input and exercise","ar":"عرض وتمرين"},"tn":{"en":["If Exercise 10 moved from Day 1, run it at the start of this exercise.","Patrick's finished HTML dashboard is on his laptop as the reference."],"ar":["إذا نُقل التمرين 10 من اليوم الأول فنفّذه في بداية هذا التمرين.","لوحة Patrick الجاهزة على حاسوبه كمرجع."]}},{"id":"20","day":2,"h":20,"ic":"branch","nm":{"en":"Three options, one choice","ar":"ثلاثة خيارات وقرار واحد"},"sub":{"en":"Exercise 6 · Tree of thought","ar":"التمرين 6 · شجرة الأفكار"},"tools":{"en":["Copilot Chat","Word"],"ar":["Copilot Chat","Word"]},"en":["Weigh three options for a department problem, write up the best one as a report, and have a critic challenge it.","",["Ask for three different options to solve a fictional department problem. Score each one (20.A)","Cut the two weakest, with reasons. Push back once if you disagree","Turn the chosen option into a one-page executive report in Word (20.B)","Ask Copilot for the three questions your director will ask, and answer them in the report (20.C)","Critic pass: open a new chat, paste the report and the critic prompt (20.D). Always in a new chat: models favour their own work"],"A proposal and a report that have survived a sceptical reviewer.","",""],"ar":["وازن بين ثلاثة خيارات لمشكلة في إدارتك، واكتب أفضلها في تقرير، ثم دع ناقداً يتحدّاه.","",["اطلب ثلاثة خيارات مختلفة لحل مشكلة افتراضية في إدارتك، وقيّم كلاً منها (⁦20.A⁩)","استبعد أضعف خيارين مع الأسباب. اعترض مرة إذا لم توافق","حوّل الخيار المختار إلى تقرير تنفيذي من صفحة واحدة في Word (⁦20.B⁩)","اطلب من Copilot الأسئلة الثلاثة التي سيطرحها مديرك، وأجب عنها في التقرير (⁦20.C⁩)","جولة الناقد: افتح محادثة جديدة، والصق التقرير وأمر الناقد (⁦20.D⁩). دائماً في محادثة جديدة: النماذج تحابي عملها"],"مقترح وتقرير صمدا أمام مراجع متشكك.","",""],"P":[["20.A","Three options, scored","ثلاثة خيارات مع التقييم","Copilot Chat","My department faces this fictional problem: [describe it]. Give me three genuinely different options to solve it. Score each from 1 to 10 on impact, cost, speed and risk, in a table. Then cut the two weakest and explain why.","تواجه إدارتي هذه المشكلة الافتراضية: [صِفها]. أعطني ثلاثة خيارات مختلفة فعلاً لحلّها. قيّم كلاً منها من 1 إلى 10 في الأثر والتكلفة والسرعة والمخاطر، في جدول. ثم استبعد أضعف خيارين واشرح السبب."],["20.B","The one-page report","تقرير الصفحة الواحدة","Word (Copilot)","Turn the chosen option into a one-page executive report: the problem, the recommendation, why not the other two options, cost and timeline, risks, and the decision needed.","حوّل الخيار المختار إلى تقرير تنفيذي من صفحة واحدة: المشكلة، والتوصية، ولماذا لم نختر الخيارين الآخرين، والتكلفة والجدول الزمني، والمخاطر، والقرار المطلوب."],["20.C","The director's three questions","أسئلة المدير الثلاثة","Copilot Chat","What are the three questions my director will ask about this report? Answer each in two lines so I can add them to the report.","ما الأسئلة الثلاثة التي سيطرحها مديري عن هذا التقرير؟ أجب عن كل منها في سطرين لأضيفها إلى التقرير."],["20.D","The critic prompt","أمر الناقد","Copilot Chat (new chat)","Context: Below is a proposal for my department. [Paste or attach it]\nRole: Act as a sceptical director who has seen many proposals fail. You did not write this.\nAction: List the five weakest points: unsupported claims, hidden costs, risks and anything presented as fact without evidence. Then rewrite the case so it survives your own challenge.\nFormat: Five weak points, then a one-page version under 300 words. Mark each figure verified or not verified.\nTarget: Be direct. If the case does not hold, say so.","السياق: أدناه مقترح لإدارتي. [الصقه أو أرفقه]\nالدور: تصرّف كمدير متشكك رأى كثيراً من المقترحات تفشل. لست أنت من كتب هذا.\nالمهمة: اذكر أضعف خمس نقاط: الادعاءات غير المدعومة، والتكاليف الخفية، والمخاطر، وكل ما قُدّم كحقيقة دون دليل. ثم أعد كتابة الحجة لتصمد أمام تحدّيك أنت.\nالصيغة: خمس نقاط ضعف، ثم نسخة من صفحة واحدة بأقل من 300 كلمة. ضع على كل رقم «مُتحقَّق منه» أو «غير مُتحقَّق منه».\nالمعيار: كن مباشراً. إذا لم تصمد الحجة فقل ذلك."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"}},{"id":"21","day":2,"h":10,"ic":"wand","nm":{"en":"Your Prompt Optimiser","ar":"محسّن الأوامر"},"sub":{"en":"Exercise 7 · Build it once, use it always","ar":"التمرين 7 · ابنِه مرة واستخدمه دائماً"},"tools":{"en":["Copilot Chat","OneDrive"],"ar":["Copilot Chat","OneDrive"]},"en":["Build your own Prompt Optimiser: a chat that turns any rough request into a strong prompt before you use it.","",["Open a new Copilot chat and name it Prompt Optimiser","Write your own setup prompt first: what should an optimiser know, do and check?","Compare it with the model setup prompt (21.A). Borrow what you missed","Upload the two prompting guides from OneDrive and paste your setup prompt","Paste a rough prompt for P2. Answer its questions and keep the improved prompt"],"A Prompt Optimiser you will use in every exercise from now on.","",""],"ar":["ابنِ محسّن أوامرك الخاص: محادثة تحوّل أي طلب تقريبي إلى أمر قوي قبل أن تستخدمه.","",["افتح محادثة Copilot جديدة وسمّها «محسّن الأوامر»","اكتب أمر الإعداد الخاص بك أولاً: ما الذي يجب أن يعرفه المحسّن ويفعله ويتحقق منه؟","قارنه بأمر الإعداد النموذجي (⁦21.A⁩). خذ ما فاتك","ارفع دليلي كتابة الأوامر من OneDrive والصق أمر الإعداد","الصق أمراً تقريبياً لـ P2. أجب عن أسئلته واحتفظ بالأمر المحسّن"],"محسّن أوامر ستستخدمه في كل تمرين من الآن.","",""],"P":[["21.A","The Prompt Optimiser setup prompt","أمر إعداد محسّن الأوامر","Copilot Chat","Context: I am attaching two prompting guides. I work at Presidential Flight and use Copilot every day.\nRole: You are my Prompt Optimiser: an expert prompt engineer who applies the attached guides.\nAction: Whenever I paste a rough prompt, ask me up to three questions, then rewrite it using the guides. Score my original and your version from 1 to 10 and explain the three biggest improvements.\nFormat: Your questions first. Then the improved prompt ready to copy, the two scores and three short bullets on what changed.\nTarget: Base every improvement on the guides and name the technique used. Never invent facts about my work: mark gaps as [to fill].","السياق: أرفق دليلين لكتابة الأوامر. أعمل في طيران الرئاسة وأستخدم Copilot يومياً.\nالدور: أنت محسّن أوامري: مهندس أوامر خبير يطبّق الدليلين المرفقين.\nالمهمة: كلما ألصقت أمراً تقريبياً، اسألني حتى ثلاثة أسئلة، ثم أعد كتابته وفق الدليلين. قيّم أمري الأصلي ونسختك من 1 إلى 10، واشرح أكبر ثلاثة تحسينات.\nالصيغة: أسئلتك أولاً. ثم الأمر المحسّن جاهزاً للنسخ، والتقييمان، وثلاث نقاط قصيرة عما تغيّر.\nالمعيار: ابنِ كل تحسين على الدليلين واذكر التقنية المستخدمة. لا تختلق معلومات عن عملي أبداً: ضع [للتعبئة] على الفجوات."]],"wide":false,"fmt":{"en":"Exercise","ar":"تمرين"},"tn":{"en":["The two prompting guides must be on PF OneDrive before the session."],"ar":["يجب أن يكون دليلا كتابة الأوامر على OneDrive طيران الرئاسة قبل الجلسة."]}},{"id":"22","day":2,"h":10,"ic":"wrench","nm":{"en":"Solve P2","ar":"حلّ P2"},"sub":{"en":"Exercise 8 · The pain-point clinic","ar":"التمرين 8 · عيادة نقاط الألم"},"tools":{"en":["Copilot Chat"],"ar":["Copilot Chat"]},"en":["Pick one of the four techniques and use it to solve your second pain point.","",["Master prompting: let Copilot write, score and merge the prompt before it answers (22.A)","Flip the script: let Copilot interview you before it starts the task (22.B)","Step-back: ask for the principles first, then the answer (22.C)","Tree of thought: generate options, prune the weak ones, commit to one (22.D)","Pick one technique. Solve P2. Save the prompt to your library"],"P2 solved, and the prompt that solved it saved to your library.","",""],"ar":["اختر واحدة من التقنيات الأربع واستخدمها لحلّ نقطة الألم الثانية.","",["الأمر المتقن: دع Copilot يكتب الأمر ويقيّمه ويدمجه قبل أن يجيب (⁦22.A⁩)","اقلب الأدوار: دع Copilot يجري معك مقابلة قبل أن يبدأ المهمة (⁦22.B⁩)","الخطوة إلى الخلف: اطلب المبادئ أولاً ثم الإجابة (⁦22.C⁩)","شجرة الأفكار: ولّد خيارات، واستبعد الضعيف، والتزم بواحد (⁦22.D⁩)","اختر تقنية واحدة. حلّ P2. احفظ الأمر في مكتبتك"],"حللت P2، وحفظت الأمر الذي حلّها في مكتبتك.","",""],"P":[["22.A","Master prompting","الأمر المتقن","Copilot Chat","My task: [P2]. Before you answer, write three versions of the prompt you would need to do this well, score each from 1 to 10, merge the best parts into one prompt, show it to me, then run it.","مهمتي: [P2]. قبل أن تجيب، اكتب ثلاث صيغ للأمر الذي تحتاجه لإنجازها جيداً، وقيّم كلاً منها من 1 إلى 10، وادمج أفضل ما فيها في أمر واحد، واعرضه عليّ، ثم نفّذه."],["22.B","Flip the script","اقلب الأدوار","Copilot Chat","My task: [P2]. Before you start, interview me one question at a time until you have what you need to do it well. Then do it.","مهمتي: [P2]. قبل أن تبدأ، اسألني سؤالاً واحداً في كل مرة حتى تحصل على ما تحتاجه لإنجازها جيداً. ثم أنجزها."],["22.C","Step-back","الخطوة إلى الخلف","Copilot Chat","My task: [P2]. First, list the principles that make a task like this succeed. Then apply them to give me the answer.","مهمتي: [P2]. أولاً، اذكر المبادئ التي تُنجح مهمة كهذه. ثم طبّقها لتعطيني الإجابة."],["22.D","Tree of thought","شجرة الأفكار","Copilot Chat","My task: [P2]. Generate three different approaches, prune the two weakest with reasons, then commit to one and carry it out.","مهمتي: [P2]. ولّد ثلاثة مناهج مختلفة، واستبعد أضعف اثنين مع الأسباب، ثم التزم بواحد ونفّذه."]],"wide":false,"br":{"en":["Master","Flip","Step-back","Tree"],"ar":["المتقن","قلب الأدوار","الخطوة للخلف","الشجرة"]},"nochips":true,"fmt":{"en":"Exercise","ar":"تمرين"}},{"id":"23","day":2,"h":37,"ic":"plan","nm":{"en":"The Planner agent","ar":"وكيل التخطيط"},"sub":{"en":"Exercise 9 · Agents that work for you","ar":"التمرين 9 · وكلاء يعملون لك"},"tools":{"en":["Planner agent","Researcher","Analyst"],"ar":["Planner agent","Researcher","Analyst"]},"en":["Use the Planner agent to build a 90-day AI adoption plan for your team, with tasks, owners and dates.","",["Researcher and Analyst, your first agents: Researcher plans, searches and writes a cited report; Analyst reasons over your data and shows its method. An agent plans its own steps; your job moves to briefing and checking","In Copilot, open Agents, then Planner (Frontier)","Give it the goal (23.A)","Review the plan: tasks, owners, due dates. Fix two things it got wrong","Ask: “What is at risk this week?” Then turn a set of meeting notes into tasks (23.B)","Share the plan with your table. Tomorrow it feeds your adoption roadmap","Dilemma 04: AI shortlists the bids (below)","Before tomorrow: bring P3, run your Day 1 email sweep once on this week's inbox, and find Create agent in the Microsoft 365 Copilot app"],"A 90-day AI adoption plan for your team, with owners and dates, tracked by an agent.","",""],"ar":["استخدم وكيل التخطيط لبناء خطة لتبنّي الذكاء الاصطناعي في فريقك خلال 90 يوماً، بالمهام والمسؤولين والتواريخ.","",["Researcher وAnalyst، أول وكلائك: Researcher يخطّط ويبحث ويكتب تقريراً موثّقاً؛ وAnalyst يستدل على بياناتك ويبيّن منهجيته. الوكيل يخطّط خطواته بنفسه؛ ودورك ينتقل إلى التوجيه والتحقق","في Copilot افتح الوكلاء، ثم Planner (Frontier)","أعطه الهدف (⁦23.A⁩)","راجع الخطة: المهام، والمسؤولون، ومواعيد الاستحقاق. صحّح أمرين أخطأ فيهما","اسأل: «ما المعرّض للخطر هذا الأسبوع؟» ثم حوّل ملاحظات اجتماع إلى مهام (⁦23.B⁩)","شارك الخطة مع طاولتك. غداً تغذّي خارطة طريق التبنّي","المعضلة 04: الذكاء الاصطناعي يختار العروض المؤهلة (أدناه)","قبل الغد: أحضر P3، وشغّل فرز البريد من اليوم الأول مرة على بريد هذا الأسبوع، وابحث عن «إنشاء وكيل» في تطبيق Microsoft 365 Copilot"],"خطة لتبنّي الذكاء الاصطناعي في فريقك خلال 90 يوماً، بالمسؤولين والتواريخ، يتابعها وكيل.","",""],"P":[["23.A","The goal","الهدف","Planner agent","Plan a 90-day AI adoption and capability-building initiative for my team: training, champions, first use cases.","خطّط لمبادرة مدتها 90 يوماً لتبنّي الذكاء الاصطناعي وبناء القدرات في فريقي: التدريب، والسفراء، وأولى حالات الاستخدام."],["23.B","Risks and notes to tasks","المخاطر ومن الملاحظات إلى المهام","Planner agent","What is at risk this week?\n\nThen: Turn these meeting notes into tasks with an owner and a due date: [paste the notes].","ما المعرّض للخطر هذا الأسبوع؟\n\nثم: حوّل ملاحظات الاجتماع هذه إلى مهام بمسؤول وموعد استحقاق: [الصق الملاحظات]."]],"wide":false,"dl":[{"n":"04","t":{"en":"AI shortlists the bids","ar":"الذكاء الاصطناعي يختار العروض المؤهلة"},"s":{"en":"38 supplier bids arrive for a ground-equipment contract. A colleague has Copilot score them against the published criteria and proposes sending the top 5 straight to the tender committee. It saves two weeks.","ar":"وصل 38 عرضاً من مورّدين لعقد معدات أرضية. استخدم زميل Copilot لتقييمها وفق المعايير المنشورة، ويقترح إرسال أفضل 5 مباشرة إلى لجنة المناقصات. هذا يوفّر أسبوعين."},"q":{"en":"“Send the AI shortlist. The criteria are public and the scores are consistent.”","ar":"«أرسلوا القائمة المختصرة من الذكاء الاصطناعي. المعايير منشورة والتقييمات متسقة.»"},"x":{"en":"Who is accountable for the shortlist? What do you say if a losing bidder challenges the outcome?","ar":"من المسؤول عن القائمة المختصرة؟ وماذا تقول إن اعترض مورّد خاسر على النتيجة؟"}}],"fmt":{"en":"Input, exercise and discussion","ar":"عرض وتمرين ونقاش"},"tn":{"en":["Planner agent needs admin enablement (Frontier). Check before the session.","Timing: Researcher and Analyst 5 min, Exercise 9 20 min, Dilemma 04 10 min, before tomorrow 2 min.","They leave Day 2 with: a branded deck, a checked peer research scan, a team notebook, a stakeholder radar, a live inventory dashboard and decision, a critic-checked report, a Prompt Optimiser, P2 solved and a 90-day team AI plan."],"ar":["يحتاج وكيل التخطيط إلى تفعيل من المسؤول (Frontier). تحقق قبل الجلسة.","التوقيت: Researcher وAnalyst 5 دقائق، والتمرين 9 عشرون دقيقة، والمعضلة 04 عشر دقائق، و«قبل الغد» دقيقتان.","يخرجون من اليوم الثاني بـ: عرض بهويتهم، ومسح بحثي مُتحقَّق منه، ودفتر فريق، ورادار جهات معنية، ولوحة مخزون حيّة وقرار، وتقرير راجعه ناقد، ومحسّن أوامر، وحلّ P2، وخطة ذكاء اصطناعي للفريق لمدة 90 يوماً."]}},{"id":"24","day":3,"h":29,"ic":"shuffle","nm":{"en":"Agent or automation?","ar":"وكيل أم أتمتة؟"},"sub":{"en":"Two quick sorts","ar":"تصنيفان سريعان"},"tools":{"en":["Concepts"],"ar":["مفاهيم"]},"en":["Automation follows a path. An agent decides. Sort PF examples by what they are and by how close the human stays.","",["Yesterday, in your words: what you tried, what changed, what got in the way","Automation: one fixed path, decided in advance. AI agent: reads the situation and decides the path. AI decides; automation executes","Sort it, automation, agent or both: 1 the Sunday 08:00 flight-hours report email; 2 a vendor email read, classified, routed and logged; 3 a purchase request with a missing cost centre rejected; 4 200 free-text survey comments grouped into five themes; 5 a scanned invoice matched to its order and approved; 6 a new employee record triggers an IT account, an email and an induction invite; 7 a voice note transcribed, diagnosed and turned into a task; 8 any expense claim above a set limit goes to the department head","In, on or out of the loop: in (AI suggests, a person approves every action), on (AI acts, a person watches and can step in), out (AI acts alone, with spot checks after). The higher the stakes, the closer the human","Sort it, in, on or out: 1 an HR policy assistant on the intranet; 2 AI scores supplier bids; 3 automatic training reminders; 4 AI translates an official PF circular into Arabic; 5 AI routes vendor enquiries; 6 a weekly internal digest of aviation news; 7 AI flags concerns in a supplier's public record; 8 AI shortlists candidate
