function build(){const t=T[lang];root.lang=lang;root.dir=t.dir;
 $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede([nSt,nLab]);$("langBtn").textContent=t.lang;$("foot").textContent=t.foot;
 const tl=["ChatGPT","Claude","CopilotMS","Gemini","Perplexity","Grok","Manus","ElevenLabs","Kling","Higgsfield","SpeakApp","Excel","n8n","MCP","Copilot"];
 $("story").innerHTML=`<div class="end"><span class="n">${S.find(s=>s.okey==="o1").no}</span><div><small>${t.storyA[0]}</small><b>${t.storyA[1]}</b></div></div><div class="mid"><div class="mini"></div><div class="lg">${tl.map(k=>`<img src="${LOGO[k]}" alt="">`).join("")}</div></div><div class="end fin"><span class="n">${nSt}</span><div><small>${t.storyB[0]}</small><b>${t.storyB[1]}</b></div></div>`;
 $("hereL").textContent=t.here;$("nextL").textContent=t.next;$("detBtn").textContent=t.det;$("kbd").textContent=t.kbd;
 $("prevBtn").textContent=lang==="ar"?"→":"←";$("nextBtn").textContent=lang==="ar"?"←":"→";
 // map
 const flipX=x=>lang==="ar"?x:VBW-x;
 let h=`<div style="position:relative;width:100%;aspect-ratio:${VBW}/${VBH}"><svg class="rope" viewBox="0 0 ${VBW} ${VBH}" aria-hidden="true" style="${lang==="en"?"transform:scaleX(-1)":""}"><defs><pattern id="pRope" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect class="r1" width="12" height="12"/><rect class="r2" width="4.5" height="12"/></pattern><pattern id="pDone" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect class="d1" width="12" height="12"/><rect class="d2" width="4.5" height="12"/></pattern></defs>
 <rect class="panel" x="16" y="${panels[0][0]}" width="1168" height="${panels[panels.length-1][1]-panels[0][0]}" rx="30"/>
 <path id="ropePath" class="rope-base" d="${d}"/><path id="ropeDone" class="rope-done" d="${d}"/><circle class="mk" cx="1150" cy="${Y[0]}" r="21"/><polygon class="mk-tri" points="1157,${Y[0]-10} 1157,${Y[0]+10} 1141,${Y[0]}"/></svg>`;
 [1,2,3].forEach(dn=>{h+=`<div class="dayl" style="top:${dayY[dn]/VBH*100}%"><b>${t.days[dn][0]}</b><span>${t.days[dn][1]}</span></div>`;});
 S.forEach((s,i)=>{const [x,yy]=POS[s.id],lab=s.kind==="lab";
  h+=`<div class="st ${lab?"labst":""}" data-i="${i+1}" style="left:${flipX(x)/VBW*100}%;top:${yy/VBH*100}%"><div class="lbl"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span></div><button class="dot ${lab?"lab":""}" type="button" aria-label="${esc(s.nm[lang])}">${dotHTML(s)}</button>${(s.tools.length||s.rule)?`<div class="chips">${chipsOf(s)}</div>`:""}</div>`;});
 $("map").innerHTML=h+`</div>`;
 // list
 let l="";[1,2,3].forEach(dn=>{l+=`<div class="lday"><b>${t.days[dn][0]}</b><span>${t.days[dn][1]}</span></div><div class="lgroup">`;
  S.forEach((s,i)=>{if(s.day!==dn)return;const lab=s.kind==="lab";l+=`<button type="button" class="li ${lab?"labli":""}" data-i="${i+1}"><span class="dot ${lab?"lab":""}">${dotHTML(s)}</span><span class="tx"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span>${(s.tools.length||s.rule)?`<span class="cl">${chipsOf(s)}</span>`:""}</span></button>`;});l+=`</div>`;});
 $("list").innerHTML=l;
 // sections
 $("focusSec").innerHTML=`<h2>${t.focusH}</h2><p class="sub">${t.focusS}</p><div class="focus">${["ChatGPT","Claude","CopilotMS"].map(k=>`<div class="fc"><div class="h"><img src="${LOGO[k]}" alt=""><div><span class="k">${t.focus[k][0]}</span><b>${k==="CopilotMS"?"Microsoft Copilot":k}</b></div></div><span>${t.focus[k][1]}</span></div>`).join("")}</div><div class="also"><small>${t.also}</small>${["Gemini","Perplexity","Grok","Manus","ElevenLabs","Kling","Higgsfield","SpeakApp","n8n","MCP","Copilot Studio"].map(chip).join("")}</div>`;
 $("labsSec").innerHTML=`<h2>${t.labsH}</h2><p class="sub">${t.labsS}</p><div class="labs">${S.map((s,i)=>s.kind!=="lab"?"":`<button type="button" class="labcard" data-i="${i+1}"><span class="dot lab">${dotHTML(s)}</span><span><small>${t.lab} ${s.no} · ${t.days[s.day][0]} · ${s.h} ${t.min}</small><b>${esc(s.nm[lang])}</b><span>${esc(s.out[lang])}</span></span></button>`).join("")}</div>`;
 $("outsSec").innerHTML=`<h2>${t.outsH}</h2><div class="outs">${S.filter(s=>s.okey).map(s=>`<div class="out"><small>${t.st} ${s.no}</small><b>${t.outs[s.okey]}</b></div>`).join("")}</div>`;
 L=[];render(false);if(open)fillDr(open);}
/* rope progress */
let total=0,L=[];
function measure(){if(L.length)return;const rp=$("ropePath");if(!rp)return;try{total=rp.getTotalLength();if(!total)return;const pts=[];for(let s=0;s<=total;s+=4){const p=rp.getPointAtLength(s);pts.push([s,p.x,p.y]);}
 L=S.map(s=>{const q=POS[s.id];let best=0,bd=Infinity;pts.forEach(p=>{const dd=(p[1]-q[0])**2+(p[2]-q[1])**2;if(dd<bd){bd=dd;best=p[0];}});return best;});}catch(e){L=[];}}
let cur=0,open=0,lastFocus=null;const mq=matchMedia("(min-width:1000px)"),reduce=matchMedia("(prefers-reduced-motion: reduce)");
const lblOf=s=>`${s.kind==="lab"?`<span class="lt">${T[lang].lab} ${s.no}</span>`:`${s.no} · `}${esc(s.nm[lang])}`;
function render(scroll){const t=T[lang];
 document.querySelectorAll("[data-i]").forEach(el=>{const i=+el.dataset.i;if(el.classList.contains("labcard"))return;el.classList.toggle("done",cur>0&&i<cur);el.classList.toggle("cur",i===cur);el.classList.toggle("dim",cur>0&&i>cur);});
 $("hereNow").innerHTML=cur?lblOf(S[cur-1]):t.overview;$("hereNext").innerHTML=cur<N?lblOf(S[cur]):t.end;
 $("prevBtn").disabled=cur===0;$("nextBtn").disabled=cur===N;$("detBtn").hidden=cur===0;$("progBar").style.width=(cur/N*100)+"%";
 measure();const rd=$("ropeDone");if(L.length&&rd){rd.style.strokeDasharray=cur?(L[cur-1]+" "+total):("0 "+total);rd.style.visibility=cur?"visible":"hidden";}
 if(scroll&&cur){const el=document.querySelector(mq.matches?`.st[data-i="${cur}"] .dot`:`.li[data-i="${cur}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-40)el.scrollIntoView({block:"center",behavior:reduce.matches?"auto":"smooth"});}}}
const setCur=(n,sc)=>{cur=Math.max(0,Math.min(N,n));render(sc);};
function fillDr(n){const t=T[lang],s=S[n-1],lab=s.kind==="lab";
 $("dp").innerHTML=`<div class="dh"><div class="dot ${lab?"lab":""}">${dotHTML(s)}</div><div class="tt"><small>${t.days[s.day][0]} · ${lab?`${t.labOf} ${s.no}`:`${t.st} ${s.no} ${t.of} ${nSt}`} · ${s.h} ${t.min}</small><h2>${esc(s.nm[lang])}</h2></div><button class="x" id="drClose" type="button" aria-label="×">×</button></div>
 <div class="dout ${lab?"lab":""}"><small>${lab?t.labOut:t.out}</small><p>${esc(s.out[lang])}</p></div>
 <h3>${lab?t.labWhat:t.what}</h3><ol>${s.steps[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
 ${s.tools.length?`<div><h3 style="margin-bottom:8px">${t.tools}</h3><div class="tchips">${s.tools.map(chip).join("")}</div></div>`:""}
 ${s.P.length?`<div><h3 style="margin-bottom:8px">${t.cmds} (${s.P.length})</h3>${s.P.map((p,i)=>`<details class="pr"><summary><b><bdi>${p[0]}</bdi></b> ${esc(lang==="ar"?p[2]:p[1])}</summary><div class="pmeta">${t.runIn}: ${esc(p[3])}</div><div class="ptext" dir="${t.dir}">${esc(lang==="ar"?p[5]:p[4])}</div><button class="cp" type="button" data-p="${i}">${t.copy}</button></details>`).join("")}</div>`:""}
 ${MODE==="trainer"?`<div class="tnote"><small>${t.tnote}</small>${esc(s.note[lang])}</div>`:""}
 ${s.rule?`<p class="drule">${esc(s.rule[lang])}</p>`:""}
 <div class="dfoot"><button type="button" id="drPrev" ${n===1?"disabled":""}>${lang==="ar"?"→":"←"} ${t.prev}</button><button type="button" id="drNext" class="pri" ${n===N?"disabled":""}>${t.nxt} ${lang==="ar"?"←":"→"}</button></div>`;
 $("drClose").onclick=closeDr;$("drPrev").onclick=()=>go(open-1);$("drNext").onclick=()=>go(open+1);
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.p],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copied;setTimeout(()=>b.textContent=t.copy,1500);});}
function openDr(n){if(!open)lastFocus=document.activeElement;open=n;fillDr(n);$("dr").hidden=false;$("drClose").focus();}
function go(n){if(n<1||n>N)return;open=n;setCur(n,true);fillDr(n);$("drClose").focus();}
function closeDr(){$("dr").hidden=true;open=0;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.addEventListener("click",e=>{const t=e.target.closest(".st .dot, .li, .labcard");if(!t)return;const host=t.closest("[data-i]");const n=+host.dataset.i;setCur(n,false);openDr(n);});
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});
$("prevBtn").onclick=()=>setCur(cur-1,true);$("nextBtn").onclick=()=>setCur(cur+1,true);$("detBtn").onclick=()=>{if(cur)openDr(cur);};
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const fwd=lang==="ar"?"ArrowLeft":"ArrowRight",back=lang==="ar"?"ArrowRight":"ArrowLeft";
 if(open){if(e.key==="Escape"){closeDr();e.preventDefault();}else if(e.key===fwd){go(open+1);e.preventDefault();}else if(e.key===back){go(open-1);e.preventDefault();}return;}
 if(e.key===fwd){setCur(cur+1,true);e.preventDefault();}else if(e.key===back){setCur(cur-1,true);e.preventDefault();}});
const onMq=()=>{L=[];render(false);};if(mq.addEventListener)mq.addEventListener("change",onMq);
$("themeBtn").onclick=()=>{const t=root.getAttribute("data-theme");const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.setAttribute("data-theme",dark?"light":"dark");};
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";build();};
build();
})();
</script></body></html>
