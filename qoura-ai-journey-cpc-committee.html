<script>
const DATA={"ST":[{"okey": "o1", "day": 1, "h": 25, "kind": "st", "ic": "chip", "tools": ["Concepts"], "lead": null, "nm": {"ar": "ثلاثة مفاهيم", "en": "Three concepts"}, "out": {"ar": "فهم مشترك، وقائمة بخمس مهام من عملك يمكن تسريعها", "en": "A shared understanding, and a list of 5 tasks from your work that AI can speed up"}, "steps": {"ar": ["ما الذكاء الاصطناعي بلغة بسيطة", "الفرق بين البرمجة والذكاء التقليدي والتوليدي بمثال واحد", "كيف يعمل النموذج اللغوي، وما يجيده وما لا يجيده", "يكتب كل متدرب خمس مهام من عمله ترافقه طوال الأيام الثلاثة"], "en": ["What AI is, in plain language", "Programming vs traditional AI vs generative AI in one example", "How a language model works, what it does well and what it does not", "Each participant writes 5 tasks from their work that stay with them for all three days"]}, "note": {"ar": "مثال واحد بثلاث طرق (فلتر بريد، وتنبؤ، وكتابة رد) يوضح الفرق في دقيقتين، ثم تبدأ قائمة المهام الخمس؛ فهي خيط الرحلة كلها.", "en": "One example three ways (mail filter, prediction, writing a reply) shows the difference in two minutes; then the five-task list starts, the thread of the whole journey."}, "P": [["1.A", "Programming, traditional AI or generative AI?", "برمجة أم ذكاء تقليدي أم توليدي؟", "ChatGPT", "Explain the difference between programming, traditional AI and generative AI in plain language for an employee in a government entity, with one example of each from office work. Then sort these ten tasks from the Ufuq initiative (a synthetic internal initiative that helps employees adopt AI) into the three types, with a one-line reason for each:\n1. Count registrations by department\n2. Send an automatic confirmation email when someone registers\n3. Predict which participants are likely to drop out\n4. Write a personal welcome message for each participant\n5. Recommend the right programme for an employee\n6. Summarise 300 written feedback answers\n7. Calculate training hours per department\n8. Design a launch poster for the initiative\n9. Flag duplicate registrations\n10. Draft a briefing for leadership from meeting notes\nFormat: a short explanation, then a table.", "اشرح الفرق بين البرمجة والذكاء الاصطناعي التقليدي والذكاء الاصطناعي التوليدي بلغة بسيطة لموظف في جهة حكومية، مع مثال واحد لكل نوع من العمل المكتبي. ثم افرز هذه المهام العشر من مبادرة «أفق» (مبادرة داخلية افتراضية تساعد الموظفين على تبنّي الذكاء الاصطناعي) إلى الأنواع الثلاثة، مع سبب من سطر واحد لكل مهمة:\n1. عدّ التسجيلات حسب الإدارة\n2. إرسال بريد تأكيد تلقائي عند التسجيل\n3. توقّع المشاركين المعرّضين للانسحاب\n4. كتابة رسالة ترحيب شخصية لكل مشارك\n5. ترشيح البرنامج المناسب للموظف\n6. تلخيص 300 إجابة مكتوبة في استبيان الملاحظات\n7. حساب ساعات التدريب لكل إدارة\n8. تصميم ملصق إطلاق المبادرة\n9. اكتشاف التسجيلات المكررة\n10. صياغة إحاطة للقيادة من ملاحظات اجتماع\nالصيغة: شرح قصير، ثم جدول."], ["1.B", "My 5 tasks", "مهامي الخمس", "ChatGPT / Claude", "Interview me with 6 short questions about my role and my week, then list the 5 tasks I repeat most that AI could speed up. For each: time spent per week, what AI could do, and what must stay with me.", "اسألني 6 أسئلة قصيرة عن دوري وأسبوعي، ثم اذكر أكثر 5 مهام أكررها ويمكن للذكاء الاصطناعي تسريعها. لكل مهمة: الوقت الذي تستغرقه أسبوعياً، وما يمكن أن يفعله الذكاء الاصطناعي، وما يجب أن يبقى بيدي."]], "rule": null, "no": "1", "id": "1"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "bulb", "tools": ["Timeline"], "lead": null, "nm": {"ar": "التاريخ", "en": "History"}, "out": {"ar": "خط زمني للذكاء الاصطناعي في ثماني محطات", "en": "An AI timeline in eight milestones"}, "steps": {"ar": ["المحطات الكبرى من خمسينيات القرن الماضي حتى اليوم", "ما أتاحته كل موجة", "أين التقى العمل الحكومي بكل موجة"], "en": ["The major milestones from the 1950s to today", "What each wave made possible", "Where government work met each wave"]}, "note": {"ar": "لا تطِل في التواريخ؛ الهدف أن يفهم المشارك لماذا تغيّر كل شيء في السنوات الثلاث الأخيرة.", "en": "Do not dwell on dates; the goal is to see why everything changed in the last three years."}, "P": [["2.A", "AI timeline", "الخط الزمني للذكاء الاصطناعي", "ChatGPT / Claude", "Show the history of AI as an 8-milestone timeline from the 1950s to today's large language models. For each milestone: the year, what happened in one line, and why it matters for the way a government team works today. Say which dates are approximate.", "اعرض تاريخ الذكاء الاصطناعي في خط زمني من 8 محطات منذ خمسينيات القرن الماضي حتى النماذج اللغوية الكبيرة اليوم. لكل محطة: السنة، وما حدث في سطر واحد، ولماذا يهمّ طريقة عمل فريق حكومي اليوم. ووضّح أي التواريخ تقريبية."]], "rule": null, "no": "2", "id": "2"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "shield", "tools": ["ChatGPT", "Claude"], "lead": null, "nm": {"ar": "احمِ بيانات جهتك", "en": "Protect your entity's data"}, "out": {"ar": "ما تجوز مشاركته وما لا تجوز، مع مراجعة بشرية دائماً", "en": "What can be shared, what cannot, and a human always reviews"}, "steps": {"ar": ["تصنيف البيانات قبل استخدام أي أداة", "استبدال الأسماء والأرقام والجهات قبل المشاركة", "التحقق من دقة المخرجات قبل اعتمادها", "القرار النهائي دائماً للإنسان"], "en": ["Classify the data before using any tool", "Replace names, numbers and entities before sharing", "Check the output's accuracy before relying on it", "The final decision always stays with a person"]}, "note": {"ar": "اعرض الهلوسة مباشرة: اطلب تلخيص تقرير غير موجود وشاهد النتيجة.", "en": "Show a hallucination live: ask for a summary of a report that does not exist and watch the result."}, "P": [["3.A", "Make a text safe to share", "تجهيز نص آمن للمشاركة", "Claude", "Turn this text into a safe version to share with an AI tool: replace names, numbers, entities and dates with tags such as [name], [entity] and [number], and give me a table of what you replaced so I can restore it later. [paste a synthetic text]", "حوّل هذا النص إلى نسخة آمنة للمشاركة مع أداة ذكاء اصطناعي: استبدل الأسماء والأرقام والجهات والتواريخ بعلامات مثل [اسم] و[جهة] و[رقم]، وأعطني جدولاً بما استبدلته لأستعيده لاحقاً. [الصق نصاً افتراضياً]"], ["3.B", "Checklist before official use", "قائمة تحقق قبل الاستخدام الرسمي", "ChatGPT", "Write an 8-point checklist an employee reviews before using any AI output in official correspondence: accuracy, sources, confidentiality, language, tone and human approval.", "اكتب قائمة تحقق من 8 بنود يراجعها الموظف قبل استخدام أي مخرج من الذكاء الاصطناعي في مراسلة رسمية: الدقة، والمصادر، والسرية، واللغة، والنبرة، والاعتماد البشري."], ["3.C", "Hallucination demo", "عرض الهلوسة", "ChatGPT / Claude", "Summarise the 2025 Ufuq initiative annual impact report in five bullets with its key numbers.\n(The report does not exist. Watch whether the tool admits it or invents a summary.)", "لخّص تقرير الأثر السنوي لمبادرة «أفق» لعام 2025 في خمس نقاط مع أبرز أرقامه.\n(التقرير غير موجود؛ لاحظ هل تعترف الأداة بذلك أم تخترع ملخصاً وأرقاماً.)"]], "rule": {"ar": "الأداة تقترح، والإنسان يقرر", "en": "The tool proposes, the human decides"}, "no": "3", "id": "3"}, {"okey": "o2", "day": 1, "h": 50, "kind": "st", "ic": "pen", "tools": ["ChatGPT", "Claude", "Microsoft Copilot", "SpeakApp"], "lead": null, "nm": {"ar": "هندسة الأوامر", "en": "Prompt engineering"}, "out": {"ar": "قالب: الدور، السياق، المهمة، الصيغة، القيود", "en": "Template: role, context, task, format, constraints"}, "steps": {"ar": ["العناصر الخمسة لأي أمر ناجح", "تحويل أمر ضعيف إلى أمر قوي", "اطلب من الأداة أن تسألك قبل أن تجيب", "المراجعة الذاتية والتكرار", "مكتبة أوامرك الشخصية", "قل أمرك بصوتك عبر SpeakApp، ثم رتّبه"], "en": ["The five parts of any good prompt", "Turn a weak prompt into a strong one", "Ask the tool to question you before answering", "Self-review and iteration", "Your personal prompt library", "Speak your prompt with SpeakApp, then structure it"]}, "note": {"ar": "اعرض الأمر الضعيف ثم القوي على الملاحظات نفسها، ودع الفرق يتكلم.", "en": "Show the weak prompt, then the strong one on the same notes, and let the difference speak."}, "P": [["4.A", "Weak vs strong prompt", "أمر ضعيف مقابل أمر قوي", "ChatGPT / Claude / Copilot", "Weak: \"Write a report about the meeting.\"\nStrong: You are an executive adviser in a government entity. Context: three departments met to follow up the Ufuq initiative rollout (notes below). Task: write executive minutes. Format: a 3-line summary, a decisions table (decision, owner, deadline), then risks. Constraints: under 300 words, formal language, add nothing that is not in the notes. [notes]", "ضعيف: «اكتب تقريراً عن الاجتماع».\nقوي: أنت مستشار تنفيذي في جهة حكومية. السياق: اجتمعت ثلاث إدارات لمتابعة إطلاق مبادرة «أفق» (الملاحظات أدناه). المهمة: اكتب محضراً تنفيذياً. الصيغة: خلاصة من 3 أسطر، ثم جدول القرارات (القرار، المسؤول، الموعد)، ثم المخاطر. القيود: أقل من 300 كلمة، لغة رسمية، ولا تضف معلومة غير موجودة في الملاحظات. [الملاحظات]"], ["4.B", "Ask before you answer", "اسأل قبل أن تجيب", "ChatGPT / Claude", "I need a 12-week rollout plan for the Ufuq initiative across five departments. Before you write anything, ask me the five questions you need answered to do this well, one at a time. Then write the plan as a week-by-week table.", "أحتاج خطة إطلاق من 12 أسبوعاً لمبادرة «أفق» في خمس إدارات. قبل أن تكتب أي شيء، اسألني الأسئلة الخمسة التي تحتاج إجاباتها لتنجز هذا جيداً، سؤالاً واحداً في كل مرة. ثم اكتب الخطة في جدول أسبوعي."], ["4.C", "Self-review", "المراجعة الذاتية", "ChatGPT / Claude / Copilot", "Review your draft as a proofreader and policy reviewer: list 5 weak points (accuracy, tone, clarity, length, unverified facts), then rewrite it with the fixes.", "راجع مسودتك بصفتك مدققاً لغوياً ومراجعاً للسياسات: اذكر 5 مواضع ضعف (الدقة، النبرة، الوضوح، الطول، معلومة غير مؤكدة)، ثم أعد كتابتها بعد التصحيح."], ["4.D", "Build my prompt library", "بناء مكتبة أوامري", "Claude", "Help me build my personal prompt library: use the 5 tasks I wrote this morning, then write a ready prompt for each using role, context, task, format and constraints, in a table.", "ساعدني في بناء مكتبة أوامري الشخصية: استخدم المهام الخمس التي كتبتها صباحاً، ثم اكتب لكل مهمة أمراً جاهزاً بقالب الدور والسياق والمهمة والصيغة والقيود، في جدول."], ["4.E", "Speak it, then structure it", "قلها بصوتك ثم رتّبها", "SpeakApp, then ChatGPT / Claude", "Open SpeakApp and say, in your own words and in Arabic, what you need from the Ufuq meeting minutes, as if you were explaining it to a colleague (about one minute). SpeakApp turns your voice into text. Paste the text into ChatGPT or Claude and add:\nTurn what I said into a strong prompt with five parts: role, context, task, format, constraints. Keep my intent, remove repetition, and list anything I did not say that you need.", "افتح SpeakApp وقل بكلماتك وبالعربية ما تحتاجه من محضر اجتماع «أفق»، كأنك تشرحه لزميل (نحو دقيقة). يحوّل SpeakApp صوتك إلى نص. الصق النص في ChatGPT أو Claude وأضف:\nحوّل ما قلته إلى أمر قوي من خمسة أجزاء: الدور، والسياق، والمهمة، والصيغة، والقيود. حافظ على قصدي، واحذف التكرار، واذكر أي معلومة لم أقلها وتحتاجها."]], "rule": null, "no": "4", "id": "4"}, {"okey": null, "day": 1, "h": 75, "kind": "st", "ic": "compass", "tools": ["ChatGPT", "Claude", "Microsoft Copilot", "Gemini", "Perplexity", "Grok", "Manus", "ElevenLabs", "Kling AI", "Higgsfield", "SpeakApp"], "lead": null, "nm": {"ar": "خريطة الأدوات", "en": "Tools map"}, "out": {"ar": "دليل «أي أداة لأي مهمة»، ومثال تطبيقي على كل أداة", "en": "A \"which tool for which task\" guide, plus a hands-on example with each tool"}, "steps": {"ar": ["جولة سريعة على أهم الأدوات", "ثلاث أدوات نتدرب عليها بعمق: Microsoft Copilot، وClaude، وChatGPT للإبداع", "Perplexity وGrok: بحث بمصادر ونقاش عام", "Gemini وManus: فيديو تعريفي وعرض وصفحة تعريفية", "ElevenLabs وKling AI: تعليق صوتي وفيديو", "SpeakApp: تحويل الصوت إلى نص"], "en": ["A quick tour of the main tools", "Three tools we train on in depth: Microsoft Copilot, Claude, and ChatGPT for creative work", "Perplexity and Grok: sourced research and public conversation", "Gemini and Manus: a concept video, a deck and a landing page", "ElevenLabs and Kling AI: voice-over and video", "SpeakApp: voice to text"]}, "note": {"ar": "هنا تُعلَن قاعدة البرنامج: ثلاث أدوات نتدرب عليها بعمق، ونعرّف ببقية الأدوات ومتى تُستخدم.", "en": "Announce the programme rule here: three tools in depth, and we know when to use the rest."}, "P": [["5.A", "Which tool for which job?", "أي أداة لأي مهمة؟", "ChatGPT", "Make a one-page tool-choice card for the Ufuq team covering ChatGPT, Claude, Microsoft Copilot, Gemini, Perplexity, Grok, Manus, ElevenLabs, Kling AI, Higgsfield and SpeakApp: what each is best at, one Ufuq job it fits (brief, research, images, video, voice-over, voice to text, deck, website), and one thing not to use it for. Format: a table, one row per tool.", "أعدّ بطاقة اختيار أدوات من صفحة واحدة لفريق «أفق» تشمل ChatGPT وClaude وMicrosoft Copilot وGemini وPerplexity وGrok وManus وElevenLabs وKling AI وHiggsfield وSpeakApp: أفضل ما تجيده كل أداة، ومهمة واحدة في «أفق» تناسبها (موجز، بحث، صور، فيديو، تعليق صوتي، تحويل الصوت إلى نص، عرض، موقع)، وشيء واحد لا تُستخدم له. الصيغة: جدول، صف لكل أداة."], ["5.B", "Sourced research", "بحث موثّق بالمصادر", "Perplexity", "What are the latest UAE government initiatives in artificial intelligence in the last six months? Give me 5 points with a source link for each, and mark anything you could not verify.", "ما أحدث المبادرات الحكومية في دولة الإمارات في مجال الذكاء الاصطناعي خلال آخر ستة أشهر؟ أعطني 5 نقاط مع رابط المصدر لكل نقطة، وميّز أي معلومة لم تتحقق منها."], ["5.C", "What people are saying", "ماذا يقول الناس؟", "Grok", "Summarise what people in the UAE are saying publicly this month about AI at work: three themes, two concerns, and two ideas Ufuq could use in its launch message. Give the posts or sources you used.", "لخّص ما يقوله الناس علناً في الإمارات هذا الشهر عن الذكاء الاصطناعي في العمل: ثلاثة محاور، ومخاوف اثنتين، وفكرتين يمكن أن تستخدمهما «أفق» في رسالة الإطلاق. اذكر المنشورات أو المصادر التي استخدمتها."], ["5.D", "Ufuq concept video", "الفيديو التعريفي لـ«أفق»", "Gemini (Veo)", "Create a cinematic 8-second video titled \"Ufuq\". Scene: early morning in a modern Abu Dhabi government office; an Emirati employee opens a laptop, a screen shows a simple rising chart, colleagues gather and smile. A thin golden horizon line glows across the frame at the end. Slow dolly-in, natural light, calm green and sand colours, no text, no real logos or famous people. Fictional training scenario.", "أنشئ فيديو سينمائياً مدته 8 ثوانٍ بعنوان «أفق». المشهد: صباح باكر في مكتب حكومي حديث في أبوظبي؛ موظف إماراتي يفتح حاسوبه، وشاشة تعرض مخططاً صاعداً بسيطاً، وزملاؤه يجتمعون ويبتسمون. في النهاية يضيء خط أفق ذهبي رفيع عبر المشهد. اقتراب بطيء، وإضاءة طبيعية، وألوان خضراء ورملية هادئة، دون نص، ودون شعارات حقيقية أو مشاهير. سيناريو تدريبي افتراضي."], ["5.E", "Deck and landing page", "عرض وصفحة تعريفية", "Manus", "Turn this Ufuq brief into an 8-slide briefing deck and a one-page bilingual landing page (Arabic first, right-to-left, with an English switch): what Ufuq is, three programmes, the timeline, and a \"register your interest\" form. Calm green and sand colours, label \"Training scenario\".", "حوّل موجز «أفق» هذا إلى عرض إحاطة من 8 شرائح وصفحة تعريفية ثنائية اللغة (العربية أولاً من اليمين إلى اليسار، مع زر للإنجليزية): ما «أفق»، وثلاثة برامج، والجدول الزمني، ونموذج «سجّل اهتمامك». بألوان خضراء ورملية هادئة، مع عبارة «سيناريو تدريبي»."], ["5.F", "Arabic voice-over", "التعليق الصوتي العربي", "ElevenLabs", "Choose a warm, clear Arabic voice and read calmly with short pauses: «في أفق، نتعلّم معاً كيف نجعل الذكاء الاصطناعي شريكاً في عملنا اليومي… الأداة تقترح، والإنسان يقرر.» Export it as MP3 and place it under the concept video.", "اختر صوتاً عربياً دافئاً وواضحاً واقرأ بهدوء مع وقفات قصيرة: «في أفق، نتعلّم معاً كيف نجعل الذكاء الاصطناعي شريكاً في عملنا اليومي… الأداة تقترح، والإنسان يقرر.» صدّره بصيغة MP3 وضعه تحت الفيديو التعريفي."], ["5.G", "Same shot in Kling AI", "اللقطة نفسها في Kling AI", "Kling AI", "Upload the same launch image to Kling AI with the same motion prompt you use in Higgsfield. Compare the two results on realism of faces and hands, smoothness of motion, respect for the colours, and time to generate. Which would you use, and why?", "ارفع صورة الإطلاق نفسها إلى Kling AI بأمر الحركة نفسه الذي تستخدمه في Higgsfield. قارن النتيجتين في واقعية الوجوه والأيدي، وسلاسة الحركة، والالتزام بالألوان، ووقت الإنشاء. أيهما ستستخدم، ولماذا؟"], ["5.H", "Voice to text", "من الصوت إلى نص", "SpeakApp", "Open SpeakApp and dictate, in Arabic, a two-minute update on Ufuq as if you were briefing your director in the corridor. Check the text it produces: names, numbers and terms. Then paste it into ChatGPT or Claude and ask: turn this into a five-line formal update with one decision needed.", "افتح SpeakApp وأملِ بالعربية تحديثاً عن «أفق» مدته دقيقتان كأنك تُطلع مديرك في الممر. راجع النص الناتج: الأسماء والأرقام والمصطلحات. ثم الصقه في ChatGPT أو Claude واطلب: حوّل هذا إلى تحديث رسمي من خمسة أسطر مع قرار واحد مطلوب."]], "rule": null, "no": "5", "id": "5"}, {"okey": null, "day": 1, "h": 50, "kind": "st", "ic": "bulb", "tools": ["ChatGPT", "Higgsfield"], "lead": "ChatGPT", "nm": {"ar": "ChatGPT", "en": "ChatGPT"}, "out": {"ar": "صور ومنشور ومقطع قصير بهوية واحدة", "en": "Images, a post and a short clip in one identity"}, "steps": {"ar": ["توليد صورة إطلاق وتعديلها بجملة واحدة", "تحويل الصورة إلى مقطع قصير في Higgsfield", "كتابة منشور الإطلاق للبوابة الداخلية", "تحليل ملف بيانات صغير داخل ChatGPT"], "en": ["Generate a launch image and edit it with one sentence", "Turn the image into a short clip in Higgsfield", "Write the launch post for the internal portal", "Analyse a small data file inside ChatGPT"]}, "note": {"ar": "اعرض توليد صورة ثم تعديلها بجملة واحدة؛ هذه اللحظة تشدّ انتباه القاعة.", "en": "Show an image generated then edited with one sentence; that is the moment that opens the room."}, "P": [["6.A", "Image, then edit", "صورة ثم تعديل", "ChatGPT (images)", "Create a clean, realistic image of a government team in Abu Dhabi working with AI on laptops in a bright modern meeting room; Emirati men in kandura and women in abaya and shayla; calm green and sand colours; 16:9; no text, no real logos, no famous people. Then: make the room brighter and add a whiteboard with a simple flowchart.", "أنشئ صورة واقعية نظيفة لفريق حكومي في أبوظبي يعمل مع الذكاء الاصطناعي على حواسيب في قاعة اجتماعات حديثة ومشرقة؛ رجال إماراتيون بالكندورة ونساء بالعباءة والشيلة؛ ألوان خضراء ورملية هادئة؛ 16:9؛ دون نص أو شعارات حقيقية أو مشاهير. ثم: اجعل القاعة أكثر إشراقاً وأضف سبورة عليها مخطط بسيط."], ["6.B", "Turn the image into a video", "حوّل الصورة إلى فيديو", "Higgsfield (image to video)", "Upload the launch image. Prompt: Slow cinematic push-in towards the person presenting; the team turns slightly and smiles; soft golden light particles drift upward; natural movement, realistic faces and hands, 5 seconds, 16:9. Try two camera presets and keep the calmer one.", "ارفع صورة الإطلاق. الأمر: Slow cinematic push-in towards the person presenting; the team turns slightly and smiles; soft golden light particles drift upward; natural movement, realistic faces and hands, 5 seconds, 16:9. جرّب حركتين للكاميرا واحتفظ بالأهدأ."], ["6.C", "Launch post", "منشور الإطلاق", "ChatGPT", "Write a launch post for the Ufuq initiative for the internal staff portal: Arabic and English, under 80 words each, warm and formal. Make clear it is a pilot and do not promise dates or certificates.", "اكتب منشور إطلاق لمبادرة «أفق» لبوابة الموظفين الداخلية: بالعربية والإنجليزية، أقل من 80 كلمة لكل منهما، بنبرة رسمية دافئة. وضّح أنها تجربة، ولا تَعِد بمواعيد أو شهادات."], ["6.D", "Analyse a file in ChatGPT", "حلّل ملفاً داخل ChatGPT", "ChatGPT (data analysis)", "Here is the synthetic Ufuq registrations file. Show registrations by department and by programme, the completion rate, and one chart. Tell me the three things a director should notice, and what the data cannot tell us.", "هذا ملف تسجيلات «أفق» الافتراضي. اعرض التسجيلات حسب الإدارة والبرنامج، ونسبة الإكمال، ومخططاً واحداً. أخبرني بأهم ثلاثة أشياء يجب أن يلاحظها المدير، وما الذي لا تستطيع البيانات إخبارنا به."]], "rule": null, "no": "6", "id": "6"}, {"okey": null, "day": 1, "h": 35, "kind": "lab", "ic": "ChatGPT", "tools": ["ChatGPT"], "lead": null, "nm": {"ar": "هوية مبادرة «أفق»", "en": "The Ufuq initiative identity"}, "out": {"ar": "الاسم والعبارة التعريفية والألوان والشعار ومنشور الإطلاق، ونبذة مهنية شخصية", "en": "Name, slogan, colours, logo and launch post, plus a personal professional bio"}, "steps": {"ar": ["ملخص الهوية", "الشعار البصري", "منشور الإطلاق", "النبذة المهنية الشخصية"], "en": ["Brand brief", "Logo", "Launch post", "Personal professional bio"]}, "note": {"ar": "«أفق» مبادرة داخلية افتراضية ترافقنا في كل التدريبات؛ ما يُبنى هنا يُستخدم في Claude وCopilot لاحقاً.", "en": "Ufuq is a synthetic internal initiative that runs through every lab; what is built here is reused in Claude and Copilot later."}, "P": [["T1.A", "Brand brief", "ملخص الهوية", "ChatGPT", "Create a brand brief for \"Ufuq\", a synthetic internal government initiative that helps employees adopt AI in their daily work: three name options with meaning, a slogan in Arabic and English, a colour palette (3 colours with hex codes and why), the tone of voice in 3 words, and 3 key messages.", "أنشئ ملخص هوية لمبادرة «أفق»، وهي مبادرة حكومية داخلية افتراضية تساعد الموظفين على تبنّي الذكاء الاصطناعي في عملهم اليومي: ثلاثة خيارات للاسم مع المعنى، وعبارة تعريفية بالعربية والإنجليزية، ولوحة ألوان (3 ألوان برموزها وسبب اختيار كل لون)، ونبرة الصوت في 3 كلمات، و3 رسائل رئيسية."], ["T1.B", "Logo", "الشعار البصري", "ChatGPT (images)", "Design a simple, modern logo for \"Ufuq\" using the palette above: a horizon line with a rising arc, flat style, white background, no text inside the symbol. Then give me a second version with the Arabic word «أفق» next to the symbol.", "صمّم شعاراً بصرياً بسيطاً وعصرياً لمبادرة «أفق» بلوحة الألوان السابقة: خط أفق مع قوس صاعد، بأسلوب مسطح، وخلفية بيضاء، ودون نص داخل الرمز. ثم أعطني نسخة ثانية بكلمة «أفق» بجانب الرمز."], ["T1.C", "Launch post", "منشور الإطلاق", "ChatGPT", "Write a launch post for \"Ufuq\" for the internal staff portal (under 80 words, Arabic and English) and create a matching square image in the brand colours.", "اكتب منشور إطلاق لمبادرة «أفق» لبوابة الموظفين الداخلية (أقل من 80 كلمة، بالعربية والإنجليزية)، وأنشئ صورة مربعة مطابقة بألوان الهوية."], ["T1.D", "Personal branding", "العلامة الشخصية", "ChatGPT", "Interview me with 5 questions about my role, achievements and skills, then write a professional bio (under 150 words) and a one-line headline, in Arabic and English.", "اسألني 5 أسئلة عن دوري وإنجازاتي ومهاراتي، ثم اكتب نبذة مهنية (أقل من 150 كلمة) وسطراً تعريفياً واحداً، بالعربية والإنجليزية."]], "rule": null, "no": "T1", "id": "T1"}, {"okey": "o4", "day": 2, "h": 35, "kind": "st", "ic": "bulb", "tools": ["ChatGPT", "Custom GPT"], "lead": "ChatGPT", "nm": {"ar": "Custom GPT", "en": "Custom GPT"}, "out": {"ar": "مساعد يجيب من دليل الإجراءات بصوت الجهة", "en": "An assistant that answers from the procedures guide in your entity's voice"}, "steps": {"ar": ["اختيار مهمة متكررة من قائمتك", "كتابة التعليمات: الدور، والمهام، والنبرة، والحدود", "إضافة الملفات المرجعية وبدايات المحادثة", "تجربته على أسئلة من واقع العمل"], "en": ["Pick a recurring task from your list", "Write the instructions: role, tasks, tone, limits", "Add the reference files and conversation starters", "Test it on real work questions"]}, "note": {"ar": "اطلب من كل مشارك اختيار مهمته من قائمة المهام الخمس.", "en": "Ask each participant to pick their task from the five-task list."}, "P": [["7.A", "Official correspondence assistant", "مساعد المراسلات الرسمية", "ChatGPT (Custom GPT)", "You are the \"Official Correspondence Assistant\". Draft internal and external correspondence following the attached style guide. Always ask for the recipient, the purpose and the level of formality. Never invent numbers or names. End every draft with \"For review before sending\". Starters: Write a thank-you letter to a partner entity / Draft an internal circular / Proofread this letter.", "أنت «مساعد المراسلات الرسمية». مهمتك صياغة المراسلات الداخلية والخارجية وفق دليل الأسلوب المرفق. اسأل دائماً عن الجهة المرسل إليها، والغرض، ودرجة الرسمية. لا تخترع أرقاماً أو أسماء. اختم كل مسودة بعبارة «للمراجعة قبل الإرسال». بدايات المحادثة: اكتب خطاب شكر لجهة شريكة / صُغ تعميماً داخلياً / راجع هذا الخطاب لغوياً."], ["7.B", "The Ufuq Assistant", "«مساعد أفق»", "ChatGPT (Custom GPT)", "Name: Ufuq Assistant. Instructions: answer staff questions about the Ufuq initiative only from the attached brief, programmes and FAQ. Ask one question at a time, reply in the user's language, and end with a clear next step. Never promise dates, seats or certificates, and never answer about personal data; direct those to the initiative team. Starters: What is Ufuq? / Which programme suits my role? / How do I register?", "الاسم: مساعد أفق. التعليمات: أجب عن أسئلة الموظفين حول مبادرة «أفق» من الملخص والبرامج والأسئلة الشائعة المرفقة فقط. اسأل سؤالاً واحداً في كل مرة، وأجب بلغة المستخدم، واختم بخطوة تالية واضحة. لا تَعِد بمواعيد أو مقاعد أو شهادات، ولا تُجب عن أي بيانات شخصية؛ ووجّهها إلى فريق المبادرة. بدايات المحادثة: ما «أفق»؟ / أي برنامج يناسب دوري؟ / كيف أسجّل؟"], ["7.C", "Test it like a colleague", "اختبره كزميل", "Your Custom GPT", "Ask your assistant: 1. When does the next session start? 2. I work in finance; which programme suits me? 3. Will I get a certificate? 4. Can you give me a colleague's registration details? Check each answer against the files: it should admit what it does not know, recommend with a reason, promise nothing, and refuse personal data.", "اسأل مساعدك: 1. متى تبدأ الجلسة القادمة؟ 2. أعمل في المالية، أي برنامج يناسبني؟ 3. هل سأحصل على شهادة؟ 4. هل تعطيني بيانات تسجيل زميلي؟ وطابق كل إجابة مع الملفات: يجب أن يعترف بما لا يعرفه، ويرشّح مع السبب، ولا يَعِد بشيء، ويرفض البيانات الشخصية."]], "rule": null, "no": "7", "id": "7"}, {"okey": "o3", "day": 2, "h": 30, "kind": "st", "ic": "bulb", "tools": ["Claude Projects"], "lead": "Claude", "nm": {"ar": "Claude Projects", "en": "Claude Projects"}, "out": {"ar": "مشروع «أفق» في Claude وخطة إطلاق منه", "en": "The Ufuq project in Claude, and a rollout plan from it"}, "steps": {"ar": ["مساحة واحدة لكل ملف أو مشروع متكرر", "رفع المراجع مرة واستخدامها كل مرة", "كتابة تعليمات المشروع", "اكتشاف الفجوات وكتابة الخطة منه"], "en": ["One workspace per recurring file or project", "Upload references once, use them every time", "Write the project instructions", "Find the gaps and write the plan from it"]}, "note": {"ar": "ارفع هوية «أفق» من محطة ChatGPT كملف مرجعي؛ هكذا تتصل المحطات.", "en": "Upload the Ufuq identity from the ChatGPT station as a reference file; that is how the stations connect."}, "P": [["8.A", "Project instructions", "تعليمات المشروع", "Claude Projects", "You are the content assistant for the Ufuq initiative. Rely only on the uploaded files and follow the brand brief: colours, tone and key messages. Write in formal Arabic, cite the source file for every fact, separate facts from assumptions, and say \"not in the files\" when information is missing.", "أنت مساعد المحتوى لمبادرة «أفق». اعتمد فقط على الملفات المرفوعة والتزم بملخص الهوية: الألوان والنبرة والرسائل الرئيسية. اكتب بالعربية الرسمية، واذكر الملف المصدر لكل معلومة، وافصل الحقائق عن الافتراضات، وقل «غير موجود في الملفات» عند غياب المعلومة."], ["8.B", "Find the gaps", "اكتشف الفجوات", "Claude Projects", "Read all the project files and list the gaps a director would notice: missing owners, missing dates, numbers that do not add up, and risks with no mitigation. Put them in a table with severity (high, medium, low) and a suggested fix.", "اقرأ كل ملفات المشروع واذكر الفجوات التي سيلاحظها المدير: مسؤولون غير محددين، ومواعيد ناقصة، وأرقام لا تتطابق، ومخاطر بلا معالجة. ضعها في جدول بدرجة الأهمية (عالية، متوسطة، منخفضة) ومعالجة مقترحة."], ["8.C", "The first four weeks", "الأسابيع الأربعة الأولى", "Claude Projects", "Write the plan for Ufuq's first four weeks as a week-by-week table: activities, owner role, output, and the decision it feeds. End with the three risks to watch.", "اكتب خطة الأسابيع الأربعة الأولى لمبادرة «أفق» في جدول أسبوعي: الأنشطة، والدور المسؤول، والمخرج، والقرار الذي يغذّيه. اختم بثلاث مخاطر يجب متابعتها."]], "rule": null, "no": "8", "id": "8"}, {"okey": null, "day": 2, "h": 30, "kind": "st", "ic": "bulb", "tools": ["Claude Artifacts"], "lead": "Claude", "nm": {"ar": "Claude Artifacts", "en": "Claude Artifacts"}, "out": {"ar": "أداة تفاعلية جاهزة ورابط للمشاركة", "en": "A ready interactive tool and a link to share"}, "steps": {"ar": ["ما الـ Artifact ومتى تستخدمه", "بناء أداة تفاعلية صغيرة من وصف", "تحسينها بطلبات متتالية", "النشر ومشاركة الرابط"], "en": ["What an Artifact is and when to use it", "Build a small interactive tool from a description", "Improve it with follow-up requests", "Publish and share the link"]}, "note": {"ar": "الهدف أن يرى كل مشارك أداة حية تعمل خلال دقائق.", "en": "The goal: every participant sees a live tool working within minutes."}, "P": [["9.A", "Programme matcher", "أداة ترشيح البرنامج", "Claude Artifacts", "Build a five-question quiz that recommends one of three Ufuq programmes (AI Foundations, AI for Productivity, AI for Leaders): role, seniority, daily tasks, comfort with AI, and available time. Show the best match and an alternative with a two-line reason each. Arabic first, right-to-left, with an English switch; calm green and sand colours.", "ابنِ اختباراً من خمسة أسئلة يرشّح واحداً من ثلاثة برامج في «أفق» (أساسيات الذكاء الاصطناعي، الذكاء الاصطناعي للإنتاجية، الذكاء الاصطناعي للقادة): الدور، والمستوى الوظيفي، والمهام اليومية، ومدى الراحة مع الذكاء الاصطناعي، والوقت المتاح. اعرض البرنامج الأنسب وبديلاً له مع سبب في سطرين لكل منهما. بالعربية أولاً من اليمين إلى اليسار مع زر للإنجليزية، وبألوان خضراء ورملية هادئة."], ["9.B", "AI-readiness self-check", "تقييم الجاهزية للذكاء الاصطناعي", "Claude Artifacts", "Build a 10-statement self-check for employees (agree / partly / not yet) on using AI safely at work. Show a score, three personal next steps, and the matching Ufuq programme. Nothing is saved or sent.", "ابنِ تقييماً ذاتياً من 10 عبارات للموظفين (أوافق / جزئياً / ليس بعد) عن استخدام الذكاء الاصطناعي بأمان في العمل. اعرض النتيجة، وثلاث خطوات شخصية تالية، والبرنامج المناسب في «أفق». لا يُحفظ أو يُرسل أي شيء."]], "rule": null, "no": "9", "id": "9"}, {"okey": null, "day": 2, "h": 40, "kind": "lab", "ic": "Claude", "tools": ["Claude"], "lead": null, "nm": {"ar": "موقع وعرض ولوحة لمبادرة «أفق»", "en": "Website, deck and dashboard for Ufuq"}, "out": {"ar": "موقع «أفق»، وعرض تقديمي، ولوحة متابعة بهويتها", "en": "The Ufuq website, a deck and a tracking dashboard in its identity"}, "steps": {"ar": ["صفحة الموقع", "العرض التقديمي", "لوحة المتابعة"], "en": ["Website page", "Presentation", "Tracking dashboard"]}, "note": {"ar": "الهدف أن يرى كل مشارك مخرجاً حياً بهوية بناها بنفسه في اليوم الأول.", "en": "The goal: every participant sees a live output in an identity they built on Day 1."}, "P": [["T2.A", "The website", "الموقع", "Claude Artifacts", "Using the Ufuq brand brief, build a one-page bilingual Arabic and English website: hero with slogan, what the initiative is, 3 programmes, a timeline, and a registration form. Use the brand colours, as one HTML file.", "باستخدام ملخص هوية «أفق»، ابنِ موقعاً من صفحة واحدة بالعربية والإنجليزية: واجهة تحمل الشعار، وتعريف بالمبادرة، و3 برامج، وجدول زمني، ونموذج تسجيل. بألوان الهوية، في ملف HTML واحد."], ["T2.B", "The deck", "العرض التقديمي", "Claude", "Build an 8-slide launch deck for Ufuq for a leadership meeting: title, the problem, the initiative, 3 programmes, timeline, KPIs, risks, decision needed. Brand colours, one idea per slide, speaker notes on each slide.", "ابنِ عرض إطلاق من 8 شرائح لمبادرة «أفق» لاجتماع قيادي: العنوان، والمشكلة، والمبادرة، و3 برامج، والجدول الزمني، ومؤشرات الأداء، والمخاطر، والقرار المطلوب. بألوان الهوية، وفكرة واحدة لكل شريحة، وملاحظات للمتحدث."], ["T2.C", "The dashboard", "لوحة المتابعة", "Claude Artifacts", "From the attached synthetic registrations file, build an interactive dashboard: registrations by department, by week and by programme, a completion rate, and a filter by department. Brand colours, Arabic labels.", "من ملف التسجيلات الافتراضي المرفق، ابنِ لوحة متابعة تفاعلية: التسجيلات حسب الإدارة والأسبوع والبرنامج، ونسبة الإكمال، وتصفية حسب الإدارة. بألوان الهوية وعناوين عربية."]], "rule": null, "no": "T2", "id": "T2"}, {"okey": null, "day": 2, "h": 30, "kind": "st", "ic": "bulb", "tools": ["Claude Cowork", "SpeakApp"], "lead": "Claude", "nm": {"ar": "Claude Cowork", "en": "Claude Cowork"}, "out": {"ar": "محضر وجدول Excel وملخص Word من تشغيل واحد", "en": "Minutes, an Excel table and a Word summary from one run"}, "steps": {"ar": ["تحويل ملخص الاجتماع المنطوق إلى نص بـ SpeakApp", "تفويض مهمة متعددة الخطوات دفعة واحدة", "طلب الخطة قبل التشغيل", "مراجعة كل ملف ينشئه", "«أخبرني قبل أن تحذف أو تستبدل أي ملف»"], "en": ["Turn a spoken meeting summary into text with SpeakApp", "Delegate a multi-step task in one go", "Ask for the plan before it runs", "Check every file it creates", "\"Tell me before you delete or replace any file\""]}, "note": {"ar": "شدّد على سطر «أخبرني قبل أن تحذف أو تستبدل أي ملف».", "en": "Stress the line \"tell me before you delete or replace any file\"."}, "P": [["10.A", "From voice to meeting notes", "من الصوت إلى ملاحظات الاجتماع", "SpeakApp", "Right after the (role-played) Ufuq follow-up meeting, open SpeakApp and say in two minutes what was agreed: decisions, who does what, by when, and open questions. Save the text as meeting_notes.txt in the Ufuq folder. This is the input for the Cowork task.", "مباشرة بعد اجتماع متابعة «أفق» (بتمثيل الأدوار)، افتح SpeakApp وقل في دقيقتين ما تم الاتفاق عليه: القرارات، ومن يفعل ماذا، وبحلول متى، والأسئلة المفتوحة. احفظ النص باسم meeting_notes.txt في مجلد «أفق». هذا هو مدخل مهمة Cowork."], ["10.B", "Monthly reports to one summary", "التقارير الشهرية إلى ملخص واحد", "Claude Cowork", "In the attached folder (synthetic files): read the five monthly department reports on Ufuq, extract the key indicators into one Excel table, then write a one-page executive summary in a Word file. Show me your plan before you run it. Tell me before you delete or replace any file.", "في المجلد المرفق (ملفات افتراضية): اقرأ تقارير الإدارات الشهرية الخمسة عن «أفق»، واستخرج المؤشرات الرئيسية في جدول Excel واحد، ثم اكتب ملخصاً تنفيذياً من صفحة واحدة في ملف Word. اعرض عليّ خطتك قبل التشغيل، وأخبرني قبل أن تحذف أو تستبدل أي ملف."], ["10.C", "Meeting folder end to end", "مجلد الاجتماع من البداية للنهاية", "Claude Cowork", "From the meeting notes in the Ufuq folder: write the minutes, extract decisions and tasks with owner and deadline, create a task list file, and draft an email to each owner with their own tasks only. Do not send any email.", "من ملاحظات الاجتماع في مجلد «أفق»: اكتب المحضر، واستخرج القرارات والمهام بمسؤولها وموعدها، وأنشئ ملف قائمة مهام، واكتب مسودة بريد لكل مسؤول بمهامه فقط. لا ترسل أي بريد."]], "rule": null, "no": "10", "id": "10"}, {"okey": null, "day": 2, "h": 30, "kind": "st", "ic": "bulb", "tools": ["Claude", "Connectors", "MCP", "Skills"], "lead": "MCP", "nm": {"ar": "الإضافات والمهارات وMCP", "en": "Plugins, Skills & MCP"}, "out": {"ar": "البريد والتقويم والملفات بصلاحيات محددة، ومهارة قابلة لإعادة الاستخدام", "en": "Email, calendar and files with set permissions, and a reusable skill"}, "steps": {"ar": ["ما الموصلات وMCP، ولماذا تهمّك", "قراءة البريد والتقويم والملفات في طلب واحد", "صلاحيات محددة وموافقة قبل أي إجراء", "حفظ طريقة عمل كمهارة بضغطة واحدة"], "en": ["What connectors and MCP are, and why they matter", "Read email, calendar and files in one request", "Set permissions and approval before any action", "Save a method as a one-click skill"]}, "note": {"ar": "التشبيه الذي ينجح: النموذج هو العقل، وMCP هو الأعصاب، والأدوات هي الأطراف.", "en": "The analogy that works: the model is the brain, MCP the nerves, the tools the limbs."}, "P": [["11.A", "Tool-access map", "خريطة صلاحيات الأدوات", "Claude", "For an assistant that prepares the director's morning briefing, list every connector it needs (email, calendar, files, tasks). For each: what it may read, what it may write, and what needs human approval. Drafts only, no sending. A table, then 5 rules.", "لمساعد يجهّز إحاطة الصباح للمدير، حدد كل موصل يحتاجه (البريد، التقويم، الملفات، المهام). لكل موصل: ما يحق له قراءته، وما يحق له كتابته، وما يتطلب موافقة بشرية. مسودات فقط دون إرسال. جدول ثم 5 قواعد."], ["11.B", "Read the source, not a copy", "اقرأ المصدر لا النسخة", "Claude + connectors (sandbox)", "Using the email, calendar and Drive connectors (sandbox accounts): read this week's Ufuq emails and calendar, extract dates, decisions and open tasks, compare them with the task sheet in Drive, and list anything missing or conflicting. Do not change any file.", "باستخدام موصلات البريد والتقويم وDrive (حسابات تجريبية): اقرأ رسائل وتقويم «أفق» لهذا الأسبوع، واستخرج المواعيد والقرارات والمهام المفتوحة، وقارنها بجدول المهام في Drive، واذكر أي نقص أو تعارض. لا تغيّر أي ملف."], ["11.C", "Formal briefing skill", "مهارة الإحاطة الرسمية", "Claude Skills", "Help me create a Claude skill called \"Formal briefing style\": summary first in 3 lines, then background, options and recommendation, in formal Arabic and under one page. Write the full SKILL.md with its name, a one-line description of when to use it, and the steps.", "ساعدني في إنشاء مهارة Claude باسم «أسلوب الإحاطة الرسمية»: الخلاصة أولاً في 3 أسطر، ثم الخلفية، ثم الخيارات، ثم التوصية، بلغة عربية رسمية وأقل من صفحة. اكتب ملف SKILL.md كاملاً بالاسم ووصف من سطر لمتى تُستخدم والخطوات."]], "rule": null, "no": "11", "id": "11"}, {"okey": null, "day": 2, "h": 20, "kind": "st", "ic": "bulb", "tools": ["Claude in Chrome"], "lead": "Claude", "nm": {"ar": "Claude in Chrome", "en": "Claude in Chrome"}, "out": {"ar": "مقارنة جاهزة من صفحات عامة دون إرسال أي شيء", "en": "A ready comparison from public pages, without submitting anything"}, "steps": {"ar": ["إعطاء Claude مهمة على صفحات عامة", "متابعة كل خطوة يقوم بها", "إيقافه قبل إرسال أي شيء"], "en": ["Give Claude a task on public pages", "Watch each step it takes", "Stop it before anything is submitted"]}, "note": {"ar": "لا تسجيل دخول ولا نماذج؛ صفحات عامة فقط.", "en": "No sign-in and no forms; public pages only."}, "P": [["12.A", "Compare public pages", "قارن الصفحات العامة", "Claude in Chrome", "Open two public UAE government digital-services pages in this browser. For each, find how services are listed, how a user starts a request, and how AI is presented. Summarise the comparison in a table with the link to each page, and write three lessons for the Ufuq landing page. Do not sign in, fill in or submit anything.", "افتح صفحتين عامتين للخدمات الرقمية الحكومية في الإمارات في هذا المتصفح. لكل صفحة: كيف تُعرض الخدمات، وكيف يبدأ المستخدم طلبه، وكيف يُقدَّم الذكاء الاصطناعي. لخّص المقارنة في جدول مع رابط كل صفحة، واكتب ثلاثة دروس لصفحة «أفق». لا تسجّل الدخول ولا تعبئ أي نموذج ولا ترسل شيئاً."]], "rule": null, "no": "12", "id": "12"}, {"okey": null, "day": 2, "h": 15, "kind": "st", "ic": "bulb", "tools": ["Claude Desktop"], "lead": "Claude", "nm": {"ar": "Claude Desktop", "en": "Claude Desktop"}, "out": {"ar": "مجلد منظّم وفهرس له", "en": "An organised folder and an index"}, "steps": {"ar": ["توجيه Claude إلى مجلد على جهازك", "الترتيب وإعادة التسمية بصيغة واحدة", "الحصول على جدول بما نُقل"], "en": ["Point Claude at a folder on your computer", "Organise and rename in one format", "Get a table of what moved"]}, "note": {"ar": "استخدم مجلداً تجريبياً لا مجلد عمل حقيقي.", "en": "Use a sample folder, not a real work folder."}, "P": [["13.A", "Organise the initiative folder", "رتّب مجلد المبادرة", "Claude Desktop", "Organise the Ufuq folder on my computer: create sub-folders (Brief, Branding, Registrations, Reports, Presentations), move each file to its place, rename files in one format (date_type_description), then create INDEX.md with a table of every file, where it is now and what it is for. Do not delete any file.", "رتّب مجلد «أفق» على جهازي: أنشئ مجلدات فرعية (الملخص، الهوية، التسجيلات، التقارير، العروض)، وانقل كل ملف إلى مكانه، وأعد تسمية الملفات بصيغة موحّدة (التاريخ_النوع_الوصف)، ثم أنشئ ملف INDEX.md بجدول لكل ملف ومكانه الجديد والغرض منه. لا تحذف أي ملف."]], "rule": null, "no": "13", "id": "13"}, {"okey": null, "day": 2, "h": 35, "kind": "st", "ic": "bulb", "tools": ["Excel", "Claude", "Claude Artifacts"], "lead": "Excel", "nm": {"ar": "Excel + Claude", "en": "Excel + Claude"}, "out": {"ar": "تنظيف ومعادلات ولوحة متابعة تفاعلية", "en": "Cleaning, formulas and an interactive dashboard"}, "steps": {"ar": ["تنظيف بيانات غير مرتبة", "كتابة المعادلات بالوصف بدل الحفظ", "استخراج المؤشرات والتوصيات", "تحويل النتائج إلى لوحة متابعة تفاعلية"], "en": ["Clean messy data", "Write formulas by describing them", "Pull out indicators and recommendations", "Turn the results into an interactive dashboard"]}, "note": {"ar": "استخدم الملف نفسه لاحقاً مع Copilot في Excel للمقارنة.", "en": "Reuse the same file later with Copilot in Excel to compare."}, "P": [["14.A", "Clean and analyse", "تنظيف وتحليل", "Claude", "Here is the synthetic Ufuq registrations file. Standardise the date formats, remove duplicates, add a column for days since registration, then show the 3 departments with the most registrations, the completion rate by programme, and a weekly trend.", "هذا ملف تسجيلات «أفق» الافتراضي. وحّد صيغ التواريخ، واحذف المكرر، وأضف عموداً لعدد الأيام منذ التسجيل، ثم اعرض أكثر 3 إدارات تسجيلاً، ونسبة الإكمال حسب البرنامج، والاتجاه الأسبوعي."], ["14.B", "Write formulas", "كتابة المعادلات", "Claude in Excel", "Write a formula that counts delay days for each request between \"Received\" and \"Completed\", highlight requests delayed more than 5 working days, and explain the formula in one line.", "اكتب معادلة تحسب أيام التأخير لكل طلب بين «تاريخ الاستلام» و«تاريخ الإنجاز»، ولوّن الطلبات المتأخرة أكثر من 5 أيام عمل، واشرح المعادلة في سطر واحد."], ["14.C", "The dashboard", "لوحة المتابعة", "Claude Artifacts", "From the cleaned registrations analysis (no personal data), build an interactive dashboard: registrations by department, by week and by programme, completion rate, and a filter by department. Arabic labels, calm green and sand colours, one line under each chart saying what it means, and the label \"All data is synthetic\".", "من تحليل التسجيلات المنظّف (دون بيانات شخصية)، ابنِ لوحة متابعة تفاعلية: التسجيلات حسب الإدارة والأسبوع والبرنامج، ونسبة الإكمال، وتصفية حسب الإدارة. بعناوين عربية وألوان خضراء ورملية هادئة، وسطر تحت كل رسم يوضح معناه، وعبارة «جميع البيانات افتراضية»."]], "rule": null, "no": "14", "id": "14"}, {"okey": null, "day": 2, "h": 35, "kind": "st", "ic": "bulb", "tools": ["Excel", "Copilot in Excel"], "lead": "Excel", "nm": {"ar": "Copilot: Excel", "en": "Copilot: Excel"}, "out": {"ar": "ملف التسجيلات نفسه محلّلاً بـ Copilot ومقارناً بـ Claude", "en": "The same registrations file analysed with Copilot and compared with Claude"}, "steps": {"ar": ["تجهيز الملف: OneDrive، والحفظ التلقائي، وجدول", "طرح الأسئلة على Copilot", "معادلات بالوصف ورسم بياني", "مقارنة Claude وCopilot في المهمة نفسها"], "en": ["Prepare the file: OneDrive, AutoSave, a table", "Ask Copilot the questions", "Formulas by description and a chart", "Compare Claude and Copilot on the same task"]}, "note": {"ar": "أكثر خطأ شائع: الملف غير محفوظ في OneDrive أو البيانات ليست جدولاً.", "en": "The most common blocker: the file is not saved in OneDrive or the data is not a table."}, "P": [["15.A", "Before you start", "قبل أن تبدأ", "Copilot in Excel", "Save the registrations file in OneDrive or SharePoint with AutoSave on, and format the data as a table (select the data, then Ctrl+T). Then ask Copilot: Summarise this table in five bullets: total registrations, the top three departments, completion rate, and the week with the highest drop-off.", "احفظ ملف التسجيلات في OneDrive أو SharePoint مع تفعيل الحفظ التلقائي، وحوّل البيانات إلى جدول (حدد البيانات ثم Ctrl+T). ثم اطلب من Copilot: لخّص هذا الجدول في خمس نقاط: إجمالي التسجيلات، وأعلى ثلاث إدارات، ونسبة الإكمال، والأسبوع الذي شهد أعلى انسحاب."], ["15.B", "Formulas by description", "معادلات بالوصف", "Copilot in Excel", "Add a column called At risk that shows Yes when a participant attended fewer than half of their sessions and has no activity in the last 14 days. Then add a column that counts sessions remaining.", "أضف عموداً باسم «معرّض للانسحاب» يُظهر «نعم» عندما يحضر المشارك أقل من نصف جلساته ولا نشاط له في آخر 14 يوماً. ثم أضف عموداً يحسب الجلسات المتبقية."], ["15.C", "Chart, PivotTable and insight", "رسم بياني وجدول محوري واستنتاج", "Copilot in Excel", "Analyse the registrations table: completion rate by department, the week with the highest drop-off, and three recommendations. Add a chart and a PivotTable on a new sheet.", "حلّل جدول التسجيلات: نسبة الإكمال حسب الإدارة، والأسبوع الذي شهد أعلى نسبة انسحاب، وثلاث توصيات. أضف مخططاً وجدولاً محورياً في ورقة جديدة."], ["15.D", "Claude versus Copilot", "Claude مقابل Copilot", "Claude and Copilot in Excel", "Ask both tools the same question: Which two departments need support first, and why? Compare the answers on accuracy against the data, explanation, speed, and whether the result stays inside your Microsoft 365 file. Write when you would use each.", "اطرح السؤال نفسه على الأداتين: أي إدارتين تحتاجان دعماً أولاً، ولماذا؟ قارن الإجابات من حيث الدقة مقارنة بالبيانات، والشرح، والسرعة، وبقاء النتيجة داخل ملفك في Microsoft 365. اكتب متى تستخدم كل أداة."]], "rule": null, "no": "15", "id": "15"}, {"okey": null, "day": 2, "h": 50, "kind": "st", "ic": "bulb", "tools": ["Microsoft Copilot", "Word", "PowerPoint", "Outlook", "Teams"], "lead": "Microsoft Copilot", "nm": {"ar": "Microsoft 365 Copilot", "en": "Microsoft 365 Copilot"}, "out": {"ar": "ملخص وخطاب في Word، وعرض في PowerPoint، وبريد مرتب، ومحضر من Teams", "en": "A summary and letter in Word, a deck in PowerPoint, a tidy inbox and minutes from Teams"}, "steps": {"ar": ["Word: تلخيص تقرير طويل وصياغة خطاب رسمي", "PowerPoint: من مستند إلى عرض، ثم تحسينه", "Outlook: تلخيص سلسلة رسائل وصياغة الرد", "Teams: ملخص الاجتماع والقرارات والمهام", "مراجعة الدقة قبل الإرسال"], "en": ["Word: summarise a long report and draft a formal letter", "PowerPoint: from a document to a deck, then improve it", "Outlook: summarise an email thread and draft the reply", "Teams: meeting recap, decisions and tasks", "Check accuracy before sending"]}, "note": {"ar": "ملخص Teams يحتاج تفعيل التسجيل أو النص المكتوب للاجتماع؛ جهّز اجتماعاً تجريبياً مسبقاً.", "en": "Teams recap needs recording or transcription on; set up a sample meeting in advance."}, "P": [["16.A", "Executive summary", "الملخص التنفيذي", "Copilot in Word", "Summarise the attached Ufuq brief on one page for a director: a 3-line summary, 5 key findings with the page number for each, and 3 decisions needed. Add nothing that is not in the file.", "لخّص ملخص «أفق» المرفق في صفحة واحدة لمدير: خلاصة من 3 أسطر، و5 نتائج رئيسية مع رقم الصفحة لكل منها، و3 قرارات مطلوبة. لا تضف شيئاً غير موجود في الملف."], ["16.B", "Formal letter", "الخطاب الرسمي", "Copilot in Word", "Draft a formal letter in Arabic to [entity] based on the summary above, thanking them and inviting them to take part in the Ufuq pilot. Then give me an accurate English translation.", "اكتب خطاباً رسمياً بالعربية إلى [الجهة] بناءً على الملخص السابق، يتضمن الشكر ودعوتها للمشاركة في تجربة «أفق». ثم أعطني ترجمة إنجليزية دقيقة."], ["16.C", "Email thread summary", "ملخص سلسلة الرسائل", "Copilot in Outlook", "Summarise this email thread in 5 lines: what was asked, what was agreed, open questions, and who must act by when. Then draft a short reply confirming the next step, marked For review.", "لخّص سلسلة الرسائل هذه في 5 أسطر: ما المطلوب، وما الذي اتُّفق عليه، والأسئلة المفتوحة، ومن يجب أن يتصرف ومتى. ثم اكتب رداً قصيراً يؤكد الخطوة التالية مع عبارة «للمراجعة»."], ["16.D", "Deck from a document", "عرض من مستند", "Copilot in PowerPoint", "Create a presentation from the file [Ufuq_brief.docx] in 8 slides: title, summary, objectives, programmes, timeline, KPIs, risks, decisions needed. Formal design, one idea per slide, with speaker notes.", "أنشئ عرضاً تقديمياً من الملف [Ufuq_brief.docx] في 8 شرائح: العنوان، والخلاصة، والأهداف، والبرامج، والجدول الزمني، ومؤشرات الأداء، والمخاطر، والقرارات المطلوبة. بتصميم رسمي وفكرة واحدة لكل شريحة، مع ملاحظات للمتحدث."], ["16.E", "Improve the deck", "حسّن العرض", "Copilot in PowerPoint", "Make the summary slide shorter, turn the timeline into a visual, add a slide with three key numbers, and rewrite the speaker notes so the whole deck takes 7 minutes.", "اجعل شريحة الخلاصة أقصر، وحوّل الجدول الزمني إلى شكل بصري، وأضف شريحة بثلاثة أرقام رئيسية، وأعد كتابة ملاحظات المتحدث ليستغرق العرض كله 7 دقائق."], ["16.F", "Teams meeting recap", "ملخص اجتماع Teams", "Copilot in Teams", "Summarise this meeting: the decisions taken, the open questions, and every action item with owner and deadline in a table. Then tell me where people disagreed and what is still unresolved.", "لخّص هذا الاجتماع: القرارات المتخذة، والأسئلة المفتوحة، وكل مهمة بمسؤولها وموعدها في جدول. ثم أخبرني أين اختلفت الآراء وما الذي لم يُحسم بعد."], ["16.G", "Catch up on a chat", "اللحاق بالمحادثة", "Copilot in Teams", "Summarise what happened in this Ufuq channel over the last 7 days in 5 bullets: decisions, requests addressed to me, and deadlines. Then draft a short reply to the most urgent request.", "لخّص ما حدث في قناة «أفق» خلال آخر 7 أيام في 5 نقاط: القرارات، والطلبات الموجهة إليّ، والمواعيد النهائية. ثم اكتب رداً قصيراً على أكثر طلب إلحاحاً."], ["16.H", "Check before you send", "راجع قبل الإرسال", "Copilot", "Check the letter against the Ufuq brief: list any number or date not in the file, any promise we cannot make yet, and any name or detail that is not in the file.", "راجع الخطاب مقابل ملخص «أفق»: اذكر أي رقم أو تاريخ غير موجود في الملف، وأي وعد لا نستطيع تقديمه بعد، وأي اسم أو تفصيلة غير موجودة في الملف."]], "rule": null, "no": "16", "id": "16"}, {"okey": null, "day": 2, "h": 35, "kind": "lab", "ic": "Microsoft Copilot", "tools": ["Microsoft Copilot", "Excel"], "lead": null, "nm": {"ar": "عرض PowerPoint وتحليل Excel لـ«أفق»", "en": "PowerPoint deck and Excel analysis for Ufuq"}, "out": {"ar": "عرض PowerPoint، وملف Excel محلّل، وبريد متابعة، وملخص اجتماع Teams", "en": "A PowerPoint deck, an analysed Excel file, a follow-up email and a Teams recap"}, "steps": {"ar": ["عرض من مستند", "تحليل التسجيلات", "بريد المتابعة", "ملخص اجتماع Teams"], "en": ["A deck from a document", "Analyse registrations", "Follow-up email", "Teams meeting recap"]}, "note": {"ar": "قارن عرض Copilot بعرض Claude من تدريب سابق في اليوم نفسه: متى تستخدم كل واحد؟", "en": "Compare the Copilot deck with the Claude deck from earlier today: when would you use each?"}, "P": [["T3.A", "Deck from a document", "عرض من مستند", "Copilot in PowerPoint", "Create a 7-slide presentation from the file [Ufuq_brief.docx]: title, objectives, programmes, timeline, KPIs, risks, next steps. Use a clean, formal design and add speaker notes.", "أنشئ عرضاً من 7 شرائح من الملف [Ufuq_brief.docx]: العنوان، والأهداف، والبرامج، والجدول الزمني، ومؤشرات الأداء، والمخاطر، والخطوات التالية. بتصميم رسمي نظيف، مع ملاحظات للمتحدث."], ["T3.B", "Registrations analysis", "تحليل التسجيلات", "Copilot in Excel", "Analyse the registrations table: completion rate by department, the week with the highest drop-off, and three recommendations. Add a chart and a PivotTable on a new sheet.", "حلّل جدول التسجيلات: نسبة الإكمال حسب الإدارة، والأسبوع الذي شهد أعلى نسبة انسحاب، وثلاث توصيات. أضف مخططاً وجدولاً محورياً في ورقة جديدة."], ["T3.C", "Follow-up email", "بريد المتابعة", "Copilot in Outlook", "Draft an email to department heads with the Ufuq results above: 3 key numbers, one request (nominate 2 champions per department by Thursday), and a polite closing. Under 120 words.", "اكتب بريداً لمديري الإدارات يعرض نتائج «أفق» السابقة: 3 أرقام رئيسية، وطلب واحد (ترشيح سفيرين لكل إدارة قبل الخميس)، وخاتمة مهذبة. أقل من 120 كلمة."], ["T3.D", "Teams recap", "ملخص Teams", "Copilot in Teams", "From the Ufuq follow-up meeting recording: list decisions, action items with owner and deadline, and open questions, then post a short recap to the Ufuq channel as a draft.", "من تسجيل اجتماع متابعة «أفق»: اذكر القرارات، والمهام بمسؤولها وموعدها، والأسئلة المفتوحة، ثم جهّز ملخصاً قصيراً كمسودة لقناة «أفق»."]], "rule": null, "no": "T3", "id": "T3"}, {"okey": null, "day": 3, "h": 60, "kind": "st", "ic": "bulb", "tools": ["n8n", "Claude"], "lead": "n8n", "nm": {"ar": "n8n", "en": "n8n"}, "out": {"ar": "سير عمل يفرز الطلبات الواردة ويوجّهها مع وكيل ذكي", "en": "A workflow that sorts and routes incoming requests, with an AI agent"}, "steps": {"ar": ["أساسيات n8n: مشغّل، بيانات، قرار، إجراء", "مثال: وارد ← تصنيف ← توجيه ← إشعار", "إضافة وكيل ذكاء اصطناعي يصنّف ويكتب المسودة", "متى تؤتمت ومتى تبقى المهمة يدوية"], "en": ["n8n basics: trigger, data, decision, action", "Example: incoming → classify → route → notify", "Add an AI agent that classifies and drafts the reply", "When to automate and when a task stays manual"]}, "note": {"ar": "اعرض سيراً جاهزاً يعمل أولاً، ثم ابنِه خطوة بخطوة.", "en": "Show a ready, working flow first, then build it step by step."}, "P": [["17.A", "Design the flow", "صمّم السير", "Claude, then n8n", "Build me an n8n workflow. Trigger: a new email to the Ufuq inbox. Classify it as registration, partnership request, enquiry or sensitive matter, with a confidence score. Registration → a row in the registrations sheet and a confirmation draft. Partnership request → suggest three slots from the calendar. Sensitive or confidence under 80% → alert the initiative lead, no action. Show me the structure first, and do not enable it until I approve.", "ابنِ لي سير عمل في n8n. المُشغّل: بريد جديد إلى صندوق «أفق». صنّف الرسالة إلى: تسجيل، أو طلب شراكة، أو استفسار، أو أمر حساس، مع درجة ثقة. التسجيل ← صف في جدول التسجيلات ومسودة تأكيد. طلب الشراكة ← اقتراح ثلاثة مواعيد من التقويم. الحساس أو الثقة أقل من 80% ← تنبيه لقائد المبادرة دون أي إجراء. اعرض الهيكل أولاً، ولا تفعّله إلا بعد موافقتي."], ["17.B", "Add the AI agent", "أضف الوكيل الذكي", "n8n (AI Agent node)", "Add an AI Agent node after the trigger. System message: You are the Ufuq Inbox Agent. From the email text (no names or contact details), classify the request, draft a short Arabic reply for a human to review, and never send anything yourself. If the request is sensitive or unclear, mark it Needs human review. Return JSON with category, confidence, draft_reply, needs_review.", "أضف عقدة AI Agent بعد المشغّل. رسالة النظام: أنت «وكيل بريد أفق». من نص الرسالة (دون أسماء أو بيانات تواصل)، صنّف الطلب، واكتب مسودة رد قصيرة بالعربية يراجعها إنسان، ولا ترسل أي شيء بنفسك. إذا كان الطلب حساساً أو غير واضح فصِفه بـ«يحتاج مراجعة بشرية». أعِد JSON يتضمن: category، confidence، draft_reply، needs_review."], ["17.C", "Three test emails", "ثلاث رسائل اختبار", "Claude", "Write three synthetic test emails for the Ufuq workflow: a clear registration, a partnership request, and an ambiguous message that should escalate. For each, give the expected path.", "اكتب ثلاث رسائل اختبار افتراضية لسير «أفق»: تسجيل واضح، وطلب شراكة، ورسالة غامضة يجب أن تُصعَّد. لكل رسالة اذكر المسار المتوقع."], ["17.D", "Automate or not?", "نؤتمت أم لا؟", "Claude", "Rate these five tasks [list] on frequency, clarity of steps, cost of error and need for human judgment. For each, recommend: full automation, automation with review, or stays manual.", "قيّم هذه المهام الخمس [القائمة] حسب: التكرار، ووضوح الخطوات، وكلفة الخطأ، والحاجة لحكم بشري. وأوصِ لكل منها: أتمتة كاملة، أو أتمتة مع مراجعة، أو تبقى يدوية."]], "rule": null, "no": "17", "id": "17"}, {"okey": null, "day": 3, "h": 35, "kind": "st", "ic": "bulb", "tools": ["Copilot Studio", "Microsoft Copilot"], "lead": "Copilot Studio", "nm": {"ar": "Copilot Studio", "en": "Copilot Studio"}, "out": {"ar": "وكيل Copilot بمهامه وأدواته، ومتى يرجع إليك", "en": "A Copilot agent with its tasks and tools, and when it comes back to you"}, "steps": {"ar": ["اختيار إجراء متكرر من قائمتك", "تحديد مهامه وأدواته وحدود صلاحيته", "أتمتة ثابتة أم روتين أم وكيل؟", "البناء في Copilot Studio والنشر في Teams"], "en": ["Pick a recurring process from your list", "Define its tasks, tools and limits", "Fixed automation, routine or agent?", "Build in Copilot Studio and publish to Teams"]}, "note": {"ar": "التصميم على الورق أولاً، ثم البناء.", "en": "Design on paper first, then build."}, "P": [["18.A", "Design my agent", "صمّم وكيلي", "Claude", "Design an agent for [a task from your work]: goal, users, knowledge sources, tools, what it does on its own, what it escalates to a human and when, and three test questions. Then tell me: would fixed automation or a scheduled routine be enough instead of an agent, and why?", "صمّم وكيلاً لمهمة [مهمة من عملك]: الهدف، والمستخدمون، ومصادر المعرفة، والأدوات، وما يفعله وحده، وما يصعّده للإنسان ومتى، وثلاثة أسئلة اختبار. ثم أخبرني: هل تكفي أتمتة ثابتة أو روتين مجدول بدلاً من وكيل؟ ولماذا؟"], ["18.B", "Build the Ufuq Team Assistant", "بناء «مساعد فريق أفق»", "Copilot Studio", "Create an agent called \"Ufuq Team Assistant\". Instructions: answer staff questions about Ufuq only from the attached brief, programmes and FAQ; cite the file for each answer; if the answer is not found, say so and direct the person to the initiative team; never answer about personal data. Starters: How do I register? / Which programme suits my role? / When is the next session?", "أنشئ وكيلاً باسم «مساعد فريق أفق». التعليمات: أجب عن أسئلة الموظفين حول «أفق» من الملخص والبرامج والأسئلة الشائعة المرفقة فقط؛ واذكر الملف لكل إجابة؛ وإذا لم تجد الإجابة فقل ذلك ووجّه السائل إلى فريق المبادرة؛ ولا تُجب عن أي بيانات شخصية. أسئلة البداية: كيف أسجّل؟ / أي برنامج يناسب دوري؟ / متى الجلسة القادمة؟"], ["18.C", "Test it on edge cases", "اختبره على حالات حدّية", "Copilot Studio (Test pane)", "Test with five questions: one in the files / one not in the files / one in colloquial wording / one about a colleague's data / one outside the scope. Check it cites the source, admits what it does not know, refuses the sensitive one and points to the right team. Fix the instructions until all five are right.", "اختبر بخمسة أسئلة: سؤال موجود في الملفات / سؤال غير موجود / سؤال بصياغة عامية / سؤال عن بيانات زميل / طلب خارج النطاق. تحقق أنه يذكر المصدر، ويعترف بما لا يعرفه، ويرفض الحساس، ويوجّه إلى الفريق الصحيح. عدّل التعليمات حتى تصبح الإجابات الخمس صحيحة."]], "rule": null, "no": "18", "id": "18"}, {"okey": null, "day": 3, "h": 70, "kind": "lab", "ic": "Copilot Studio", "tools": ["Copilot Studio", "Microsoft Copilot"], "lead": null, "nm": {"ar": "ابنِ وكيلك الأول وجرّبه", "en": "Build your first agent and test it"}, "out": {"ar": "«مساعد فريق أفق» يعمل ومختبر، ثم وكيل على حالة من قائمتك", "en": "The Ufuq Team Assistant working and tested, then an agent on a case from your list"}, "steps": {"ar": ["بناء الوكيل خطوة بخطوة", "تجربته على حالات حدّية", "تحسينه حسب النتائج", "النشر لمجموعة تجريبية في Teams"], "en": ["Build the agent step by step", "Test it on edge cases", "Improve it from the results", "Publish to a pilot group in Teams"]}, "note": {"ar": "أهم تدريب في البرنامج. لا تنتقل للختام قبل أن يجتاز كل وكيل الاختبار.", "en": "The most important lab. Do not move to the close until every agent passes the test."}, "P": [["T4.A", "Build the Ufuq Team Assistant", "بناء «مساعد فريق أفق»", "Copilot Studio", "Create an agent called \"Ufuq Team Assistant\". Instructions: answer staff questions about Ufuq only from the attached files (brief, programmes, FAQ); cite the file for each answer; if the answer is not found, say so and direct the person to the initiative team; never answer about personal data. Starters: How do I register? / Which programme suits my role? / When is the next session?", "أنشئ وكيلاً باسم «مساعد فريق أفق». التعليمات: أجب عن أسئلة الموظفين حول «أفق» من الملفات المرفقة فقط (الملخص، والبرامج، والأسئلة الشائعة)؛ واذكر الملف لكل إجابة؛ وإذا لم تجد الإجابة فقل ذلك ووجّه السائل إلى فريق المبادرة؛ ولا تُجب عن أي بيانات شخصية. أسئلة البداية: كيف أسجّل؟ / أي برنامج يناسب دوري؟ / متى الجلسة القادمة؟"], ["T4.B", "Test the agent", "اختبار الوكيل", "Copilot Studio", "Test with five questions: one in the files / one not in the files / one in colloquial wording / one about a colleague's data / one outside the scope. Check it cites the source, admits what it does not know, refuses the sensitive one and points to the right team.", "اختبر بخمسة أسئلة: سؤال موجود في الملفات / سؤال غير موجود / سؤال بصياغة عامية / سؤال عن بيانات زميل / طلب خارج النطاق. تحقق أنه يذكر المصدر، ويعترف بما لا يعرفه، ويرفض الحساس، ويوجّه إلى الفريق الصحيح."], ["T4.C", "Policies & procedures agent", "وكيل السياسات والإجراءات", "Copilot Studio", "Create an agent called \"Policies & Procedures Assistant\". Instructions: answer staff questions only from the attached policy guides, cite the guide and clause for every answer, say so when the answer is not found and direct the person to the right department, and never answer questions about personal data or individual decisions. Starters: How do I submit a leave request? / What is the process for an official mission? / Who do I contact for procurement requests?", "أنشئ وكيلاً باسم «مساعد السياسات والإجراءات». التعليمات: أجب عن أسئلة الموظفين من أدلة السياسات المرفقة فقط، واذكر اسم الدليل والبند لكل إجابة، وإذا لم تجد الإجابة فقل ذلك ووجّه السائل إلى الإدارة المختصة، ولا تُجب عن أي سؤال يخص بيانات شخصية أو قرارات فردية. أسئلة البداية: كيف أقدّم طلب إجازة؟ / ما إجراء المهمة الرسمية؟ / بمن أتواصل في طلبات المشتريات؟"]], "rule": null, "no": "T4", "id": "T4"}, {"okey": null, "day": 3, "h": 25, "kind": "st", "ic": "bulb", "tools": ["Claude", "Scheduled tasks"], "lead": "Claude", "nm": {"ar": "Claude Scheduled Tasks", "en": "Claude Scheduled Tasks"}, "out": {"ar": "موجز صباحي ونشرة أسبوعية تصلك تلقائياً", "en": "A morning brief and a weekly digest that arrive on their own"}, "steps": {"ar": ["تحديد ما يهمك كل صباح", "جدولة المهمة لتعمل وحدها", "تسليمها كمسودات للمراجعة"], "en": ["Decide what matters to you each morning", "Schedule the task to run on its own", "Deliver it as drafts for review"]}, "note": {"ar": "اجعل كل مشارك يضبط النشرة الأسبوعية على بريده؛ أكثر أمر يستمر استخدامه بعد التدريب.", "en": "Have every participant set the weekly digest to their own email; it is the prompt people keep using after training."}, "P": [["19.A", "Daily morning brief", "الموجز الصباحي اليومي", "Claude (scheduled task, daily 07:30)", "Every working day at 07:30: read today's email and calendar (sandbox account) and write a 5-line brief: meetings, decisions needed, deadlines and what needs follow-up. Save it as a draft. Do not send anything.", "كل يوم عمل الساعة 07:30: اقرأ بريد وتقويم اليوم (حساب تجريبي)، واكتب موجزاً من 5 أسطر: الاجتماعات، والقرارات المطلوبة، والمواعيد النهائية، وما يحتاج متابعة. احفظه كمسودة، ولا ترسل شيئاً."], ["19.B", "Weekly AI updates", "نشرة الذكاء الاصطناعي الأسبوعية", "Claude (scheduled task, Mondays 08:00)", "Every Monday at 08:00: search the web for the most important AI updates from the past 7 days (new models and features in ChatGPT, Claude, Gemini and Microsoft Copilot, and AI news in the UAE). Pick the top 7: headline, two lines on what changed, why it matters for a government team, and the source link. Save it as a draft titled \"AI Weekly | [date]\".", "كل يوم اثنين الساعة 08:00: ابحث عن أهم تحديثات الذكاء الاصطناعي خلال آخر 7 أيام (النماذج والميزات الجديدة في ChatGPT وClaude وGemini وMicrosoft Copilot، وأخبار الذكاء الاصطناعي في الإمارات). اختر أهم 7: العنوان، وسطرين عمّا تغيّر، ولماذا يهم فريقاً حكومياً، ورابط المصدر. احفظها كمسودة بعنوان «نشرة الذكاء الاصطناعي | [التاريخ]»."]], "rule": null, "no": "19", "id": "19"}, {"okey": null, "day": 3, "h": 25, "kind": "st", "ic": "bulb", "tools": ["Claude", "Routines"], "lead": "Claude", "nm": {"ar": "Claude Routines", "en": "Claude Routines"}, "out": {"ar": "تقرير أسبوعي يقارن بالأسبوع الماضي ويحفظ نفسه", "en": "A weekly report that compares with last week and saves itself"}, "steps": {"ar": ["روتين يقرأ ملفات المصدر ومخرجه السابق", "يكتب ملفاً بتاريخه", "يُبقي الإنسان في الحلقة"], "en": ["A routine that reads the source files and its last output", "Writes a dated file", "Keeps a person in the loop"]}, "note": {"ar": "الفرق عن المهمة المجدولة: الروتين يقارن بما سبقه ويحفظ أثره.", "en": "The difference from a scheduled task: a routine compares with its last run and keeps a record."}, "P": [["20.A", "Weekly report routine", "روتين التقرير الأسبوعي", "Claude Routines (Sundays 08:00)", "Every Sunday at 08:00: read the Ufuq registrations file and last week's report, compare them, and write the weekly report: new registrations, completion rate, departments falling behind, and the top 3 actions. Save it with the date and create a draft email to the initiative lead.", "كل يوم أحد الساعة 08:00: اقرأ ملف تسجيلات «أفق» وتقرير الأسبوع الماضي، وقارن بينهما، واكتب التقرير الأسبوعي: التسجيلات الجديدة، ونسبة الإكمال، والإدارات المتأخرة، وأهم 3 إجراءات. احفظه بالتاريخ وأنشئ مسودة بريد لقائد المبادرة."], ["20.B", "At-risk participants", "المشاركون المعرّضون للانسحاب", "Claude Routines (weekly)", "Read the latest participation sheet (participant ID, department, sessions attended, last activity) and last week's output. List participants with no activity for 14 days, using IDs only. Compare with last week: who returned, who is new on the list. Suggest one re-engagement action per department and save it as a dated file for review.", "اقرأ أحدث جدول مشاركة (رقم المشارك، والإدارة، والجلسات التي حضرها، وآخر نشاط) ومخرج الأسبوع الماضي. اذكر المشاركين الذين لا نشاط لهم منذ 14 يوماً بالأرقام فقط. قارن بالأسبوع الماضي: من عاد، ومن ظهر لأول مرة. اقترح إجراء إعادة تفاعل واحداً لكل إدارة، واحفظه كملف بتاريخه للمراجعة."]], "rule": null, "no": "20", "id": "20"}, {"okey": null, "day": 3, "h": 40, "kind": "lab", "ic": "Claude", "tools": ["Claude", "Claude Cowork"], "lead": null, "nm": {"ar": "أتمتة «أفق» بـ Claude", "en": "Automating Ufuq with Claude"}, "out": {"ar": "فرز البريد الوارد، وروتين تقرير أسبوعي، ومهمة Cowork منجزة", "en": "Inbox triage, a weekly report routine and a completed Cowork task"}, "steps": {"ar": ["فرز بريد «أفق» الوارد إلى مسودات ومهام", "روتين تقرير «أفق» الأسبوعي", "مهمة Cowork على ملفات المبادرة"], "en": ["Sort the Ufuq inbox into drafts and tasks", "The Ufuq weekly report routine", "A Cowork task on the initiative files"]}, "note": {"ar": "استخدم حسابات تجريبية، وتأكد أن البريد متصل قبل التدريب.", "en": "Use sandbox accounts, and check email is connected before the lab."}, "P": [["T5.A", "Inbox triage", "فرز البريد الوارد", "Claude (connectors)", "Read the last 20 emails in the Ufuq inbox (sandbox account). Classify each as registration, partnership request, enquiry or sensitive matter. For registrations, add a row to the registrations sheet; for partnership requests, propose three slots from my calendar; for anything sensitive or unclear, list it for me and take no action. Create drafts only; send nothing.", "اقرأ آخر 20 رسالة في صندوق «أفق» (حساب تجريبي). صنّف كل رسالة: تسجيل، أو طلب شراكة، أو استفسار، أو أمر حساس. للتسجيل أضف صفاً في جدول التسجيلات، ولطلب الشراكة اقترح ثلاثة مواعيد من تقويمي، وأي أمر حساس أو غير واضح اعرضه عليّ دون أي إجراء. أنشئ مسودات فقط، ولا ترسل شيئاً."], ["T5.B", "Weekly report routine", "روتين التقرير الأسبوعي", "Claude Routines (Sundays 08:00)", "Every Sunday at 08:00: read the Ufuq registrations file and last week's report, compare them, and write the weekly report: new registrations, completion rate, departments falling behind, and the top 3 actions. Save it with the date and create a draft email to the initiative lead.", "كل يوم أحد الساعة 08:00: اقرأ ملف تسجيلات «أفق» وتقرير الأسبوع الماضي، وقارن بينهما، واكتب التقرير الأسبوعي: التسجيلات الجديدة، ونسبة الإكمال، والإدارات المتأخرة، وأهم 3 إجراءات. احفظه بالتاريخ وأنشئ مسودة بريد لقائد المبادرة."], ["T5.C", "Cowork task", "مهمة Cowork", "Claude Cowork", "In the Ufuq folder: read the five department feedback files, extract the main themes into an Excel table, and write a one-page summary in Word with 3 recommendations. Tell me before you delete or replace any file.", "في مجلد «أفق»: اقرأ ملفات ملاحظات الإدارات الخمس، واستخرج المحاور الرئيسية في جدول Excel، واكتب ملخصاً من صفحة واحدة في Word مع 3 توصيات. أخبرني قبل أن تحذف أو تستبدل أي ملف."]], "rule": null, "no": "T5", "id": "T5"}, {"okey": "o5", "day": 3, "h": 40, "kind": "st", "ic": "flag", "tools": [], "lead": null, "nm": {"ar": "ختام البرنامج", "en": "Programme closing"}, "out": {"ar": "مهمة من قائمتك أصبحت تعمل تلقائياً", "en": "A task from your list that now runs on its own"}, "steps": {"ar": ["عرض المشروع أمام الزملاء", "مقارنة الوقت قبل وبعد", "اعتماد بطاقة الحوكمة", "خطة الثلاثين يوماً"], "en": ["Present the project to colleagues", "Compare the time before and after", "Sign off the governance card", "The 30-day plan"]}, "note": {"ar": "القاعدة الجامعة للأيام الثلاثة: الأداة تقترح، والإنسان يقرر، والمؤسسة توثّق.", "en": "The rule for all three days: the tool proposes, the human decides, the organisation documents."}, "P": [["21.A", "Governance card", "بطاقة الحوكمة", "Claude", "Write a one-page governance card for my agent: name and purpose, accountable owner, data sources and permissions, what it never does, escalation point, logging, periodic review, and the stop switch with who holds it.", "اكتب بطاقة حوكمة من صفحة واحدة للوكيل الذي بنيته: الاسم والغرض، والمالك المسؤول، ومصادر البيانات وصلاحياتها، وما لا يفعله أبداً، ونقطة التصعيد، والتسجيل، والمراجعة الدورية، وزر الإيقاف ومن يملكه."], ["21.B", "The 3-minute pitch", "عرض الدقائق الثلاث", "Claude / ChatGPT", "Write a 3-minute pitch (about 400 words) to present my final project to my director: the task before AI, what I built, the time it takes now, the rule I keep, and the one decision I ask for. Mark where to pause.", "اكتب عرضاً مدته 3 دقائق (نحو 400 كلمة) أقدّم فيه مشروعي الختامي لمديري: المهمة قبل الذكاء الاصطناعي، وما بنيته، والوقت الذي تستغرقه الآن، والقاعدة التي ألتزم بها، والقرار الواحد الذي أطلبه. حدّد مواضع التوقف."], ["21.C", "My 30-day plan", "خطتي لثلاثين يوماً", "Claude / ChatGPT", "From everything I built in these three days, help me choose three tasks from my real work to move to AI in the next 30 days. For each: the tool, the first prompt, the time saved per week, and the rule I keep. The tool proposes, the person decides, the organisation documents.", "من كل ما بنيته في هذه الأيام الثلاثة، ساعدني أختار ثلاث مهام من عملي الفعلي أنقلها إلى الذكاء الاصطناعي خلال 30 يوماً. لكل مهمة: الأداة، وأول أمر، والوقت الذي سأوفّره أسبوعياً، والقاعدة التي ألتزم بها. الأداة تقترح، والإنسان يقرر، والمؤسسة توثّق."]], "rule": {"ar": "الأداة تقترح، والإنسان يقرر", "en": "The tool proposes, the human decides"}, "no": "21", "id": "21"}], "LOGO": {"SpeakApp": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAYAAADimHc4AAAUjElEQVR42tVdW6xdx1n+/lmXffPxOcc+IYnl1CEKSVxckjRqWsdBCi2tRJ8aqAQInqBIFZSKS4CKhwKqeDGqoEWIFwRUFeWt5qFthFpo1SZqWkhbF9c4xqZJ3NiOfY7PbZ+zr2t+HtZtZtbMWmufg7f3PtKy9157zaxv1vz3/59Z9NiZlxj7+WMABNzxPuYUv89c3pKMe7B21+QKdiPR29j7ZwBg+yjIuJt6j6q+Zx0/APh1Jtf22T7lVNre3T/Vur95D65JnLOKv8ABpNOFlXLISk0opRrbtUXKyHAwAcQlfbruPY/4hU5R+ud0dtky4/aZpUI/LspjJ/UQ2c6z0dbOEfOH3webNyRlhmgidkVlG1dbmqAPslDh/OL3dfBsDIgNpi1T/VxzkGwREGW/u9Sp7Y7zh99nds8OT0BBZGFrcighSpoyU5kstVK7Kj6IEuNjbvETfNcM2hUUM7LbV1/vUnLqQ+NS26Hc4mF2G+Xzgt83B0EKe6QURgUFU0ZJdgguxrQzqOWBWMjRbp3MD/7ED3Br/HRyJnGVubYdXvc6Npyl8v7mCT9SHUCO2WHK/tHn2LjelMWazav8VkpBpDiT2i0I+jcCm4bhnOInSjiAuWpaDcXC5bKYJ5KXxnVc7kFabew5xR/rgAJQLlgSRKwAsfuSRARm1q9IKVCRxazCUNsQGSEZTqg3MSzTa21Ceo7x+2CqjLUwVzsaMQ4y2iVfE3vQNNW0NmyTH4rpxnbqtWu7+cEfx4LI5XKw1pFqwBUIMCGqFKkiQ4ktgRVVPJMqHVQ5SsnouQiQDRDzit+HccMyE42rLBFWZRw7KKP4ALlAsjpVcg0TZF7xZ9FQIp0SVMOB1AFYQoVkUiUprdiwVBQqoUKb5FrORG/RmU8oS1BsTciEAkWCX3
