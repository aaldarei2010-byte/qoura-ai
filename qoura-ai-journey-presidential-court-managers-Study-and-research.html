<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الذكاء الاصطناعي للمدراء · ديوان الرئاسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F1E8;--panel:#EEE5D6;--card:#FFFFFF;--ink:#16211F;--muted:#5E6D69;--line:#E2D7C6;
  --g:#163832;--g-ink:#F6F1E8;--g-sub:#E2B48A;--g-line:rgba(246,241,232,.35);--g-track:rgba(246,241,232,.16);
  --c:#A0683A;--c-ink:#FFFFFF;--brand:#163832;--labbg:#F9EBDD;
  --rope:#C9A27A;--rope2:#A47A50;--done:#3A7A5C;--done2:#22543E;--ok:#2F7A4E;
  --glow:rgba(160,104,58,.22);--shadow:rgba(22,33,31,.10);--scrim:rgba(10,18,16,.5);
  --f-display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A18;--panel:#13211E;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;
  --g:#1C463D;--g-ink:#F2EBDD;--g-sub:#E2B48A;--g-line:rgba(242,235,221,.30);--g-track:rgba(242,235,221,.14);
  --c:#D39A68;--c-ink:#1A120B;--brand:#E2B48A;--labbg:#2A2219;
  --rope:#8C6B4A;--rope2:#5F4731;--done:#2F5D4E;--done2:#183A32;--ok:#5DBB86;
  --glow:rgba(211,154,104,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18;--panel:#13211E;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;
  --g:#1C463D;--g-ink:#F2EBDD;--g-sub:#E2B48A;--g-line:rgba(242,235,221,.30);--g-track:rgba(242,235,221,.14);
  --c:#D39A68;--c-ink:#1A120B;--brand:#E2B48A;--labbg:#2A2219;
  --rope:#8C6B4A;--rope2:#5F4731;--done:#2F5D4E;--done2:#183A32;--ok:#5DBB86;
  --glow:rgba(211,154,104,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 12px;display:grid;place-items:center}
.mark img{height:52px;display:block}
.ht{flex:1;min-width:220px}
.eyebrow{margin:0;color:var(--c);font-weight:600;font-size:.9rem}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.2vw,2.9rem);line-height:1.15;text-wrap:balance}
html[lang=en] h1{font-family:"IBM Plex Sans",sans-serif}
.lede{margin:4px 0 0;color:var(--muted);font-size:1rem}
.tbtn{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-weight:700}
.tbtn svg{width:20px;height:20px}
/* story */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,1.1fr) minmax(0,1fr);align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.end{display:flex;align-items:center;gap:12px;min-width:0}
.end .n{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--c-ink);font-weight:700}
.end.fin .n{background:var(--ok)}
.end small{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.end b{display:block;font-size:1.05rem;line-height:1.35;text-wrap:balance}
.mid{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mini{height:12px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--rope) 0 7px,var(--rope2) 7px 11px)}
.mid .lg{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.mid .lg img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;border:1px solid var(--line)}
@media (max-width:640px){.story{grid-template-columns:1fr;gap:8px}}
/* presenter bar */
.here{position:relative;overflow:hidden;background:var(--g);color:var(--g-ink);border-radius:18px;padding:12px 16px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hcol{flex:1 1 220px;min-width:0}
.hcol small{display:block;color:var(--g-sub);font-size:.78rem;font-weight:600}
.hcol b{display:block;font-size:1.05rem;line-height:1.35}
.hcol .lt{display:inline-block;background:var(--c);color:var(--c-ink);border-radius:6px;padding:0 6px;font-size:.78rem;margin-inline-end:6px;vertical-align:2px}
.hsep{width:1px;align-self:stretch;background:var(--g-line)}
.hbtns{display:flex;gap:8px;align-items:center}
.hb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;display:grid;place-items:center;font-size:1.15rem}
.hd{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;font-weight:600}
.hb:hover:not([disabled]),.hd:hover{background:var(--c);border-color:var(--c);color:var(--c-ink)}
.hb[disabled]{opacity:.35;cursor:not-allowed}
.kbd{flex-basis:100%;margin:0;font-size:.75rem;color:var(--g-sub)}
.prog{position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--g-track)}
.prog i{display:block;height:100%;width:0;background:var(--g-sub);transition:width .5s ease}
@media (max-width:640px){.hsep{display:none}}
@media (hover:none),(max-width:999px){.kbd{display:none}}
/* map */
.map{position:relative;width:100%;container-type:inline-size}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.r1{fill:var(--rope)}.r2{fill:var(--rope2)}.d1{fill:var(--done)}.d2{fill:var(--done2)}
.rope-base{fill:none;stroke:url(#pRope);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.rope-done{fill:none;stroke:url(#pDone);stroke-width:22;stroke-linecap:butt;stroke-linejoin:round;visibility:hidden;transition:stroke-dasharray .7s ease}
.mk{fill:var(--c)}.mk-tri{fill:var(--c-ink)}
.dayl{position:absolute;inset-inline-start:3%;display:flex;align-items:center;gap:1cqw;transform:translateY(-50%)}
.dayl b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:.35cqw 1.4cqw;font-size:1.35cqw;font-weight:700}
.dayl span{color:var(--c);font-weight:700;font-size:1.4cqw}
.st{position:absolute;width:0;height:0}
.st .lbl{position:absolute;left:0;bottom:3.8cqw;transform:translateX(-50%);width:19cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.25cqw;pointer-events:none}
.st .lbl b{font-size:1.45cqw;line-height:1.25;font-weight:700;text-wrap:balance}
.st .lbl .o{font-size:1.05cqw;line-height:1.35;color:var(--muted);text-wrap:balance}
.tag{display:none;background:var(--c);color:var(--c-ink);font-weight:700;border-radius:999px}
.st .tag{font-size:1cqw;padding:.15cqw .9cqw}
.st.cur .tag.here-t{display:inline-block}
.ltag{display:inline-block;background:var(--labbg);color:var(--c);border:1px dashed var(--c);font-weight:700;border-radius:999px;white-space:nowrap}
.st .ltag{font-size:.95cqw;padding:.1cqw .8cqw}
.st.cur .ltag{display:none}
.dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:5.8cqw;height:5.8cqw;border-radius:50%;background:var(--card);border:.28cqw solid var(--rope);display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 .3cqw .9cqw var(--shadow);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.dot svg{width:2.6cqw;height:2.6cqw;color:var(--ink)}
.dot img.lg{width:3.1cqw;height:3.1cqw;object-fit:contain}
.dot.lab{border-radius:30%;border-style:dashed;border-color:var(--c);background:var(--labbg);width:6.4cqw;height:6.4cqw}
.dot .n{position:absolute;top:-.5cqw;inset-inline-end:-.5cqw;min-width:2.1cqw;height:2.1cqw;padding:0 .3cqw;border-radius:999px;background:var(--c);color:var(--c-ink);font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.dot .l2{position:absolute;bottom:-.4cqw;inset-inline-start:-.4cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}
.dot .l2 img{width:1.5cqw;height:1.5cqw;object-fit:contain}
.st .dot:hover{transform:translate(-50%,-50%) scale(1.07)}
.st.cur .dot{border-color:var(--c);border-style:solid;box-shadow:0 0 0 1cqw var(--glow)}
.st.done .dot{border-color:var(--ok)}
.st.done .dot .n{background:var(--ok)}
.st.dim .lbl b{color:var(--muted)}
.st.dim .dot{opacity:.75}
.st.labst .lbl b{color:var(--c)}
.chips{position:absolute;left:0;top:3.9cqw;transform:translateX(-50%);width:19.5cqw;display:flex;flex-wrap:wrap;justify-content:center;gap:.45cqw;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--card);border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap;line-height:1.3}
.chip img{width:1.3em;height:1.3em;object-fit:contain}
.chips .chip{padding:.25cqw .8cqw;font-size:.95cqw}
.chip.rule{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.st.cur .chip{border-color:var(--c)}
/* list (phones) */
.list{display:none}
@media (max-width:999px){.map{display:none}.list{display:block}}
.lday{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.lday:first-child{margin-top:0}
.lday b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:3px 14px;font-size:.92rem}
.lday span{color:var(--c);font-weight:700;font-size:.95rem}
.lgroup{display:flex;flex-direction:column}
.li{position:relative;display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;padding:6px 0 18px;cursor:pointer}
.li::before{content:"";position:absolute;inset-inline-start:24px;top:0;bottom:0;width:9px;border-radius:5px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,var(--rope2) 6px 10px)}
.lgroup .li:first-child::before{top:30px}
.lgroup .li:last-child::before{bottom:auto;height:34px}
.li.done::before{background:repeating-linear-gradient(45deg,var(--done) 0 6px,var(--done2) 6px 10px)}
.li .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;z-index:1}
.li .dot svg{width:26px;height:26px}.li .dot img.lg{width:30px;height:30px}
.li .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.li .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.li .dot .l2 img{width:14px;height:14px}
.li.cur .dot{border-color:var(--c);box-shadow:0 0 0 6px var(--glow)}
.li.done .dot{border-color:var(--ok)}
.li.done .dot .n{background:var(--ok)}
.li .tx{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:4px}
.li .tx b{font-size:1.05rem;line-height:1.35}
.li.labli .tx b{color:var(--c)}
.li .tx .o{color:var(--muted);font-size:.88rem;line-height:1.45}
.li .tag{font-size:.72rem;padding:1px 10px}
.li.cur .tag.here-t{display:inline-block}
.li .ltag{font-size:.72rem;padding:0 9px}
.li .cl{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.li .cl .chip{font-size:.74rem;padding:1px 9px}
/* sections */
.sec h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:0 0 10px;text-wrap:balance}
html[lang=en] .sec h2{font-family:"IBM Plex Sans",sans-serif}
.sec .sub{margin:-4px 0 12px;color:var(--muted)}
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.fc .h{display:flex;align-items:center;gap:10px}.fc img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)}
.fc b{font-size:1.1rem}.fc span{color:var(--muted);font-size:.92rem}
.fc .k{display:block;color:var(--c);font-weight:700;font-size:.8rem}.fc b{display:block}
.also{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.also small{color:var(--muted);font-weight:600}
.also .chip{padding:3px 10px;font-size:.85rem}
.labs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.labcard{text-align:start;background:var(--labbg);border:1.5px dashed var(--c);border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.labcard .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 52px;width:52px;height:52px;border-width:2px}
.labcard .dot img.lg{width:28px;height:28px}.labcard .dot .n{top:-7px;inset-inline-end:-8px;min-width:24px;height:20px;font-size:.7rem}
.labcard .dot .l2{width:20px;height:20px;bottom:-5px;inset-inline-start:-5px}.labcard .dot .l2 img{width:13px;height:13px}
.labcard small{color:var(--c);font-weight:700;font-size:.78rem}.labcard b{display:block;line-height:1.35}.labcard span{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.outs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.out small{color:var(--c);font-weight:700;font-size:.78rem}
.out b{font-size:1rem;line-height:1.4}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{flex:1 1 100px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.15;color:var(--brand)}
.fact span{color:var(--muted);font-size:.85rem}
@media (max-width:899px){.focus,.labs{grid-template-columns:1fr}.outs{grid-template-columns:1fr}.out{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px}.out small{order:2;white-space:nowrap}}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
/* drawer */
.dr{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);color:var(--ink);width:min(480px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;width:100%;border-radius:20px 20px 0 0}}
.dh{display:flex;align-items:center;gap:12px}
.dh .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;cursor:default;border-color:var(--c)}
.dh .dot svg{width:26px;height:26px}.dh .dot img.lg{width:30px;height:30px}
.dh .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.dh .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.dh .dot .l2 img{width:14px;height:14px}
.dh .tt{min-width:0}
.dh small{color:var(--muted);font-weight:600;font-size:.82rem}
.dh h2{margin:2px 0 0;font-size:1.25rem;line-height:1.3;text-wrap:balance}
.x{margin-inline-start:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1.3rem;line-height:1}
.dout{background:var(--panel);border-radius:12px;padding:12px 14px}
.dout.lab{background:var(--labbg);border:1px dashed var(--c)}
.dout small{display:block;color:var(--c);font-weight:700;font-size:.8rem}
.dout p{margin:2px 0 0;font-weight:600}
.dp h3{margin:0;font-size:.95rem}
.dp ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips .chip{font-size:.85rem;padding:3px 12px}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.pr+details.pr{margin-top:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:var(--g-ink);font-weight:600;cursor:pointer;font-size:.8rem}
.tnote{background:var(--panel);border-radius:12px;padding:10px 14px;font-size:.9rem}.tnote small{display:block;color:var(--muted);font-weight:700}
.drule{margin:0;background:var(--g);color:var(--g-ink);border-radius:12px;padding:10px 14px;font-weight:700}
.dfoot{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.dfoot button{flex:1;border-radius:12px;padding:11px 12px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--card)}
.dfoot button.pri{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.dfoot button[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.here,.tbtn,.dr{display:none!important}.map{display:block!important}.list{display:none!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<script>
const DATA={"ST": [{"okey": "o1", "day": 1, "h": 15, "kind": "st", "ic": "mic", "tools": ["Wispr Flow", "Teams", "ChatGPT", "Claude"], "lead": "Wispr Flow", "nm": {"ar": "من التسجيل إلى المحضر", "en": "From the recording to the minutes"}, "out": {"ar": "محضر اجتماع وقرارات ومهام من تسجيل أو تفريغ", "en": "Meeting minutes, decisions and actions from a recording or transcript"}, "steps": {"ar": ["الإملاء الصوتي بدل الكتابة في أي تطبيق (Wispr Flow)", "تسجيل اجتماع Teams وتفريغه النصي", "من التفريغ إلى محضر: القرارات والمهام والمسؤولون (ChatGPT أو Claude)", "موافقة الحضور قبل التسجيل"], "en": ["Voice dictation instead of typing, in any app (Wispr Flow)", "Record a Teams meeting and export its transcript", "From transcript to minutes: decisions, actions, owners (ChatGPT or Claude)", "Attendees' consent before recording"]}, "note": {"ar": "استخدم تفريغاً افتراضياً قصيراً لاجتماع Teams. التفريغ وحده لا يكفي؛ المحضر يحتاج خطوة تلخيص في ChatGPT أو Claude.", "en": "Use a short synthetic Teams transcript. The transcript alone is not enough; the minutes need a summarising step in ChatGPT or Claude."}, "P": [["1.A", "Minutes from a transcript", "المحضر من النص", "ChatGPT / Claude (Teams transcript)", "From this meeting transcript, write formal minutes: attendees, a 3-line summary, decisions, actions in a table (action, owner, deadline), and open questions. Add nothing that was not said.", "من نص هذا الاجتماع، اكتب محضراً رسمياً: الحضور، وخلاصة من 3 أسطر، والقرارات، والمهام في جدول (المهمة، المسؤول، الموعد)، والأسئلة المفتوحة. لا تضف شيئاً لم يُقل."], ["1.B", "Voice brief", "الإحاطة بالصوت", "Wispr Flow + ChatGPT / Claude", "(Speak, do not type) I just left a meeting about the labour market study. Here is what happened... Turn what I said into 5 clear follow-up points and a short email to the team.", "(تحدّث ولا تكتب) خرجت للتو من اجتماع عن دراسة سوق العمل، وهذا ما حدث... حوّل ما قلته إلى 5 نقاط متابعة واضحة وبريد قصير للفريق."]], "rule": null, "no": "1", "id": "1"}, {"okey": "o2", "day": 1, "h": 20, "kind": "st", "ic": "folder", "tools": ["Claude Projects", "ChatGPT Projects"], "lead": null, "nm": {"ar": "Claude Projects", "en": "Claude Projects"}, "out": {"ar": "مساحة عمل تتذكر ملفك، ومهارة «الملخص التنفيذي للمركز» داخلها", "en": "A workspace that remembers your file, with a \"Centre executive summary\" skill inside it"}, "steps": {"ar": ["مساحة واحدة لكل ملف بحثي متكرر (Projects في ChatGPT وClaude)", "ترفع المراجع وقالب المركز مرة، وتستخدمها كل مرة", "احفظ طريقتك: أسلوب المركز في الملخصات كمهارة داخل المشروع", "تطبيقها على أي دراسة جديدة، فيخرج كل ملخص بالشكل نفسه"], "en": ["One workspace per recurring research file (Projects in ChatGPT and Claude)", "Upload references and the centre's template once, use them every time", "Save your method: the centre's summary style as a skill inside the project", "Apply it to any new study, so every summary comes out the same way"]}, "note": {"ar": "ارفع محضر المحطة السابقة كملف مرجعي؛ هكذا تتصل المحطات. استخدم نموذج ملخص مسموحاً بمشاركته، أو نموذجاً افتراضياً.", "en": "Upload the minutes from the previous station as a reference file; this is how the stations connect. Use a summary template the client allows you to share, or a synthetic one."}, "P": [["2.A", "Project instructions", "تعليمات المشروع", "ChatGPT Projects / Claude Projects", "You are the research assistant for the \"Labour Market 2030\" file. Rely only on the uploaded sources, write in formal Arabic, cite the source file and page for every fact, and say \"not in the sources\" when information is missing.", "أنت المساعد البحثي لملف «سوق العمل 2030». اعتمد فقط على المصادر المرفوعة، واكتب بالعربية الرسمية، واذكر الملف المصدر والصفحة لكل معلومة، وقل «غير موجود في المصادر» عند غياب المعلومة."], ["2.B", "Save your method: the executive summary", "احفظ طريقتك: الملخص التنفيذي", "ChatGPT Projects / Claude Projects", "Add this to the instructions of my \"Labour Market 2030\" project as a fixed method called \"Centre executive summary\": whenever I ask for a summary, write a 3-line summary first, then key findings each with source and date, then options, then a recommendation; formal Arabic, under one page, and mark any number without a source as \"needs checking\".", "أضف هذا إلى تعليمات مشروعي «سوق العمل 2030» كطريقة ثابتة باسم «الملخص التنفيذي للمركز»: كلما طلبت ملخصاً، اكتب الخلاصة أولاً في 3 أسطر، ثم النتائج الرئيسية مع مصدر كل منها وتاريخه، ثم الخيارات، ثم التوصية؛ بلغة عربية رسمية، وأقل من صفحة، وضع علامة «يحتاج تحقق» على أي رقم بلا مصدر."]], "rule": null, "no": "2", "id": "2"}, {"okey": "o3", "day": 1, "h": 20, "kind": "st", "ic": "screen", "tools": ["Claude Artifacts", "ChatGPT Canvas"], "lead": null, "nm": {"ar": "Claude Artifacts", "en": "Claude Artifacts"}, "out": {"ar": "مخرجات حيّة تعمل فوراً: لوحة مؤشرات وأداة صغيرة من ملف الدراسة", "en": "Live outputs that work at once: an indicators dashboard and a small tool from the study file"}, "steps": {"ar": ["ما الـ Artifact: صفحة أو لوحة أو أداة تعمل داخل المحادثة", "لوحة مؤشرات من بيانات الدراسة", "أداة صغيرة تفاعلية يستخدمها الفريق", "التحسين بطلبات متتالية، ثم المشاركة برابط", "المقابل في ChatGPT: Canvas"], "en": ["What an Artifact is: a page, dashboard or tool that runs inside the chat", "An indicators dashboard from the study data", "A small interactive tool the team can use", "Refine with follow-up requests, then share by link", "The ChatGPT equivalent: Canvas"]}, "note": {"ar": "ابنِ من داخل مشروع المحطة السابقة لتستفيد من ملفاته. شغّل الأمر نفسه في Canvas وقارن.", "en": "Build from inside the previous station's project to use its files. Run the same prompt in Canvas and compare."}, "P": [["3.A", "Indicators dashboard", "لوحة مؤشرات الدراسة", "Claude (Artifacts) / ChatGPT (Canvas)", "From the synthetic employment-by-sector file, build an interactive Arabic dashboard: 4 KPI cards (total employment, growth, the fastest-growing sector, the sector most exposed to automation), a sector bar chart, a trend line by year, and a filter by emirate. Calm green and sand colours, and a note that the data is synthetic.", "من ملف التوظيف حسب القطاع الافتراضي، ابنِ لوحة مؤشرات عربية تفاعلية: 4 بطاقات (إجمالي التوظيف، والنمو، والقطاع الأسرع نمواً، والقطاع الأكثر تعرضاً للأتمتة)، ورسماً بالأعمدة للقطاعات، وخطاً للاتجاه حسب السنة، وفلتراً حسب الإمارة. بألوان خضراء ورملية هادئة، مع ملاحظة أن البيانات افتراضية."], ["3.B", "A small tool for the team", "أداة صغيرة للفريق", "Claude (Artifacts) / ChatGPT (Canvas)", "Build a small interactive tool: \"How exposed is this job to AI?\". The user picks a sector and types a job title and its 5 main tasks; the tool rates each task as low, medium or high exposure with a one-line reason, and shows a summary. Add a clear note that it is an indicative training tool, not an official assessment.", "ابنِ أداة تفاعلية صغيرة: «ما مدى تأثر هذه الوظيفة بالذكاء الاصطناعي؟». يختار المستخدم القطاع ويكتب المسمى الوظيفي ومهامه الخمس الرئيسية؛ فتقيّم الأداة كل مهمة (منخفض، متوسط، مرتفع) مع سبب من سطر واحد، وتعرض ملخصاً. أضف ملاحظة واضحة بأنها أداة تدريبية استرشادية، وليست تقييماً رسمياً."], ["3.C", "Refine and share", "حسّن وشارك", "Claude (Artifacts) / ChatGPT (Canvas)", "Improve the dashboard in three rounds: (1) add an English toggle; (2) add a one-paragraph \"what this means\" box under each chart; (3) make it print well on one A4 page. Then tell me how to share it by link and who will be able to see it.", "حسّن اللوحة على ثلاث جولات: (1) أضف زراً للإنجليزية؛ (2) أضف تحت كل رسم فقرة قصيرة «ماذا يعني هذا»؛ (3) اجعلها تُطبع جيداً في صفحة A4 واحدة. ثم أخبرني كيف أشاركها برابط ومن سيستطيع رؤيتها."]], "rule": null, "no": "3", "id": "3"}, {"okey": "o4", "day": 1, "h": 20, "kind": "st", "ic": "steps", "tools": ["Claude Cowork", "ChatGPT Work"], "lead": null, "nm": {"ar": "Claude Cowork", "en": "Claude Cowork"}, "out": {"ar": "مهمة متعددة الخطوات على ملفاتك: جمع وقراءة واستخراج وتلخيص، دفعة واحدة", "en": "A multi-step task on your files: collect, read, extract and summarise, all at once"}, "steps": {"ar": ["تفويض مهمة من عدة خطوات دفعة واحدة على ملفاتك", "مثال: قراءة تقارير الإدارات، ثم جدول بالمؤشرات، ثم ملخص من صفحة", "المقابل في ChatGPT: ChatGPT Work", "موافقة قبل أي حذف أو تنزيل أو إرسال"], "en": ["Delegate a task of several steps at once, on your files", "Example: read the department reports, then an indicators table, then a one-page summary", "The ChatGPT equivalent: ChatGPT Work", "Approval before any delete, download or send"]}, "note": {"ar": "شدّد على سطر «أخبرني قبل أن تحذف أو تستبدل أي ملف».", "en": "Stress the line \"tell me before you delete or replace any file\"."}, "P": [["4.A", "Task in Cowork", "مهمة في Cowork", "Claude Cowork", "In the study folder (synthetic files): read the five department reports, extract the key indicators into one Excel table, and write a one-page summary in Word with 3 recommendations. Tell me before you delete or replace any file.", "في مجلد الدراسة (ملفات افتراضية): اقرأ تقارير الإدارات الخمسة، واستخرج المؤشرات الرئيسية في جدول Excel واحد، واكتب ملخصاً من صفحة واحدة في Word مع 3 توصيات. أخبرني قبل أن تحذف أو تستبدل أي ملف."], ["4.B", "The same in ChatGPT Work", "المهمة نفسها في ChatGPT Work", "ChatGPT Work", "Run the same task in ChatGPT Work on the same synthetic study folder: read the five department reports, extract the key indicators into one Excel table, and write a one-page summary. Then compare the result with Cowork: accuracy, the steps it took, and where it asked for approval. Tell me before you delete or replace any file.", "شغّل المهمة نفسها في ChatGPT Work على مجلد الدراسة الافتراضي نفسه: اقرأ تقارير الإدارات الخمسة، واستخرج المؤشرات الرئيسية في جدول Excel واحد، واكتب ملخصاً من صفحة. ثم قارن النتيجة بـ Cowork: الدقة، والخطوات التي اتبعها، وأين طلب الموافقة. أخبرني قبل أن تحذف أو تستبدل أي ملف."]], "rule": null, "no": "4", "id": "4"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "plug", "tools": ["Claude", "ChatGPT", "MCP", "Skills", "Outlook", "Gmail", "Canva"], "lead": null, "nm": {"ar": "الإضافات والمهارات وMCP", "en": "Plugins, skills and MCP"}, "out": {"ar": "الموصلات وربط أدواتك: البريد والتقويم وCanva، بصلاحيات محددة", "en": "Connectors and linking your tools: email, calendar and Canva, with set permissions"}, "steps": {"ar": ["ما الموصلات وMCP، ولماذا تهمّك، وكيف تعمل في Claude وChatGPT", "البريد (Outlook وGmail): تلخيص الوارد، واستخراج المطلوب منك، ومسودات ردود", "التقويم: تجهيز أسبوعك، وإيجاد موعد مناسب", "Canva: تحويل نتائج الدراسة إلى إنفوجرافيك بقالب الجهة", "المهارات (Skills): طريقة عمل محفوظة يستدعيها المساعد متى احتاجها", "صلاحيات محددة وموافقة قبل أي إرسال أو حجز أو نشر"], "en": ["What connectors and MCP are, why they matter, and how they work in Claude and ChatGPT", "Email (Outlook and Gmail): summarise the inbox, pull out what is asked of you, draft replies", "Calendar: prepare your week, find a suitable slot", "Canva: turn the study's findings into an infographic in the entity's template", "Skills: a saved way of working the assistant calls on when needed", "Set permissions and approval before any send, booking or publishing"]}, "note": {"ar": "التشبيه الذي ينجح: النموذج هو العقل، وMCP هو الأعصاب، والأدوات هي الأطراف. استخدم حسابات تجريبية للبريد والتقويم وCanva؛ لم يُحسم بعد السماح بربط حسابات الجهة.", "en": "The analogy that works: the model is the brain, MCP the nerves, the tools the limbs. Use sandbox email, calendar and Canva accounts; permission to connect the entity's accounts is not yet confirmed."}, "P": [["5.A", "Email: inbox to actions", "البريد: من الوارد إلى المهام", "ChatGPT / Claude (Outlook or Gmail connector)", "Read the emails from the last 3 days in my inbox (sandbox account). Give me: what is asked of me in a table (request, sender, deadline), the 3 most urgent, and a draft reply for each of those 3. Create drafts only; send nothing.", "اقرأ رسائل آخر 3 أيام في بريدي (حساب تجريبي). أعطني: المطلوب مني في جدول (الطلب، المرسل، الموعد)، وأهم 3 رسائل عاجلة، ومسودة رد لكل منها. أنشئ مسودات فقط، ولا ترسل شيئاً."], ["5.B", "Calendar: prepare my week", "التقويم: جهّز أسبوعي", "ChatGPT / Claude (calendar connector)", "Look at my calendar for next week. List my meetings with what I need to prepare for each, flag any clashes or back-to-back days, and suggest two 90-minute blocks for focused research work. Do not create or change any event without my approval.", "اطّلع على تقويمي للأسبوع القادم. اعرض اجتماعاتي مع ما يجب أن أجهزه لكل منها، ونبّه إلى أي تعارض أو أيام مزدحمة، واقترح فترتين من 90 دقيقة للعمل البحثي المركّز. لا تُنشئ أو تعدّل أي موعد دون موافقتي."], ["5.C", "Canva: study to design", "Canva: من الدراسة إلى تصميم", "ChatGPT / Claude (Canva connector)", "Using my Canva account, create a one-page Arabic infographic from these study findings: a headline, 4 key numbers with their sources, and a closing message, in calm green and sand colours [or: use our template \"[template name]\"]. Give me the edit link so I can adjust it myself.", "باستخدام حسابي في Canva، أنشئ إنفوجرافيك عربياً من صفحة واحدة من نتائج هذه الدراسة: عنوان رئيسي، و4 أرقام رئيسية مع مصادرها، ورسالة ختامية، بألوان خضراء ورملية هادئة [أو: استخدم قالبنا «[اسم القالب]»]. وأعطني رابط التعديل لأعدّله بنفسي."], ["5.D", "Tool-access map", "خريطة صلاحيات الأدوات", "ChatGPT / Claude", "For an assistant that prepares a weekly research digest, list every connector it needs (email, calendar, Canva, files). For each: what it may read, what it may write, and what needs human approval. Drafts only, no sending or publishing. A table, then 5 rules.", "لمساعد يجهّز نشرة بحثية أسبوعية، حدد كل موصل يحتاجه (البريد، التقويم، Canva، الملفات). لكل موصل: ما يحق له قراءته، وما يحق له كتابته، وما يتطلب موافقة بشرية. مسودات فقط دون إرسال أو نشر. جدول ثم 5 قواعد."]], "rule": null, "no": "5", "id": "5"}, {"okey": null, "day": 1, "h": 10, "kind": "st", "ic": "search", "tools": ["Claude in Chrome", "ChatGPT"], "lead": null, "nm": {"ar": "Claude in Chrome", "en": "Claude in Chrome"}, "out": {"ar": "مهام داخل المتصفح: جمع وقراءة وتلخيص من مواقع عامة", "en": "Tasks inside the browser: collect, read and summarise from public websites"}, "steps": {"ar": ["إضافة Claude in Chrome: يقرأ الصفحة ويتنقل وينفّذ خطوات", "مثال: جمع تقارير من موقع عام في جدول", "المقابل في ChatGPT: إضافة ChatGPT لـ Chrome (تقرأ الصفحة وتلخصها)", "موافقة قبل أي إرسال أو تعبئة نموذج أو تنزيل"], "en": ["The Claude in Chrome extension: reads the page, navigates and carries out steps", "Example: collect reports from a public website into a table", "The ChatGPT equivalent: the ChatGPT extension for Chrome (reads and summarises the page)", "Approval before any send, form fill or download"]}, "note": {"ar": "ثبّت إضافة Claude in Chrome على أجهزة القاعة مسبقاً. إضافة ChatGPT الجديدة لـ Chrome تُطرح تدريجياً، وقد لا تظهر لكل الحسابات.", "en": "Install the Claude in Chrome extension on the room's devices beforehand. The new ChatGPT extension for Chrome is rolling out gradually and may not appear for every account."}, "P": [["6.A", "Collect reports from a public site", "جمع التقارير من موقع عام", "Claude in Chrome", "Open the publications page of [public statistics website]. Find the reports published in the last 6 months on employment or the labour market, and list them in a table with title, date, link and a one-line summary. Do not download anything; ask me first.", "افتح صفحة الإصدارات في [موقع إحصائي عام]. ابحث عن التقارير المنشورة خلال آخر 6 أشهر عن التوظيف أو سوق العمل، واعرضها في جدول بالعنوان والتاريخ والرابط وملخص من سطر واحد. لا تنزّل أي ملف؛ اسألني أولاً."], ["6.B", "Read this page", "اقرأ هذه الصفحة", "Claude in Chrome / ChatGPT (Chrome extension)", "Read the report page open in front of me and give me: the main finding in two lines, the 3 key numbers with their source and date, and one point that our labour-market study should check.", "اقرأ صفحة التقرير المفتوحة أمامي وأعطني: النتيجة الرئيسية في سطرين، و3 أرقام رئيسية مع مصدرها وتاريخها، ونقطة واحدة يجب أن تتحقق منها دراستنا عن سوق العمل."]], "rule": null, "no": "6", "id": "6"}, {"okey": null, "day": 1, "h": 10, "kind": "st", "ic": "flow", "tools": ["Claude Desktop", "ChatGPT Desktop"], "lead": null, "nm": {"ar": "Claude Desktop", "en": "Claude Desktop"}, "out": {"ar": "ترتيب ملفات الدراسة على جهازك", "en": "Organising the study files on your computer"}, "steps": {"ar": ["تطبيق سطح المكتب: يعمل على مجلد تحدده على جهازك", "ترتيب المجلدات وتوحيد أسماء الملفات", "المقابل في ChatGPT: تطبيق ChatGPT لسطح المكتب", "لا حذف ولا استبدال دون موافقتك"], "en": ["The desktop app: works on a folder you choose on your computer", "Organise folders and standardise file names", "The ChatGPT equivalent: the ChatGPT desktop app", "No deleting or replacing without your approval"]}, "note": {"ar": "استخدم مجلداً افتراضياً فيه ملفات بأسماء غير مرتبة. شدّد على سطر «أخبرني قبل أن تحذف أو تستبدل أي ملف».", "en": "Use a synthetic folder with messily named files. Stress the line \"tell me before you delete or replace any file\"."}, "P": [["7.A", "Organise the study folder", "رتّب مجلد الدراسة", "Claude Desktop / ChatGPT Desktop", "In the folder \"Labour Market 2030\" (synthetic files): propose a folder structure (sources, data, drafts, final), rename the files to the pattern YYYY-MM_type_title, and list any duplicates. Show me the plan in a table first, and do nothing until I approve. Tell me before you delete or replace any file.", "في مجلد «سوق العمل 2030» (ملفات افتراضية): اقترح هيكل مجلدات (المصادر، والبيانات، والمسودات، والنهائي)، وأعد تسمية الملفات بنمط سنة-شهر_النوع_العنوان، واذكر أي ملفات مكررة. اعرض الخطة في جدول أولاً، ولا تنفّذ شيئاً قبل موافقتي. أخبرني قبل أن تحذف أو تستبدل أي ملف."]], "rule": null, "no": "7", "id": "7"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "chart", "tools": ["Claude in Excel", "ChatGPT for Excel"], "lead": null, "nm": {"ar": "Claude in Excel", "en": "Claude in Excel"}, "out": {"ar": "تنظيف وتجميع ومعادلات ورسم بياني داخل Excel نفسه", "en": "Cleaning, merging, formulas and a chart inside Excel itself"}, "steps": {"ar": ["المساعد داخل Excel نفسه: Claude in Excel أو ChatGPT for Excel", "تنظيف بيانات غير مرتبة وتوحيد صيغها", "كتابة المعادلات بالوصف بدل الحفظ", "رسم بياني وملخص للنتائج"], "en": ["The assistant inside Excel itself: Claude in Excel or ChatGPT for Excel", "Clean messy data and standardise formats", "Write formulas by describing them", "A chart and a summary of the results"]}, "note": {"ar": "استخدم ملف إحصاءات افتراضياً واحداً، وشغّل الطلب نفسه في Claude in Excel وChatGPT for Excel وقارن. تأكد من تثبيت الإضافتين مسبقاً.", "en": "Use one synthetic statistics file, run the same request in Claude in Excel and ChatGPT for Excel, and compare. Make sure both add-ins are installed beforehand."}, "P": [["8.A", "Clean and analyse", "تنظيف وتحليل", "Claude in Excel / ChatGPT for Excel", "This synthetic file shows employment by sector and year. Standardise the sector names and years, remove duplicates, calculate the growth rate for each sector, then show the 5 fastest-growing sectors and a trend chart.", "هذا الملف الافتراضي يعرض التوظيف حسب القطاع والسنة. وحّد أسماء القطاعات والسنوات، واحذف المكرر، واحسب معدل النمو لكل قطاع، ثم اعرض أسرع 5 قطاعات نمواً ومخططاً للاتجاه."], ["8.B", "Merge files", "تجميع الملفات", "Claude in Excel / ChatGPT for Excel", "Merge these 4 quarterly files into one master table with a column for the quarter. Flag rows where the columns do not match and list any missing values.", "اجمع هذه الملفات الربعية الأربعة في جدول رئيسي واحد مع عمود للربع. ونبّه إلى الصفوف التي لا تتطابق أعمدتها، واذكر أي قيم ناقصة."], ["8.C", "Write formulas", "كتابة المعادلات", "Claude in Excel / ChatGPT for Excel", "Write a formula that calculates the year-on-year change for each indicator, highlight any change above 10% in either direction, and explain the formula in one line.", "اكتب معادلة تحسب التغير السنوي لكل مؤشر، ولوّن أي تغير يزيد على 10% صعوداً أو هبوطاً، واشرح المعادلة في سطر واحد."]], "rule": null, "no": "8", "id": "8"}, {"okey": "o5", "day": 1, "h": 25, "kind": "st", "ic": "robot", "tools": ["Claude Scheduled", "ChatGPT Tasks"], "lead": null, "nm": {"ar": "AI Agent: Scheduled Tasks", "en": "AI Agent: Scheduled Tasks"}, "out": {"ar": "وكيلك الأول: يعمل وحده في موعده، ويسلّمك الملخص قبل الدوام", "en": "Your first AI agent: it runs on its own, on schedule, and hands you the summary before work"}, "steps": {"ar": ["ما الوكيل الذكي (AI Agent): هدف، وأدوات، وتعليمات ثابتة، ويعمل دون أن تطلب منه كل مرة", "الفرق بين المحادثة والوكيل: المحادثة تنتظرك، والوكيل يعمل في موعده ويستخدم أدواته وحده", "صمّم وكيلك على بطاقة: الهدف، والمصادر، والأدوات، والموعد، والمخرج، والحدود", "شغّله كمهمة مجدولة في Claude (Scheduled Tasks) أو ChatGPT (Tasks)", "أمثلة جاهزة: موجز صباحي، ورصد يومي، ونشرة بحثية، ونشرة الذكاء الاصطناعي", "حدود الوكيل: مسودات فقط، ولا إرسال أو نشر دون موافقتك"], "en": ["What an AI agent is: a goal, tools, fixed instructions, and it works without being asked each time", "Chat vs agent: a chat waits for you; an agent runs on schedule and uses its tools on its own", "Design your agent on a card: goal, sources, tools, schedule, output, limits", "Run it as a scheduled task in Claude (Scheduled Tasks) or ChatGPT (Tasks)", "Ready examples: a morning brief, a daily monitor, a research digest, and an AI-updates digest", "The agent's limits: drafts only, no sending or publishing without your approval"]}, "note": {"ar": "هذه خاتمة الرحلة: قدّمها على أنها وكيل ذكي فعلاً، لا مجرد تذكير. ابدأ ببطاقة الوكيل (9.A)، ثم يختار كل مشارك وكيلاً واحداً من الأمثلة ويجدوله على موضوع من عمله؛ أكثر ما يستمر استخدامه بعد التدريب.", "en": "This is the journey's close: present it as a real AI agent, not just a reminder. Start with the agent card (9.A), then each participant picks one example agent and schedules it on a topic from their own work; it is what people keep using after the training."}, "P": [["9.A", "Design your agent", "صمّم وكيلك", "ChatGPT / Claude", "Help me design an AI agent that runs on its own for the \"Labour Market 2030\" file. Ask me 5 short questions, then give me an agent card: name, goal in one line, sources it reads, tools it uses (web search, email, calendar, files), schedule, the output and where it lands, and its limits (what it must never do without my approval). Then write the scheduled-task instruction I can paste into Claude or ChatGPT.", "ساعدني أصمّم وكيلاً ذكياً يعمل وحده لملف «سوق العمل 2030». اسألني 5 أسئلة قصيرة، ثم أعطني بطاقة الوكيل: الاسم، والهدف في سطر، والمصادر التي يقرأها، والأدوات التي يستخدمها (البحث على الإنترنت، والبريد، والتقويم، والملفات)، والموعد، والمخرج وأين يصل، والحدود (ما لا يفعله أبداً دون موافقتي). ثم اكتب تعليمات المهمة المجدولة التي ألصقها في Claude أو ChatGPT."], ["9.B", "Daily morning brief", "الموجز الصباحي اليومي", "Claude Scheduled / ChatGPT Tasks (daily 07:30)", "Every working day at 07:30: read today's email and calendar (sandbox account) and write a 5-line brief: meetings, decisions needed, deadlines, what needs a reply from me, and one item on the \"Labour Market 2030\" file. Send nothing.", "كل يوم عمل الساعة 07:30: اقرأ بريد وتقويم اليوم (حساب تجريبي)، واكتب موجزاً من 5 أسطر: الاجتماعات، والقرارات المطلوبة، والمواعيد النهائية، وما يحتاج مني رداً، وبنداً واحداً عن ملف «سوق العمل 2030». لا ترسل شيئاً."], ["9.C", "Daily monitor", "الرصد اليومي", "Claude Scheduled / ChatGPT Tasks (daily 07:45)", "Every working day at 07:30: check [source 1], [source 2] and [source 3] for anything new in the last 24 hours on [topic]. For each item: the headline, two lines on what is new, why it matters for our research, the link and the publication date. If nothing is new, say so in one line.", "كل يوم عمل الساعة 07:30: راجع [المصدر 1] و[المصدر 2] و[المصدر 3] بحثاً عن أي جديد خلال آخر 24 ساعة حول [الموضوع]. لكل خبر: العنوان، وسطران عمّا هو جديد، ولماذا يهم أبحاثنا، والرابط، وتاريخ النشر. وإن لم يوجد جديد فقل ذلك في سطر واحد."], ["9.D", "Weekly research digest", "النشرة البحثية الأسبوعية", "Claude Scheduled / ChatGPT Tasks (Mondays 08:00)", "Every Monday at 08:00: find the most important new studies, reports and statistics from the past 7 days on AI and the labour market, globally and in the UAE. Pick the top 7: headline, two lines on the finding, why it matters for a government research team, and the source link. Save it as a draft email with the subject \"Research Weekly | [date]\".", "كل يوم اثنين الساعة 08:00: ابحث عن أهم الدراسات والتقارير والإحصاءات الجديدة خلال آخر 7 أيام عن الذكاء الاصطناعي وسوق العمل، عالمياً وفي الإمارات. اختر أهم 7: العنوان، وسطرين عن النتيجة، ولماذا تهم فريقاً بحثياً حكومياً، ورابط المصدر. احفظها كمسودة بريد بعنوان «النشرة البحثية | [التاريخ]»."], ["9.E", "Weekly AI updates", "نشرة الذكاء الاصطناعي الأسبوعية", "Claude Scheduled / ChatGPT Tasks (Mondays 08:30)", "Every Monday at 08:30: search the web for the most important AI updates from the past 7 days (new models, new features in ChatGPT, Claude and Gemini, and AI news in the UAE). Pick the top 7: headline, two lines on what changed, why it matters for a research team, and the source link. Email it to me with the subject \"AI Weekly | [date]\", or save it as a draft if sending is not available.", "كل يوم اثنين الساعة 08:30: ابحث عن أهم تحديثات الذكاء الاصطناعي خلال آخر 7 أيام (النماذج الجديدة، والميزات الجديدة في ChatGPT وClaude وGemini، وأخبار الذكاء الاصطناعي في الإمارات). اختر أهم 7: العنوان، وسطرين عمّا تغيّر، ولماذا يهم فريقاً بحثياً، ورابط المصدر. أرسلها إلى بريدي بعنوان «نشرة الذكاء الاصطناعي | [التاريخ]»، أو احفظها كمسودة إن لم يتوفر الإرسال."]], "rule": null, "no": "9", "id": "9"}, {"okey": null, "day": 1, "h": 20, "kind": "lab", "ic": "Claude", "tools": ["Claude", "ChatGPT"], "lead": null, "nm": {"ar": "أتمتة ملف «سوق العمل 2030»", "en": "Automating the \"Labour Market 2030\" file"}, "out": {"ar": "فرز البريد الوارد، ورصد يومي وتقرير أسبوعي مجدولان، وبطاقة حوكمة", "en": "Inbox triage, a scheduled daily monitor and weekly report, and a governance card"}, "steps": {"ar": ["فرز بريد الدراسة الوارد إلى مسودات ومهام", "الرصد اليومي المجدول", "التقرير الأسبوعي المجدول", "بطاقة الحوكمة"], "en": ["Triage the study inbox into drafts and tasks", "The scheduled daily monitor", "The scheduled weekly report", "The governance card"]}, "note": {"ar": "استخدم حسابات تجريبية وملفات افتراضية، وتأكد أن البريد متصل قبل التدريب. من يستخدم ChatGPT يضبط الجدولة في Tasks.", "en": "Use sandbox accounts and synthetic files, and check the email is connected before the lab. ChatGPT users set the schedule in Tasks."}, "P": [["T1.A", "Inbox triage", "فرز البريد الوارد", "ChatGPT / Claude (email connector)", "Read the last 20 emails in the \"Labour Market 2030\" study inbox (sandbox account). Classify each: data request, partner submission, media enquiry, or sensitive. For data requests draft a reply, for partner submissions add a row to the sources table, for media enquiries draft a holding reply, and list sensitive ones for me only. Send nothing.", "اقرأ آخر 20 رسالة في صندوق دراسة «سوق العمل 2030» (حساب تجريبي). صنّف كل رسالة: طلب بيانات، أو مساهمة من جهة شريكة، أو استفسار إعلامي، أو أمر حساس. لطلب البيانات اكتب مسودة رد، وللمساهمة أضف صفاً في جدول المصادر، وللاستفسار الإعلامي اكتب رداً مبدئياً، واعرض الحساس عليّ فقط. لا ترسل شيئاً."], ["T1.B", "Daily monitor", "الرصد اليومي", "Claude Scheduled / ChatGPT Tasks (daily 07:30)", "Set up a daily task at 07:30 for the \"Labour Market 2030\" file: check 3 public sources I choose for new reports or statistics, summarise each in two lines with link and date, and add them to a running log file. Send nothing.", "اضبط مهمة يومية الساعة 07:30 لملف «سوق العمل 2030»: راجع 3 مصادر عامة أختارها بحثاً عن تقارير أو إحصاءات جديدة، ولخّص كلاً منها في سطرين مع الرابط والتاريخ، وأضفها إلى ملف سجل متجدد. لا ترسل شيئاً."], ["T1.C", "Scheduled weekly report", "التقرير الأسبوعي المجدول", "Claude Scheduled / ChatGPT Tasks (Sundays 08:00)", "Every Sunday at 08:00: read the monitoring log and last week's report, compare them, and write the weekly report using the \"Centre executive summary\" skill: what is new, what changed in the num  $("map").innerHTML=h+`</div>`;

  S.forEach((s,i)=>{if(s.day!==dn)return;const lab=s.kind==="lab";l+=`<button type="button" class="li ${lab?"labli":""}" data-i="${i+1}"><span class="dot ${lab?"lab":""}">${dotHTML(s)}</span><span class="tx"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span>${(s.tools.length||s.rule)?`<span class="cl">${chipsOf(s)}</span>`:""}</span></button>`;});l+=`</div>`;});
 $("list").innerHTML=l;

 L=[];render(false);if(open)fillDr(open);}
/* rope progress */
let total=0,L=[];
function measure(){if(L.length)return;const rp=$("ropePath");if(!rp)return;try{total=rp.getTotalLength();if(!total)return;const pts=[];for(let s=0;s<=total;s+=4){const p=rp.getPointAtLength(s);pts.push([s,p.x,p.y]);}
 L=S.map(s=>{const q=POS[s.id];let best=0,bd=Infinity;pts.forEach(p=>{const dd=(p[1]-q[0])**2+(p[2]-q[1])**2;if(dd<bd){bd=dd;best=p[0];}});return best;});}catch(e){L=[];}}
let cur=0,open=0,lastFocus=null;const mq=matchMedia("(min-width:1000px)"),reduce=matchMedia("(prefers-reduced-motion: reduce)");

 ${MODE==="trainer"?`<div class="tnote"><small>${t.tnote}</small>${esc(s.note[lang])}</div>`:""}

function openDr(n){if(!open)lastFocus=document.activeElement;drLab=false;open=n;fillDr(n);$("dr").hidden=false;$("drClose").focus();}
