ندسة العكسية متاحة برمز QR من التدريبات السابقة.", "en": "The analogy that works: the model is the brain, MCP the nerves, the tools the limbs. Use sandbox email, calendar and Canva accounts; permission to connect the entity's accounts is not yet confirmed. The reverse-engineering skill is available by QR code from earlier sessions."}, "P": [["15.A", "Email: media requests to actions", "البريد: من طلبات الإعلام إلى إجراءات", "ChatGPT / Claude (Outlook or Gmail connector)", "Read the last 3 days of email in my mailbox (sandbox account). Sort them into: media requests, event invitations and RSVPs, internal requests, and other. For each media request: the outlet, what they want, the deadline, and a draft reply. Create drafts only; send nothing.", "اقرأ رسائل آخر 3 أيام في بريدي (حساب تجريبي). صنّفها إلى: طلبات إعلامية، ودعوات وتأكيدات حضور، وطلبات داخلية، وأخرى. لكل طلب إعلامي: الوسيلة، وما تطلبه، والموعد النهائي، ومسودة رد. أنشئ مسودات فقط، ولا ترسل شيئاً."], ["15.B", "Calendar: the forum milestones", "التقويم: محطات الملتقى", "ChatGPT / Claude (calendar connector)", "Look at my calendar for the next 4 weeks. Propose where to place the forum's preparation milestones (final programme, invitations, rehearsal, media briefing), flag any clash, and suggest two 60-minute slots for the rehearsal. Do not book anything; show me first.", "اطّلع على تقويمي للأسابيع الأربعة القادمة. اقترح أين أضع محطات التحضير للملتقى (البرنامج النهائي، والدعوات، والبروفة، والإحاطة الإعلامية)، ونبّه إلى أي تعارض، واقترح فترتين من 60 دقيقة للبروفة. لا تحجز شيئاً؛ اعرض عليّ أولاً."], ["15.C", "Canva: invitation and posts", "Canva: الدعوة والمنشورات", "ChatGPT / Claude (Canva connector)", "Using my Canva account, create the forum's invitation card and 3 social posts (announcement, speakers, countdown) in its identity, in Arabic, square format for posts and A5 for the card. Leave them as drafts for me to review.", "باستخدام حسابي في Canva، أنشئ بطاقة دعوة الملتقى و3 منشورات (إعلان، ومتحدثون، وعدّ تنازلي) بهويته، بالعربية، بمقاس مربع للمنشورات وA5 للبطاقة. اتركها مسودات لأراجعها."], ["15.D", "Save a template as a skill", "احفظ قالباً كمهارة", "Claude (Skills) / ChatGPT", "Here is an example of a media report our office liked. Analyse it, show me what you understood about its structure, style and rules, ask me only about what is missing, then write a reusable skill (SKILL.md) that produces reports in the same shape every time, and test it on this week's monitoring results.", "هذا مثال لتقرير إعلامي أعجب مكتبنا. حلّله، واعرض عليّ ما فهمته عن هيكله وأسلوبه وقواعده، واسألني عن الناقص فقط، ثم اكتب مهارة قابلة لإعادة الاستخدام (SKILL.md) تنتج التقارير بالشكل نفسه كل مرة، وجرّبها على نتائج رصد هذا الأسبوع."]], "rule": null, "no": "15", "id": "15"}, {"okey": null, "day": 2, "h": 15, "kind": "st", "ic": "search", "tools": ["Claude in Chrome", "ChatGPT"], "lead": null, "nm": {"ar": "Claude in Chrome", "en": "Claude in Chrome"}, "out": {"ar": "مهام داخل المتصفح: جمع التغطية وقراءة الصفحات العامة", "en": "Tasks inside the browser: collect coverage and read public pages"}, "steps": {"ar": ["إضافة Claude in Chrome: يقرأ الصفحة ويتنقل وينفّذ خطوات", "مثال: جمع تغطية الملتقى من المواقع الإخبارية في جدول", "قراءة منشور عام على Instagram أو نقاش على Reddit من حسابك", "المقابل في ChatGPT: إضافة ChatGPT لـ Chrome (تقرأ الصفحة وتلخصها)", "قراءة فقط: لا إعجاب ولا تعليق ولا متابعة ولا إرسال دون موافقة"], "en": ["The Claude in Chrome extension: reads the page, navigates and carries out steps", "Example: collect the forum's coverage from news sites into a table", "Read a public Instagram post or a Reddit thread from your own account", "The ChatGPT equivalent: the ChatGPT extension for Chrome (reads and summarises the page)", "Read only: no likes, comments, follows or sending without approval"]}, "note": {"ar": "ثبّت إضافة Claude in Chrome على أجهزة القاعة مسبقاً. الإضافة تعمل بحساب الموظف وتقرأ ما يراه هو فقط. إضافة ChatGPT الجديدة لـ Chrome تُطرح تدريجياً، وقد لا تظهر لكل الحسابات.", "en": "Install the Claude in Chrome extension on the room's devices beforehand. It works in the employee's own account and reads only what they can see. The new ChatGPT extension for Chrome is rolling out gradually and may not appear for every account."}, "P": [["16.A", "Collect coverage from news sites", "اجمع التغطية من المواقع الإخبارية", "Claude in Chrome", "Search the websites of [3 news outlets] for coverage from the last 7 days of [the public topic]. List what you find in a table with the outlet, headline, date, link, a one-line summary and the tone. Do not download anything; ask me first.", "ابحث في مواقع [3 وسائل إعلام] عن التغطية خلال آخر 7 أيام لـ[الموضوع العام]. اعرض ما تجده في جدول بالوسيلة، والعنوان، والتاريخ، والرابط، وملخص من سطر، والنبرة. لا تنزّل أي ملف؛ اسألني أولاً."], ["16.B", "Read this public page", "اقرأ هذه الصفحة العامة", "Claude in Chrome / ChatGPT (Chrome extension)", "Read the public Instagram post or Reddit thread open in front of me and give me: what it is about, the main reactions grouped into themes, the overall tone, and the 3 comments that most need the communication team's attention, quoted exactly. Only read; do not interact with the page.", "اقرأ المنشور العام على Instagram أو النقاش على Reddit المفتوح أمامي وأعطني: موضوعه، وأبرز ردود الفعل مجمّعة في محاور، والنبرة العامة، وأكثر 3 تعليقات تحتاج انتباه فريق الاتصال مع اقتباسها حرفياً. اقرأ فقط؛ لا تتفاعل مع الصفحة."]], "rule": null, "no": "16", "id": "16"}, {"okey": null, "day": 2, "h": 10, "kind": "st", "ic": "flow", "tools": ["Claude Desktop", "ChatGPT Desktop"], "lead": null, "nm": {"ar": "Claude Desktop", "en": "Claude Desktop"}, "out": {"ar": "ترتيب ملفات الملتقى على جهازك", "en": "Organising the forum's files on your computer"}, "steps": {"ar": ["تطبيق سطح المكتب: يعمل على مجلد تحدده على جهازك", "ترتيب المجلدات وتوحيد أسماء الملفات", "المقابل في ChatGPT: تطبيق ChatGPT لسطح المكتب", "لا حذف ولا استبدال دون موافقتك"], "en": ["The desktop app: works on a folder you choose on your computer", "Organise folders and standardise file names", "The ChatGPT equivalent: the ChatGPT desktop app", "No deleting or replacing without your approval"]}, "note": {"ar": "استخدم مجلداً افتراضياً فيه ملفات بأسماء غير مرتبة. شدّد على سطر «أخبرني قبل أن تحذف أو تستبدل أي ملف».", "en": "Use a synthetic folder with messily named files. Stress the line \"tell me before you delete or replace any file\"."}, "P": [["17.A", "Organise the forum folder", "رتّب مجلد الملتقى", "Claude Desktop / ChatGPT Desktop", "In the folder \"Government Innovation Forum 2026\" (synthetic files): propose a folder structure (programme, speakers, invitations, media, protocol, reports), rename the files to the pattern YYYY-MM_type_title, and list any duplicates. Show me the plan in a table first, and do nothing until I approve. Tell me before you delete or replace any file.", "في مجلد «ملتقى الابتكار الحكومي 2026» (ملفات افتراضية): اقترح هيكل مجلدات (البرنامج، والمتحدثون، والدعوات، والإعلام، والمراسم، والتقارير)، وأعد تسمية الملفات بنمط سنة-شهر_النوع_العنوان، واذكر أي ملفات مكررة. اعرض الخطة في جدول أولاً، ولا تنفّذ شيئاً قبل موافقتي. أخبرني قبل أن تحذف أو تستبدل أي ملف."]], "rule": null, "no": "17", "id": "17"}, {"okey": null, "day": 2, "h": 20, "kind": "st", "ic": "chart", "tools": ["Claude in Excel", "ChatGPT for Excel"], "lead": null, "nm": {"ar": "Claude in Excel", "en": "Claude in Excel"}, "out": {"ar": "تنظيف وتجميع ومعادلات ورسم بياني داخل Excel نفسه", "en": "Cleaning, merging, formulas and a chart inside Excel itself"}, "steps": {"ar": ["المساعد داخل Excel نفسه: Claude in Excel أو ChatGPT for Excel", "تنظيف قائمة المدعوين وتأكيدات الحضور وتوحيد صيغها", "سجل التغطية الإعلامية: معادلات بالوصف بدل الحفظ", "رسم بياني وملخص للنتائج"], "en": ["The assistant inside Excel itself: Claude in Excel or ChatGPT for Excel", "Clean the guest list and RSVPs, and standardise their formats", "The media-coverage log: formulas by description instead of memory", "A chart and a summary of the results"]}, "note": {"ar": "استخدم ملفاً افتراضياً واحداً، وشغّل الطلب نفسه في Claude in Excel وChatGPT for Excel وقارن. تأكد من تثبيت الإضافتين مسبقاً.", "en": "Use one synthetic file, run the same request in Claude in Excel and ChatGPT for Excel, and compare. Make sure both add-ins are installed beforehand."}, "P": [["18.A", "Clean the RSVP list", "نظّف قائمة تأكيد الحضور", "Claude in Excel / ChatGPT for Excel", "This synthetic file lists the forum's invitations. Standardise the guest categories and the RSVP status, remove duplicates, count confirmations by category and by day, and add a chart. Do not change the original sheet; work in a new one.", "هذا الملف الافتراضي يضم دعوات الملتقى. وحّد فئات الضيوف وحالة تأكيد الحضور، واحذف المكرر، واحسب التأكيدات حسب الفئة وحسب اليوم، وأضف رسماً بيانياً. لا تغيّر الورقة الأصلية؛ اعمل في ورقة جديدة."], ["18.B", "Media-coverage log", "سجل التغطية الإعلامية", "Claude in Excel / ChatGPT for Excel", "Turn these monitoring results into a coverage log: date, platform, outlet or account, headline, tone, reach if known, link. Then add a summary table by platform and tone, and colour negative items.", "حوّل نتائج الرصد هذه إلى سجل تغطية: التاريخ، والمنصة، والوسيلة أو الحساب، والعنوان، والنبرة، والوصول إن عُرف، والرابط. ثم أضف جدول ملخص حسب المنصة والنبرة، ولوّن المواد السلبية."], ["18.C", "Write formulas", "اكتب المعادلات", "Claude in Excel / ChatGPT for Excel", "Write a formula that counts the days left to the forum for each task and flags any task that is due in under 7 days and not done, then explain the formula in one line.", "اكتب معادلة تحسب الأيام المتبقية حتى الملتقى لكل مهمة، وتنبّه إلى أي مهمة موعدها خلال أقل من 7 أيام ولم تنجز، ثم اشرح المعادلة في سطر واحد."]], "rule": null, "no": "18", "id": "18"}, {"okey": "o5", "day": 2, "h": 35, "kind": "st", "ic": "robot", "tools": ["Claude Scheduled", "ChatGPT Tasks"], "lead": null, "nm": {"ar": "AI Agent: Scheduled Tasks", "en": "AI Agent: Scheduled Tasks"}, "out": {"ar": "وكيلك الأول: يرصد وحده كل صباح، ويسلّمك الموجز قبل الدوام", "en": "Your first AI agent: it monitors on its own every morning and hands you the brief before work"}, "steps": {"ar": ["ما الوكيل الذكي (AI Agent): هدف، وأدوات، وتعليمات ثابتة، ويعمل دون أن تطلب منه كل مرة", "الفرق بين المحادثة والوكيل: المحادثة تنتظرك، والوكيل يعمل في موعده ويستخدم أدواته وحده", "صمّم وكيلك على بطاقة: الهدف، والمصادر، والأدوات، والموعد، والمخرج، والحدود", "شغّله كمهمة مجدولة في Claude (Scheduled Tasks) أو ChatGPT (Tasks)", "أمثلة جاهزة: الرصد الإعلامي الصباحي، والتقرير الأسبوعي، وعدّ تنازلي لمهام الفعالية", "حدود الوكيل: مسودات فقط، ولا إرسال أو نشر دون موافقتك"], "en": ["What an AI agent is: a goal, tools, fixed instructions, and it works without being asked each time", "Chat vs agent: a chat waits for you; an agent runs on schedule and uses its tools on its own", "Design your agent on a card: goal, sources, tools, schedule, output, limits", "Run it as a scheduled task in Claude (Scheduled Tasks) or ChatGPT (Tasks)", "Ready examples: a morning media monitor, a weekly report, and an event-task countdown", "The agent's limits: drafts only, no sending or publishing without your approval"]}, "note": {"ar": "هذه خاتمة الرحلة: قدّمها على أنها وكيل ذكي فعلاً، لا مجرد تذكير. ابدأ ببطاقة الوكيل (19.A)، ثم يجدول كل مشارك وكيل الرصد الصباحي على موضوع عام يوافق عليه المكتب؛ أكثر ما يستمر استخدامه بعد التدريب.", "en": "This is the journey's close: present it as a real AI agent, not just a reminder. Start with the agent card (19.A), then each participant schedules the morning monitor on a public topic the office approves; it is what people keep using after the training."}, "P": [["19.A", "Design your agent", "صمّم وكيلك", "ChatGPT / Claude", "Help me design an AI agent that monitors on its own for the executive office. Ask me 5 short questions, then give me an agent card: name, goal in one line, the public topics and figures it monitors, the sources and platforms, the tools it uses (web search, email, files), the schedule, the output and where it lands, and its limits (what it must never do without my approval). Then write the scheduled-task instruction I can paste into Claude or ChatGPT.", "ساعدني أصمّم وكيلاً ذكياً يرصد وحده للمكتب التنفيذي. اسألني 5 أسئلة قصيرة، ثم أعطني بطاقة الوكيل: الاسم، والهدف في سطر، والموضوعات والشخصيات العامة التي يرصدها، والمصادر والمنصات، والأدوات التي يستخدمها (البحث على الإنترنت، والبريد، والملفات)، والموعد، والمخرج وأين يصل، والحدود (ما لا يفعله أبداً دون موافقتي). ثم اكتب تعليمات المهمة المجدولة التي ألصقها في Claude أو ChatGPT."], ["19.B", "Morning media monitor", "الرصد الإعلامي الصباحي", "Claude Scheduled / ChatGPT Tasks (daily 07:30)", "Every working day at 07:30: search the news and public posts from the last 24 hours about [the public figure or topic] and [the forum]. Write a brief of no more than 10 lines: was it mentioned, where, the tone, the 5 most important items with links, and anything that needs a response today. Mark anything not verified with [to verify]. Draft only; publish nothing.", "كل يوم عمل الساعة 07:30: ابحث في الأخبار والمنشورات العامة خلال آخر 24 ساعة عن [الشخصية العامة أو الموضوع] و[الملتقى]. اكتب موجزاً لا يتجاوز 10 أسطر: هل ذُكر، وأين، والنبرة، وأهم 5 مواد مع روابطها، وما يحتاج رداً اليوم. ضع علامة [للتحقق] على ما لم يُتحقق منه. مسودة فقط؛ لا تنشر شيئاً."], ["19.C", "Weekly media report", "التقرير الإعلامي الأسبوعي", "Claude Scheduled / ChatGPT Tasks (Thursdays 14:00)", "Every Thursday at 14:00: read this week's morning briefs and write the weekly media report with the \"Executive Office report\" method: the week in 3 lines, mentions by platform, themes and tone, the 3 items leadership should see, and recommendations for next week.", "كل يوم خميس الساعة 14:00: اقرأ موجزات الرصد الصباحية لهذا الأسبوع، واكتب التقرير الإعلامي الأسبوعي بطريقة «تقرير المكتب التنفيذي»: الأسبوع في 3 أسطر، والذكر حسب المنصة، والمحاور والنبرة، و3 مواد يجب أن تراها القيادة، والتوصيات للأسبوع القادم."], ["19.D", "Event countdown", "العدّ التنازلي للفعالية", "Claude Scheduled / ChatGPT Tasks (Sundays 08:00)", "Every Sunday at 08:00 until the forum: read the forum's task list, and write me a short note: days left, tasks due this week with their owners, overdue tasks, and the 3 risks to watch. Draft only.", "كل يوم أحد الساعة 08:00 حتى موعد الملتقى: اقرأ قائمة مهام الملتقى، واكتب لي ملاحظة قصيرة: الأيام المتبقية، والمهام المستحقة هذا الأسبوع مع مسؤوليها، والمهام المتأخرة، و3 مخاطر يجب متابعتها. مسودة فقط."]], "rule": null, "no": "19", "id": "19"}, {"okey": null, "day": 2, "h": 45, "kind": "lab", "ic": "Claude", "tools": ["Claude", "ChatGPT"], "lead": null, "nm": {"ar": "أتمتة الأسبوع الإعلامي", "en": "Automating the media week"}, "out": {"ar": "فرز البريد الإعلامي، ورصد يومي وتقرير أسبوعي مجدولان، وبطاقة حوكمة", "en": "Media-mail triage, a scheduled daily monitor and weekly report, and a governance card"}, "steps": {"ar": ["فرز البريد الإعلامي إلى مسودات ومهام", "الرصد اليومي المجدول", "التقرير الأسبوعي المجدول", "بطاقة الحوكمة"], "en": ["Triage the media mail into drafts and tasks", "The scheduled daily monitor", "The scheduled weekly report", "The governance card"]}, "note": {"ar": "استخدم حسابات تجريبية وملفات افتراضية، وتأكد أن البريد متصل قبل التدريب. من يستخدم ChatGPT يضبط الجدولة في Tasks. يكمل هذا تدريب «الأسبوع الإعلامي» من اليوم الأول.", "en": "Use sandbox accounts and synthetic files, and make sure email is connected before the lab. ChatGPT users set the schedule in Tasks. This continues the Day 1 \"media week\" lab."}, "P": [["T4.A", "Media-mail triage", "فرز البريد الإعلامي", "ChatGPT / Claude (email connector)", "Read the last 20 messages in the office's media mailbox (sandbox account). Classify each: interview request, request for information, event invitation, complaint, or sensitive matter. For each request draft a reply; for sensitive matters draft nothing and flag them for my manager. Put everything in a table. Drafts only; send nothing.", "اقرأ آخر 20 رسالة في صندوق البريد الإعلامي للمكتب (حساب تجريبي). صنّف كل رسالة: طلب مقابلة، أو طلب معلومات، أو دعوة لفعالية، أو شكوى، أو أمر حساس. لكل طلب اكتب مسودة رد؛ وللأمور الحساسة لا تكتب شيئاً ونبّه مديري إليها. ضع كل شيء في جدول. مسودات فقط؛ لا ترسل شيئاً."], ["T4.B", "Scheduled daily monitor", "الرصد اليومي المجدول", "Claude Scheduled / ChatGPT Tasks (daily 07:30)", "Set a daily task at 07:30 for the media week's topic: search the news and public posts from the last 24 hours, summarise the 5 most important items in two lines each with link and date, note the tone, and add the results to the monitoring log.", "اضبط مهمة يومية الساعة 07:30 لموضوع الأسبوع الإعلامي: ابحث في الأخبار والمنشورات العامة خلال آخر 24 ساعة، ولخّص أهم 5 مواد في سطرين لكل منها مع الرابط والتاريخ، واذكر النبرة، وأضف النتائج إلى سجل الرصد."], ["T4.C", "Scheduled weekly report", "التقرير الأسبوعي المجدول", "Claude Scheduled / ChatGPT Tasks (Thursdays 14:00)", "Every Thursday at 14:00: read the monitoring log and last week's report, compare them, and write the weekly media report with the \"Executive Office report\" method: what's new, what changed in tone, the 3 items for leadership, and next week's recommendations.", "كل يوم خميس الساعة 14:00: اقرأ سجل الرصد وتقرير الأسبوع الماضي، وقارن بينهما، واكتب التقرير الإعلامي الأسبوعي بطريقة «تقرير المكتب التنفيذي»: ما الجديد، وما الذي تغيّر في النبرة، و3 مواد للقيادة، وتوصيات الأسبوع القادم."], ["T4.D", "Governance card", "بطاقة الحوكمة", "ChatGPT / Claude", "Write a one-page governance card for the agent or automation you built: name and purpose, the accountable owner, data sources and their permissions, approved tools, what it must never do (for example publish, reply to media, or store personal data), when a human must review, and how it is stopped.", "اكتب بطاقة حوكمة من صفحة واحدة للوكيل أو الأتمتة التي بنيتها: الاسم والغرض، والمالك المسؤول، ومصادر البيانات وصلاحياتها، والأدوات المعتمدة، وما لا يفعله أبداً (مثل النشر، أو الرد على الإعلام، أو حفظ بيانات شخصية)، ومتى يجب أن يراجعه إنسان، وكيف يُوقف."]], "rule": null, "no": "T4", "id": "T4"}], "LOGO": {"ChatGPT": "data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIGZpbGwtcnVsZT0iZXZlbm9kZCIgaGVpZ2h0PSIxZW0iIHN0eWxlPSJmbGV4Om5vbmU7bGluZS1oZWlnaHQ6MSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iMWVtIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuQUk8L3RpdGxlPjxwYXRoIGQ9Ik05LjIwNSA4LjY1OHYtMi4yNmMwLS4xOS4wNzItLjMzMy4yMzgtLjQyOGw0LjU0My0yLjYxNmMuNjE5LS4zNTcgMS4zNTYtLjUyMyAyLjExNy0uNTIzIDIuODU0IDAgNC42NjIgMi4yMTIgNC42NjIgNC41NjYgMCAuMTY3IDAgLjM1Ny0uMDI0LjU0N2wtNC43MS0yLjc1OWEuNzk3Ljc5NyAwIDAwLS44NTYgMGwtNS45NyAzLjQ3M3ptMTAuNjA5IDguOFYxMi4wNmMwLS4zMzMtLjE0My0uNTctLjQyOS0uNzM3bC01Ljk3LTMuNDczIDEuOTUtMS4xMThhLjQzMy40MzMgMCAwMS40NzYgMGw0LjU0MyAyLjYxN2MxLjMwOS43NiAyLjE4OSAyLjM3OCAyLjE4OSAzLjk0OCAwIDEuODA4LTEuMDcgMy40NzMtMi43NiA0LjE2M3pNNy44MDIgMTIuNzAzbC0xLjk1LTEuMTQyYy0uMTY3LS4wOTUtLjIzOS0uMjM4LS4yMzktLjQyOFY1Ljg5OWMwLTIuNTQ1IDEuOTUtNC40NzIgNC41OTEtNC40NzIgMSAwIDEuOTI3LjMzMyAyLjcxMi45MjhMOC4yMyA1LjA2N2MtLjI4NS4xNjYtLjQyOC40MDQtLjQyOC43Mzd2Ni44OTh6TTEyIDE1LjEyOGwtMi43OTUtMS41N3YtMy4zM0wxMiA4LjY1OGwyLjc5NSAxLjU3djMuMzNMMTIgMTUuMTI4em0xLjc5NiA3LjIzYy0xIDAtMS45MjctLjMzMi0yLjcxMi0uOTI3bDQuNjg2LTIuNzEyYy4yODUtLjE2Ni40MjgtLjQwNC40MjgtLjczN3YtNi44OThsMS45NzQgMS4xNDJjLjE2Ny4wOTUuMjM4LjIzOC4yMzguNDI4djUuMjMzYzAgMi41NDUtMS45NzQgNC40NzItNC42MTQgNC40NzJ6bS01LjYzNy01LjMwM2wtNC41NDQtMi42MTdjLTEuMzA4LS43NjEtMi4xODgtMi4zNzgtMi4xODgtMy45NDhBNC40ODIgNC40ODIgMCAwMTQuMjEgNi4zMjd2NS40MjNjMCAuMzMzLjE0My41NzEuNDI4LjczOGw1Ljk0NyAzLjQ0OS0xLjk1IDEuMTE4YS40MzIuNDMyIDAgMDEtLjQ3NiAwem0tLjI2MiAzLjljLTIuNjg4IDAtNC42NjItMi4wMjEtNC42NjItNC41MTkgMC0uMTkuMDI0LS4zOC4wNDctLjU3bDQuNjg2IDIuNzFjLjI4Ni4xNjcuNTcxLjE2Ny44NTYgMGw1Ljk3LTMuNDQ4djIuMjZjMCAuMTktLjA3LjMzMy0uMjM3LjQyOGwtNC41NDMgMi42MTZjLS42MTkuMzU3LTEuMzU2LjUyMy0yLjExNy41MjN6bTUuODk5IDIuODNhNS45NDcgNS45NDcgMCAwMDUuODI3LTQuNzU2QzIyLjI4NyAxOC4zMzkgMjQgMTUuODQgMjQgMTMuMjk2YzAtMS42NjUtLjcxMy0zLjI4Mi0xLjk5OC00LjQ0OC4xMTktLjUuMTktLjk5OS4xOS0xLjQ5OCAwLTMuNDAxLTIuNzU5LTUuOTQ3LTUuOTQ2LTUu const rows=[];[1,2].forEach(d=>{const a=S.filter(s=>s.day===d);for(let k=0;k<a.length;k+=4)rows.push(a.slice(k,k+4));});
const Y=[];let y=230,prevDay=1,panels=[];let pTop=16;
const chipLines=s=>{let w=0,n=1;s.tools.concat(s.rule?[s.rule.ar]:[]).forEach(x=>{const c=x.length*0.55+3.4;if(w&&w+c>19){n++;w=c+0.45;}else w+=c+0.45;});return n;};const ex=r=>Math.max(0,...r.map(s=>chipLines(s)-2))*30;
rows.forEach((r,i)=>{if(i>0){const e=ex(rows[i-1]);if(r[0].day!==prevDay){panels.push([pTop,y+150+e]);pTop=y+180+e;y+=400+e;}else y+=290+e;}Y.push(y);prevDay=r[0].day;});
const eL=ex(rows[rows.length-1]);panels.push([pTop,y+170+eL]);const VBH=y+190+eL;
const POS={};rows.forEach((r,i)=>r.forEach((s,k)=>POS[s.id]=[(i%2===0?R1:R2)[k],Y[i]]));
let d=`M1150 ${Y[0]}`;rows.forEach((r,i)=>{const last=i===rows.length-1;if(last){const lx=POS[r[r.length-1].id][0];d+=` L${i%2===0?lx-110:lx+110} ${Y[i]}`;}else{const ry=(Y[i+1]-Y[i])/2;d+=i%2===0?` L${LX} ${Y[i]} A135 ${ry} 0 0 0 ${LX} ${Y[i+1]}`:` L${RX} ${Y[i]} A135 ${ry} 0 0 1 ${RX} ${Y[i+1]}`;}});
const dayY={1:panels[0][0]+44,2:panels[1][0]+44};
function dotHTML(s){const lg=s.lead?logoOf(s.lead):(s.kind==="lab"?logoOf(s.ic):null);const l2=s.kind==="lab"&&s.tools[1]?logoOf(s.tools[1]):(lg==="Excel"&&s.tools[1]?logoOf(s.tools[1]):null);
 return `${l2&&l2!==lg?`<span class="l2"><img src="${LOGO[l2]}" alt=""></span>`:""}${lg?`<img class="lg" src="${LOGO[lg]}" alt="">`:ico(s.ic)}<span class="n">${s.no}</span>`;}
const TRN={"البرمجة":"Programming","الذكاء التقليدي":"Traditional AI","الذكاء التوليدي":"Generative AI","خط زمني":"Timeline"};const tr=x=>lang==="en"&&TRN[x]?TRN[x]:x;const chip=x=>{const l=logoOf(x);return `<span class="chip">${l?`<img src="${LOGO[l]}" alt="">`:""}${esc(tr(x))}</span>`;};
const chipsOf=s=>s.tools.map(chip).join("")+(s.rule?`<span class="chip rule">${esc(s.rule[lang])}</span>`:"");
function build(){const t=T[lang];root.lang=lang;root.dir=t.dir;
 $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede([nSt,nLab]);$("langBtn").textContent=t.lang;$("foot").textContent=t.foot;
 const tl=["ChatGPT","Claude","NotebookLM","WisprFlow","Perplexity","Gemini","Grok","Manus","ElevenLabs","Higgsfield"];
 $("story").innerHTML=`<div class="end"><span class="n">${S.find(s=>s.okey==="o1").no}</span><div><small>${t.storyA[0]}</small><b>${t.storyA[1]}</b></div></div><div class="mid"><div class="mini"></div><div class="lg">${tl.map(k=>`<img src="${LOGO[k]}" alt="">`).join("")}</div></div><div class="end fin"><span class="n">${nSt}</span><div><small>${t.storyB[0]}</small><b>${t.storyB[1]}</b></div></div>`;
 $("hereL").textContent=t.here;$("nextL").textContent=t.next;$("detBtn").textContent=t.det;$("kbd").textContent=t.kbd;
 $("prevBtn").textContent=lang==="ar"?"→":"←";$("nextBtn").textContent=lang==="ar"?"←":"→";
 // map
 const flipX=x=>lang==="ar"?x:VBW-x;
 let h=`<div style="position:relative;width:100%;aspect-ratio:${VBW}/${VBH}"><svg class="rope" viewBox="0 0 ${VBW} ${VBH}" aria-hidden="true" style="${lang==="en"?"transform:scaleX(-1)":""}"><defs><pattern id="pRope" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect class="r1" width="12" height="12"/><rect class="r2" width="4.5" height="12"/></pattern><pattern id="pDone" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect class="d1" width="12" height="12"/><rect class="d2" width="4.5" height="12"/></pattern></defs>
 ${panels.map(([a,b])=>`<rect class="panel" x="16" y="${a}" width="1168" height="${b-a}" rx="30"/>`).join("")}
 <path id="ropePath" class="rope-base" d="${d}"/><path id="ropeDone" class="rope-done" d="${d}"/><circle class="mk" cx="1150" cy="${Y[0]}" r="21"/><polygon class="mk-tri" points="1157,${Y[0]-10} 1157,${Y[0]+10} 1141,${Y[0]}"/></svg>`;
 [1,2].forEach(dn=>{h+=`<div class="dayl" style="top:${dayY[dn]/VBH*100}%"><b>${t.days[dn][0]}</b><span>${t.days[dn][1]}</span></div>`;});
 S.forEach((s,i)=>{const [x,yy]=POS[s.id],lab=s.kind==="lab";
  h+=`<div class="st ${lab?"labst":""}" data-i="${i+1}" style="left:${flipX(x)/VBW*100}%;top:${yy/VBH*100}%"><div class="lbl"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span></div><button class="dot ${lab?"lab":""}" type="button" aria-label="${esc(s.nm[lang])}">${dotHTML(s)}</button>${(s.tools.length||s.rule)?`<div class="chips">${chipsOf(s)}</div>`:""}</div>`;});
 $("map").innerHTML=h+`</div>`;
 // list
 let l="";[1,2].forEach(dn=>{l+=`<div class="lday"><b>${t.days[dn][0]}</b><span>${t.days[dn][1]}</span></div><div class="lgroup">`;
  S.forEach((s,i)=>{if(s.day!==dn)return;const lab=s.kind==="lab";l+=`<button type="button" class="li ${lab?"labli":""}" data-i="${i+1}"><span class="dot ${lab?"lab":""}">${dotHTML(s)}</span><span class="tx"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span>${(s.tools.length||s.rule)?`<span class="cl">${chipsOf(s)}</span>`:""}</span></button>`;});l+=`</div>`;});
 $("list").innerHTML=l;
 // sections
 $("focusSec").innerHTML=`<h2>${t.focusH}</h2><p class="sub">${t.focusS}</p><div class="focus">${["ChatGPT","Claude"].map(k=>`<div class="fc"><div class="h"><img src="${LOGO[k]}" alt=""><div><span class="k">${t.focus[k][0]}</span><b>${k}</b></div></div><span>${t.focus[k][1]}</span></div>`).join("")}</div><div class="also"><small>${t.also}</small>${["NotebookLM","Wispr Flow","Perplexity","Gemini","Grok","Manus","ElevenLabs","Higgsfield"].map(chip).join("")}</div>`;
 $("labsSec").innerHTML=`<h2>${t.labsH}</h2><p class="sub">${t.labsS}</p><div class="labs">${LABS.map((s,i)=>`<button type="button" class="labcard" data-l="${i+1}"><span class="dot lab">${dotHTML(s)}</span><span><small>${t.lab} ${s.no} · ${t.days[s.day][0]} · ${s.h} ${t.min}</small><b>${esc(s.nm[lang])}</b><span>${esc(s.out[lang])}</span></span></button>`).join("")}</div>`;
 $("outsSec").innerHTML=`<h2>${t.outsH}</h2><div class="outs">${S.filter(s=>s.okey).map(s=>`<div class="out"><small>${t.st} ${s.no}</small><b>${t.outs[s.okey]}</b></div>`).join("")}</div>`;
 L=[];render(false);if(open)fillDr(open);}
/* rope progress */
let total=0,L=[];
function measure(){if(L.length)return;const rp=$("ropePath");if(!rp)return;try{total=rp.getTotalLength();if(!total)return;const pts=[];for(let s=0;s<=total;s+=4){const p=rp.getPointAtLength(s);pts.push([s,p.x,p.y]);}
 L=S.map(s=>{const q=POS[s.id];let best=0,bd=Infinity;pts.forEach(p=>{const dd=(p[1]-q[0])**2+(p[2]-q[1])**2;if(dd<bd){bd=dd;best=p[0];}});return best;});}catch(e){L=[];}}
let cur=0,open=0,lastFocus=null;const mq=matchMedia("(min-width:1000px)"),reduce=matchMedia("(prefers-reduced-motion: reduce)");
const lblOf=s=>`${s.kind==="lab"?`<span class="lt">${T[lang].lab} ${s.no}</span>`:`${s.no} · `}${esc(s.nm[lang])}`;
function render(scroll){const t=T[lang];
 document.querySelectorAll("[data-i]").forEach(el=>{const i=+el.dataset.i;if(el.classList.contains("labcard"))return;el.classList.toggle("done",cur>0&&i<cur);el.classList.toggle("cur",i===cur);el.classList.toggle("dim",cur>0&&i>cur);});
 $("hereNow").innerHTML=cur?lblOf(S[cur-1]):t.overview;$("hereNext").innerHTML=cur<N?lblOf(S[cur]):t.end;
 $("prevBtn").disabled=cur===0;$("nextBtn").disabled=cur===N;$("detBtn").hidden=cur===0;$("progBar").style.width=(cur/N*100)+"%";
 measure();const rd=$("ropeDone");if(L.length&&rd){rd.style.strokeDasharray=cur?(L[cur-1]+" "+total):("0 "+total);rd.style.visibility=cur?"visible":"hidden";}
 if(scroll&&cur){const el=document.querySelector(mq.matches?`.st[data-i="${cur}"] .dot`:`.li[data-i="${cur}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-40)el.scrollIntoView({block:"center",behavior:reduce.matches?"auto":"smooth"});}}}
const setCur=(n,sc)=>{cur=Math.max(0,Math.min(N,n));render(sc);};
function fillDr(n){const t=T[lang],A=drLab?LABS:S,s=A[n-1],lab=s.kind==="lab";
 $("dp").innerHTML=`<div class="dh"><div class="dot ${lab?"lab":""}">${dotHTML(s)}</div><div class="tt"><small>${t.days[s.day][0]} · ${lab?`${t.labOf} ${s.no}`:`${t.st} ${s.no} ${t.of} ${nSt}`} · ${s.h} ${t.min}</small><h2>${esc(s.nm[lang])}</h2></div><button class="x" id="drClose" type="button" aria-label="×">×</button></div>
 <div class="dout ${lab?"lab":""}"><small>${lab?t.labOut:t.out}</small><p>${esc(s.out[lang])}</p></div>
 <h3>${lab?t.labWhat:t.what}</h3><ol>${s.steps[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
 ${s.tools.length?`<div><h3 style="margin-bottom:8px">${t.tools}</h3><div class="tchips">${s.tools.map(chip).join("")}</div></div>`:""}
 ${s.P.length?`<div><h3 style="margin-bottom:8px">${t.cmds} (${s.P.length})</h3>${s.P.map((p,i)=>`<details class="pr"><summary><b><bdi>${p[0]}</bdi></b> ${esc(lang==="ar"?p[2]:p[1])}</summary><div class="pmeta">${t.runIn}: ${esc(p[3])}</div><div class="ptext" dir="${t.dir}">${esc(lang==="ar"?p[5]:p[4])}</div><button class="cp" type="button" data-p="${i}">${t.copy}</button></details>`).join("")}</div>`:""}
 ${MODE==="trainer"?`<div class="tnote"><small>${t.tnote}</small>${esc(s.note[lang])}</div>`:""}
 ${s.rule?`<p class="drule">${esc(s.rule[lang])}</p>`:""}
 <div class="dfoot"><button type="button" id="drPrev" ${n===1?"disabled":""}>${lang==="ar"?"→":"←"} ${t.prev}</button><button type="button" id="drNext" class="pri" ${n===A.length?"disabled":""}>${t.nxt} ${lang==="ar"?"←":"→"}</button></div>`;
 $("drClose").onclick=closeDr;$("drPrev").onclick=()=>step(-1);$("drNext").onclick=()=>step(1);
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.p],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copied;setTimeout(()=>b.textContent=t.copy,1500);});}
function openDr(n){if(!open)lastFocus=document.activeElement;drLab=false;open=n;fillDr(n);$("dr").hidden=false;$("drClose").focus();}
function openLab(n){if(n<1||n>LABS.length)return;if(!open)lastFocus=document.activeElement;drLab=true;open=n;fillDr(n);$("dr").hidden=false;$("drClose").focus();}
const step=d=>drLab?openLab(open+d):go(open+d);
function go(n){if(n<1||n>N)return;open=n;setCur(n,true);fillDr(n);$("drClose").focus();}
function closeDr(){$("dr").hidden=true;open=0;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.addEventListener("click",e=>{const lc=e.target.closest(".labcard");if(lc){openLab(+lc.dataset.l);return;}const t=e.target.closest(".st .dot, .li");if(!t)return;const host=t.closest("[data-i]");const n=+host.dataset.i;setCur(n,false);openDr(n);});
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});
$("prevBtn").onclick=()=>setCur(cur-1,true);$("nextBtn").onclick=()=>setCur(cur+1,true);$("detBtn").onclick=()=>{if(cur)openDr(cur);};
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const fwd=lang==="ar"?"ArrowLeft":"ArrowRight",back=lang==="ar"?"ArrowRight":"ArrowLeft";
 if(open){if(e.key==="Escape"){closeDr();e.preventDefault();}else if(e.key===fwd){step(1);e.preventDefault();}else if(e.key===back){step(-1);e.preventDefault();}return;}
 if(e.key===fwd){setCur(cur+1,true);e.preventDefault();}else if(e.key===back){setCur(cur-1,true);e.preventDefault();}});
const onMq=()=>{L=[];render(false);};if(mq.addEventListener)mq.addEventListener("change",onMq);
$("themeBtn").onclick=()=>{const t=root.getAttribute("data-theme");const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.setAttribute("data-theme",dark?"light":"dark");};
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";build();};
build();
})();
</script></body></html>
