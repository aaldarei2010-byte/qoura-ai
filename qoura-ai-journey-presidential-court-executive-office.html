<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الذكاء الاصطناعي · المكتب التنفيذي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F1E8;--panel:#EEE5D6;--card:#FFFFFF;--ink:#16211F;--muted:#5E6D69;--line:#E2D7C6;
  --g:#163832;--g-ink:#F6F1E8;--g-sub:#E2B48A;--g-line:rgba(246,241,232,.35);--g-track:rgba(246,241,232,.16);
  --c:#A0683A;--c-ink:#FFFFFF;--brand:#163832;--labbg:#F9EBDD;
  --rope:#C9A27A;--rope2:#A47A50;--done:#3A7A5C;--done2:#22543E;--ok:#2F7A4E;
  --glow:rgba(160,104,58,.22);--shadow:rgba(22,33,31,.10);--scrim:rgba(10,18,16,.5);
  --f-display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A18;--panel:#13211E;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;
  --g:#1C463D;--g-ink:#F2EBDD;--g-sub:#E2B48A;--g-line:rgba(242,235,221,.30);--g-track:rgba(242,235,221,.14);
  --c:#D39A68;--c-ink:#1A120B;--brand:#E2B48A;--labbg:#2A2219;
  --rope:#8C6B4A;--rope2:#5F4731;--done:#2F5D4E;--done2:#183A32;--ok:#5DBB86;
  --glow:rgba(211,154,104,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18;--panel:#13211E;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;
  --g:#1C463D;--g-ink:#F2EBDD;--g-sub:#E2B48A;--g-line:rgba(242,235,221,.30);--g-track:rgba(242,235,221,.14);
  --c:#D39A68;--c-ink:#1A120B;--brand:#E2B48A;--labbg:#2A2219;
  --rope:#8C6B4A;--rope2:#5F4731;--done:#2F5D4E;--done2:#183A32;--ok:#5DBB86;
  --glow:rgba(211,154,104,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 12px;display:grid;place-items:center}
.mark img{height:52px;display:block}
.ht{flex:1;min-width:220px}
.eyebrow{margin:0;color:var(--c);font-weight:600;font-size:.9rem}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.2vw,2.9rem);line-height:1.15;text-wrap:balance}
html[lang=en] h1{font-family:"IBM Plex Sans",sans-serif}
.lede{margin:4px 0 0;color:var(--muted);font-size:1rem}
.tbtn{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-weight:700}
.tbtn svg{width:20px;height:20px}
/* story */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,1.1fr) minmax(0,1fr);align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.end{display:flex;align-items:center;gap:12px;min-width:0}
.end .n{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--c-ink);font-weight:700}
.end.fin .n{background:var(--ok)}
.end small{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.end b{display:block;font-size:1.05rem;line-height:1.35;text-wrap:balance}
.mid{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mini{height:12px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--rope) 0 7px,var(--rope2) 7px 11px)}
.mid .lg{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.mid .lg img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;border:1px solid var(--line)}
@media (max-width:640px){.story{grid-template-columns:1fr;gap:8px}}
/* presenter bar */
.here{position:relative;overflow:hidden;background:var(--g);color:var(--g-ink);border-radius:18px;padding:12px 16px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hcol{flex:1 1 220px;min-width:0}
.hcol small{display:block;color:var(--g-sub);font-size:.78rem;font-weight:600}
.hcol b{display:block;font-size:1.05rem;line-height:1.35}
.hcol .lt{display:inline-block;background:var(--c);color:var(--c-ink);border-radius:6px;padding:0 6px;font-size:.78rem;margin-inline-end:6px;vertical-align:2px}
.hsep{width:1px;align-self:stretch;background:var(--g-line)}
.hbtns{display:flex;gap:8px;align-items:center}
.hb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;display:grid;place-items:center;font-size:1.15rem}
.hd{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;font-weight:600}
.hb:hover:not([disabled]),.hd:hover{background:var(--c);border-color:var(--c);color:var(--c-ink)}
.hb[disabled]{opacity:.35;cursor:not-allowed}
.kbd{flex-basis:100%;margin:0;font-size:.75rem;color:var(--g-sub)}
.prog{position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--g-track)}
.prog i{display:block;height:100%;width:0;background:var(--g-sub);transition:width .5s ease}
@media (max-width:640px){.hsep{display:none}}
@media (hover:none),(max-width:999px){.kbd{display:none}}
/* map */
.map{position:relative;width:100%;container-type:inline-size}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.r1{fill:var(--rope)}.r2{fill:var(--rope2)}.d1{fill:var(--done)}.d2{fill:var(--done2)}
.rope-base{fill:none;stroke:url(#pRope);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.rope-done{fill:none;stroke:url(#pDone);stroke-width:22;stroke-linecap:butt;stroke-linejoin:round;visibility:hidden;transition:stroke-dasharray .7s ease}
.mk{fill:var(--c)}.mk-tri{fill:var(--c-ink)}
.dayl{position:absolute;inset-inline-start:3%;display:flex;align-items:center;gap:1cqw;transform:translateY(-50%)}
.dayl b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:.35cqw 1.4cqw;font-size:1.35cqw;font-weight:700}
.dayl span{color:var(--c);font-weight:700;font-size:1.4cqw}
.st{position:absolute;width:0;height:0}
.st .lbl{position:absolute;left:0;bottom:3.8cqw;transform:translateX(-50%);width:19cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.25cqw;pointer-events:none}
.st .lbl b{font-size:1.45cqw;line-height:1.25;font-weight:700;text-wrap:balance}
.st .lbl .o{font-size:1.05cqw;line-height:1.35;color:var(--muted);text-wrap:balance}
.tag{display:none;background:var(--c);color:var(--c-ink);font-weight:700;border-radius:999px}
.st .tag{font-size:1cqw;padding:.15cqw .9cqw}
.st.cur .tag.here-t{display:inline-block}
.ltag{display:inline-block;background:var(--labbg);color:var(--c);border:1px dashed var(--c);font-weight:700;border-radius:999px;white-space:nowrap}
.st .ltag{font-size:.95cqw;padding:.1cqw .8cqw}
.st.cur .ltag{display:none}
.dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:5.8cqw;height:5.8cqw;border-radius:50%;background:var(--card);border:.28cqw solid var(--rope);display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 .3cqw .9cqw var(--shadow);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.dot svg{width:2.6cqw;height:2.6cqw;color:var(--ink)}
.dot img.lg{width:3.1cqw;height:3.1cqw;object-fit:contain}
.dot.lab{border-radius:30%;border-style:dashed;border-color:var(--c);background:var(--labbg);width:6.4cqw;height:6.4cqw}
.dot .n{position:absolute;top:-.5cqw;inset-inline-end:-.5cqw;min-width:2.1cqw;height:2.1cqw;padding:0 .3cqw;border-radius:999px;background:var(--c);color:var(--c-ink);font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.dot .l2{position:absolute;bottom:-.4cqw;inset-inline-start:-.4cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}
.dot .l2 img{width:1.5cqw;height:1.5cqw;object-fit:contain}
.st .dot:hover{transform:translate(-50%,-50%) scale(1.07)}
.st.cur .dot{border-color:var(--c);border-style:solid;box-shadow:0 0 0 1cqw var(--glow)}
.st.done .dot{border-color:var(--ok)}
.st.done .dot .n{background:var(--ok)}
.st.dim .lbl b{color:var(--muted)}
.st.dim .dot{opacity:.75}
.st.labst .lbl b{color:var(--c)}
.chips{position:absolute;left:0;top:3.9cqw;transform:translateX(-50%);width:19.5cqw;display:flex;flex-wrap:wrap;justify-content:center;gap:.45cqw;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--card);border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap;line-height:1.3}
.chip img{width:1.3em;height:1.3em;object-fit:contain}
.chips .chip{padding:.25cqw .8cqw;font-size:.95cqw}
.chip.rule{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.st.cur .chip{border-color:var(--c)}
/* list (phones) */
.list{display:none}
@media (max-width:999px){.map{display:none}.list{display:block}}
.lday{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.lday:first-child{margin-top:0}
.lday b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:3px 14px;font-size:.92rem}
.lday span{color:var(--c);font-weight:700;font-size:.95rem}
.lgroup{display:flex;flex-direction:column}
.li{position:relative;display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;padding:6px 0 18px;cursor:pointer}
.li::before{content:"";position:absolute;inset-inline-start:24px;top:0;bottom:0;width:9px;border-radius:5px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,var(--rope2) 6px 10px)}
.lgroup .li:first-child::before{top:30px}
.lgroup .li:last-child::before{bottom:auto;height:34px}
.li.done::before{background:repeating-linear-gradient(45deg,var(--done) 0 6px,var(--done2) 6px 10px)}
.li .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;z-index:1}
.li .dot svg{width:26px;height:26px}.li .dot img.lg{width:30px;height:30px}
.li .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.li .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.li .dot .l2 img{width:14px;height:14px}
.li.cur .dot{border-color:var(--c);box-shadow:0 0 0 6px var(--glow)}
.li.done .dot{border-color:var(--ok)}
.li.done .dot .n{background:var(--ok)}
.li .tx{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:4px}
.li .tx b{font-size:1.05rem;line-height:1.35}
.li.labli .tx b{color:var(--c)}
.li .tx .o{color:var(--muted);font-size:.88rem;line-height:1.45}
.li .tag{font-size:.72rem;padding:1px 10px}
.li.cur .tag.here-t{display:inline-block}
.li .ltag{font-size:.72rem;padding:0 9px}
.li .cl{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.li .cl .chip{font-size:.74rem;padding:1px 9px}
/* sections */
.sec h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:0 0 10px;text-wrap:balance}
html[lang=en] .sec h2{font-family:"IBM Plex Sans",sans-serif}
.sec .sub{margin:-4px 0 12px;color:var(--muted)}
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.fc .h{display:flex;align-items:center;gap:10px}.fc img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)}
.fc b{font-size:1.1rem}.fc span{color:var(--muted);font-size:.92rem}
.fc .k{display:block;color:var(--c);font-weight:700;font-size:.8rem}.fc b{display:block}
.also{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.also small{color:var(--muted);font-weight:600}
.also .chip{padding:3px 10px;font-size:.85rem}
.labs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.labcard{text-align:start;background:var(--labbg);border:1.5px dashed var(--c);border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.labcard .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 52px;width:52px;height:52px;border-width:2px}
.labcard .dot img.lg{width:28px;height:28px}.labcard .dot .n{top:-7px;inset-inline-end:-8px;min-width:24px;height:20px;font-size:.7rem}
.labcard .dot .l2{width:20px;height:20px;bottom:-5px;inset-inline-start:-5px}.labcard .dot .l2 img{width:13px;height:13px}
.labcard small{color:var(--c);font-weight:700;font-size:.78rem}.labcard b{display:block;line-height:1.35}.labcard span{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.outs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.out small{color:var(--c);font-weight:700;font-size:.78rem}
.out b{font-size:1rem;line-height:1.4}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{flex:1 1 100px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.15;color:var(--brand)}
.fact span{color:var(--muted);font-size:.85rem}
@media (max-width:899px){.focus,.labs{grid-template-columns:1fr}.outs{grid-template-columns:1fr}.out{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px}.out small{order:2;white-space:nowrap}}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
/* drawer */
.dr{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);color:var(--ink);width:min(480px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;width:100%;border-radius:20px 20px 0 0}}
.dh{display:flex;align-items:center;gap:12px}
.dh .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;cursor:default;border-color:var(--c)}
.dh .dot svg{width:26px;height:26px}.dh .dot img.lg{width:30px;height:30px}
.dh .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.dh .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.dh .dot .l2 img{width:14px;height:14px}
.dh .tt{min-width:0}
.dh small{color:var(--muted);font-weight:600;font-size:.82rem}
.dh h2{margin:2px 0 0;font-size:1.25rem;line-height:1.3;text-wrap:balance}
.x{margin-inline-start:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1.3rem;line-height:1}
.dout{background:var(--panel);border-radius:12px;padding:12px 14px}
.dout.lab{background:var(--labbg);border:1px dashed var(--c)}
.dout small{display:block;color:var(--c);font-weight:700;font-size:.8rem}
.dout p{margin:2px 0 0;font-weight:600}
.dp h3{margin:0;font-size:.95rem}
.dp ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips .chip{font-size:.85rem;padding:3px 12px}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.pr+details.pr{margin-top:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:var(--g-ink);font-weight:600;cursor:pointer;font-size:.8rem}
.tnote{background:var(--panel);border-radius:12px;padding:10px 14px;font-size:.9rem}.tnote small{display:block;color:var(--muted);font-weight:700}
.drule{margin:0;background:var(--g);color:var(--g-ink);border-radius:12px;padding:10px 14px;font-weight:700}
.dfoot{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.dfoot button{flex:1;border-radius:12px;padding:11px 12px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--card)}
.dfoot button.pri{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.dfoot button[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.here,.tbtn,.dr{display:none!important}.map{display:block!important}.list{display:none!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

<script>
const DATA={"ST": [{"okey": "o1", "day": 1, "h": 20, "kind": "st", "ic": "bulb", "tools": ["البرمجة", "الذكاء التقليدي", "الذكاء التوليدي"], "lead": null, "nm": {"ar": "ثلاثة مفاهيم: ما الفرق بينها؟", "en": "Three concepts: what is the difference?"}, "out": {"ar": "فهم مشترك للفرق بين البرمجة والذكاء التقليدي والتوليدي، وقائمة بمهامك الخمس", "en": "The three types in plain terms, and your list of 5 tasks"}, "steps": {"ar": ["ما كل واحد منها بلغة بسيطة", "مثال لكل نوع من عمل الاتصال الاستراتيجي والمراسم", "كيف يعمل النموذج اللغوي ببساطة، وما يجيده وما لا يجيده", "يكتب المتدرب خمس مهام من عمله ترافقه طوال اليومين"], "en": ["What each one is, in plain terms", "An example of each from strategic communication and protocol work", "How a language model works, simply, and what it is and isn't good at", "Each participant writes 5 tasks from their work that run through both days"]}, "note": {"ar": "مثال واحد بثلاث طرق (فلتر بريد، وتنبؤ بعدد الحضور، وكتابة خبر) يوضح الفرق في دقيقتين، ثم يكتب كل مشارك مهامه الخمس؛ فهي خيط الرحلة كلها.", "en": "One example done three ways (an email filter, forecasting attendance, writing a news item) shows the difference in two minutes; then each participant writes their 5 tasks, which run through the whole journey."}, "P": [["1.A", "Programming, traditional AI or generative AI?", "برمجة أم ذكاء تقليدي أم توليدي؟", "ChatGPT / Claude", "Explain the difference between programming, traditional AI and generative AI in plain language for an employee in a government executive office who works in strategic communication and protocol, with one example of each from their work (media, events, official correspondence). End with one sentence on what generative AI is not good at.", "اشرح الفرق بين البرمجة والذكاء الاصطناعي التقليدي والذكاء الاصطناعي التوليدي بلغة بسيطة لموظف في مكتب تنفيذي حكومي يعمل في الاتصال الاستراتيجي والمراسم، مع مثال واحد لكل نوع من عمله (الإعلام، والفعاليات، والمراسلات الرسمية). واختم بجملة واحدة عمّا لا يجيده الذكاء الاصطناعي التوليدي."], ["1.B", "My 5 tasks", "مهامي الخمس", "ChatGPT / Claude", "Ask me 6 short questions about my role and my week, then list the 5 tasks I repeat most that AI could speed up. For each task: the time it takes each week, what AI could do in it, and what must stay with me (approval, sensitive information, final wording).", "اسألني 6 أسئلة قصيرة عن دوري وأسبوعي، ثم اذكر أكثر 5 مهام أكررها ويمكن للذكاء الاصطناعي تسريعها. لكل مهمة: الوقت الذي تستغرقه أسبوعياً، وما يمكن أن يفعله الذكاء الاصطناعي فيها، وما يجب أن يبقى عندي (الاعتماد، والمعلومات الحساسة، والصياغة النهائية)."]], "rule": null, "no": "1", "id": "1"}, {"okey": null, "day": 1, "h": 15, "kind": "st", "ic": "flag", "tools": ["خط زمني"], "lead": null, "nm": {"ar": "خريطة تاريخ الذكاء الاصطناعي", "en": "A map of AI history"}, "out": {"ar": "خط زمني للذكاء الاصطناعي في خمس محطات", "en": "An AI timeline in five milestones"}, "steps": {"ar": ["خمس محطات من 1956 حتى اليوم", "ما أتاحته كل موجة", "ما الذي غيّرته كل موجة في عمل الإعلام والاتصال"], "en": ["Five milestones from 1956 to today", "What each wave made possible", "What each wave changed in media and communication work"]}, "note": {"ar": "اعرض الخط الزمني سريعاً، وتوقف عند الموجة الأخيرة: النماذج اللغوية الكبيرة هي ما سنعمل به طوال اليومين.", "en": "Show the timeline quickly and pause on the last wave: large language models are what we work with for both days."}, "P": [["2.A", "AI history in five milestones", "تاريخ الذكاء الاصطناعي في خمس محطات", "ChatGPT / Claude", "Build a five-milestone timeline of AI from its beginnings in 1956 to today's large language models: year, milestone, what it made possible, and one example of what it changed or could change for research and statistics work. Keep each row to one line and say which dates are approximate.", "ابنِ خطاً زمنياً من خمس محطات لتاريخ الذكاء الاصطناعي منذ بدايته عام 1956 حتى النماذج اللغوية الكبيرة اليوم: السنة، والمحطة، وما أتاحته، ومثال واحد على ما غيّرته أو يمكن أن تغيّره في العمل البحثي والإحصائي. اجعل كل صف في سطر واحد، ووضّح أي التواريخ تقريبية."], ["2.B", "What changed for the communications officer", "ماذا تغيّر في عمل الاتصال", "ChatGPT / Claude", "Compare how a communications officer prepared a media report on a government event in 2015, and how they can prepare it today with generative AI, in a table of 5 stages (monitoring, reading, analysis, writing, review). For each stage: the time it took then, the time now, and what stays the human's job.", "قارن كيف كان موظف الاتصال يجهّز تقريراً إعلامياً عن فعالية حكومية عام 2015، وكيف يمكن أن يجهّزه اليوم بالذكاء الاصطناعي التوليدي، في جدول من 5 مراحل (الرصد، والقراءة، والتحليل، والكتابة، والمراجعة). لكل مرحلة: الوقت الذي كانت تستغرقه، والوقت اليوم، وما يبقى مسؤولية الإنسان."]], "rule": null, "no": "2", "id": "2"}, {"okey": null, "day": 1, "h": 30, "kind": "st", "ic": "shield", "tools": ["ChatGPT", "Claude"], "lead": null, "nm": {"ar": "احمِ بيانات جهتك", "en": "Protect your entity's data"}, "out": {"ar": "ما تجوز مشاركته وما لا تجوز، وكيف تنظّف ملفاً قبل رفعه، وكيف تكشف المعلومة المختلقة", "en": "What may and may not be shared, how to clean a file before uploading it, and how to catch invented information"}, "steps": {"ar": ["تصنيف البيانات قبل استخدام أي أداة: عام، وداخلي، وسري، وسري للغاية", "ما لا يُرفع أبداً: جداول كبار الشخصيات وتنقلاتهم، والترتيبات الأمنية، وبيانات المدعوين الشخصية، والمراسلات السرية", "تنظيف الملف قبل رفعه: استبدال الأسماء والمواقع والأرقام بعلامات", "الحسابات المؤسسية مقابل الشخصية، وإيقاف حفظ المحادثات للتدريب", "المعلومات والمصادر المختلقة: لماذا تحدث، وكيف تكشفها", "قائمة تحقق قبل أي استخدام رسمي، والقرار النهائي دائماً للإنسان"], "en": ["Classify data before using any tool: public, internal, confidential, top secret", "What is never uploaded: VIP schedules and movements, security arrangements, guests' personal data, confidential correspondence", "Clean a file before uploading it: replace names, places and numbers with placeholders", "Enterprise vs personal accounts, and turning off training on your chats", "Invented information and sources: why it happens and how to catch it", "A checklist before any official use; the final decision is always human"]}, "note": {"ar": "هذا أول احتياج عبّر عنه المكتب التنفيذي، فخذ وقته كاملاً. اعرض قائمة مدعوين افتراضية، ونظّفها مباشرة بالأمر 3.A، ثم اعرض الهلوسة: اطلب تصريحاً منسوباً لشخصية عامة في مناسبة لم تحدث، وشاهد الأداة تختلقه. اتبع سياسة الجهة المعتمدة في تصنيف البيانات إن وُجدت.", "en": "This is the Executive Office's first stated need, so give it full time. Show a synthetic guest list and clean it live with prompt 3.A, then show hallucination: ask for a statement attributed to a public figure at an event that never happened, and watch the tool invent it. Follow the entity's approved data-classification policy if there is one."}, "P": [["3.A", "Make a file safe to share", "اجعل الملف آمناً للمشاركة", "ChatGPT / Claude", "Turn this text into a version that is safe to share with an AI tool: replace every person's name, title, entity, place, phone number, email, date and time with placeholders such as [person 1], [entity], [place], [date]. Keep the meaning and the structure. Then give me a table of what you replaced, so I can put the real values back myself afterwards.", "حوّل هذا النص إلى نسخة آمنة للمشاركة مع أداة ذكاء اصطناعي: استبدل كل اسم شخص، ومنصب، وجهة، ومكان، ورقم هاتف، وبريد، وتاريخ، ووقت بعلامات مثل [شخص 1] و[جهة] و[مكان] و[تاريخ]. حافظ على المعنى والهيكل. ثم أعطني جدولاً بما استبدلته، لأعيد القيم الحقيقية بنفسي لاحقاً."], ["3.B", "Classify before you upload", "صنّف قبل أن ترفع", "ChatGPT / Claude", "Here are 10 types of information from an executive office (synthetic list): a public news release, the draft programme of a forum, a VIP's movement schedule, the guest list with phone numbers, a speech draft before approval, a published annual report, internal meeting minutes, a seating plan for an official dinner, a media monitoring report, the security arrangements of an event. Classify each as: may be used with an AI tool / only after cleaning / never. Give a one-line reason for each.", "هذه 10 أنواع من المعلومات في مكتب تنفيذي (قائمة افتراضية): خبر صحفي منشور، ومسودة برنامج ملتقى، وجدول تنقلات شخصية رفيعة، وقائمة المدعوين بأرقام هواتفهم، ومسودة كلمة قبل اعتمادها، وتقرير سنوي منشور، ومحضر اجتماع داخلي، ومخطط جلوس عشاء رسمي، وتقرير رصد إعلامي، والترتيبات الأمنية لفعالية. صنّف كل نوع: يجوز استخدامه مع أداة ذكاء اصطناعي / بعد التنظيف فقط / لا يجوز أبداً. مع سبب من سطر واحد لكل نوع."], ["3.C", "Invented-statement demo", "عرض التصريح المختلق", "ChatGPT / Claude (without web search)", "Write the full text of the speech given by [a well-known public figure] at the opening of the \"Government Innovation Forum 2026\" in Abu Dhabi, with three quotes from it. (The forum is fictional; notice how the tool may invent a speech and quotes. Then ask it: are these quotes real, and where can I check them?)", "اكتب النص الكامل للكلمة التي ألقاها [شخصية عامة معروفة] في افتتاح «ملتقى الابتكار الحكومي 2026» في أبوظبي، مع ثلاثة اقتباسات منها. (الملتقى افتراضي؛ لاحظ كيف قد تختلق الأداة كلمة واقتباسات. ثم اسألها: هل هذه الاقتباسات حقيقية، وأين أتحقق منها؟)"], ["3.D", "Checklist before official use", "قائمة التحقق قبل الاستخدام الرسمي", "ChatGPT / Claude", "Write an 8-point checklist an executive-office employee reviews before using any AI output in a report, an article, an official letter or a social-media post: accuracy, sources, confidentiality, names and titles written correctly, protocol order, language and tone, approval, and keeping a copy of the original. Make each point a yes/no question.", "اكتب قائمة تحقق من 8 بنود يراجعها موظف المكتب التنفيذي قبل استخدام أي مخرج من الذكاء الاصطناعي في تقرير أو مقال أو خطاب رسمي أو منشور على منصات التواصل: الدقة، والمصادر، والسرية، وصحة الأسماء والألقاب، وترتيب البروتوكول، واللغة والنبرة، والاعتماد، والاحتفاظ بنسخة من الأصل. اجعل كل بند سؤالاً يُجاب بنعم أو لا."]], "rule": {"ar": "الأداة تقترح، والإنسان يقرر", "en": "The tool proposes, the human decides"}, "no": "3", "id": "3"}, {"okey": "o2", "day": 1, "h": 40, "kind": "st", "ic": "pen", "tools": ["ChatGPT", "Claude", "Wispr Flow"], "lead": null, "nm": {"ar": "هندسة الأوامر", "en": "Prompt engineering"}, "out": {"ar": "اكتب أمراً يعطيك النتيجة من المحاولة الأولى", "en": "Write a prompt that gets the result on the first try"}, "steps": {"ar": ["العناصر الخمسة لأي أمر ناجح", "تحويل أمر ضعيف إلى أمر قوي: خبر عن فعالية", "المراجعة الذاتية والتكرار", "قالب جاهز لمهام عمل المتدرب", "اسأل قبل أن تجيب: دع النموذج يسألك أولاً", "قل أمرك بصوتك عبر Wispr Flow، ثم رتّبه"], "en": ["The five parts of any good prompt", "Turn a weak prompt into a strong one: a news item about an event", "Self-review and iteration", "A ready template for the participant's own tasks", "Ask before you answer: let the model ask you first", "Say your prompt aloud with Wispr Flow, then structure it"]}, "note": {"ar": "اعرض الأمر الضعيف ثم القوي على الخبر نفسه، ودع الفرق يتكلم.", "en": "Show the weak prompt, then the strong one, on the same news item, and let the difference speak."}, "P": [["4.A", "Weak vs strong prompt", "الأمر الضعيف مقابل القوي", "ChatGPT / Claude", "Weak: \"Write a news item about the forum.\"\nStrong: You are a senior media officer in a government executive office in the UAE. Context: the \"Government Innovation Forum 2026\" (fictional) opened today with 600 participants, 12 sessions and the launch of 3 initiatives. Task: write an Arabic news item for the official website. Format: a headline under 12 words, an opening paragraph that answers who, what, when and where, two body paragraphs, and an English version of the headline. Constraints: formal tone, no invented quotes, and mark any number I must confirm with [confirm].", "ضعيف: «اكتب خبراً عن الملتقى».\nقوي: أنت مسؤول إعلامي أول في مكتب تنفيذي حكومي في الإمارات. السياق: افتُتح اليوم «ملتقى الابتكار الحكومي 2026» (افتراضي) بمشاركة 600 شخص، و12 جلسة، وإطلاق 3 مبادرات. المهمة: اكتب خبراً عربياً للموقع الرسمي. الصيغة: عنوان أقل من 12 كلمة، وفقرة افتتاحية تجيب عن من وماذا ومتى وأين، وفقرتان للمتن، ونسخة إنجليزية من العنوان. القيود: نبرة رسمية، ولا اقتباسات مختلقة، وضع علامة [للتأكيد] على أي رقم يجب أن أتحقق منه."], ["4.B", "Self-review", "المراجعة الذاتية", "ChatGPT / Claude", "Review your news item as a senior editor in a government media office: list 5 weak points (an unsupported claim, a number to confirm, a title or name that needs checking, tone, length), then rewrite it with the corrections.", "راجع الخبر بصفتك محرراً أول في مكتب إعلامي حكومي: اذكر 5 مواضع ضعف (ادعاء غير مدعوم، ورقم يحتاج تأكيداً، ولقب أو اسم يحتاج تحققاً، والنبرة، والطول)، ثم أعد كتابته بعد التصحيح."], ["4.C", "Build my prompt library", "ابنِ مكتبة أوامري", "ChatGPT / Claude", "Help me build my personal prompt library: ask me about the 5 tasks I repeat most each week (for example a monitoring brief, a weekly report, an article, an invitation, a meeting summary), then write a ready prompt for each using the role, context, task, format and constraints template, in a table.", "ساعدني في بناء مكتبة أوامري الشخصية: اسألني عن أكثر 5 مهام أكررها أسبوعياً (مثل موجز رصد، أو تقرير أسبوعي، أو مقال، أو دعوة، أو ملخص اجتماع)، ثم اكتب لكل مهمة أمراً جاهزاً بقالب الدور والسياق والمهمة والصيغة والقيود، في جدول."], ["4.D", "Ask before you answer", "اسأل قبل أن تجيب", "ChatGPT / Claude", "I need a communication plan for the \"Government Innovation Forum 2026\" (fictional) covering the 4 weeks before it, the forum days and the week after. Before you write anything, ask me the 5 questions you need answered to make the plan fit our office. Wait for my answers.", "أحتاج خطة اتصال لـ«ملتقى الابتكار الحكومي 2026» (افتراضي) تغطي الأسابيع الأربعة قبله، وأيام الملتقى، والأسبوع الذي يليه. قبل أن تكتب أي شيء، اسألني الأسئلة الخمسة التي تحتاج إجاباتها لتناسب الخطة مكتبنا. انتظر إجاباتي."], ["4.E", "Say it aloud, then structure it", "قلها بصوتك ثم رتّبها", "Wispr Flow, then ChatGPT / Claude", "Open Wispr Flow and say in your own words, in Arabic, what you need from this week's media report, as if explaining it to a colleague (about a minute). Wispr Flow turns your voice into text. Paste it into ChatGPT or Claude and add: \"Turn what I said into a clear prompt with role, context, task, format and constraints, then run it.\"", "افتح Wispr Flow وقل بكلماتك وبالعربية ما تحتاجه من التقرير الإعلامي لهذا الأسبوع، كأنك تشرحه لزميل (نحو دقيقة). يحوّل Wispr Flow صوتك إلى نص. الصقه في ChatGPT أو Claude وأضف: «حوّل ما قلته إلى أمر واضح بالدور والسياق والمهمة والصيغة والقيود، ثم نفّذه»."]], "rule": null, "no": "4", "id": "4"}, {"okey": null, "day": 1, "h": 50, "kind": "st", "ic": "compass", "tools": ["ChatGPT", "Claude", "NotebookLM", "Wispr Flow", "Perplexity", "Gemini", "Grok", "Manus", "ElevenLabs", "Higgsfield"], "lead": null, "nm": {"ar": "اختر الأداة المناسبة لمهمتك", "en": "Choose the right tool for the task"}, "out": {"ar": "دليل «أي أداة لأي مهمة» في عمل الاتصال والمراسم", "en": "A guide to which tool fits which task in communication and protocol work"}, "steps": {"ar": ["جولة سريعة على أهم الأدوات ومتى تُستخدم كل أداة", "أداتان نتدرب عليهما في كل محطة: ChatGPT للإبداع والصور، وClaude لمعظم العمل", "متى تبحث، ومتى تكتب، ومتى تحلّل", "Perplexity وGrok: بحث بمصادر، وماذا يقول الناس", "Gemini: فيديو تعريفي بـ Veo، وتلخيص يوتيوب", "Manus: عرض جاهز وصفحة تعريفية", "ElevenLabs: تعليق صوتي عربي، وHiggsfield: من صورة إلى فيديو", "NotebookLM حين يجب أن تأتي الإجابة من مصادرك وحدها، وWispr Flow حين تتكلم بدل أن تكتب"], "en": ["A quick tour of the key tools and when to use each", "Two tools we practise at every station: ChatGPT for creativity and images, Claude for most of the work", "When to search, when to write, when to analyse", "Perplexity and Grok: sourced search, and what people are saying", "Gemini: an intro video with Veo, and YouTube summaries", "Manus: a ready deck and a landing page", "ElevenLabs: an Arabic voice-over; Higgsfield: from image to video", "NotebookLM when the answer must come from your sources only; Wispr Flow when you speak instead of type"]}, "note": {"ar": "أعلن قاعدة البرنامج: نتدرب على ChatGPT وClaude في كل محطة، ونعرّف ببقية الأدوات بمثال واحد لكل أداة. الأمثلة من C إلى H اختيارية حسب الوقت؛ اعرض منها ما يناسب القاعة.", "en": "Announce the programme rule: we train on ChatGPT and Claude at every station, and introduce the other tools with one example each. Examples C to H are optional depending on time; show what suits the room."}, "P": [["5.A", "Same question, two tools", "السؤال نفسه في أداتين", "ChatGPT · Claude", "In 150 words: what are the three most important ways AI is changing government communication in the UAE? Give a source for each point. (Run the same prompt in both tools and compare accuracy and sources.)", "في 150 كلمة: ما أهم ثلاث طرق يغيّر بها الذكاء الاصطناعي الاتصال الحكومي في الإمارات؟ اذكر مصدراً لكل نقطة. (شغّل الأمر نفسه في الأداتين وقارن الدقة والمصادر.)"], ["5.B", "Sourced search (Perplexity)", "بحث بمصادر (Perplexity)", "Perplexity", "Find the five most important news items from the last 30 days about government innovation or AI in the UAE. For each: the headline, the outlet, the date, a one-line summary and the link. Only include items whose link opens.", "ابحث عن أهم خمسة أخبار خلال آخر 30 يوماً عن الابتكار الحكومي أو الذكاء الاصطناعي في الإمارات. لكل خبر: العنوان، والجهة الناشرة، والتاريخ، وملخص من سطر، والرابط. لا تذكر إلا الأخبار التي يفتح رابطها."], ["5.C", "What are people saying? (Grok)", "ماذا يقول الناس؟ (Grok)", "Grok", "Summarise what people are saying publicly on X this week about government services and AI in the UAE: three themes, two concerns, and the five most-engaged posts with their links. Separate official accounts from individuals.", "لخّص ما يقوله الناس علناً على X هذا الأسبوع عن الخدمات الحكومية والذكاء الاصطناعي في الإمارات: ثلاثة محاور، ومخاوف اثنتين، وأكثر خمسة منشورات تفاعلاً مع روابطها. افصل الحسابات الرسمية عن الأفراد."], ["5.D", "Forum teaser video (Gemini / Veo)", "فيديو تشويقي للملتقى (Gemini / Veo)", "Gemini (Veo)", "Create an 8-second video teasing the \"Government Innovation Forum 2026\" (fictional): a modern conference hall in Abu Dhabi in the morning, guests arriving, soft daylight, calm green and sand colours, no text inside the video.", "أنشئ فيديو مدته 8 ثوانٍ يشوّق لـ«ملتقى الابتكار الحكومي 2026» (افتراضي): قاعة مؤتمرات عصرية في أبوظبي صباحاً، وضيوف يصلون، وإضاءة نهارية ناعمة، بألوان خضراء ورملية هادئة، ودون نص داخل الفيديو."], ["5.E", "Summarise a public video (YouTube)", "لخّص فيديو عاماً (يوتيوب)", "Gemini", "Summarise this public talk on YouTube about government communication: [paste the link]. Give me the five main ideas, two quotes worth sharing with the team (with their time in the video), and one idea we could use in our next event.", "لخّص هذه المحاضرة العامة على يوتيوب عن الاتصال الحكومي: [الصق الرابط]. أعطني الأفكار الخمس الرئيسية، واقتباسين يستحقان المشاركة مع الفريق (مع توقيتهما في الفيديو)، وفكرة واحدة يمكن أن نستخدمها في فعاليتنا القادمة."], ["5.F", "Brief to deck and page (Manus)", "من الموجز إلى عرض وصفحة (Manus)", "Manus", "Turn this brief about the \"Government Innovation Forum 2026\" (fictional) into a 10-slide briefing deck in calm green and sand colours, then build a bilingual one-page landing page for the forum with the programme, the speakers (placeholders) and a registration button that does nothing.", "حوّل هذا الموجز عن «ملتقى الابتكار الحكومي 2026» (افتراضي) إلى عرض إحاطة من 10 شرائح بألوان خضراء ورملية هادئة، ثم ابنِ صفحة تعريفية ثنائية اللغة للملتقى فيها البرنامج، والمتحدثون (أسماء افتراضية)، وزر تسجيل لا يعمل."], ["5.G", "Arabic voice-over (ElevenLabs)", "تعليق صوتي عربي (ElevenLabs)", "ElevenLabs", "Choose a warm, clear Arabic voice. Text, read calmly with short pauses: \"Innovation is not an idea we talk about… it is how we work. The Government Innovation Forum 2026: two days that bring ideas and decision-makers together.\"", "اختر صوتاً عربياً دافئاً وواضحاً. النص المقروء بهدوء ومع وقفات قصيرة: «الابتكار ليس فكرة نتحدث عنها… بل طريقة نعمل بها. ملتقى الابتكار الحكومي 2026: يومان يجمعان الأفكار وصنّاع القرار»."], ["5.H", "From image to video (Higgsfield)", "من صورة إلى فيديو (Higgsfield)", "Higgsfield (image to video)", "Upload the forum cover image you created in ChatGPT. Prompt: Slow cinematic push-in towards the stage; soft morning light; guests taking their seats; natural movement; no text.", "ارفع صورة غلاف الملتقى التي أنشأتها في ChatGPT. الأمر: Slow cinematic push-in towards the stage; soft morning light; guests taking their seats; natural movement; no text."]], "rule": null, "no": "5", "id": "5"}, {"okey": null, "day": 1, "h": 40, "kind": "st", "ic": "radar", "tools": ["Grok", "Perplexity", "Claude in Chrome", "ChatGPT"], "lead": null, "nm": {"ar": "رصد منصات التواصل الاجتماعي", "en": "Social-media monitoring"}, "out": {"ar": "موجز رصد: ماذا قيل عن الشخصية أو الموضوع على X وInstagram وReddit والأخبار", "en": "A monitoring brief: what was said about the figure or topic on X, Instagram, Reddit and the news"}, "steps": {"ar": ["ماذا يمكن رصده: المحتوى العام فقط، على X وInstagram وReddit والمواقع الإخبارية", "X: هل ذُكرت الشخصية أو الموضوع؟ Grok يبحث في المنشورات العامة", "الأخبار والمواقع: Perplexity والبحث العميق، بمصادر وروابط", "Instagram وReddit: Claude in Chrome يقرأ الصفحة العامة المفتوحة من حسابك", "من النتائج إلى موجز رصد: المحاور، والنبرة، وأبرز المنشورات، وما يحتاج متابعة", "التحقق من كل رابط قبل الاعتماد، وحدود الأدوات"], "en": ["What can be monitored: public content only, on X, Instagram, Reddit and news sites", "X: was the figure or topic mentioned? Grok searches public posts", "News and websites: Perplexity and deep research, with sources and links", "Instagram and Reddit: Claude in Chrome reads the public page open in your own account", "From results to a monitoring brief: themes, tone, top posts, and what needs follow-up", "Verify every link before relying on it, and know the tools' limits"]}, "note": {"ar": "لا توجد أداة تدخل Instagram أو Reddit وتسحب كل محتواهما تلقائياً؛ العمل على المحتوى العام: Grok لـ X، والبحث على الويب، والمتصفح من حساب الموظف. الرصد الشامل المستمر يحتاج أدوات رصد إعلامي متخصصة. الرصد يخص الشخصيات العامة والموضوعات المرتبطة بعمل الجهة، ووفق سياستها؛ لا رصد لأفراد عاديين. استخدم في القاعة شخصية عامة يوافق عليها المكتب، أو موضوعاً عاماً.", "en": "No tool goes into Instagram or Reddit and pulls everything automatically; the work is on public content: Grok for X, web search, and the browser in the employee's own account. Comprehensive continuous monitoring needs dedicated media-monitoring tools. Monitoring covers public figures and topics related to the entity's work, under its policy; no monitoring of private individuals. In the room, use a public figure the office approves, or a public topic."}, "P": [["6.A", "Was it mentioned on X? (Grok)", "هل ذُكر على X؟ (Grok)", "Grok", "Search public posts on X from the last 7 days that mention [the public figure or topic] (in Arabic and English, including common spellings). Tell me: was it mentioned, roughly how often, the 3 main themes, the overall tone (positive, neutral, negative) with an example of each, and the 10 most-engaged posts in a table (account, official or individual, date, summary, link). Do not guess; if you find nothing, say so.", "ابحث في منشورات X العامة خلال آخر 7 أيام التي تذكر [الشخصية العامة أو الموضوع] (بالعربية والإنجليزية، مع طرق الكتابة الشائعة). أخبرني: هل ذُكر، وبأي تكرار تقريباً، وأهم 3 محاور، والنبرة العامة (إيجابية، محايدة، سلبية) مع مثال لكل منها، وأكثر 10 منشورات تفاعلاً في جدول (الحساب، رسمي أم فرد، التاريخ، الملخص، الرابط). لا تخمّن؛ إن لم تجد شيئاً فقل ذلك."], ["6.B", "News and websites (Perplexity)", "الأخبار والمواقع (Perplexity)", "Perplexity / ChatGPT (search)", "Find news coverage from the last 7 days of [the public figure or topic] in UAE and international outlets. For each item: the outlet, the date, the headline, a two-line summary, the tone, and the link. Sort by importance, and only include items whose link opens.", "ابحث عن التغطية الإخبارية خلال آخر 7 أيام لـ[الشخصية العامة أو الموضوع] في وسائل الإعلام الإماراتية والدولية. لكل خبر: الوسيلة، والتاريخ، والعنوان، وملخص من سطرين، والنبرة، والرابط. رتّبها حسب الأهمية، ولا تذكر إلا ما يفتح رابطه."], ["6.C", "Read a public Instagram or Reddit page", "اقرأ صفحة عامة على Instagram أو Reddit", "Claude in Chrome / ChatGPT (Chrome extension)", "Read the public page open in front of me (an Instagram post and its comments, or a Reddit thread). Give me: what the post is about, the main reactions in the comments grouped into themes, the overall tone, and any comment that needs attention from the communication team, with a direct quote. Only read; do not like, comment or follow anything.", "اقرأ الصفحة العامة المفتوحة أمامي (منشور على Instagram وتعليقاته، أو نقاش على Reddit). أعطني: موضوع المنشور، وأبرز ردود الفعل في التعليقات مجمّعة في محاور، والنبرة العامة، وأي تعليق يحتاج انتباه فريق الاتصال مع اقتباسه حرفياً. اقرأ فقط؛ لا تُعجب ولا تعلّق ولا تتابع أي حساب."], ["6.D", "From results to a monitoring brief", "من النتائج إلى موجز رصد", "ChatGPT / Claude", "From these monitoring results (X, news, Instagram, Reddit), write a one-page monitoring brief for the executive office: the headline finding in 2 lines, mentions by platform in a small table, the 3 main themes, the tone, the 5 most important items with links, and what needs follow-up or a response. Mark anything not verified with [to verify].", "من نتائج الرصد هذه (X، والأخبار، وInstagram، وReddit)، اكتب موجز رصد من صفحة واحدة للمكتب التنفيذي: الخلاصة في سطرين، والذكر حسب المنصة في جدول صغير، وأهم 3 محاور، والنبرة، وأهم 5 مواد مع روابطها، وما يحتاج متابعة أو رداً. ضع علامة [للتحقق] على أي شيء لم يُتحقق منه."]], "rule": null, "no": "6", "id": "6"}, {"okey": null, "day": 1, "h": 35, "kind": "st", "ic": "doc", "tools": ["ChatGPT", "Claude", "NotebookLM"], "lead": null, "nm": {"ar": "اكتب تقريراً احترافياً", "en": "Write a professional report"}, "out": {"ar": "تقرير ما بعد الفعالية، وملخص تنفيذي، وخطاب رسمي، وعرض للقيادة", "en": "A post-event report, an executive summary, an official letter and a deck for leadership"}, "steps": {"ar": ["هيكل التقرير الاحترافي: الخلاصة أولاً، ثم النتائج، ثم التوصيات", "من ملاحظات متفرقة إلى تقرير ما بعد الفعالية", "الملخص التنفيذي من صفحة واحدة لمستند طويل، مع الإحالة إلى الصفحات", "صياغة خطاب رسمي بالعربية وترجمته", "NotebookLM: اسأل تقاريرك نفسها، فيجيب منها وحدها مع الإحالة", "من التقرير إلى عرض للقيادة"], "en": ["The structure of a professional report: the conclusion first, then findings, then recommendations", "From scattered notes to a post-event report", "A one-page executive summary of a long document, with page references", "Draft an official letter in Arabic and translate it", "NotebookLM: ask your own reports, and get answers from them alone, with references", "From the report to a deck for leadership"]}, "note": {"ar": "كتابة التقارير ثاني احتياج للمكتب التنفيذي. ابدأ بملاحظات افتراضية متفرقة عن الملتقى وحوّلها إلى تقرير أمام القاعة. أهم لحظة في NotebookLM: اسأل سؤالاً غير موجود في المصادر وأظهر أن الأداة تقول ذلك.", "en": "Report writing is the Executive Office's second need. Start from scattered synthetic notes about the forum and turn them into a report in front of the room. The key NotebookLM moment: ask a question the sources don't answer and show the tool says so."}, "P": [["7.A", "Post-event report", "تقرير ما بعد الفعالية", "ChatGPT / Claude", "From these scattered notes about the \"Government Innovation Forum 2026\" (synthetic), write a post-event report for leadership: a 3-line executive summary, the forum in numbers (participants, sessions, speakers, initiatives), the 5 key outcomes, media coverage in brief, what went well, what to improve, and 3 recommendations for the next edition. Formal Arabic, headings and short paragraphs, and mark any number I must confirm with [confirm].", "من هذه الملاحظات المتفرقة عن «ملتقى الابتكار الحكومي 2026» (افتراضي)، اكتب تقرير ما بعد الفعالية للقيادة: خلاصة تنفيذية من 3 أسطر، والملتقى بالأرقام (المشاركون، والجلسات، والمتحدثون، والمبادرات)، وأهم 5 مخرجات، والتغطية الإعلامية باختصار، وما نجح، وما يحتاج تحسيناً، و3 توصيات للدورة القادمة. بالعربية الرسمية، بعناوين وفقرات قصيرة، وضع علامة [للتأكيد] على أي رقم يجب أن أتحقق منه."], ["7.B", "Executive summary of a long document", "ملخص تنفيذي لمستند طويل", "ChatGPT / Claude", "Summarise the attached document on one page for a senior official: a 3-line conclusion, the 5 key points with the page number for each, and the 3 decisions or actions required. Add nothing that is not in the document.", "لخّص المستند المرفق في صفحة واحدة لمسؤول رفيع: خلاصة من 3 أسطر، وأهم 5 نقاط مع رقم الصفحة لكل منها، و3 قرارات أو إجراءات مطلوبة. لا تضف شيئاً غير موجود في المستند."], ["7.C", "Official letter and translation", "خطاب رسمي وترجمته", "ChatGPT / Claude", "Write a formal Arabic letter of thanks from the executive office to [partner entity] for its participation in the \"Government Innovation Forum 2026\", mentioning its contribution in one line and inviting it to the next edition. Then give me an accurate English translation. Keep the official forms of address.", "اكتب خطاب شكر رسمياً بالعربية من المكتب التنفيذي إلى [الجهة الشريكة] على مشاركتها في «ملتقى الابتكار الحكومي 2026»، يذكر إسهامها في سطر، ويدعوها إلى الدورة القادمة. ثم أعطني ترجمة إنجليزية دقيقة. حافظ على صيغ المخاطبة الرسمية."], ["7.D", "Ask your reports (NotebookLM)", "اسأل تقاريرك (NotebookLM)", "NotebookLM", "Across all the uploaded reports: what were the recurring recommendations from previous events, and which of them were implemented? Give each point with its source.", "عبر جميع التقارير المرفوعة: ما التوصيات التي تكررت في الفعاليات السابقة، وأيها نُفّذ؟ اذكر كل نقطة مع مصدرها."], ["7.E", "From the report to a leadership deck", "من التقرير إلى عرض للقيادة", "ChatGPT / Claude", "Turn the post-event report into an 8-slide deck for a leadership meeting: title, the forum in numbers, 3 key outcomes, media coverage, lessons learned, recommendations, and the decision required. One idea per slide, short headlines, and a speaker note under each slide.", "حوّل تقرير ما بعد الفعالية إلى عرض من 8 شرائح لاجتماع قيادي: العنوان، والملتقى بالأرقام، و3 مخرجات رئيسية، والتغطية الإعلامية، والدروس المستفادة، والتوصيات، والقرار المطلوب. فكرة واحدة لكل شريحة، وعناوين قصيرة، وملاحظة للمتحدث تحت كل شريحة."]], "rule": null, "no": "7", "id": "7"}, {"okey": null, "day": 1, "h": 30, "kind": "st", "ic": "news", "tools": ["ChatGPT", "Claude"], "lead": null, "nm": {"ar": "اكتب مقالاً احترافياً راقياً", "en": "Write a polished, professional article"}, "out": {"ar": "مقال رأي راقٍ بأسلوب الجهة، من الفكرة إلى النسخة النهائية", "en": "A polished opinion article in the entity's style, from idea to final draft"}, "steps": {"ar": ["من الفكرة إلى المخطط: الزاوية، والرسالة، والجمهور", "الكتابة على مراحل: مخطط، ثم مسودة، ثم تحرير", "اللغة الراقية: الفصاحة، والإيقاع، وتجنّب الحشو والمبالغة", "عنوان يشدّ القارئ، ونسخ للمنصات المختلفة", "احفظ أسلوب الجهة: من مقالات منشورة إلى دليل أسلوب", "التحقق من كل معلومة واسم ولقب قبل النشر"], "en": ["From idea to outline: the angle, the message, the audience", "Write in stages: outline, then draft, then edit", "Polished language: eloquence, rhythm, no padding or overstatement", "A headline that draws the reader, and versions for different platforms", "Keep the entity's style: from published articles to a style guide", "Check every fact, name and title before publishing"]}, "note": {"ar": "اطلب المخطط أولاً ولا تقفز إلى المقال؛ هذا ما يصنع الفرق في الجودة. استخدم مقالات منشورة للجهة (عامة) لاستخراج دليل الأسلوب في 8.D. المقال يُنسب لكاتبه ويعتمده صاحب الصلاحية قبل النشر.", "en": "Ask for the outline first instead of jumping to the article; that is what makes the difference in quality. Use the entity's published (public) articles to extract the style guide in 8.D. The article is attributed to its author and approved by the authorised person before publishing."}, "P": [["8.A", "From idea to outline", "من الفكرة إلى المخطط", "ChatGPT / Claude", "I want to write an opinion article about \"why government innovation starts with people, not technology\", tied to the \"Government Innovation Forum 2026\" (fictional). Before writing, propose 3 different angles, each with its main message, audience and one example. Then, for the angle I choose, give me an outline: headline, opening hook, 3 sections with their key idea, and a closing line.", "أريد كتابة مقال رأي عن «لماذا يبدأ الابتكار الحكومي بالإنسان لا بالتقنية» مرتبط بـ«ملتقى الابتكار الحكومي 2026» (افتراضي). قبل الكتابة، اقترح 3 زوايا مختلفة، لكل منها رسالتها الرئيسية وجمهورها ومثال واحد. ثم للزاوية التي أختارها، أعطني مخططاً: العنوان، وافتتاحية تشدّ القارئ، و3 أقسام بفكرة كل منها، وسطراً ختامياً."], ["8.B", "The draft, in a polished style", "المسودة بأسلوب راقٍ", "ChatGPT / Claude", "Write the article from the outline in 600 words of eloquent, modern formal Arabic: a strong opening, short paragraphs, a varied rhythm, no padding, no overstatement and no clichés. Use concrete examples instead of general claims, and do not invent any statistic or quote; mark any place that needs a number with [number to confirm].", "اكتب المقال من المخطط في 600 كلمة بعربية فصيحة رسمية معاصرة: افتتاحية قوية، وفقرات قصيرة، وإيقاع متنوع، دون حشو أو مبالغة أو عبارات مستهلكة. استخدم أمثلة ملموسة بدل الادعاءات العامة، ولا تختلق أي إحصاء أو اقتباس؛ ضع علامة [رقم للتأكيد] حيث يلزم رقم."], ["8.C", "Edit like a senior editor", "حرّر كمحرر أول", "ChatGPT / Claude", "Edit the article as a senior editor at a respected Arabic newspaper: tighten every sentence, replace weak words, check grammar and punctuation, and make the opening and closing stronger. Show me the 5 most important changes and why, then give me the final version, 5 headline options, and two short versions: one for LinkedIn and one for X.", "حرّر المقال بصفتك محرراً أول في صحيفة عربية رصينة: شدّ كل جملة، واستبدل الكلمات الضعيفة، وراجع النحو والترقيم، وقوِّ الافتتاحية والخاتمة. اعرض لي أهم 5 تغييرات وسببها، ثم أعطني النسخة النهائية، و5 خيارات للعنوان، ونسختين قصيرتين: واحدة لـ LinkedIn وواحدة لـ X."], ["8.D", "Extract the entity's style", "استخرج أسلوب الجهة", "ChatGPT / Claude", "Here are 3 published articles by our entity. Analyse their style and write a one-page style guide: tone, sentence length, preferred and avoided words, how titles and names are written, how articles open and close, and 3 rules I must always follow. Then rewrite my article to match this guide.", "هذه 3 مقالات منشورة لجهتنا. حلّل أسلوبها واكتب دليل أسلوب من صفحة واحدة: النبرة، وطول الجمل، والكلمات المفضلة والمتجنَّبة، وطريقة كتابة الألقاب والأسماء، وكيف تبدأ المقالات وكيف تُختم، و3 قواعد يجب أن ألتزم بها دائماً. ثم أعد كتابة مقالي وفق هذا الدليل."]], "rule": null, "no": "8", "id": "8"}, {"okey": null, "day": 1, "h": 25, "kind": "st", "ic": "spark", "tools": ["ChatGPT", "Claude"], "lead": "ChatGPT", "nm": {"ar": "ابتكر هوية ومحتوى بصرياً", "en": "Create an identity and visual content"}, "out": {"ar": "صورة غلاف وشعار ودعوة ومنشور بهوية واحدة للملتقى", "en": "A cover image, a mark, an invitation and a post in one identity for the forum"}, "steps": {"ar": ["توليد الصور وتعديلها بجملة واحدة (ChatGPT)", "هوية الفعالية: الاسم والعبارة والألوان والشعار البصري (ChatGPT، وClaude بشعار SVG قابل للتعديل)", "بطاقة دعوة ومنشور إعلان بالهوية نفسها"], "en": ["Generate images and edit them with one sentence (ChatGPT)", "The event identity: name, tagline, colours and mark (ChatGPT, and Claude for an editable SVG mark)", "An invitation card and an announcement post in the same identity"]}, "note": {"ar": "اعرض توليد صورة ثم تعديلها بجملة واحدة؛ فهذه اللحظة تشدّ انتباه القاعة. الصور في ChatGPT، والشعار القابل للتعديل في Claude. لا صور لأشخاص حقيقيين.", "en": "Show generating an image, then editing it with one sentence; that moment grabs the room. Images in ChatGPT, the editable mark in Claude. No images of real people."}, "P": [["9.A", "Image then edit", "صورة ثم تعديل", "ChatGPT (images)", "Create a clean, formal cover image for the \"Government Innovation Forum 2026\" (fictional): a modern conference stage in Abu Dhabi with soft light, calm green and sand colours, no text and no recognisable people. Then: make it wider and leave empty space on the right for the title.", "أنشئ صورة غلاف رسمية نظيفة لـ«ملتقى الابتكار الحكومي 2026» (افتراضي): منصة مؤتمرات عصرية في أبوظبي بإضاءة ناعمة، بألوان خضراء ورملية هادئة، دون نص ودون أشخاص يمكن التعرف عليهم. ثم: اجعلها أعرض واترك مساحة فارغة على اليمين للعنوان."], ["9.B", "The mark in Claude", "الشعار في Claude", "Claude", "Design a simple, modern visual mark in SVG for the \"Government Innovation Forum 2026\": a spark rising from an arch, calm green and sand colours, flat style, no text inside the symbol. Then give me a version with the forum name in Arabic and English beside it.", "صمّم شعاراً بصرياً بسيطاً وعصرياً بصيغة SVG لـ«ملتقى الابتكار الحكومي 2026»: شرارة تصعد من قوس، بألوان خضراء ورملية هادئة، وأسلوب مسطح، ودون نص داخل الرمز. ثم أعطني نسخة يجاور فيها اسم الملتقى بالعربية والإنجليزية."], ["9.C", "Invitation and announcement post", "دعوة ومنشور إعلان", "ChatGPT / Claude", "Write the text of a formal invitation card for the forum (Arabic and English, under 60 words each: the inviting party, the event, the date and place as placeholders, and the RSVP line), and an announcement post for the official accounts under 50 words with 3 hashtags. Then describe the design of the card in the forum's identity.", "اكتب نص بطاقة دعوة رسمية للملتقى (بالعربية والإنجليزية، أقل من 60 كلمة لكل منهما: الجهة الداعية، والفعالية، والتاريخ والمكان كعلامات، وسطر تأكيد الحضور)، ومنشور إعلان للحسابات الرسمية أقل من 50 كلمة مع 3 وسوم. ثم صف تصميم البطاقة بهوية الملتقى."]], "rule": null, "no": "9", "id": "9"}, {"okey": null, "day": 1, "h": 20, "kind": "lab", "ic": "ChatGPT", "tools": ["ChatGPT", "Claude"], "lead": null, "nm": {"ar": "تمرين الأساسيات: فرز المهام ومكتبة أوامرك", "en": "Basics lab: sort the tasks and build your prompt library"}, "out": {"ar": "فرز عشر مهام من الأسبوع الإعلامي، وأول ثلاثة أوامر في مكتبتك", "en": "Ten media-week tasks sorted, and the first three prompts in your library"}, "steps": {"ar": ["فرز عشر مهام إلى الأنواع الثلاثة", "أمر قوي لمهمة من مهامك الخمس", "المراجعة الذاتية", "حفظ الأوامر في مكتبتك"], "en": ["Sort ten tasks into the three types", "A strong prompt for one of your 5 tasks", "Self-review", "Save the prompts in your library"]}, "note": {"ar": "بعد المحطات 1 إلى 4. كل مشارك يخرج بمكتبة أوامر من ثلاثة أوامر يستخدمها في بقية اليومين.", "en": "After stations 1 to 4. Everyone leaves with a three-prompt library they use for the rest of the two days."}, "P": [["T1.A", "Programming, traditional or generative?", "برمجة أم ذكاء تقليدي أم توليدي؟", "ChatGPT / Claude", "Sort these ten tasks from the executive office's media week into programming, traditional AI or generative AI, with a one-line reason for each:\n1. Counting mentions of the forum per platform\n2. Sending an automatic reminder to guests\n3. Writing the forum's news item\n4. Classifying comments as positive or negative\n5. Summarising a 40-page report\n6. Forecasting attendance from previous years\n7. Drafting a thank-you letter\n8. Translating the programme into English\n9. Reformatting a guest list\n10. Proposing 5 headlines for an article", "افرز هذه المهام العشر من الأسبوع الإعلامي للمكتب التنفيذي إلى برمجة أو ذكاء تقليدي أو ذكاء توليدي، مع سبب من سطر واحد لكل مهمة:\n1. عدّ مرات ذكر الملتقى في كل منصة\n2. إرسال تذكير تلقائي للمدعوين\n3. كتابة خبر الملتقى\n4. تصنيف التعليقات إلى إيجابية وسلبية\n5. تلخيص تقرير من 40 صفحة\n6. توقّع عدد الحضور من السنوات السابقة\n7. صياغة خطاب شكر\n8. ترجمة البرنامج إلى الإنجليزية\n9. إعادة تنسيق قائمة المدعوين\n10. اقتراح 5 عناوين لمقال"], ["T1.B", "A strong prompt for your task", "أمر قوي لمهمتك", "ChatGPT / Claude", "Take one of my 5 tasks: [paste the task]. Write a strong five-part prompt for it (role, context, task, format, constraints), run it, and show me the result.", "خذ مهمة من مهامي الخمس: [الصق المهمة]. اكتب لها أمراً قوياً من خمسة أجزاء (الدور، والسياق، والمهمة، والصيغة، والقيود)، ونفّذه، واعرض لي النتيجة."], ["T1.C", "Review and save", "راجع واحفظ", "ChatGPT / Claude", "Review the result you gave me: point out every sentence without a source, every number that needs checking, any name or title that needs confirming, and any question my manager might ask that it doesn't answer. Then give me the corrected version and a final version of the prompt to save in my library.", "راجع النتيجة التي أعطيتني إياها: اذكر كل جملة بلا مصدر، وكل رقم يحتاج تحققاً، وأي اسم أو لقب يحتاج تأكيداً، وأي سؤال قد يطرحه مديري ولا تجيب عنه. ثم أعطني النسخة المصححة، ونسخة نهائية من الأمر أحفظها في مكتبتي."]], "rule": null, "no": "T1", "id": "T1"}, {"okey": null, "day": 1, "h": 40, "kind": "lab", "ic": "Claude", "tools": ["Grok", "Perplexity", "ChatGPT", "Claude"], "lead": null, "nm": {"ar": "الأسبوع الإعلامي: من الرصد إلى التقرير والمقال", "en": "Media week: from monitoring to report and article"}, "out": {"ar": "موجز رصد، وتقرير أسبوعي، ومقال قصير عن موضوع الأسبوع", "en": "A monitoring brief, a weekly report and a short article on the week's topic"}, "steps": {"ar": ["رصد موضوع الأسبوع", "التقرير الأسبوعي", "مقال قصير"], "en": ["Monitor the week's topic", "The weekly report", "A short article"]}, "note": {"ar": "«الأسبوع الإعلامي للمكتب التنفيذي» تمرين افتراضي: يختار كل فريق موضوعاً عاماً (مثلاً الابتكار الحكومي أو الخدمات الذكية)، ويرصده، ثم يكتب عنه تقريراً ومقالاً. ما يُبنى هنا يُؤتمت في تدريب اليوم الثاني.", "en": "\"The Executive Office's media week\" is a synthetic exercise: each team picks a public topic (for example government innovation or smart services), monitors it, then writes a report and an article on it. What is built here is automated in the Day 2 lab."}, "P": [["T2.A", "Monitor the week's topic", "ارصد موضوع الأسبوع", "Grok / Perplexity", "Monitor [the week's public topic] over the last 7 days: on X with Grok (themes, tone, the 5 most-engaged posts with links), and in the news with Perplexity (the 5 most important items with outlet, date and link). Put the results in one table by platform.", "ارصد [موضوع الأسبوع العام] خلال آخر 7 أيام: على X عبر Grok (المحاور، والنبرة، وأكثر 5 منشورات تفاعلاً مع روابطها)، وفي الأخبار عبر Perplexity (أهم 5 مواد مع الوسيلة والتاريخ والرابط). ضع النتائج في جدول واحد حسب المنصة."], ["T2.B", "The weekly media report", "التقرير الإعلامي الأسبوعي", "ChatGPT / Claude", "From the monitoring table, write the executive office's weekly media report on one page: the week in 3 lines, what was said by platform, the main themes and tone, the 3 items leadership should see with links, and recommended actions for next week. Mark anything not verified with [to verify].", "من جدول الرصد، اكتب التقرير الإعلامي الأسبوعي للمكتب التنفيذي في صفحة واحدة: الأسبوع في 3 أسطر، وما قيل حسب المنصة، والمحاور الرئيسية والنبرة، و3 مواد يجب أن تراها القيادة مع روابطها، والإجراءات المقترحة للأسبوع القادم. ضع علامة [للتحقق] على أي شيء لم يُتحقق منه."], ["T2.C", "A short article on the week's topic", "مقال قصير عن موضوع الأسبوع", "ChatGPT / Claude", "Write a 350-word opinion article on the week's topic in polished formal Arabic, starting with an outline (angle, message, 3 ideas), then the draft, then a senior editor's edit. Give me 3 headline options and a version for LinkedIn.", "اكتب مقال رأي من 350 كلمة عن موضوع الأسبوع بعربية رسمية راقية، يبدأ بمخطط (الزاوية، والرسالة، و3 أفكار)، ثم المسودة، ثم تحرير المحرر الأول. أعطني 3 خيارات للعنوان ونسخة لـ LinkedIn."]], "rule": null, "no": "T2", "id": "T2"}, {"okey": null, "day": 1, "h": 35, "kind": "lab", "ic": "Claude", "tools": ["ChatGPT", "Claude"], "lead": null, "nm": {"ar": "هوية وصفحة «ملتقى الابتكار الحكومي 2026»", "en": "Identity and page for the \"Government Innovation Forum 2026\""}, "out": {"ar": "هوية الملتقى، وبطاقة الدعوة، وصفحة تعريفية به", "en": "The forum's identity, the invitation card, and a landing page"}, "steps": {"ar": ["ملخص الهوية", "بطاقة الدعوة", "صفحة الملتقى"], "en": ["Identity brief", "Invitation card", "The forum page"]}, "note": {"ar": "الملتقى افتراضي ويرافقنا في اليوم الثاني كاملاً: المحضر، والمشروع، واللوحة، وتنظيم الفعالية.", "en": "The forum is synthetic and runs through all of Day 2: the minutes, the project, the dashboard and the event organisation."}, "P": [["T3.A", "Identity brief", "ملخص الهوية", "ChatGPT / Claude", "Create an identity brief for the \"Government Innovation Forum 2026\" (fictional): 3 tagline options in Arabic and English, a palette of 4 colours with their codes and use, a font pair suitable for Arabic and English, and the tone of voice in 3 words.", "أنشئ ملخص هوية لـ«ملتقى الابتكار الحكومي 2026» (افتراضي): 3 خيارات للعبارة التعريفية بالعربية والإنجليزية، ولوحة من 4 ألوان مع أكوادها واستخدام كل منها، وزوج خطوط مناسب للعربية والإنجليزية، ونبرة الصوت في 3 كلمات."], ["T3.B", "Invitation card", "بطاقة الدعوة", "ChatGPT (images) / Claude", "Design a formal invitation card for the forum in its identity: the inviting party, the event, the date and place as placeholders, and an RSVP line, in Arabic and English, A5 size, with a clean, official look.", "صمّم بطاقة دعوة رسمية للملتقى بهويته: الجهة الداعية، والفعالية، والتاريخ والمكان كعلامات، وسطر تأكيد الحضور، بالعربية والإنجليزية، بمقاس A5، وبمظهر رسمي نظيف."], ["T3.C", "The forum page", "صفحة الملتقى", "Claude (Artifacts) / ChatGPT (Canvas)", "Using the identity brief, build a bilingual one-page site for the forum: a hero with the mark and tagline, the two-day programme, speakers (placeholders), the venue, and a registration button that does nothing. Add a note that the forum is fictional.", "باستخدام ملخص الهوية، ابنِ موقعاً من صفحة واحدة بالعربية والإنجليزية للملتقى: واجهة تحمل الشعار والعبارة، وبرنامج اليومين، والمتحدثون (أسماء افتراضية)، والمكان، وزر تسجيل لا يعمل. أضف ملاحظة بأن الملتقى افتراضي."]], "rule": null, "no": "T3", "id": "T3"}, {"okey": null, "day": 2, "h": 20, "kind": "st", "ic": "mic", "tools": ["Wispr Flow", "Teams", "ChatGPT", "Claude"], "lead": "Wispr Flow", "nm": {"ar": "من التسجيل إلى المحضر", "en": "From the recording to the minutes"}, "out": {"ar": "محضر اجتماع وقرارات ومهام من تسجيل أو تفريغ", "en": "Meeting minutes, decisions and actions from a recording or transcript"}, "steps": {"ar": ["الإملاء الصوتي بدل الكتابة في أي تطبيق (Wispr Flow)", "تسجيل اجتماع Teams وتفريغه النصي", "من التفريغ إلى محضر: القرارات والمهام والمسؤولون (ChatGPT أو Claude)", "موافقة الحضور قبل التسجيل، ولا تسجيل لاجتماعات سرية"], "en": ["Dictate instead of typing in any app (Wispr Flow)", "Record a Teams meeting and its transcript", "From transcript to minutes: decisions, actions and owners (ChatGPT or Claude)", "Attendees' consent before recording, and no recording of confidential meetings"]}, "note": {"ar": "استخدم تفريغاً افتراضياً قصيراً لاجتماع اللجنة المنظمة. التفريغ وحده لا يكفي؛ المحضر يحتاج خطوة تلخيص في ChatGPT أو Claude.", "en": "Use a short synthetic transcript of the organising-committee meeting. A transcript alone isn't enough; minutes need a summarising step in ChatGPT or Claude."}, "P": [["10.A", "Minutes from a transcript", "محضر من التفريغ", "ChatGPT / Claude (Teams transcript)", "From the transcript of this organising-committee meeting for the \"Government Innovation Forum 2026\" (synthetic), write formal minutes: attendees, a 3-line summary, decisions, actions in a table (action, owner, due date), and open questions. Add nothing that was not said.", "من نص اجتماع اللجنة المنظمة لـ«ملتقى الابتكار الحكومي 2026» (افتراضي)، اكتب محضراً رسمياً: الحضور، وخلاصة من 3 أسطر، والقرارات، والمهام في جدول (المهمة، المسؤول، الموعد)، والأسئلة المفتوحة. لا تضف شيئاً لم يُقل."], ["10.B", "Voice brief", "موجز صوتي", "Wispr Flow + ChatGPT / Claude", "(Speak, don't type) I've just left a meeting about the forum preparations, and here is what happened... Turn what I said into 5 clear follow-up points and a short email to the team.", "(تحدّث ولا تكتب) خرجت للتو من اجتماع عن تجهيزات الملتقى، وهذا ما حدث... حوّل ما قلته إلى 5 نقاط متابعة واضحة وبريد قصير للفريق."]], "rule": null, "no": "10", "id": "10"}, {"okey": null, "day": 2, "h": 25, "kind": "st", "ic": "folder", "tools": ["Claude Projects", "ChatGPT Projects"], "lead": null, "nm": {"ar": "Claude Projects", "en": "Claude Projects"}, "out": {"ar": "مساحة عمل تتذكر ملفات الملتقى، ومهارة «تقرير المكتب التنفيذي» داخلها", "en": "A workspace that remembers the forum's files, with an \"Executive Office report\" skill inside it"}, "steps": {"ar": ["مساحة واحدة لكل ملف متكرر: الملتقى، والرصد الأسبوعي (Projects في ChatGPT وClaude)", "ترفع المراجع وقوالب المكتب مرة، وتستخدمها كل مرة", "احفظ طريقتك: أسلوب المكتب في التقارير والمقالات كمهارة داخل المشروع", "تطبيقها على أي فعالية جديدة، فيخرج كل تقرير بالشكل نفسه"], "en": ["One space per recurring file: the forum, the weekly monitoring (Projects in ChatGPT and Claude)", "Upload the references and the office's templates once, and use them every time", "Save your method: the office's report and article style as a skill inside the project", "Apply it to any new event, and every report comes out the same way"]}, "note": {"ar": "ارفع محضر المحطة السابقة، ودليل الأسلوب من محطة المقالات، ومخرجات تدريبات اليوم الأول كملفات مرجعية؛ هكذا تتصل المحطات. ملفات افتراضية فقط.", "en": "Upload the previous station's minutes, the style guide from the article station and the Day 1 lab outputs as reference files; this is how the stations connect. Synthetic files only."}, "P": [["11.A", "Project instructions", "تعليمات المشروع", "ChatGPT Projects / Claude Projects", "You are the executive office's assistant for the \"Government Innovation Forum 2026\" file. Rely only on the uploaded files, write in formal Arabic, cite the source file for every piece of information, and say \"not in the files\" when something is missing. Never include personal data of guests or VIPs in any output.", "أنت مساعد المكتب التنفيذي لملف «ملتقى الابتكار الحكومي 2026». اعتمد فقط على الملفات المرفوعة، واكتب بالعربية الرسمية، واذكر الملف المصدر لكل معلومة، وقل «غير موجود في الملفات» عند غياب المعلومة. لا تضع أي بيانات شخصية للمدعوين أو كبار الشخصيات في أي مخرج."], ["11.B", "Save your method: the office report", "احفظ طريقتك: تقرير المكتب", "ChatGPT Projects / Claude Projects", "Add this to my project's instructions as a fixed method called \"Executive Office report\": whenever I ask for a report, write the conclusion first in 3 lines, then the key points with their sources, then recommendations, then what is required from leadership, in under one page, with headings, and mark any number to confirm with [confirm]. Then apply it to the minutes of the previous station.", "أضف هذا إلى تعليمات مشروعي كطريقة ثابتة باسم «تقرير المكتب التنفيذي»: كلما طلبت تقريراً، اكتب الخلاصة أولاً في 3 أسطر، ثم النقاط الرئيسية مع مصادرها، ثم التوصيات، ثم المطلوب من القيادة، في أقل من صفحة، بعناوين، وضع علامة [للتأكيد] على أي رقم. ثم طبّقها على محضر المحطة السابقة."]], "rule": null, "no": "11", "id": "11"}, {"okey": null, "day": 2, "h": 25, "kind": "st", "ic": "screen", "tools": ["Claude Artifacts", "ChatGPT Canvas"], "lead": null, "nm": {"ar": "Claude Artifacts", "en": "Claude Artifacts"}, "out": {"ar": "مخرجات حيّة تعمل فوراً: لوحة متابعة الملتقى ولوحة الرصد", "en": "Live outputs that work at once: a forum tracker and a monitoring dashboard"}, "steps": {"ar": ["ما الـ Artifact: صفحة أو لوحة أو أداة تعمل داخل المحادثة", "لوحة متابعة الملتقى: التسجيل وتأكيد الحضور والمهام", "لوحة الرصد الإعلامي من نتائج الأسبوع", "التحسين بطلبات متتالية، ثم المشاركة برابط", "المقابل في ChatGPT: Canvas"], "en": ["What an Artifact is: a page, dashboard or tool that runs inside the chat", "A forum tracker: registrations, RSVPs and tasks", "A media-monitoring dashboard from the week's results", "Refine with follow-up requests, then share by link", "The ChatGPT equivalent: Canvas"]}, "note": {"ar": "ابنِ من داخل مشروع المحطة السابقة لتستفيد من ملفاته. بيانات افتراضية فقط. شغّل الأمر نفسه في Canvas وقارن.", "en": "Build from inside the previous station's project to use its files. Synthetic data only. Run the same prompt in Canvas and compare."}, "P": [["12.A", "Forum tracker", "لوحة متابعة الملتقى", "Claude (Artifacts) / ChatGPT (Canvas)", "From this synthetic list of invitations, build an interactive Arabic tracker for the forum: 4 cards (invited, confirmed, declined, no reply), a bar chart of confirmations by guest category, a task list with owner and status, and a filter by category. Calm green and sand colours, and a note that the data is synthetic.", "من قائمة الدعوات الافتراضية هذه، ابنِ لوحة متابعة عربية تفاعلية للملتقى: 4 بطاقات (المدعوون، والمؤكدون، والمعتذرون، ومن لم يرد)، ورسماً بالأعمدة للتأكيدات حسب فئة الضيوف، وقائمة مهام بالمسؤول والحالة، وفلتراً حسب الفئة. بألوان خضراء ورملية هادئة، مع ملاحظة أن البيانات افتراضية."], ["12.B", "Media-monitoring dashboard", "لوحة الرصد الإعلامي", "Claude (Artifacts) / ChatGPT (Canvas)", "From the media week's monitoring table, build a monitoring dashboard: mentions by platform, tone (positive, neutral, negative) as a simple chart, the top 5 items with links, and a \"what needs follow-up\" box. Add a date filter.", "من جدول رصد الأسبوع الإعلامي، ابنِ لوحة رصد: الذكر حسب المنصة، والنبرة (إيجابية، محايدة، سلبية) في رسم بسيط، وأهم 5 مواد مع روابطها، ومربع «ما يحتاج متابعة». أضف فلتراً بالتاريخ."], ["12.C", "Refine and share", "حسّن وشارك", "Claude (Artifacts) / ChatGPT (Canvas)", "Improve the tracker in three rounds: (1) add an English toggle; (2) add a \"days to the forum\" counter; (3) make it print well on one A4 page. Then tell me how to share it by link and who will be able to see it.", "حسّن لوحة المتابعة على ثلاث جولات: (1) أضف زراً للإنجليزية؛ (2) أضف عدّاداً «أيام حتى الملتقى»؛ (3) اجعلها تُطبع جيداً في صفحة A4 واحدة. ثم أخبرني كيف أشاركها برابط ومن سيستطيع رؤيتها."]], "rule": null, "no": "12", "id": "12"}, {"okey": "o3", "day": 2, "h": 35, "kind": "st", "ic": "cal", "tools": ["ChatGPT", "Claude"], "lead": null, "nm": {"ar": "نظّم فعاليتك", "en": "Organise your event"}, "out": {"ar": "خطة الفعالية: البرنامج، وجدول اللحظة بلحظة، والدعوات، والمهام، والمخاطر", "en": "The event plan: programme, run of show, invitations, tasks and risks"}, "steps": {"ar": ["من الفكرة إلى خطة: الهدف، والجمهور، والميزانية التقديرية، والجدول الزمني للتحضير", "البرنامج وجدول اللحظة بلحظة (Run of Show)", "المراسم: ترتيب الكلمات والاستقبال والجلوس كمسودة يراجعها قسم المراسم", "الدعوات ورسائل التذكير وتأكيد الحضور", "قائمة المهام والمسؤوليات، وخطة المخاطر والبدائل", "بعد الفعالية: الشكر والتقرير"], "en": ["From idea to plan: goal, audience, indicative budget and preparation timeline", "The programme and the minute-by-minute run of show", "Protocol: the order of speeches, reception and seating as a draft for the protocol section to review", "Invitations, reminders and RSVPs", "The task list and owners, and a risk and contingency plan", "After the event: thanks and the report"]}, "note": {"ar": "تنظيم الفعاليات احتياج مباشر لقسم المراسم. ترتيب الأسبقية والجلوس في المناسبات الرسمية يعتمده قسم المراسم وفق أنظمة الجهة؛ الأداة تقترح مسودة فقط. لا أسماء حقيقية ولا جداول تنقلات؛ استخدم فئات مثل [ضيف رفيع 1].", "en": "Event organisation is a direct need of the protocol section. Precedence and seating at official events are approved by the protocol section under the entity's rules; the tool only proposes a draft. No real names and no movement schedules; use categories such as [senior guest 1]."}, "P": [["13.A", "From idea to event plan", "من الفكرة إلى خطة الفعالية", "ChatGPT / Claude", "Help me plan the \"Government Innovation Forum 2026\" (fictional): two days, 600 participants, 12 sessions, in Abu Dhabi. Ask me 5 questions first, then give me: the goal and audience, the preparation timeline from 8 weeks before to the week after (in a table by week), the teams and their responsibilities, and the indicative budget items (without prices).", "ساعدني أخطط لـ«ملتقى الابتكار الحكومي 2026» (افتراضي): يومان، و600 مشارك، و12 جلسة، في أبوظبي. اسألني 5 أسئلة أولاً، ثم أعطني: الهدف والجمهور، والجدول الزمني للتحضير من 8 أسابيع قبل الملتقى حتى الأسبوع الذي يليه (في جدول حسب الأسبوع)، والفرق ومسؤولياتها، وبنود الميزانية التقديرية (دون أسعار)."], ["13.B", "Run of show", "جدول اللحظة بلحظة", "ChatGPT / Claude", "Write the run of show for the forum's opening ceremony (90 minutes): every item with start time, duration, what happens, who is responsible, the audio-visual cue, and notes. Include guest arrival, the national anthem, the speeches in order, a short film, the launch of the initiatives, and the photo session. Use categories such as [senior guest 1] instead of names.", "اكتب جدول اللحظة بلحظة لحفل افتتاح الملتقى (90 دقيقة): كل فقرة بوقت البداية، والمدة، وما يحدث، والمسؤول، والإشارة الصوتية والمرئية، والملاحظات. يشمل وصول الضيوف، والسلام الوطني، والكلمات بترتيبها، وفيلماً قصيراً، وإطلاق المبادرات، والتصوير الجماعي. استخدم فئات مثل [ضيف رفيع 1] بدل الأسماء."], ["13.C", "Protocol draft: reception and seating", "مسودة المراسم: الاستقبال والجلوس", "ChatGPT / Claude", "Propose a draft for the reception and seating at the opening ceremony: the reception sequence, the front-row seating plan as a simple diagram, and the order of speeches, based on general protocol principles. Use guest categories only, and end with a note that the final order must be approved by the protocol section under the entity's rules.", "اقترح مسودة للاستقبال والجلوس في حفل الافتتاح: تسلسل الاستقبال، ومخطط جلوس الصف الأول كرسم بسيط، وترتيب الكلمات، بناءً على مبادئ البروتوكول العامة. استخدم فئات الضيوف فقط، واختم بملاحظة أن الترتيب النهائي يعتمده قسم المراسم وفق أنظمة الجهة."], ["13.D", "Tasks, reminders and risks", "المهام والتذكيرات والمخاطر", "ChatGPT / Claude", "From the event plan, give me: (1) a task list with owner, due date and status, ready to paste into Excel; (2) three reminder messages to guests (4 weeks, 1 week and 1 day before), in Arabic and English; (3) the 8 most likely risks on the day (for example a speaker's delay, a technical failure, weather) with a contingency for each.", "من خطة الفعالية، أعطني: (1) قائمة مهام بالمسؤول والموعد والحالة جاهزة للصق في Excel؛ (2) ثلاث رسائل تذكير للمدعوين (قبل 4 أسابيع، وأسبوع، ويوم)، بالعربية والإنجليزية؛ (3) أكثر 8 مخاطر محتملة يوم الفعالية (مثل تأخر متحدث، أو عطل تقني، أو الطقس) مع بديل لكل منها."]], "rule": null, "no": "13", "id": "13"}, {"okey": "o4", "day": 2, "h": 25, "kind": "st", "ic": "steps", "tools": ["Claude Cowork", "ChatGPT Work"], "lead": null, "nm": {"ar": "Claude Cowork", "en": "Claude Cowork"}, "out": {"ar": "مهمة متعددة الخطوات على ملفاتك: جمع وقراءة واستخراج وتلخيص، دفعة واحدة", "en": "A multi-step task on your files: collect, read, extract and summarise, all at once"}, "steps": {"ar": ["تفويض مهمة من عدة خطوات دفعة واحدة على ملفاتك", "مثال: قراءة سير المتحدثين، ثم كتيّب البرنامج، ثم ملخص من صفحة", "المقابل في ChatGPT: ChatGPT Work", "موافقة قبل أي حذف أو تنزيل أو إرسال"], "en": ["Delegate a task of several steps at once, on your files", "Example: read the speakers' bios, then the programme booklet, then a one-page summary", "The ChatGPT equivalent: ChatGPT Work", "Approval before any delete, download or send"]}, "note": {"ar": "شدّد على سطر «أخبرني قبل أن تحذف أو تستبدل أي ملف».", "en": "Stress the line \"tell me before you delete or replace any file\"."}, "P": [["14.A", "Task in Cowork", "المهمة في Cowork", "Claude Cowork", "In the forum folder (synthetic files): read the 12 speakers' bios and the session descriptions, build the programme booklet in Word (cover, welcome, two-day programme, a 60-word bio per speaker), and put the session schedule in one Excel table. Tell me before you delete or replace any file.", "في مجلد الملتقى (ملفات افتراضية): اقرأ سير المتحدثين الاثني عشر وأوصاف الجلسات، وابنِ كتيّب البرنامج في Word (الغلاف، والترحيب، وبرنامج اليومين، ونبذة من 60 كلمة لكل متحدث)، وضع جدول الجلسات في جدول Excel واحد. أخبرني قبل أن تحذف أو تستبدل أي ملف."], ["14.B", "The same in ChatGPT Work", "المهمة نفسها في ChatGPT Work", "ChatGPT Work", "Run the same task in ChatGPT Work on the same synthetic forum folder, then compare the result with Cowork: accuracy, the steps it took, and where it asked for approval. Tell me before you delete or replace any file.", "شغّل المهمة نفسها في ChatGPT Work على مجلد الملتقى الافتراضي نفسه، ثم قارن النتيجة بـ Cowork: الدقة، والخطوات التي اتبعها، وأين طلب الموافقة. أخبرني قبل أن تحذف أو تستبدل أي ملف."]], "rule": null, "no": "14", "id": "14"}, {"okey": null, "day": 2, "h": 30, "kind": "st", "ic": "plug", "tools": ["Claude", "ChatGPT", "MCP", "Skills", "Outlook", "Gmail", "Canva"], "lead": null, "nm": {"ar": "الإضافات والمهارات وMCP", "en": "Plugins, skills and MCP"}, "out": {"ar": "الموصلات وربط أدواتك: البريد والتقويم وCanva، بصلاحيات محددة", "en": "Connectors and linking your tools: email, calendar and Canva, with set permissions"}, "steps": {"ar": ["ما الموصلات وMCP، ولماذا تهمّك، وكيف تعمل في Claude وChatGPT", "البريد (Outlook وGmail): فرز طلبات الإعلام والدعوات، ومسودات ردود", "التقويم: مواعيد التحضير للملتقى، وإيجاد موعد مناسب", "Canva: بطاقة الدعوة ومنشورات الملتقى بقالب الجهة", "المهارات (Skills): طريقة عمل محفوظة، ومنها مهارة الهندسة العكسية لقوالب التقارير والمقالات", "صلاحيات محددة وموافقة قبل أي إرسال أو حجز أو نشر"], "en": ["What connectors and MCP are, why they matter, and how they work in Claude and ChatGPT", "Email (Outlook and Gmail): sort media requests and invitations, and draft replies", "Calendar: the forum's preparation milestones, and finding a suitable slot", "Canva: the invitation card and the forum's posts in the entity's template", "Skills: a saved way of working, including the reverse-engineering skill for report and article templates", "Set permissions and approval before any send, booking or publishing"]}, "note": {"ar": "التشبيه الذي ينجح: النموذج هو العقل، وMCP هو الأعصاب، والأدوات هي الأطراف. استخدم حسابات تجريبية للبريد والتقويم وCanva؛ لم يُحسم بعد السماح بربط حسابات الجهة. مهارة اله
