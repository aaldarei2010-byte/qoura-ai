<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F1E8;--panel:#EEE5D6;--card:#FFFFFF;--ink:#16211F;--muted:#5E6D69;--line:#E2D7C6;
  --g:#163832;--g-ink:#F6F1E8;--g-sub:#E2B48A;--g-line:rgba(246,241,232,.35);--g-track:rgba(246,241,232,.16);
  --c:#A0683A;--c-ink:#FFFFFF;--brand:#163832;--labbg:#F9EBDD;
  --rope:#C9A27A;--rope2:#A47A50;--done:#3A7A5C;--done2:#22543E;--ok:#2F7A4E;
  --glow:rgba(160,104,58,.22);--shadow:rgba(22,33,31,.10);--scrim:rgba(10,18,16,.5);
  --f-display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A18;--panel:#13211E;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;
  --g:#1C463D;--g-ink:#F2EBDD;--g-sub:#E2B48A;--g-line:rgba(242,235,221,.30);--g-track:rgba(242,235,221,.14);
  --c:#D39A68;--c-ink:#1A120B;--brand:#E2B48A;--labbg:#2A2219;
  --rope:#8C6B4A;--rope2:#5F4731;--done:#2F5D4E;--done2:#183A32;--ok:#5DBB86;
  --glow:rgba(211,154,104,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18;--panel:#13211E;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;
  --g:#1C463D;--g-ink:#F2EBDD;--g-sub:#E2B48A;--g-line:rgba(242,235,221,.30);--g-track:rgba(242,235,221,.14);
  --c:#D39A68;--c-ink:#1A120B;--brand:#E2B48A;--labbg:#2A2219;
  --rope:#8C6B4A;--rope2:#5F4731;--done:#2F5D4E;--done2:#183A32;--ok:#5DBB86;
  --glow:rgba(211,154,104,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 12px;display:grid;place-items:center}
.mark img{height:52px;display:block}
.ht{flex:1;min-width:220px}
.eyebrow{margin:0;color:var(--c);font-weight:600;font-size:.9rem}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.2vw,2.9rem);line-height:1.15;text-wrap:balance}
html[lang=en] h1{font-family:"IBM Plex Sans",sans-serif}
.lede{margin:4px 0 0;color:var(--muted);font-size:1rem}
.tbtn{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-weight:700}
.tbtn svg{width:20px;height:20px}
/* story */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,1.1fr) minmax(0,1fr);align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.end{display:flex;align-items:center;gap:12px;min-width:0}
.end .n{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--c-ink);font-weight:700}
.end.fin .n{background:var(--ok)}
.end small{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.end b{display:block;font-size:1.05rem;line-height:1.35;text-wrap:balance}
.mid{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mini{height:12px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--rope) 0 7px,var(--rope2) 7px 11px)}
.mid .lg{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.mid .lg img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;border:1px solid var(--line)}
@media (max-width:640px){.story{grid-template-columns:1fr;gap:8px}}
/* presenter bar */
.here{position:relative;overflow:hidden;background:var(--g);color:var(--g-ink);border-radius:18px;padding:12px 16px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hcol{flex:1 1 220px;min-width:0}
.hcol small{display:block;color:var(--g-sub);font-size:.78rem;font-weight:600}
.hcol b{display:block;font-size:1.05rem;line-height:1.35}
.hcol .lt{display:inline-block;background:var(--c);color:var(--c-ink);border-radius:6px;padding:0 6px;font-size:.78rem;margin-inline-end:6px;vertical-align:2px}
.hsep{width:1px;align-self:stretch;background:var(--g-line)}
.hbtns{display:flex;gap:8px;align-items:center}
.hb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;display:grid;place-items:center;font-size:1.15rem}
.hd{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;font-weight:600}
.hb:hover:not([disabled]),.hd:hover{background:var(--c);border-color:var(--c);color:var(--c-ink)}
.hb[disabled]{opacity:.35;cursor:not-allowed}
.kbd{flex-basis:100%;margin:0;font-size:.75rem;color:var(--g-sub)}
.prog{position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--g-track)}
.prog i{display:block;height:100%;width:0;background:var(--g-sub);transition:width .5s ease}
@media (max-width:640px){.hsep{display:none}}
@media (hover:none),(max-width:999px){.kbd{display:none}}
/* map */
.map{position:relative;width:100%;container-type:inline-size}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.r1{fill:var(--rope)}.r2{fill:var(--rope2)}.d1{fill:var(--done)}.d2{fill:var(--done2)}
.rope-base{fill:none;stroke:url(#pRope);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.rope-done{fill:none;stroke:url(#pDone);stroke-width:22;stroke-linecap:butt;stroke-linejoin:round;visibility:hidden;transition:stroke-dasharray .7s ease}
.mk{fill:var(--c)}.mk-tri{fill:var(--c-ink)}
.dayl{position:absolute;inset-inline-start:3%;display:flex;align-items:center;gap:1cqw;transform:translateY(-50%)}
.dayl b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:.35cqw 1.4cqw;font-size:1.35cqw;font-weight:700}
.dayl span{color:var(--c);font-weight:700;font-size:1.4cqw}
.st{position:absolute;width:0;height:0}
.st .lbl{position:absolute;left:0;bottom:3.8cqw;transform:translateX(-50%);width:19cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.25cqw;pointer-events:none}
.st .lbl b{font-size:1.45cqw;line-height:1.25;font-weight:700;text-wrap:balance}
.st .lbl .o{font-size:1.05cqw;line-height:1.35;color:var(--muted);text-wrap:balance}
.tag{display:none;background:var(--c);color:var(--c-ink);font-weight:700;border-radius:999px}
.st .tag{font-size:1cqw;padding:.15cqw .9cqw}
.st.cur .tag.here-t{display:inline-block}
.ltag{display:inline-block;background:var(--labbg);color:var(--c);border:1px dashed var(--c);font-weight:700;border-radius:999px;white-space:nowrap}
.st .ltag{font-size:.95cqw;padding:.1cqw .8cqw}
.st.cur .ltag{display:none}
.dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:5.8cqw;height:5.8cqw;border-radius:50%;background:var(--card);border:.28cqw solid var(--rope);display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 .3cqw .9cqw var(--shadow);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.dot svg{width:2.6cqw;height:2.6cqw;color:var(--ink)}
.dot img.lg{width:3.1cqw;height:3.1cqw;object-fit:contain}
.dot.lab{border-radius:30%;border-style:dashed;border-color:var(--c);background:var(--labbg);width:6.4cqw;height:6.4cqw}
.dot .n{position:absolute;top:-.5cqw;inset-inline-end:-.5cqw;min-width:2.1cqw;height:2.1cqw;padding:0 .3cqw;border-radius:999px;background:var(--c);color:var(--c-ink);font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.dot .l2{position:absolute;bottom:-.4cqw;inset-inline-start:-.4cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}
.dot .l2 img{width:1.5cqw;height:1.5cqw;object-fit:contain}
.st .dot:hover{transform:translate(-50%,-50%) scale(1.07)}
.st.cur .dot{border-color:var(--c);border-style:solid;box-shadow:0 0 0 1cqw var(--glow)}
.st.done .dot{border-color:var(--ok)}
.st.done .dot .n{background:var(--ok)}
.st.dim .lbl b{color:var(--muted)}
.st.dim .dot{opacity:.75}
.st.labst .lbl b{color:var(--c)}
.chips{position:absolute;left:0;top:3.9cqw;transform:translateX(-50%);width:24cqw;display:flex;flex-wrap:wrap;justify-content:center;gap:.45cqw;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--card);border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap;line-height:1.3}
.chip img{width:1.3em;height:1.3em;object-fit:contain}
.chips .chip{padding:.25cqw .8cqw;font-size:.95cqw}
.chip.rule{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.st.cur .chip{border-color:var(--c)}
/* list (phones) */
.list{display:none}
@media (max-width:999px){.map{display:none}.list{display:block}}
.lday{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.lday:first-child{margin-top:0}
.lday b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:3px 14px;font-size:.92rem}
.lday span{color:var(--c);font-weight:700;font-size:.95rem}
.lgroup{display:flex;flex-direction:column}
.li{position:relative;display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;padding:6px 0 18px;cursor:pointer}
.li::before{content:"";position:absolute;inset-inline-start:24px;top:0;bottom:0;width:9px;border-radius:5px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,var(--rope2) 6px 10px)}
.lgroup .li:first-child::before{top:30px}
.lgroup .li:last-child::before{bottom:auto;height:34px}
.li.done::before{background:repeating-linear-gradient(45deg,var(--done) 0 6px,var(--done2) 6px 10px)}
.li .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;z-index:1}
.li .dot svg{width:26px;height:26px}.li .dot img.lg{width:30px;height:30px}
.li .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.li .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.li .dot .l2 img{width:14px;height:14px}
.li.cur .dot{border-color:var(--c);box-shadow:0 0 0 6px var(--glow)}
.li.done .dot{border-color:var(--ok)}
.li.done .dot .n{background:var(--ok)}
.li .tx{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:4px}
.li .tx b{font-size:1.05rem;line-height:1.35}
.li.labli .tx b{color:var(--c)}
.li .tx .o{color:var(--muted);font-size:.88rem;line-height:1.45}
.li .tag{font-size:.72rem;padding:1px 10px}
.li.cur .tag.here-t{display:inline-block}
.li .ltag{font-size:.72rem;padding:0 9px}
.li .cl{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.li .cl .chip{font-size:.74rem;padding:1px 9px}
/* sections */
.sec h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:0 0 10px;text-wrap:balance}
html[lang=en] .sec h2{font-family:"IBM Plex Sans",sans-serif}
.sec .sub{margin:-4px 0 12px;color:var(--muted)}
.focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.fc .h{display:flex;align-items:center;gap:10px}.fc img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)}
.fc b{font-size:1.1rem}.fc span{color:var(--muted);font-size:.92rem}
.fc .k{display:block;color:var(--c);font-weight:700;font-size:.8rem}.fc b{display:block}
.also{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.also small{color:var(--muted);font-weight:600}
.also .chip{padding:3px 10px;font-size:.85rem}
.labs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.labcard{text-align:start;background:var(--labbg);border:1.5px dashed var(--c);border-radius:16px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.labcard .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 52px;width:52px;height:52px;border-width:2px}
.labcard .dot img.lg{width:28px;height:28px}.labcard .dot .n{top:-7px;inset-inline-end:-8px;min-width:24px;height:20px;font-size:.7rem}
.labcard .dot .l2{width:20px;height:20px;bottom:-5px;inset-inline-start:-5px}.labcard .dot .l2 img{width:13px;height:13px}
.labcard small{color:var(--c);font-weight:700;font-size:.78rem}.labcard b{display:block;line-height:1.35}.labcard span{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.outs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.out small{color:var(--c);font-weight:700;font-size:.78rem}
.out b{font-size:1rem;line-height:1.4}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{flex:1 1 100px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.15;color:var(--brand)}
.fact span{color:var(--muted);font-size:.85rem}
@media (max-width:899px){.focus,.labs{grid-template-columns:1fr}.outs{grid-template-columns:1fr}.out{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px}.out small{order:2;white-space:nowrap}}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
/* drawer */
.dr{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);color:var(--ink);width:min(480px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;width:100%;border-radius:20px 20px 0 0}}
.dh{display:flex;align-items:center;gap:12px}
.dh .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;cursor:default;border-color:var(--c)}
.dh .dot svg{width:26px;height:26px}.dh .dot img.lg{width:30px;height:30px}
.dh .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.dh .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.dh .dot .l2 img{width:14px;height:14px}
.dh .tt{min-width:0}
.dh small{color:var(--muted);font-weight:600;font-size:.82rem}
.dh h2{margin:2px 0 0;font-size:1.25rem;line-height:1.3;text-wrap:balance}
.x{margin-inline-start:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1.3rem;line-height:1}
.dout{background:var(--panel);border-radius:12px;padding:12px 14px}
.dout.lab{background:var(--labbg);border:1px dashed var(--c)}
.dout small{display:block;color:var(--c);font-weight:700;font-size:.8rem}
.dout p{margin:2px 0 0;font-weight:600}
.dp h3{margin:0;font-size:.95rem}
.dp ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips .chip{font-size:.85rem;padding:3px 12px}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.pr+details.pr{margin-top:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:var(--g-ink);font-weight:600;cursor:pointer;font-size:.8rem}
.tnote{background:var(--panel);border-radius:12px;padding:10px 14px;font-size:.9rem}.tnote small{display:block;color:var(--muted);font-weight:700}
.drule{margin:0;background:var(--g);color:var(--g-ink);border-radius:12px;padding:10px 14px;font-weight:700}
.dfoot{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.dfoot button{flex:1;border-radius:12px;padding:11px 12px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--card)}
.dfoot button.pri{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.dfoot button[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.here,.tbtn,.dr{display:none!important}.map{display:block!important}.list{display:none!important}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

", "ChatGPT", "Write an 8-point checklist an employee reviews before using any AI output in official correspondence: accuracy, sources, confidentiality, language, tone and human approval.", "اكتب قائمة تحقق من 8 بنود يراجعها الموظف قبل استخدام أي مخرج من الذكاء الاصطناعي في مراسلة رسمية: الدقة، والمصادر، والسرية، واللغة، والنبرة، والاعتماد البشري."], ["2.C", "Hallucination demo", "عرض الهلوسة", "ChatGPT / Claude", "Summarise the report \"National Smart Mobility Strategy 2029\" issued by the Presidential Court. (The report does not exist. Watch whether the tool admits it or invents a summary.)", "لخّص تقرير «الاستراتيجية الوطنية للتنقل الذكي 2029» الصادر عن ديوان الرئاسة. (التقرير غير موجود؛ لاحظ هل تعترف الأداة بذلك أم تختلق ملخصاً.)"]], "rule": {"ar": "الأداة تقترح، والإنسان يقرر", "en": "The tool proposes, the human decides"}, "no": "2", "id": "2"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "compass", "tools": ["ChatGPT", "Claude", "Microsoft Copilot", "Gemini", "Perplexity", "Grok", "Manus", "ElevenLabs", "Kling", "Higgsfield"], "lead": null, "nm": {"ar": "اختر الأداة المناسبة لمهمتك", "en": "Choose the right tool for your task"}, "out": {"ar": "دليل «أي أداة لأي مهمة»", "en": "A \"which tool for which task\" guide"}, "steps": {"ar": ["جولة سريعة على أهم الأدوات", "ثلاث أدوات نتدرب عليها: ChatGPT للإبداع، وClaude لمعظم العمل، وMicrosoft Copilot لبيئة Microsoft", "متى تبحث، ومتى تكتب، ومتى تحلّل"], "en": ["A quick tour of the main tools", "Three tools we train on: ChatGPT for creative work, Claude for most of the work, Microsoft Copilot for Microsoft 365", "When to search, when to write, when to analyse"]}, "note": {"ar": "هنا تُعلَن قاعدة البرنامج: ثلاث أدوات نتدرب عليها، ونعرّف ببقية الأدوات ومتى تُستخدم.", "en": "Announce the programme rule here: three tools we train on, and we know when to use the rest."}, "P": [["3.A", "Same prompt, three tools", "أمر واحد في ثلاث أدوات", "ChatGPT · Claude · Copilot", "Write a 150-word internal memo inviting departments to a coordination meeting on quarterly indicators, in a short formal tone. (Run the same prompt in the three tools and compare.)", "اكتب مذكرة داخلية من 150 كلمة تدعو الإدارات إلى اجتماع تنسيقي لمتابعة المؤشرات الربعية، بنبرة رسمية مختصرة. (شغّل الأمر نفسه في الأدوات الثلاث وقارن.)"], ["3.B", "Sourced research", "بحث موثّق بالمصادر", "Perplexity", "What are the latest UAE government initiatives in artificial intelligence in the last six months? Give me 5 points with a source link for each.", "ما أحدث المبادرات الحكومية في دولة الإمارات في مجال الذكاء الاصطناعي خلال آخر ستة أشهر؟ أعطني 5 نقاط مع رابط المصدر لكل نقطة."]], "rule": null, "no": "3", "id": "3"}, {"okey": "o2", "day": 1, "h": 30, "kind": "st", "ic": "pen", "tools": ["ChatGPT", "Claude", "Microsoft Copilot"], "lead": null, "nm": {"ar": "اكتب أمراً يعطيك النتيجة من المحاولة الأولى", "en": "Write a prompt that works the first time"}, "out": {"ar": "قالب: الدور، السياق، المهمة، الصيغة، القيود", "en": "Template: role, context, task, format, constraints"}, "steps": {"ar": ["العناصر الخمسة لأي أمر ناجح", "تحويل أمر ضعيف إلى أمر قوي", "المراجعة الذاتية والتكرار", "قالب جاهز لمهام عمل المتدرب"], "en": ["The five parts of any good prompt", "Turn a weak prompt into a strong one", "Self-review and iteration", "A ready template for the participant's own tasks"]}, "note": {"ar": "اعرض الأمر الضعيف ثم القوي على الملاحظات نفسها، ودع الفرق يتكلم.", "en": "Show the weak prompt, then the strong one on the same notes, and let the difference speak."}, "P": [["4.A", "Weak vs strong prompt", "أمر ضعيف مقابل أمر قوي", "ChatGPT / Claude / Copilot", "Weak: \"Write a report about the meeting.\"\nStrong: You are an executive adviser in a federal government entity. Context: three departments met to follow up a delayed project (notes below). Task: write executive minutes. Format: a 3-line summary, a decisions table (decision, owner, deadline), then risks. Constraints: under 300 words, formal language, add nothing that is not in he room."}, "P": [["6.A", "Image, then edit", "صورة ثم تعديل", "ChatGPT (images)", "Create a clean, formal illustration of a government team working with AI on laptops, in calm green and sand colours, no text. Then: make the room brighter and add a whiteboard with a simple flowchart.", "أنشئ صورة رسمية نظيفة لفريق حكومي يعمل مع الذكاء الاصطناعي على أجهزة محمولة، بألوان خضراء ورملية هادئة، دون نص. ثم: اجعل القاعة أكثر إشراقاً وأضف سبورة عليها مخطط بسيط."], ["6.B", "Same image in Gemini", "الصورة نفسها في Gemini", "Gemini", "Use the same description to create the image in Gemini, then compare the two results: which one is closer to the request, and which one suits an official presentation better?", "استخدم الوصف نفسه لإنشاء الصورة في Gemini، ثم قارن النتيجتين: أيهما أقرب إلى المطلوب، وأيهما أنسب لعرض رسمي؟"]], "rule": null, "no": "6", "id": "6"}, {"okey": null, "day": 1, "h": 30, "kind": "lab", "ic": "ChatGPT", "tools": ["ChatGPT"], "lead": null, "nm": {"ar": "هوية مبادرة «أفق»", "en": "The \"Ufuq\" initiative identity"}, "out": {"ar": "الاسم والعبارة التعريفية والألوان والشعار البصري ومنشور الإطلاق، ونبذة مهنية شخصية", "en": "Name, slogan, colours, logo and launch post, plus a personal professional bio"}, "steps": {"ar": ["ملخص الهوية", "الشعار البصري", "منشور الإطلاق", "النبذة المهنية الشخصية"], "en": ["Brand brief", "Logo", "Launch post", "Personal professional bio"]}, "note": {"ar": "«أفق» مبادرة داخلية افتراضية ترافقنا في كل التدريبات؛ ما يُبنى هنا يُستخدم في Claude وCopilot لاحقاً.", "en": "\"Ufuq\" is a synthetic internal initiative that runs through every lab; what is built here is reused in Claude and Copilot later."}, "P": [["T1.A", "Brand brief", "ملخص الهوية", "ChatGPT", "Create a brand brief for \"Ufuq\", a synthetic internal government initiative that helps employees adopt AI in their daily work: three name options with meaning, a slogan in Arabic and English, a colour palette (3 colours with hex codes and why), the tone of voice in 3 words, and 3 key messages.", "أنشئ ملخص هوية لمبادرة «أفق»، وهي مبادرة حكومية داخلية افتراضية تساعد الموظفين على تبنّي الذكاء الاصطناعي في عملهم اليومي: ثلاثة خيارات للاسم مع المعنى، وعبارة تعريفية بالعربية والإنجليزية، ولوحة ألوان (3 ألوان برموزها وسبب اختيار كل لون)، ونبرة الصوت في 3 كلمات، و3 رسائل رئيسية."], ["T1.B", "Logo", "الشعار البصري", "ChatGPT (images)", "Design a simple, modern logo for \"Ufuq\" using the palette above: a horizon line with a rising arc, flat style, white background, no text inside the symbol, suitable for a government initiative. Then give me a second version with the Arabic word «أفق» next to the symbol.", "صمّم شعاراً بصرياً بسيطاً وعصرياً لمبادرة «أفق» بلوحة الألوان السابقة: خط أفق مع قوس صاعد، بأسلوب مسطح، وخلفية بيضاء، ودون نص داخل الرمز، ومناسب لمبادرة حكومية. ثم أعطني نسخة ثانية بكلمة «أفق» بجانب الرمز."], ["T1.C", "Launch post", "منشور الإطلاق", "ChatGPT", "Write a launch post for \"Ufuq\" for the internal staff portal (under 80 words, Arabic and English) and create a matching square image in the brand colours.", "اكتب منشور إطلاق لمبادرة «أفق» لبوابة الموظفين الداخلية (أقل من 80 كلمة، بالعربية والإنجليزية)، وأنشئ صورة مربعة مطابقة بألوان الهوية."], ["T1.D", "Personal branding", "العلامة الشخصية", "ChatGPT", "Interview me with 5 questions about my role, achievements and skills, then write a professional bio (LinkedIn \"About\" section, under 150 words) and a one-line headline, in Arabic and English.", "اسألني 5 أسئلة عن دوري وإنجازاتي ومهاراتي، ثم اكتب نبذة مهنية (قسم «نبذة» في LinkedIn، أقل من 150 كلمة) وسطراً تعريفياً واحداً، بالعربية والإنجليزية."]], "rule": null, "no": "T1", "id": "T1"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "screen", "tools": ["Microsoft Copilot", "Claude", "Manus", "Gemini"], "lead": "Microsoft Copilot", "nm": {"ar": "حوّل تقريراً إلى عرض تقديمي", "en": "Turn a report into a presentation"}, "out": {"ar": "عرض جاهز، ومعه صفحة تعريفية أو فيديو قصير", "en": "A ready deck, plus a web page or a short video"}, "steps": {"ar": ["من تقرير إلى عرض بهوية الجهة (PowerPoint وClaude)", "صفحة تعريفية أو فيديو قصير للمحتوى نفسه", "تحسين النتيجة بطلبات متتالية"], "en": ["From a report to a deck in the house style (PowerPoint and Claude)", "A landing page or short video for the same content", "Improve the result with follow-up requests"]}, "note": {"ar": "اعرض Manus وVeo عرضاً سريعاً فقط؛ التدريب على Copilot وClaude.", "en": "Show Manus and Veo as a quick demo only; the hands-on is in Copilot and Claude."}, "P": [["7.A", "Deck in PowerPoint", "عرض في PowerPoint", "Copilot in PowerPoint", "Create a presentation from the file [report.docx] in 8 slides: title, summary, 3 content slides, risks, decisions needed, next steps. Formal design, with speaker notes.", "أنشئ عرضاً تقديمياً من الملف [report.docx] في 8 شرائح: العنوان، والخلاصة، و3 شرائح محتوى، والمخاطر، والقرارات المطلوبة، والخطوات التالية. بتصميم رسمي، مع ملاحظات للمتحدث."], ["7.B", "From briefing to deck", "من الإحاطة إلى عرض", "Claude", "Turn this briefing into an 8-slide deck for a leadership meeting: title, summary, 3 content slides, risks, decisions needed, next steps. For each slide: the title, up to 3 points and a speaker note.", "حوّل هذه الإحاطة إلى عرض تقديمي من 8 شرائح لاجتماع قيادي: العنوان، والخلاصة، و3 شرائح محتوى، والمخاطر، والقرارات المطلوبة، والخطوات التالية. لكل شريحة: العنوان، و3 نقاط بحد أقصى، وملاحظة للمتحدث."], ["7.C", "Short video", "فيديو قصير", "Gemini (Veo)", "Create an 8-second video that introduces the report's main message: a calm office scene, a screen showing a rising chart, formal green and sand colours, no text in the frames.", "أنشئ فيديو مدته 8 ثوانٍ يقدّم الرسالة الرئيسية للتقرير: مشهد مكتبي هادئ، وشاشة تعرض مخططاً صاعداً، بألوان خضراء ورملية رسمية، ودون نص داخل المشاهد."]], "rule": null, "no": "7", "id": "7"}, {"okey": "o3", "day": 1, "h": 25, "kind": "st", "ic": "folder", "tools": ["Claude"], "lead": "Claude", "nm": {"ar": "أنشئ مساحة عمل تتذكر ملفك", "en": "Build a workspace that remembers your file"}, "out": {"ar": "سياق دائم لمشروعك ومخرجات جاهزة", "en": "Lasting context for your project, and ready outputs"}, "steps": {"ar": ["مساحة واحدة لكل ملف أو مشروع متكرر (Projects)", "ترفع المراجع مرة وتستخدمها كل مرة", "تُنتج منها موقعاً أو عرضاً أو لوحة جاهزة (Artifacts)"], "en": ["One workspace per recurring file or project (Projects)", "Upload references once, use them every time", "Produce a website, deck or dashboard from it (Artifacts)"]}, "note": {"ar": "ارفع هوية «أفق» من تدريب ChatGPT كملف مرجعي؛ هكذا تتصل التدريبات.", "en": "Upload the Ufuq identity from the ChatGPT lab as a reference file; that is how the labs connect."}, "P": [["8.A", "Project instructions", "تعليمات المشروع", "Claude Projects", "You are the content assistant for the \"Ufuq\" initiative. Rely only on the uploaded files and follow the brand brief: colours, tone and key messages. Write in formal Arabic, cite the source file for every fact, and say \"not in the files\" when information is missing.", "أنت مساعد المحتوى لمبادرة «أفق». اعتمد فقط على الملفات المرفوعة والتزم بملخص الهوية: الألوان والنبرة والرسائل الرئيسية. اكتب بالعربية الرسمية، واذكر الملف المصدر لكل معلومة، وقل «غير موجود في الملفات» عند غياب المعلومة."]], "rule": null, "no": "8", "id": "8"}, {"okey": null, "day": 1, "h": 35, "kind": "lab", "ic": "Claude", "tools": ["Claude"], "lead": null, "nm": {"ar": "موقع وعرض ولوحة لمبادرة «أفق»", "en": "Website, deck and dashboard for \"Ufuq\""}, "out": {"ar": "موقع «أفق»، وعرض تقديمي، ولوحة متابعة بهويتها", "en": "The Ufuq website, a deck and a tracking dashboard in its identity"}, "steps": {"ar": ["صفحة الموقع", "العرض التقديمي", "لوحة المتابعة"], "en": ["Website page", "Presentation", "Tracking dashboard"]}, "note": {"ar": "الهدف أن يرى كل مشارك مخرجاً حياً بهوية بناها بنفسه قبل ساعة.", "en": "The goal: every participant sees a live output in an identity they built an hour ago."}, "P": [["T2.A", "The website", "الموقع", "Claude Artifacts", "Using the Ufuq brand brief, build a one-page bilingual Arabic and English website: hero with slogan, what the initiative is, 3 programmes, a timeline, and a registration form. Use the brand colours, as one HTML file.", "باستخدام ملخص هوية «أفق»، ابنِ موقعاً من صفحة واحدة بالعربية والإنجليزية: واجهة تحمل الشعار، وتعريف بالمبادرة، و3 برامج، وجدول زمني، ونموذج تسجيل. بألوان الهوية، في ملف HTML واحد."], ["T2.B", "The deck", "العرض التقديمي", "Claude", "Build an 8-slide launch deck for Ufuq for a leadership meeting: title, the problem, the initiative, 3 programmes, timeline, KPIs, risks, decision needed. Brand colours, one idea per slide, speaker notes on each slide.", "ابنِ عرض إطلاق من 8 شرائح لمبادرة «أفق» لاجتماع قيادي: العنوان، والمشكلة، والمبادرة، و3 برامج، والجدول الزمني، ومؤشرات الأداء، والمخاطر، والقرار المطلوب. بألوان الهوية، وفكرة واحدة لكل شريحة، وملاحظات للمتحدث."], ["T2.C", "The dashboard", "لوحة المتابعة", "Claude Artifacts", "From the attached synthetic registrations file, build an interactive dashboard: registrations by department, by week and by programme, a completion rate, and a filter by department. Brand colours, Arabic labels.", "من ملف التسجيلات الافتراضي المرفق، ابنِ لوحة متابعة تفاعلية: التسجيلات حسب الإدارة والأسبوع والبرنامج، ونسبة الإكمال، وتصفية حسب الإدارة. بألوان الهوية وعناوين عربية."]], "rule": null, "no": "T2", "id": "T2"}, {"okey": null, "day": 1, "h": 20, "kind": "st", "ic": "chart", "tools": ["Excel", "Microsoft Copilot", "Claude"], "lead": "Excel", "nm": {"ar": "حلّل جدولاً واستخرج مؤشراته", "en": "Analyse a table and pull out its indicators"}, "out": {"ar": "تنظيف ومعادلات ورسم بياني في دقائق", "en": "Cleaning, formulas and a chart in minutes"}, "steps": {"ar": ["تنظيف بيانات غير مرتبة", "كتابة المعادلات بالوصف بدل الحفظ", "رسم بياني وملخص للنتائج"], "en": ["Clean messy data", "Write formulas by describing them", "A chart and a summary of the results"]}, "note": {"ar": "استخدم ملف التسجيلات الافتراضي نفسه في Copilot وClaude وقارن.", "en": "Use the same synthetic registrations file in Copilot and Claude and compare."}, "P": [["9.A", "Clean and analyse", "تنظيف وتحليل", "Copilot in Excel / Claude in Excel", "Standardise the date formats, remove duplicates, add a column for days since registration, then show the 3 departments with the most registrations and a weekly trend chart.", "وحّد صيغ التواريخ، واحذف المكرر، وأضف عموداً لعدد الأيام منذ التسجيل، ثم اعرض أكثر 3 إدارات تسجيلاً ومخططاً للاتجاه الأسبوعي."], ["9.B", "Write formulas", "كتابة المعادلات", "Claude in Excel / Copilot", "Write a formula that counts delay days for each request between \"Received\" and \"Completed\", highlight requests delayed more than 5 working days, and explain the formula in one line.", "اكتب معادلة تحسب أيام التأخير لكل طلب بين «تاريخ الاستلام» و«تاريخ الإنجاز»، ولوّن الطلبات المتأخرة أكثر من 5 أيام عمل، واشرح المعادلة في سطر واحد."]], "rule": null, "no": "9", "id": "9"}, {"okey": null, "day": 1, "h": 30, "kind": "lab", "ic": "Microsoft Copilot", "tools": ["Microsoft Copilot", "Excel"], "lead": null, "nm": {"ar": "عرض PowerPoint وتحليل Excel لـ «أفق»", "en": "PowerPoint deck and Excel analysis for \"Ufuq\""}, "out": {"ar": "عرض PowerPoint، وملف Excel محلّل، وبريد متابعة", "en": "A PowerPoint deck, an analysed Excel file and a follow-up email"}, "steps": {"ar": ["عرض من مستند", "تحليل التسجيلات", "بريد المتابعة"], "en": ["A deck from a document", "Analyse registrations", "Follow-up email"]}, "note": {"ar": "قارن عرض Copilot بعرض Claude من التدريب السابق: متى تستخدم كل واحد؟", "en": "Compare the Copilot deck with the Claude deck from the previous lab: when would you use each?"}, "P": [["T3.A", "Deck from a document", "عرض من مستند", "Copilot in PowerPoint", "Create a 7-slide presentation from the file [Ufuq_brief.docx]: title, objectives, programmes, timeline, KPIs, risks, next steps. Use a clean, formal design and add speaker notes.", "أنشئ عرضاً من 7 شرائح من الملف [Ufuq_brief.docx]: العنوان، والأهداف، والبرامج، والجدول الزمني، ومؤشرات الأداء، والمخاطر، والخطوات التالية. بتصميم رسمي نظيف، مع ملاحظات للمتحدث."], ["T3.B", "Registrations analysis", "تحليل التسجيلات", "Copilot in Excel", "Analyse the registrations table: completion rate by department, the week with the highest drop-off, and three recommendations. Add a chart and a PivotTable on a new sheet.", "حلّل جدول التسجيلات: نسبة الإكمال حسب الإدارة، والأسبوع الذي شهد أعلى نسبة انسحاب، وثلاث توصيات. أضف مخططاً وجدولاً محورياً في ورقة جديدة."], ["T3.C", "Follow-up email", "بريد المتابعة", "Copilot in Outlook", "Draft an email to department heads with the Ufuq results above: 3 key numbers, one request (nominate 2 champions per department by Thursday), and a polite closing. Under 120 words.", "اكتب بريداً لمديري الإدارات يعرض نتائج «أفق» السابقة: 3 أرقام رئيسية، وطلب واحد (ترشيح سفيرين لكل إدارة قبل الخميس)، وخاتمة مهذبة. أقل من 120 كلمة."]], "rule": null, "no": "T3", "id": "T3"}, {"okey": "o4", "day": 2, "h": 25, "kind": "st", "ic": "chat", "tools": ["Custom GPT"], "lead": "ChatGPT", "nm": {"ar": "ابنِ مساعداً لمهمة تتكرر عندك", "en": "Build an assistant for a task you repeat"}, "out": {"ar": "مساعد يجيب من دليل الإجراءات", "en": "An assistant that answers from the procedures guide"}, "steps": {"ar": ["اختيار مهمة متكررة من قائمتك", "تزويد المساعد بالتعليمات والمراجع", "تجربته على أسئلة من واقع العمل"], "en": ["Pick a recurring task from your list", "Give the assistant instructions and references", "Test it on real work questions"]}, "note": {"ar": "اطلب من كل مشارك اختيار مهمته من قائمة المهام الخمس.", "en": "Ask each participant to pick their task from the five-task list."}, "P": [["10.A", "Official correspondence assistant", "مساعد المراسلات الرسمية", "ChatGPT (Custom GPT)", "You are the \"Official Correspondence Assistant\". Draft internal and external correspondence following the attached style guide. Always ask for: the recipient, the purpose and the level of formality. Never invent numbers or names. End every draft with \"For review before sending\". Starters: Write a thank-you letter to a partner entity / Draft an internal circular / Proofread this letter.", "أنت «مساعد المراسلات الرسمية». مهمتك صياغة المراسلات الداخلية والخارجية وفق دليل الأسلوب المرفق. اسأل دائماً عن: الجهة المرسل إليها، والغرض، ودرجة الرسمية. لا تخترع أرقاماً أو أسماء. اختم كل مسودة بعبارة «للمراجعة قبل الإرسال». بدايات المحادثة: اكتب خطاب شكر لجهة شريكة / صُغ تعميماً داخلياً / راجع هذا الخطاب لغوياً."], ["10.B", "Brand voice Custom GPT", "Custom GPT بصوت الجهة", "ChatGPT (Custom GPT)", "You are the brand voice of [initiative]. Write all content in the attached tone guide: formal, warm, short. Always ask for the audience and channel. Never invent numbers or names. End every draft with \"For review before publishing\".", "أنت المتحدث بصوت [اسم المبادرة]. اكتب كل المحتوى وفق دليل النبرة المرفق: رسمي، ودود، مختصر. اسأل دائماً عن الجمهور والقناة. لا تخترع أرقاماً أو أسماء. اختم كل مسودة بعبارة «للمراجعة قبل النشر»."]], "rule": null, "no": "10", "id": "10"}, {"okey": null, "day": 2, "h": 30, "kind": "st", "ic": "steps", "tools": ["Claude", "Claude Cowork"], "lead": "Claude", "nm": {"ar": "سلّم مهمة متعددة الخطوات", "en": "Hand over a multi-step task"}, "out": {"ar": "مثل تجهيز ملف اجتماع، مع حفظ طريقتك مهارةً قابلة لإعادة الاستخدام", "en": "Like preparing a meeting pack, and save your method as a skill"}, "steps": {"ar": ["تفويض مهمة من عدة خطوات دفعة واحدة (Cowork)", "مثال: جمع المراجع، ثم التلخيص، ثم جدول الأعمال", "حفظ الطريقة مهارةً تُستدعى بضغطة واحدة (Skills)"], "en": ["Delegate a multi-step task in one go (Cowork)", "Example: gather references, summarise, then build the agenda", "Save the method as a one-click skill (Skills)"]}, "note": {"ar": "شدّد على سطر «أخبرني قبل أن تحذف أو تستبدل أي ملف».", "en": "Stress the line \"tell me before you delete or replace any file\"."}, "P": [["11.A", "A Cowork task", "مهمة في Cowork", "Claude Cowork", "In the attached folder (synthetic files): read the five monthly department reports, extract the key indicators into one Excel table, then write a one-page executive summary in a Word file. Tell me before you delete or replace any file.", "في المجلد المرفق (ملفات افتراضية): اقرأ تقارير الإدارات الشهرية الخمسة، واستخرج المؤشرات الرئيسية في جدول Excel واحد، ثم اكتب ملخصاً تنفيذياً من صفحة واحدة في ملف Word. أخبرني قبل أن تحذف أو تستبدل أي ملف."], ["11.B", "Formal briefing skill", "مهارة الإحاطة الرسمية", "Claude Skills", "Help me create a Claude skill called \"Formal briefing style\": summary first in 3 lines, then background, options and recommendation, in formal Arabic and under one page. Write the full SKILL.md file.", "ساعدني في إنشاء مهارة Claude باسم «أسلوب الإحاطة الرسمية»: الخلاصة أولاً في 3 أسطر، ثم الخلفية، ثم الخيارات، ثم التوصية، بلغة عربية رسمية وأقل من صفحة. اكتب ملف SKILL.md كاملاً."]], "rule": null, "no": "11", "id": "11"}, {"okey": null, "day": 2, "h": 25, "kind": "st", "ic": "flow", "tools": ["n8n", "Claude"], "lead": null, "nm": {"ar": "أتمت فرز الطلبات الواردة", "en": "Automate sorting incoming requests"}, "out": {"ar": "فهم الأتمتة بـ n8n وأمثلة جاهزة", "en": "Understand n8n automation, with ready examples"}, "steps": {"ar": ["أساسيات n8n: مشغّل، بيانات، قرار، إجراء", "مثال: وارد ← تصنيف ← توجيه تلقائي مع إشعار", "ربط n8n بـ Claude وبناء سير العمل بوصفه نصياً", "متى تؤتمت ومتى تبقى المهمة يدوية"], "en": ["n8n basics: trigger, data, decision, action", "Example: incoming → classify → route automatically with a notification", "Connect n8n to Claude and build a flow by describing it", "When to automate and when a task stays manual"]}, "note": {"ar": "عرض وأمثلة فقط دون تدريب عملي؛ اعرض سيراً جاهزاً يعمل واشرح أجزاءه الأربعة.", "en": "Demo and examples only, no hands-on; show a ready, working flow and explain its four parts."}, "P": [["12.A", "Build the workflow", "بناء السير", "Claude → n8n", "Build me an n8n workflow. Trigger: a new email to the Ufuq inbox. Classify it as registration, partnership request, enquiry or sensitive matter, with a confidence score. Registration → a row in the registrations sheet and a confirmation draft. Partnership request → suggest three slots from the calendar. Sensitive or confidence under 80% → alert the initiative lead, no action. Show me the structure first, and do not enable it until I approve.", "ابنِ لي سير عمل في n8n. المُشغّل: بريد جديد إلى صندوق «أفق». صنّف الرسالة إلى: تسجيل، أو طلب شراكة، أو استفسار، أو أمر حساس، مع درجة ثقة. التسجيل ← صف في جدول التسجيلات ومسودة تأكيد. طلب الشراكة ← اقتراح ثلاثة مواعيد من التقويم. الحساس أو الثقة أقل من 80% ← تنبيه لقائد المبادرة دون أي إجراء. اعرض الهيكل أولاً، ولا تفعّله إلا بعد موافقتي."], ["12.B", "Three test emails", "ثلاث رسائل اختبار", "Claude", "Write three synthetic test emails for the Ufuq workflow: a clear registration, a partnership request, and an ambiguous message that should escalate. For each, give the expected path.", "اكتب ثلاث رسائل اختبار افتراضية لسير «أفق»: تسجيل واضح، وطلب شراكة، ورسالة غامضة يجب أن تُصعَّد. لكل رسالة اذكر المسار المتوقع."], ["12.C", "Automate or not?", "نؤتمت أم لا؟", "Claude", "Rate these five tasks [list] on frequency, clarity of steps, cost of error and need for human judgment. For each, recommend: full automation, automation with review, or stays manual.", "قيّم هذه المهام الخمس [القائمة] حسب: التكرار، ووضوح الخطوات، وكلفة الخطأ، والحاجة لحكم بشري. وأوصِ لكل منها: أتمتة كاملة، أو أتمتة مع مراجعة، أو تبقى يدوية."]], "rule": null, "no": "12", "id": "12"}, {"okey": null, "day": 2, "h": 25, "kind": "st", "ic": "plug", "tools": ["MCP", "Claude"], "lead": "MCP", "nm": {"ar": "اربط المساعد بأدوات عملك", "en": "Connect the assistant to your work tools"}, "out": {"ar": "البريد والتقويم والملفات، بصلاحيات محددة", "en": "Email, calendar and files, with set permissions"}, "steps": {"ar": ["ما الموصلات وMCP، ولماذا تهمّك", "ربط المساعد بالبريد والتقويم والملفات", "الإضافات وClaude في المتصفح", "صلاحيات محددة وموافقة قبل أي إجراء"], "en": ["What connectors and MCP are, and why they matter", "Connect the assistant to email, calendar and files", "Plugins and Claude in the browser", "Set permissions and approval before any action"]}, "note": {"ar": "التشبيه الذي ينجح: النموذج هو العقل، وMCP هو الأعصاب، والأدوات هي الأطراف.", "en": "The analogy that works: the model is the brain, MCP the nerves, the tools the limbs."}, "P": [["13.A", "Tool-access map", "خريطة صلاحيات الأدوات", "Claude", "For an assistant that prepares the director's morning briefing, list every connector it needs (email, calendar, files, tasks). For each: what it may read, what it may write, and what needs human approval. Drafts only, no sending. A table, then 5 rules.", "لمساعد يجهّز إحاطة الصباح للمدير، حدد كل موصل يحتاجه (البريد، التقويم، الملفات، المهام). لكل موصل: ما يحق له قراءته، وما يحق له كتابته، وما يتطلب موافقة بشرية. مسودات فقط دون إرسال. جدول ثم 5 قواعد."]], "rule": null, "no": "13", "id": "13"}, {"okey": null, "day": 2, "h": 25, "kind": "st", "ic": "sun", "tools": ["Claude", "Scheduled tasks"], "lead": "Claude", "nm": {"ar": "استلم ملخصك جاهزاً قبل الدوام", "en": "Get your summary before the workday starts"}, "out": {"ar": "تقرير صباحي ونشرة أسبوعية تصلك تلقائياً", "en": "A morning report and a weekly digest that arrive on their own"}, "steps": {"ar": ["تحديد ما يهمك كل صباح", "جدولة المهمة لتعمل وحدها (Scheduled Tasks)", "روتين يبني على ما سبقه (Routines)", "تقرير جاهز قبل بداية الدوام"], "en": ["Decide what matters to you each morning", "Schedule the task to run on its own (Scheduled Tasks)", "A routine that builds on the last run (Routines)", "A report ready before the workday"]}, "note": {"ar": "اجعل كل مشارك يضبط النشرة الأسبوعية على بريده؛ أكثر أمر يستمر استخدامه بعد التدريب.", "en": "Have every participant set the weekly digest to their own email; it is the prompt people keep using after training."}, "P": [["14.A", "Daily morning brief", "الموجز الصباحي اليومي", "Claude (scheduled task, daily 07:30)", "Every working day at 07:30: read today's email and calendar (sandbox account) and write a 5-line brief: meetings, decisions needed, deadlines and what needs follow-up. Save it as a draft. Do not send anything.", "كل يوم عمل الساعة 07:30: اقرأ بريد وتقويم اليوم (حساب تجريبي)، واكتب موجزاً من 5 أسطر: الاجتماعات، والقرارات المطلوبة، والمواعيد النهائية، وما يحتاج متابعة. احفظه كمسودة، ولا ترسل شيئاً."], ["14.B", "Weekly AI updates by email", "نشرة الذكاء الاصطناعي الأسبوعية", "Claude (scheduled task, Mondays 08:00)", "Every Monday at 08:00: search the web for the most important AI updates from the past 7 days (new models, new features in ChatGPT, Claude, Gemini and Microsoft Copilot, and AI news in the UAE). Pick the top 7: headline, two lines on what changed, why it matters for a government team, and the source link. Email it to me with the subject \"AI Weekly | [date]\", or save it as a draft if sending is not available.", "كل يوم اثنين الساعة 08:00: ابحث عن أهم تحديثات الذكاء الاصطناعي خلال آخر 7 أيام (النماذج الجديدة، والميزات الجديدة في ChatGPT وClaude وGemini وMicrosoft Copilot، وأخبار الذكاء الاصطناعي في الإمارات). اختر أهم 7: العنوان، وسطرين عمّا تغيّر، ولماذا يهم فريقاً حكومياً، ورابط المصدر. أرسلها إلى بريدي بعنوان «نشرة الذكاء الاصطناعي | [التاريخ]»، أو احفظها كمسودة إن لم يتوفر الإرسال."]], "rule": null, "no": "14", "id": "14"}, {"okey": null, "day": 2, "h": 40, "kind": "lab", "ic": "Claude", "tools": ["Claude", "Claude Cowork"], "lead": null, "nm": {"ar": "أتمتة «أفق» بـ Claude", "en": "Automating \"Ufuq\" with Claude"}, "out": {"ar": "فرز البريد الوارد، وروتين تقرير أسبوعي، ومهمة Cowork منجزة", "en": "Inbox triage, a weekly report routine and a completed Cowork task"}, "steps": {"ar": ["فرز بريد «أفق» الوارد إلى مسودات ومهام", "روتين تقرير «أفق» الأسبوعي", "مهمة Cowork على ملفات المبادرة"], "en": ["Sort the Ufuq inbox into drafts and tasks", "The Ufuq weekly report routine", "A Cowork task on the initiative files"]}, "note": {"ar": "استخدم حسابات تجريبية، وتأكد أن البريد متصل قبل التدريب.", "en": "Use sandbox accounts, and check email is connected before the lab."}, "P": [["T4.A", "Inbox triage", "فرز البريد الوارد", "Claude (connectors)", "Read the last 20 emails in the Ufuq inbox (sandbox account). Classify each as registration, partnership request, enquiry or sensitive matter. For registrations, add a row to the registrations sheet; for partnership requests, propose three slots from my calendar; for anything sensitive or unclear, list it for me and take no action. Create drafts only; send nothing.", "اقرأ آخر 20 رسالة في صندوق «أفق» (حساب تجريبي). صنّف كل رسالة: تسجيل، أو طلب شراكة، أو استفسار، أو أمر حساس. للتسجيل أضف صفاً في جدول التسجيلات، ولطلب الشراكة اقترح ثلاثة مواعيد من تقويمي، وأي أمر حساس أو غير واضح اعرضه عليّ دون أي إجراء. أنشئ مسودات فقط، ولا ترسل شيئاً."], ["T4.B", "Weekly report routine", "روتين التقرير الأسبوعي", "Claude Routines (Sundays 08:00)", "Every Sunday at 08:00: read the Ufuq registrations file and last week's report, compare them, and write the weekly report: new registrations, completion rate, departments falling behind, and the top 3 actions. Save it with the date and create a draft email to the initiative lead.", "كل يوم أحد الساعة 08:00: اقرأ ملف تسجيلات «أفق» وتقرير الأسبوع الماضي، وقارن بينهما، واكتب التقرير الأسبوعي: التسجيلات الجديدة، ونسبة الإكمال، والإدارات المتأخرة، وأهم 3 إجراءات. احفظه بالتاريخ وأنشئ مسودة بريد لقائد المبادرة."], ["T4.C", "Cowork task", "مهمة Cowork", "Claude Cowork", "In the Ufuq folder: read the five department feedback files, extract the main themes into an Excel table, and write a one-page summary in Word with 3 recommendations. Tell me before you delete or replace any file.", "في مجلد «أفق»: اقرأ ملفات ملاحظات الإدارات الخمس، واستخرج المحاور الرئيسية في جدول Excel، واكتب ملخصاً من صفحة واحدة في Word مع 3 توصيات. أخبرني قبل أن تحذف أو تستبدل أي ملف."]], "rule": null, "no": "T4", "id": "T4"}, {"okey": null, "day": 2, "h": 25, "kind": "st", "ic": "robot", "tools": ["Copilot Studio"], "lead": "Copilot Studio", "nm": {"ar": "صمّم موظفاً رقمياً لإجراء في إدارتك", "en": "Design a digital employee for a process in your department"}, "out": {"ar": "مهامه وأدواته، ومتى يرجع إليك", "en": "Its tasks and tools, and when it comes back to you"}, "steps": {"ar": ["اختيار إجراء متكرر من قائمتك", "تحديد مهامه وأدواته وحدود صلاحيته", "متى يتوقف ويرجع إلى الإنسان", "أتمتة ثابتة أم روتين أم وكيل؟"], "en": ["Pick a recurring process from your list", "Define its tasks, tools and limits", "When it stops and returns to a human", "Fixed automation, routine or agent?"]}, "note": {"ar": "التصميم على الورق أولاً؛ البناء في التدريب التالي.", "en": "Design on paper first; building happens in the next lab."}, "P": [["15.A", "Design my agent", "صمّم وكيلي", "Claude", "Design an agent for [a task from your work]: goal, users, knowledge sources, tools, what it does on its own, what it escalates to a human and when, and three test questions. Then tell me: would fixed automation or a scheduled routine be enough instead of an agent, and why?", "صمّم وكيلاً لمهمة [مهمة من عملك]: الهدف، والمستخدمون، ومصادر المعرفة، والأدوات، وما يفعله وحده، وما يصعّده للإنسان ومتى، وثلاثة أسئلة اختبار. ثم أخبرني: هل تكفي أتمتة ثابتة أو روتين مجدول بدلاً من وكيل؟ ولماذا؟"], ["15.B", "Which layer?", "أي مستوى يناسب؟", "Claude", "For these five tasks [list], recommend for each: fixed automation, a scheduled routine, or an agent. Explain in one line why, and name the human escalation point for any agent.", "لهذه المهام الخمس [القائمة]، أوصِ لكل منها: أتمتة ثابتة، أو روتين مجدول، أو وكيل. اشرح السبب في سطر، وحدد نقطة التصعيد البشري لأي وكيل."]], "rule": null, "no": "15", "id": "15"}, {"okey": null, "day": 2, "h": 80, "kind": "lab", "ic": "Copilot Studio", "tools": ["Copilot Studio", "Microsoft Copilot"], "lead": null, "nm": {"ar": "ابنِ وكيلك الأول وجرّبه", "en": "Build your first agent and test it"}, "out": {"ar": "«مساعد أفق» يعمل ومختبر، ثم وكيل على حالة من قائمتك", "en": "The Ufuq Assistant working and tested, then an agent on a case from your list"}, "steps": {"ar": ["بناء الوكيل خطوة بخطوة", "تجربته على حالات حدّية", "تحسينه حسب النتائج", "النشر لمجموعة تجريبية في Teams"], "en": ["Build the agent step by step", "Test it on edge cases", "Improve it from the results", "Publish to a pilot group in Teams"]}, "note": {"ar": "أهم تدريب في البرنامج. لا تنتقل للختام قبل أن يجتاز كل وكيل الاختبار.", "en": "The most important lab. Do not move to the close until every agent passes the test."}, "P": [["T5.A", "Build the Ufuq Assistant", "بناء «مساعد أفق»", "Copilot Studio", "Create an agent called \"Ufuq Assistant\". Instructions: answer staff questions about the Ufuq initiative only from the attached files (brief, programmes, FAQ); cite the file for each answer; if the answer is not found, say so and direct the person to the initiative team; never answer about personal data. Starters: How do I register? / Which programme suits my role? / When is the next session?", "أنشئ وكيلاً باسم «مساعد أفق». التعليمات: أجب عن أسئلة الموظفين حول مبادرة «أفق» من الملفات المرفقة فقط (الملخص، والبرامج، والأسئلة الشائعة)؛ واذكر الملف لكل إجابة؛ وإذا لم تجد الإجابة فقل ذلك ووجّه السائل إلى فريق المبادرة؛ ولا تُجب عن أي بيانات شخصية. أسئلة البداية: كيف أسجّل؟ / أي برنامج يناسب دوري؟ / متى الجلسة القادمة؟"], ["T5.B", "Test the agent", "اختبار الوكيل", "Copilot Studio", "Test with five questions: one in the files / one not in the files / one in colloquial wording / one about a colleague's data / one outside the scope. Check it cites the source, admits what it does not know, refuses the sensitive one and points to the right team.", "اختبر بخمسة أسئلة: سؤال موجود في الملفات / سؤال غير موجود / سؤال بصياغة عامية / سؤال عن بيانات زميل / طلب خارج النطاق. تحقق أنه يذكر المصدر، ويعترف بما لا يعرفه، ويرفض الحساس، ويوجّه إلى الفريق الصحيح."], ["T5.C", "Policies & procedures agent", "وكيل السياسات والإجراءات", "Copilot Studio", "Create an agent called \"Policies & Procedures Assistant\". Instructions: answer staff questions only from the attached policy guides, cite the guide and clause for every answer, say so when the answer is not found and direct the person to the right department, and never answer questions about personal data or individual decisions. Starters: How do I submit a leave request? / What is the process for an official mission? / Who do I contact for procurement requests?", "أنشئ وكيلاً باسم «مساعد السياسات والإجراءات». التعليمات: أجب عن أسئلة الموظفين من أدلة السياسات المرفقة فقط، واذكر اسم الدليل والبند لكل إجابة، وإذا لم تجد الإجابة فقل ذلك ووجّه السائل إلى الإدارة المختصة، ولا تُجب عن أي سؤال يخص بيانات شخصية أو قرارات فردية. أسئلة البداية: كيف أقدّم طلب إجازة؟ / ما إجراء المهمة الرسمية؟ / بمن أتواصل في طلبات المشتريات؟"]], "rule": null, "no": "T5", "id": "T5"}, {"okey": "o5", "day": 2, "h": 25, "kind": "st", "ic": "flag", "tools": [], "lead": null, "nm": {"ar": "قدّم مشروعك الختامي", "en": "Present your final project"}, "out": {"ar": "مهمة من قائمتك أصبحت تعمل تلقائياً", "en": "A task from your list that now runs on its own"}, "steps": {"ar": ["عرض المشروع أمام الزملاء", "مقارنة الوقت قبل وبعد", "اعتماد بطاقة الحوكمة"], "en": ["Present the project to colleagues", "Compare the time before and after", "Sign off the governance card"]}, "note": {"ar": "القاعدة الجامعة لليومين: الأداة تقترح، والإنسان يقرر، والمؤسسة توثّق.", "en": "The rule for both days: the tool proposes, the human decides, the organisation documents."}, "P": [["16.A", "Governance card", "بطاقة الحوكمة", "Claude", "Write a one-page governance card for my agent: name and purpose, accountable owner, data sources and permissions, what it never does, escalation point, logging, periodic review, and the stop switch with who holds it.", "اكتب بطاقة حوكمة من صفحة واحدة للوكيل الذي بنيته: الاسم والغرض، والمالك المسؤول، ومصادر البيانات وصلاحياتها، وما لا يفعله أبداً، ونقطة التصعيد، والتسجيل، والمراجعة الدورية، وزر الإيقاف ومن يملكه."]], "rule": {"ar": "الأداة تقترح، والإنسان يقرر", "en": "The tool proposes, the human decides"}, "no": "16", "id": "  here:"We are here",next:"Next",overview:"Journey overview",end:"End of the journey",det:"Station details",prev:"Previous",nxt:"Next",kbd:"While presenting: → for next, ← for previous.",
 st:"Station",of:"of",lab:"Lab",labOf:"Hands-on lab",out:"Output",labOut:"What participants build",what:"What happens here",labWhat:"Lab steps",tools:"Tools",cmds:"Ready prompts",runIn:"Run in",copy:"Copy",copied:"Copied",tnote:"Trainer note",min:"min",
 focusH:"Three tools we train on in depth",focusS:"We also show the other tools so participants know when to use each one.",also:"Also shown:",
 focus:{ChatGPT:["Creative work","Images, identity, branding, content, and Custom GPT"],Claude:["Most of the work","Projects, websites, decks, dashboards, Cowork and automation"],CopilotMS:["Microsoft 365","PowerPoint, Excel, Word, Outlook, and agents in Copilot Studio"]},
 labsH:"Hands-on labs: the \"Ufuq\" initiative from identity to agent",labsS:"\"Ufuq\" is a synthetic internal initiative that runs through every lab; what is built in one lab is reused in the next.",
 outsH:"What every employee leaves with",outs:{o1:"A list of their tasks AI can speed up",o2:"A ready prompt template for their work",o3:"A workspace that remembers their file",o4:"An assistant for a recurring task",o5:"A task from their list that runs on its own"},
 factsH:"The programme in numbers",facts:[["500","employees"],["17","cohorts"],["30","per cohort"],["2","training days"],["10","training hours per cohort"]],
 foot:"Qoura AI · all examples are synthetic"}};
let lang="ar";
const nSt=S.filter(s=>s.kind!=="lab").length,nLab=N-nSt;
/* geometry */
const VBW=1200,R1=[960,720,480,240],R2=[240,480,720,960],LX=190,RX=1010;
const rows=[];[1,2].forEach(d=>{const a=S.filter(s=>s.day===d);for(let k=0;k<a.length;k+=4)rows.push(a.slice(k,k+4));});
const Y=[];let y=200,prevDay=1,panels=[];let pTop=16;
rows.forEach((r,i)=>{if(i>0){if(r[0].day!==prevDay){panels.push([pTop,y+150]);pTop=y+180;y+=400;}else y+=290;}Y.push(y);prevDay=r[0].day;});
panels.push([pTop,y+170]);const VBH=y+190;
const POS={};rows.forEach((r,i)=>r.forEach((s,k)=>POS[s.id]=[(i%2===0?R1:R2)[k],Y[i]]));
let d=`M1150 ${Y[0]}`;rows.forEach((r,i)=>{const last=i===rows.length-1;if(last){const lx=POS[r[r.length-1].id][0];d+=` L${i%2===0?lx-110:lx+110} ${Y[i]}`;}else{const ry=(Y[i+1]-Y[i])/2;d+=i%2===0?` L${LX} ${Y[i]} A135 ${ry} 0 0 0 ${LX} ${Y[i+1]}`:` L${RX} ${Y[i]} A135 ${ry} 0 0 1 ${RX} ${Y[i+1]}`;}});
const dayY={1:panels[0][0]+44,2:panels[1][0]+44};
function dotHTML(s){const lg=s.lead?logoOf(s.lead):(s.kind==="lab"?logoOf(s.ic):null);const l2=s.kind==="lab"&&s.tools[1]?logoOf(s.tools[1]):(lg==="Excel"&&s.tools[1]?logoOf(s.tools[1]):null);
 return `${l2&&l2!==lg?`<span class="l2"><img src="${LOGO[l2]}" alt=""></span>`:""}${lg?`<img class="lg" src="${LOGO[lg]}" alt="">`:ico(s.ic)}<span class="n">${s.no}</span>`;}
const chip=x=>{const l=logoOf(x);return `<span class="chip">${l?`<img src="${LOGO[l]}" alt="">`:""}${esc(x)}</span>`;};
const chipsOf=s=>s.tools.map(chip).join("")+(s.rule?`<span class="chip rule">${esc(s.rule[lang])}</span>`:"");
function build(){const t=T[lang];root.lang=lang;root.dir=t.dir;
 $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede([nSt,nLab]);$("langBtn").textContent=t.lang;$("foot").textContent=t.foot;
 const tl=["ChatGPT","Claude","CopilotMS","Gemini","Perplexity","Grok","Manus","ElevenLabs","Kling","Higgsfield","Excel","n8n","MCP","Copilot"];
 $("story").innerHTML=`<div class="end"><span class="n">${S.find(s=>s.okey==="o1").no}</span><div><small>${t.storyA[0]}</small><b>${t.storyA[1]}</b></div></div><div class="mid"><div class="mini"></div><div class="lg">${tl.map(k=>`<img src="${LOGO[k]}" alt="">`).join("")}</div></div><div class="end fin"><span class="n">${nSt}</span><div><small>${t.storyB[0]}</small><b>${t.storyB[1]}</b></div></div>`;
 $("hereL").textContent=t.here;$("nextL").textContent=t.next;$("detBtn").textContent=t.det;$("kbd").textContent=t.kbd;
 $("prevBtn").textContent=lang==="ar"?"→":"←";$("nextBtn").textContent=lang==="ar"?"←":"→";
 // map
 const flipX=x=>lang==="ar"?x:VBW-x;
 let h=`<div style="position:relative;width:100%;aspect-ratio:${VBW}/${VBH}"><svg class="rope" viewBox="0 0 ${VBW} ${VBH}" aria-hidden="true" style="${lang==="en"?"transform:scaleX(-1)":""}"><defs><pattern id="pRope" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect class="r1" width="12" height="12"/><rect class="r2" width="4.5" height="12"/></pattern><pattern id="pDone" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect class="d1" width="12" height="12"/><rect class="d2" width="4.5" height="12"/></pattern></defs>
 ${panels.map(([a,b])=>`<rect class="panel" x="16" y="${a}" width="1168" height="${b-a}" rx="30"/>`).join("")}
 <path id="ropePath" class="rope-base" d="${d}"/><path id="ropeDone" class="rope-done" d="${d}"/><circle class="mk" cx="1150" cy="${Y[0]}" r="21"/><polygon class="mk-tri" points="1157,${Y[0]-10} 1157,${Y[0]+10} 1141,${Y[0]}"/></svg>`;
 [1,2].forEach(dn=>{h+=`<div class="dayl" style="top:${dayY[dn]/VBH*100}%"><b>${t.days[dn][0]}</b><span>${t.days[dn][1]}</span></div>`;});
 S.forEach((s,i)=>{const [x,yy]=POS[s.id],lab=s.kind==="lab";
  h+=`<div class="st ${lab?"labst":""}" data-i="${i+1}" style="left:${flipX(x)/VBW*100}%;top:${yy/VBH*100}%"><div class="lbl"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span></div><button class="dot ${lab?"lab":""}" type="button" aria-label="${esc(s.nm[lang])}">${dotHTML(s)}</button>${(s.tools.length||s.rule)?`<div class="chips">${chipsOf(s)}</div>`:""}</div>`;});
 $("map").innerHTML=h+`</div>`;
 // list
 let l="";[1,2].forEach(dn=>{l+=`<div class="lday"><b>${t.days[dn][0]}</b><span>${t.days[dn][1]}</span></div><div class="lgroup">`;
  S.forEach((s,i)=>{if(s.day!==dn)return;const lab=s.kind==="lab";l+=`<button type="button" class="li ${lab?"labli":""}" data-i="${i+1}"><span class="dot ${lab?"lab":""}">${dotHTML(s)}</span><span class="tx"><span class="tag here-t">${t.here}</span>${lab?`<span class="ltag">${t.lab} ${s.no}</span>`:""}<b>${esc(s.nm[lang])}</b><span class="o">${esc(s.out[lang])}</span>${(s.tools.length||s.rule)?`<span class="cl">${chipsOf(s)}</span>`:""}</span></button>`;});l+=`</div>`;});
 $("list").innerHTML=l;
 // sections
 $("focusSec").innerHTML=`<h2>${t.focusH}</h2><p class="sub">${t.focusS}</p><div class="focus">${["ChatGPT","Claude","CopilotMS"].map(k=>`<div class="fc"><div class="h"><img src="${LOGO[k]}" alt=""><div><span class="k">${t.focus[k][0]}</span><b>${k==="CopilotMS"?"Microsoft Copilot":k}</b></div></div><span>${t.focus[k][1]}</span></div>`).join("")}</div><div class="also"><small>${t.also}</small>${["Gemini","Perplexity","Grok","Manus","ElevenLabs","Kling","Higgsfield","n8n","MCP","Copilot Studio"].map(chip).join("")}</div>`;
 $("labsSec").innerHTML=`<h2>${t.labsH}</h2><p class="sub">${t.labsS}</p><div class="labs">${S.map((s,i)=>s.kind!=="lab"?"":`<button type="button" class="labcard" data-i="${i+1}"><span class="dot lab">${dotHTML(s)}</span><span><small>${t.lab} ${s.no} · ${t.days[s.day][0]} · ${s.h} ${t.min}</small><b>${esc(s.nm[lang])}</b><span>${esc(s.out[lang])}</span></span></button>`).join("")}</div>`;
 $("outsSec").innerHTML=`<h2>${t.outsH}</h2><div class="outs">${S.filter(s=>s.okey).map(s=>`<div class="out"><small>${t.st} ${s.no}</small><b>${t.outs[s.okey]}</b></div>`).join("")}</div>`;
 $("factsSec").innerHTML=`<h2>${t.factsH}</h2><div class="facts">${t.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div>`;
 L=[];render(false);if(open)fillDr(open);}
/* rope progress */
let total=0,L=[];
function measure(){if(L.length)return;const rp=$("ropePath");if(!rp)return;try{total=rp.getTotalLength();if(!total)return;const pts=[];for(let s=0;s<=total;s+=4){const p=rp.getPointAtLength(s);pts.push([s,p.x,p.y]);}
 L=S.map(s=>{const q=POS[s.id];let best=0,bd=Infinity;pts.forEach(p=>{const dd=(p[1]-q[0])**2+(p[2]-q[1])**2;if(dd<bd){bd=dd;best=p[0];}});return best;});}catch(e){L=[];}}
let cur=0,open=0,lastFocus=null;const mq=matchMedia("(min-width:1000px)"),reduce=matchMedia("(prefers-reduced-motion: reduce)");
const lblOf=s=>`${s.kind==="lab"?`<span class="lt">${T[lang].lab} ${s.no}</span>`:`${s.no} · `}${esc(s.nm[lang])}`;
function render(scroll){const t=T[lang];
 document.querySelectorAll("[data-i]").forEach(el=>{const i=+el.dataset.i;if(el.classList.contains("labcard"))return;el.classList.toggle("done",cur>0&&i<cur);el.classList.toggle("cur",i===cur);el.classList.toggle("dim",cur>0&&i>cur);});
 $("hereNow").innerHTML=cur?lblOf(S[cur-1]):t.overview;$("hereNext").innerHTML=cur<N?lblOf(S[cur]):t.end;
 $("prevBtn").disabled=cur===0;$("nextBtn").disabled=cur===N;$("detBtn").hidden=cur===0;$("progBar").style.width=(cur/N*100)+"%";
 measure();const rd=$("ropeDone");if(L.length&&rd){rd.style.strokeDasharray=cur?(L[cur-1]+" "+total):("0 "+total);rd.style.visibility=cur?"visible":"hidden";}
 if(scroll&&cur){const el=document.querySelector(mq.matches?`.st[data-i="${cur}"] .dot`:`.li[data-i="${cur}"]`);if(el){const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-40)el.scrollIntoView({block:"center",behavior:reduce.matches?"auto":"smooth"});}}}
const setCur=(n,sc)=>{cur=Math.max(0,Math.min(N,n));render(sc);};
function fillDr(n){const t=T[lang],s=S[n-1],lab=s.kind==="lab";
 $("dp").innerHTML=`<div class="dh"><div class="dot ${lab?"lab":""}">${dotHTML(s)}</div><div class="tt"><small>${t.days[s.day][0]} · ${lab?`${t.labOf} ${s.no}`:`${t.st} ${s.no} ${t.of} ${nSt}`} · ${s.h} ${t.min}</small><h2>${esc(s.nm[lang])}</h2></div><button class="x" id="drClose" type="button" aria-label="×">×</button></div>
 <div class="dout ${lab?"lab":""}"><small>${lab?t.labOut:t.out}</small><p>${esc(s.out[lang])}</p></div>
 <h3>${lab?t.labWhat:t.what}</h3><ol>${s.steps[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
 ${s.tools.length?`<div><h3 style="margin-bottom:8px">${t.tools}</h3><div class="tchips">${s.tools.map(chip).join("")}</div></div>`:""}
 ${s.P.length?`<div><h3 style="margin-bottom:8px">${t.cmds} (${s.P.length})</h3>${s.P.map((p,i)=>`<details class="pr"><summary><b><bdi>${p[0]}</bdi></b> ${esc(lang==="ar"?p[2]:p[1])}</summary><div class="pmeta">${t.runIn}: ${esc(p[3])}</div><div class="ptext" dir="${t.dir}">${esc(lang==="ar"?p[5]:p[4])}</div><button class="cp" type="button" data-p="${i}">${t.copy}</button></details>`).join("")}</div>`:""}
 ${MODE==="trainer"?`<div class="tnote"><small>${t.tnote}</small>${esc(s.note[lang])}</div>`:""}
 ${s.rule?`<p class="drule">${esc(s.rule[lang])}</p>`:""}
 <div class="dfoot"><button type="button" id="drPrev" ${n===1?"disabled":""}>${lang==="ar"?"→":"←"} ${t.prev}</button><button type="button" id="drNext" class="pri" ${n===N?"disabled":""}>${t.nxt} ${lang==="ar"?"←":"→"}</button></div>`;
 $("drClose").onclick=closeDr;$("drPrev").onclick=()=>go(open-1);$("drNext").onclick=()=>go(open+1);
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.p],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copied;setTimeout(()=>b.textContent=t.copy,1500);});}
function openDr(n){if(!open)lastFocus=document.activeElement;open=n;fillDr(n);$("dr").hidden=false;$("drClose").focus();}
function go(n){if(n<1||n>N)return;open=n;setCur(n,true);fillDr(n);$("drClose").focus();}
function closeDr(){$("dr").hidden=true;open=0;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.addEventListener("click",e=>{const t=e.target.closest(".st .dot, .li, .labcard");if(!t)return;const host=t.closest("[data-i]");const n=+host.dataset.i;setCur(n,false);openDr(n);});
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});
$("prevBtn").onclick=()=>setCur(cur-1,true);$("nextBtn").onclick=()=>setCur(cur+1,true);$("detBtn").onclick=()=>{if(cur)openDr(cur);};
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const fwd=lang==="ar"?"ArrowLeft":"ArrowRight",back=lang==="ar"?"ArrowRight":"ArrowLeft";
 if(open){if(e.key==="Escape"){closeDr();e.preventDefault();}else if(e.key===fwd){go(open+1);e.preventDefault();}else if(e.key===back){go(open-1);e.preventDefault();}return;}
 if(e.key===fwd){setCur(cur+1,true);e.preventDefault();}else if(e.key===back){setCur(cur-1,true);e.preventDefault();}});
const onMq=()=>{L=[];render(false);};if(mq.addEventListener)mq.addEventListener("change",onMq);
$("themeBtn").onclick=()=>{const t=root.getAttribute("data-theme");const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.setAttribute("data-theme",dark?"light":"dark");};
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";build();};
build();
})();
