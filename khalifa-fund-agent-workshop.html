<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة وكيل خدمة العملاء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>document.documentElement.setAttribute("data-style","b")</script>
<style>
/* Layout: one-day snake map (3 stops per row) → concept table → agent architecture → outcomes. Two switchable styles: A blueprint grid, B chat flow. */
:root{
  --bg:#EDF1F5;--panel:#E2E8EF;--card:#FFFFFF;--ink:#0F1E2E;--muted:#55677A;--line:#C9D4DF;
  --g:#0F2A44;--g-ink:#F3F6F9;--g-sub:#EDB451;--g-line:rgba(243,246,249,.32);--g-track:rgba(243,246,249,.16);
  --c:#A86A12;--c-ink:#FFFFFF;--brand:#0F2A44;--labbg:#FAF0DC;--bubble:transparent;
  --rope:#7D93A9;--rope2:#5C7690;--done:#1F7A5A;--ok:#1F7A5A;--grid:rgba(15,42,68,.075);
  --glow:rgba(168,106,18,.22);--shadow:rgba(15,30,46,.10);--scrim:rgba(8,16,26,.55);
  --pat:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);--pat-size:28px 28px;
  --r:8px;--r-lg:10px;--dot-r:22%;--rope-w:6;--rope-dash:16 10;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1724;--panel:#10202F;--card:#142738;--ink:#E6EDF3;--muted:#9AACBD;--line:#25394D;
  --g:#133252;--g-ink:#EEF3F7;--g-sub:#F0BE62;--g-line:rgba(238,243,247,.28);--g-track:rgba(238,243,247,.14);
  --c:#E8B14F;--c-ink:#1A1205;--brand:#F0BE62;--labbg:#2A2414;
  --rope:#4F6B87;--rope2:#3A536C;--done:#3BA37C;--ok:#4CC08F;--grid:rgba(160,190,220,.06);
  --glow:rgba(232,177,79,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1724;--panel:#10202F;--card:#142738;--ink:#E6EDF3;--muted:#9AACBD;--line:#25394D;
  --g:#133252;--g-ink:#EEF3F7;--g-sub:#F0BE62;--g-line:rgba(238,243,247,.28);--g-track:rgba(238,243,247,.14);
  --c:#E8B14F;--c-ink:#1A1205;--brand:#F0BE62;--labbg:#2A2414;
  --rope:#4F6B87;--rope2:#3A536C;--done:#3BA37C;--ok:#4CC08F;--grid:rgba(160,190,220,.06);
  --glow:rgba(232,177,79,.25);--shadow:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);color-scheme:dark}
/* Style B: chat flow */
:root[data-style="b"]{
  --bg:#F1F6FB;--panel:#E3EEF8;--card:#FFFFFF;--ink:#10243A;--muted:#57697D;--line:#D2E0EC;
  --g:#1C77B8;--g-ink:#FFFFFF;--g-sub:#FFDDB5;--g-line:rgba(255,255,255,.4);--g-track:rgba(255,255,255,.2);
  --c:#D44E27;--c-ink:#FFFFFF;--brand:#1C77B8;--labbg:#FFEFE8;--bubble:#FFFFFF;
  --rope:#8CCAF0;--rope2:#3E9BD8;--done:#2BA36B;--ok:#228A58;--grid:rgba(28,119,184,.16);
  --glow:rgba(212,78,39,.2);--shadow:rgba(16,36,58,.10);
  --pat:radial-gradient(var(--grid) 1.3px,transparent 1.6px);--pat-size:18px 18px;
  --r:18px;--r-lg:24px;--dot-r:50%;--rope-w:20;--rope-dash:none;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root[data-style="b"]:not([data-theme="light"]){
  --bg:#0C1622;--panel:#11202F;--card:#15283A;--ink:#E8F0F7;--muted:#9FB3C6;--line:#263C52;
  --g:#17649C;--g-ink:#FFFFFF;--g-sub:#FFD0A0;--c:#FF7A52;--c-ink:#1B0B04;--brand:#6DB8EC;--labbg:#2B1A14;--bubble:#15283A;
  --rope:#2B6A98;--rope2:#4C9AD3;--done:#2F8F63;--ok:#4CC08F;--grid:rgba(110,170,230,.12);--glow:rgba(255,122,82,.25);--shadow:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-style="b"][data-theme="dark"]{
  --bg:#0C1622;--panel:#11202F;--card:#15283A;--ink:#E8F0F7;--muted:#9FB3C6;--line:#263C52;
  --g:#17649C;--g-ink:#FFFFFF;--g-sub:#FFD0A0;--c:#FF7A52;--c-ink:#1B0B04;--brand:#6DB8EC;--labbg:#2B1A14;--bubble:#15283A;
  --rope:#2B6A98;--rope2:#4C9AD3;--done:#2F8F63;--ok:#4CC08F;--grid:rgba(110,170,230,.12);--glow:rgba(255,122,82,.25);--shadow:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background-color:var(--bg);background-image:var(--pat);background-size:var(--pat-size);color:var(--ink);font-family:var(--f-body);line-height:1.55}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;display:grid;place-items:center}
.mark img{height:50px;display:block}
.ht{flex:1;min-width:240px}
.eyebrow{margin:0;color:var(--c);font-weight:600;font-size:.9rem}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.2;text-wrap:balance}
html[lang=en] h1,html[lang=en] .sec h2{font-family:"IBM Plex Sans",sans-serif}
.lede{margin:6px 0 0;color:var(--muted)}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{height:42px;min-width:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-weight:700}
.tbtn svg{width:20px;height:20px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--g);color:var(--g-ink)}
/* story */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(40px,1.1fr) minmax(0,1fr);align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px}
.end{display:flex;align-items:center;gap:12px;min-width:0}
.end .n{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:var(--dot-r);background:var(--c);color:var(--c-ink);font-weight:700;font-family:var(--f-mono);font-size:.8rem}
.end.fin .n{background:var(--ok);color:#fff}
.end small{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.end b{display:block;font-size:1.02rem;line-height:1.4;text-wrap:balance}
.mid{display:flex;flex-direction:column;gap:6px}
.mini{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--rope) 0 14px,transparent 14px 22px)}
:root[data-style="b"] .mini{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--rope),var(--rope2))}
.mid .lg{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.mid .lg img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;border:1px solid var(--line)}
@media (max-width:640px){.story{grid-template-columns:1fr;gap:10px}}
/* presenter bar */
.here{position:relative;overflow:hidden;background:var(--g);color:var(--g-ink);border-radius:var(--r-lg);padding:12px 16px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hcol{flex:1 1 220px;min-width:0}
.hcol small{display:block;color:var(--g-sub);font-size:.78rem;font-weight:600}
.hcol b{display:block;font-size:1.05rem;line-height:1.35}
.hcol .lt{display:inline-block;background:var(--c);color:var(--c-ink);border-radius:6px;padding:0 6px;font-size:.78rem;margin-inline-end:6px;vertical-align:2px}
.hsep{width:1px;align-self:stretch;background:var(--g-line)}
.hbtns{display:flex;gap:8px;align-items:center}
.hb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;display:grid;place-items:center;font-size:1.15rem}
.hd{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--g-line);background:transparent;color:var(--g-ink);cursor:pointer;font-weight:600}
.hb:hover:not([disabled]),.hd:hover{background:var(--c);border-color:var(--c);color:var(--c-ink)}
.hb[disabled]{opacity:.35;cursor:not-allowed}
.kbd{flex-basis:100%;margin:0;font-size:.75rem;color:var(--g-sub)}
.prog{position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--g-track)}
.prog i{display:block;height:100%;width:0;background:var(--g-sub);transition:width .5s ease}
@media (max-width:640px){.hsep{display:none}}
@media (hover:none),(max-width:999px){.kbd{display:none}}
/* map */
.map{position:relative;width:100%;container-type:inline-size}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5;opacity:.92}
.rope-base{fill:none;stroke:var(--rope);stroke-width:var(--rope-w);stroke-dasharray:var(--rope-dash);stroke-linecap:round;stroke-linejoin:round}
:root[data-style="b"] .rope-base{stroke:url(#gRope)}
.rope-done{fill:none;stroke:var(--done);stroke-width:var(--rope-w);stroke-linecap:round;stroke-linejoin:round;visibility:hidden;transition:stroke-dasharray .7s ease}
.mk{fill:var(--c)}.mk-tri{fill:var(--c-ink)}
.dayl{position:absolute;inset-inline-start:3%;display:flex;align-items:center;gap:1cqw;transform:translateY(-50%)}
.dayl b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:.35cqw 1.4cqw;font-size:1.35cqw;font-weight:700}
.dayl span{color:var(--c);font-weight:700;font-size:1.4cqw}
.st{position:absolute;width:0;height:0}
.st .lbl{position:absolute;left:0;bottom:4.2cqw;transform:translateX(-50%);width:25cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3cqw;pointer-events:none;background:var(--bubble);border-radius:1.6cqw;padding:.5cqw .8cqw}
:root[data-style="b"] .st .lbl{box-shadow:0 .2cqw .8cqw var(--shadow)}
.st .lbl b{font-size:1.5cqw;line-height:1.3;font-weight:700;text-wrap:balance}
.st .lbl .o{font-size:1.08cqw;line-height:1.4;color:var(--muted);text-wrap:balance}
.tm{font-family:var(--f-mono);font-weight:600;color:var(--muted);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.st .tm{font-size:.95cqw}
.tag{display:none;background:var(--c);color:var(--c-ink);font-weight:700;border-radius:999px}
.st .tag{font-size:1cqw;padding:.15cqw .9cqw}
.st.cur .tag.here-t{display:inline-block}
.ltag{display:inline-block;background:var(--labbg);color:var(--c);border:1px dashed var(--c);font-weight:700;border-radius:999px;white-space:nowrap}
.st .ltag{font-size:.95cqw;padding:.1cqw .8cqw}
.st.cur .ltag{display:none}
.dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:6cqw;height:6cqw;border-radius:var(--dot-r);background:var(--card);border:.28cqw solid var(--rope2);display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 .3cqw .9cqw var(--shadow);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.dot svg{width:2.7cqw;height:2.7cqw;color:var(--ink)}
.dot img.lg{width:3.2cqw;height:3.2cqw;object-fit:contain}
.dot.lab{border-style:dashed;border-color:var(--c);background:var(--labbg);width:6.6cqw;height:6.6cqw}
.dot.brk{width:4.4cqw;height:4.4cqw;border-style:dotted}
.dot.brk svg{width:2cqw;height:2cqw;color:var(--muted)}
.dot .n{position:absolute;top:-.5cqw;inset-inline-end:-.5cqw;min-width:2.1cqw;height:2.1cqw;padding:0 .3cqw;border-radius:999px;background:var(--c);color:var(--c-ink);font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.dot .l2{position:absolute;bottom:-.4cqw;inset-inline-start:-.4cqw;width:2.4cqw;height:2.4cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}
.dot .l2 img{width:1.5cqw;height:1.5cqw;object-fit:contain}
.st .dot:hover{transform:translate(-50%,-50%) scale(1.07)}
.st.cur .dot{border-color:var(--c);border-style:solid;box-shadow:0 0 0 1cqw var(--glow)}
.st.done .dot{border-color:var(--ok)}
.st.done .dot .n{background:var(--ok);color:#fff}
.st.dim .lbl b{color:var(--muted)}
.st.dim .dot{opacity:.75}
.st.labst .lbl b{color:var(--c)}
.chips{position:absolute;left:0;top:4cqw;transform:translateX(-50%);width:26cqw;display:flex;flex-wrap:wrap;justify-content:center;gap:.45cqw;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:.4em;background:var(--card);border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap;line-height:1.3}
.chip img{width:1.3em;height:1.3em;object-fit:contain}
.chips .chip{padding:.25cqw .8cqw;font-size:.95cqw}
.chip.rule{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.st.cur .chip{border-color:var(--c)}
/* list (phones) */
.list{display:none}
@media (max-width:999px){.map{display:none}.list{display:block}}
.lday{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.lday:first-child{margin-top:0}
.lday b{background:var(--g);color:var(--g-ink);border-radius:999px;padding:3px 14px;font-size:.92rem}
.lday span{color:var(--c);font-weight:700;font-size:.95rem}
.lgroup{display:flex;flex-direction:column}
.li{position:relative;display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;padding:6px 0 18px;cursor:pointer}
.li::before{content:"";position:absolute;inset-inline-start:25px;top:0;bottom:0;width:6px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--rope) 0 12px,transparent 12px 20px)}
:root[data-style="b"] .li::before{width:9px;inset-inline-start:24px;background:linear-gradient(180deg,var(--rope),var(--rope2))}
.lgroup .li:first-child::before{top:30px}
.lgroup .li:last-child::before{bottom:auto;height:34px}
.li.done::before{background:var(--done)}
.li .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;z-index:1}
.li .dot svg{width:26px;height:26px}.li .dot img.lg{width:30px;height:30px}
.li .dot.brk{flex-basis:56px;width:56px;height:56px}.li .dot.brk svg{width:22px;height:22px}
.li .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.li .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.li .dot .l2 img{width:14px;height:14px}
.li.cur .dot{border-color:var(--c);box-shadow:0 0 0 6px var(--glow)}
.li.done .dot{border-color:var(--ok)}
.li .tx{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:2px}
.li .tm{font-size:.75rem}
.li .tx b{font-size:1.05rem;line-height:1.35}
.li.labli .tx b{color:var(--c)}
.li .tx .o{color:var(--muted);font-size:.88rem;line-height:1.45}
.li .tag{font-size:.72rem;padding:1px 10px}
.li.cur .tag.here-t{display:inline-block}
.li .ltag{font-size:.72rem;padding:0 9px}
.li .cl{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.li .cl .chip{font-size:.74rem;padding:1px 9px}
/* sections */
.sec h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:0 0 6px;text-wrap:balance}
.sec .sub{margin:0 0 14px;color:var(--muted);max-width:70ch}
.tblw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.93rem}
th{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.02em;background:var(--panel)}
tr:last-child td{border-bottom:0}
td.cn b{display:block;direction:ltr;unicode-bidi:isolate;text-align:start;font-family:var(--f-mono);font-size:.88rem}
td.cn small{color:var(--muted);font-size:.78rem}
.grp{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-top:4px}
.grp.k3{color:var(--c);border-color:var(--c);background:var(--labbg)}
.stn{display:flex;gap:4px;flex-wrap:wrap}
.stn button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 7px;cursor:pointer;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.stn button:hover{border-color:var(--c);color:var(--c)}
.callout{margin-top:12px;background:var(--labbg);border:1px dashed var(--c);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.callout b{color:var(--c)}
/* architecture */
.arch{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 14px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.node .k{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--c);display:inline-flex;gap:6px;align-items:center}
.node .k img{width:18px;height:18px}
.node b{font-size:.98rem}
.node span{font-size:.82rem;color:var(--muted)}
.node.hero{background:var(--g);color:var(--g-ink);border-color:var(--g);padding:14px 22px}
.node.hero .k{color:var(--g-sub)}.node.hero span{color:var(--g-sub)}
.node.ok{border-color:var(--ok)}.node.ok .k{color:var(--ok)}
.node.esc{border-style:dashed;border-color:var(--c);background:var(--labbg)}
.arw{color:var(--muted);font-size:1.2rem;line-height:1}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:880px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:600px}
.arch .cap{margin:10px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:700px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* growth */
.grow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:g}
.gs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gs small{font-family:var(--f-mono);color:var(--c);font-weight:600;font-size:.76rem}
.gs b{font-size:.98rem;line-height:1.4}
.gs span{font-size:.82rem;color:var(--muted)}
@media (max-width:899px){.grow{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:899px){.two{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.box h3{margin:0 0 8px;font-size:1.02rem}
.box ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.box li{font-size:.93rem}
.box li span{color:var(--muted)}
.outs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.out{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.out small{color:var(--c);font-weight:700;font-size:.78rem}
.out b{font-size:1rem;line-height:1.4}
@media (max-width:899px){.outs{grid-template-columns:1fr}.out{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px}.out small{order:2;white-space:nowrap}}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{flex:1 1 110px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.2;color:var(--brand)}
.fact span{color:var(--muted);font-size:.85rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
/* drawer */
.dr{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-start;z-index:20}
.dp{background:var(--card);color:var(--ink);width:min(500px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;width:100%;border-radius:20px 20px 0 0}}
.dh{display:flex;align-items:center;gap:12px}
.dh .dot{position:relative;left:auto;top:auto;transform:none;flex:0 0 56px;width:56px;height:56px;border-width:3px;cursor:default;border-color:var(--c)}
.dh .dot svg{width:26px;height:26px}.dh .dot img.lg{width:30px;height:30px}
.dh .dot .n{top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;font-size:.72rem;border-width:2px;padding:0 4px}
.dh .dot .l2{width:22px;height:22px;bottom:-4px;inset-inline-start:-4px}.dh .dot .l2 img{width:14px;height:14px}
.dh .tt{min-width:0}
.dh small{color:var(--muted);font-weight:600;font-size:.82rem}
.dh h2{margin:2px 0 0;font-size:1.25rem;line-height:1.3;text-wrap:balance}
.x{margin-inline-start:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1.3rem;line-height:1}
.dout{background:var(--panel);border-radius:var(--r);padding:12px 14px}
.dout.lab{background:var(--labbg);border:1px dashed var(--c)}
.dout small{display:block;color:var(--c);font-weight:700;font-size:.8rem}
.dout p{margin:2px 0 0;font-weight:600}
.dp h3{margin:0;font-size:.95rem}
.dp ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips .chip{font-size:.85rem;padding:3px 12px}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.pr+details.pr{margin-top:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px;font-family:var(--f-mono)}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.65;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:var(--g-ink);font-weight:600;cursor:pointer;font-size:.8rem}
.drule{margin:0;background:var(--g);color:var(--g-ink);border-radius:12px;padding:10px 14px;font-weight:700}
.dfoot{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.dfoot button{flex:1;border-radius:12px;padding:11px 12px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--card)}
.dfoot button.pri{background:var(--g);color:var(--g-ink);border-color:var(--g)}
.dfoot button[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

 steps:{ar:["أول 5 دقائق: زبون يسأل على Telegram والوكيل يرد من بيانات المتجر","القدرات الخمس: نص، صورة، صوت، فيديو، كود","مثال سريع لكل قدرة من عالم المشاريع الصغيرة","تركيز اليوم: توليد ردود خدمة العملاء النصية"],en:["First 5 minutes: a customer asks on Telegram and the agent answers from the store's data","The five capabilities: text, image, audio, video, code","One quick example per capability from small-business life","Today's focus: generating text replies for customer service"]},
 P:[["1.A","Reply to a customer","رد على زبون","ChatGPT / Claude","You are a customer service employee at an online perfume shop in Abu Dhabi. Write a polite reply to a customer asking: Do you have the oud perfume in 100 ml, and how much is delivery to Al Ain? If you do not have the prices, say so and do not make them up.","أنت موظف خدمة عملاء في متجر عطور إلكتروني في أبوظبي. اكتب رداً مهذباً على زبون يسأل: هل يتوفر عطر العود بحجم 100 مل؟ وكم سعر التوصيل إلى العين؟ إذا لم تكن لديك الأسعار فقل ذلك ولا تخترعها."],["1.B","Five capabilities, one business","خمس قدرات لمشروع واحد","ChatGPT / Gemini","For my business [describe your business], give me one practical example for each generative AI capability: text, image, audio, video and code. A two-column table, under 100 words.","لمشروعي [صف مشروعك]، أعطني مثالاً عملياً واحداً لكل قدرة من قدرات الذكاء الاصطناعي التوليدي: النص، والصورة، والصوت، والفيديو، والكود. في جدول من عمودين، وبأقل من 100 كلمة."]],rule:null},
{id:"2",no:"2",ph:1,t:"00:15–00:35",h:20,kind:"st",ic:"robot",lead:null,tools:["Claude"],
 nm:{ar:"ما هو الوكيل الذكي؟",en:"What is an AI agent?"},
 out:{ar:"الفرق بين Chatbot والأتمتة والوكيل: يفهم الهدف، يخطط، ينفذ، يراجع",en:"Chatbot vs automation vs agent: it understands the goal, plans, acts and checks"},
 steps:{ar:["Chatbot: يرد على السؤال فقط","Automation: يكرر خطوات ثابتة","AI Agent: يفهم الهدف، يختار الأداة، ينفذ ويتحقق من النتيجة","أين يقف وكيل خدمة العملاء بين الثلاثة"],en:["Chatbot: answers the question only","Automation: repeats fixed steps","AI agent: understands the goal, picks the tool, acts and checks the result","Where a customer service agent sits among the three"]},
 P:[["2.A","Compare the three","قارن بين الثلاثة","Claude / ChatGPT","Compare a chatbot, an automation and an AI agent for a small online shop: what does each one do when a customer asks \"Where is my order?\" A three-column table, then one line: when do I actually need an agent?","قارن بين Chatbot والأتمتة (Automation) ووكيل الذكاء الاصطناعي (AI Agent) لمتجر إلكتروني صغير: ماذا يفعل كل منها عندما يسأل الزبون «وين طلبي؟». جدول من ثلاثة أعمدة، ثم سطر واحد: متى أحتاج وكيلاً فعلاً؟"]],rule:null},
{id:"3",no:"3",ph:1,t:"00:35–01:00",h:25,kind:"st",ic:"chip",lead:null,tools:["Claude"],

 out:{ar:"بطاقة مكونات لوكيل مشروعك: الهدف، العقل، التعليمات، الذاكرة، الأدوات، التنفيذ، الصلاحيات",en:"A component card for your own agent: goal, brain, instructions, memory, tools, execution, permissions"},
 steps:{ar:["Goal: ماذا يحقق الوكيل لزبائنك","Brain: النموذج اللغوي الذي يفهم ويستدل","Instructions: الرد بالعربية وعدم اختلاق الأسعار","Memory: يتذكر المنتج الذي يسأل عنه الزبون","Tools وExecution: ما يستطيع فعله فعلاً","الصلاحيات: ما يُسمح له وما يُمنع"],en:["Goal: what the agent achieves for your customers","Brain: the language model that understands and reasons","Instructions: reply in Arabic, never invent prices","Memory: remembers the product the customer asked about","Tools and execution: what it can actually do","Permissions: what it may and may not do"]},
 P:[["3.A","My agent's component card","بطاقة مكونات وكيلي","Claude","Help me design a customer service agent for my business [describe your business]. Fill a 7-item card: goal, brain (model), instructions, memory, tools, execution, permissions (what it may and may not do). One line per item, with a customer service example.","ساعدني في تصميم وكيل خدمة عملاء لمشروعي [صف مشروعك]. املأ بطاقة من 7 بنود: الهدف، والعقل (النموذج)، والتعليمات، والذاكرة، والأدوات، والتنفيذ، والصلاحيات (ما يُسمح له وما يُمنع). سطر واحد لكل بند، مع مثال من خدمة العملاء."]],rule:null},
{id:"4",no:"4",ph:1,t:"01:00–01:25",h:25,kind:"st",ic:"plug",lead:null,tools:["n8n","MCP"],

 out:{ar:"Connector وSkill وExtension وCo-worker: الفرق بينها ومتى يحتاجها رائد الأعمال",en:"Connector, skill, extension and co-worker: how they differ and when a founder needs each"},
 steps:{ar:["Connector: يربط الوكيل بالخدمات والبيانات (Telegram وGoogle Sheets)","Skill: مهمة قابلة لإعادة الاستخدام (البحث عن منتج، حساب رسوم التوصيل)","Extension: خدمة خارجية توسّع القدرات (نظام الطلبات أو المخزون)","Co-worker: الوكيل يحوّل المحادثة لموظف عند الحاجة"],en:["Connector: links the agent to services and data (Telegram, Google Sheets)","Skill: a reusable task (find a product, calculate delivery fees)","Extension: an outside service that adds capability (orders or stock system)","Co-worker: the agent hands the chat to a person when needed"]},
 P:[["4.A","Classify my needs","صنّف احتياجاتي","Claude / ChatGPT","These are my shop's needs: [answer price questions, order status, delivery fees, receive complaints, check stock]. Classify each as connector, skill, extension or co-worker, and give the reason in one line.","هذه احتياجات متجري: [الرد على أسئلة الأسعار، معرفة حالة الطلب، حساب رسوم التوصيل، استلام الشكاوى، التحقق من المخزون]. صنّف كل حاجة: Connector أو Skill أو Extension أو Co-worker، واشرح السبب في سطر واحد."]],rule:null},

 P:[["5.A","Agent instructions (system prompt)","تعليمات الوكيل","n8n · AI Agent node","You are \"[Shop name] Assistant\" for customer service on Telegram. Your goal: answer customers' questions about products, prices and delivery. Write in the customer's language, warm and short (3 lines at most). Never invent a price, date or fact that is not in your data; say \"Let me check with the team\" instead. Never ask for card details or passwords.","أنت «مساعد [اسم المتجر]» لخدمة العملاء على Telegram. هدفك: الإجابة عن أسئلة الزبائن حول المنتجات والأسعار والتوصيل. اكتب بلغة الزبون، بأسلوب ودود ومختصر (3 أسطر كحد أقصى). لا تخترع أي سعر أو موعد أو معلومة غير موجودة في بياناتك؛ وقل «سأتأكد لك من الفريق» بدلاً من ذلك. لا تطلب بيانات بطاقات أو كلمات مرور."],["5.B","First three test messages","أول ثلاث رسائل اختبار","Telegram","1) Hello, what do you sell?\n2) How much is delivery to Dubai? (it must not invent a number)\n3) مرحبا، عندكم توصيل؟ (check the reply language)","1) السلام عليكم، شو تبيعون؟\n2) كم سعر التوصيل لدبي؟ (يجب ألا يخترع رقماً)\n3) Hi, do you speak English? (لاحظ لغة الرد)"]],rule:null},

 out:{ar:"الوكيل يجيب من جدول منتجات المتجر ويتذكر سياق المحادثة",en:"The agent answers from the shop's product sheet and remembers the conversation"},
 steps:{ar:["جدول منتجات تجريبي في Google Sheets: المنتج، السعر، المتوفر، الوصف","ربط الجدول بالوكيل كأداة (Connector)","إضافة ذاكرة المحادثة مرتبطة بمعرّف محادثة الزبون","اختبار: سؤال، ثم متابعة «وكم سعره؟» دون ذكر المنتج"],en:["A sample product sheet in Google Sheets: product, price, stock, description","Connect the sheet to the agent as a tool (connector)","Add chat memory keyed to the customer's chat ID","Test: a question, then \"and how much is it?\" without naming the product"]},
 P:[["6.A","Sample product sheet","جدول المنتجات التجريبي","Claude / ChatGPT","Create a synthetic product table for a [type of shop] in the UAE: 15 products with columns: code, name, category, price in AED, quantity in stock, short description. As CSV so I can paste it into Google Sheets.","أنشئ جدول منتجات افتراضياً لمتجر [نوع المتجر] في الإمارات: 15 منتجاً بالأعمدة: الرمز، الاسم، الفئة، السعر بالدرهم، الكمية المتوفرة، وصف قصير. بصيغة CSV لألصقه في Google Sheets."],["6.B","Search tool description","وصف أداة البحث","n8n · Google Sheets tool","Use this tool to look up any product in the product sheet before you mention its price or availability. Search by name or category. If the product is not found, tell the customer and suggest the closest alternative from the sheet.","استخدم هذه الأداة للبحث عن أي منتج في جدول المنتجات قبل ذكر سعره أو توفره. ابحث بالاسم أو الفئة. إذا لم تجد المنتج فأخبر الزبون بذلك واقترح أقرب بديل من الجدول."],["6.C","Memory test","اختبار الذاكرة","Telegram","1) Do you have the oud perfume?\n2) And how much is it?\n3) I want two, what is the total?\nThe agent should understand that messages 2 and 3 are about the same product.","1) عندكم عطر العود؟\n2) وكم سعره؟\n3) أبغى اثنين، كم المجموع؟\nيجب أن يفهم الوكيل أن الرسالتين الثانية والثالثة عن المنتج نفسه."]],rule:null},
{id:"7",no:"7",ph:2,t:"03:05–03:40",h:35,kind:"lab",ic:"n8n",lead:"n8n",tools:["n8n","Telegram","Google Sheets"],

 out:{ar:"مهارة قابلة لإعادة الاستخدام، وخدمة إضافية، وتصعيد لموظف بقواعد أمان",en:"A reusable skill, an extra service, and hand-off to a person with safety rules"},
 steps:{ar:["Skill: حساب رسوم التوصيل حسب الإمارة","Extension: ربط خدمة إضافية مثل حالة الطلب أو المخزون","Co-worker: تحويل المحادثة لموظف مع ملخص","حدود الصلاحيات: ما لا يفعله الوكيل أبداً"],en:["Skill: calculate delivery fees by emirate","Extension: connect an extra service such as order status or stock","Co-worker: hand the chat to a person with a summary","Permission limits: what the agent never does"]},
 P:[["7.A","Delivery fee skill","مهارة رسوم التوصيل","n8n · sub-workflow","When a customer asks about delivery: ask for the emirate if they did not mention it, then use the delivery table (emirate, fee, delivery time). Orders over 200 AED get free delivery. State the fee and the time in one line.","عند سؤال الزبون عن التوصيل: اسأله عن الإمارة إن لم يذكرها، ثم استخدم جدول التوصيل (الإمارة، الرسوم، مدة التوصيل). الطلبات فوق 200 درهم توصيلها مجاني. اذكر الرسوم والمدة في سطر واحد."],["7.B","Escalation rules","قواعد التصعيد","n8n · AI Agent node","Hand the chat to the staff member on duty right away, and send them a 3-line summary (customer, request, reason), when: there is a complaint or refund request, the answer is not in your data, the customer is upset, or they ask for a special discount. Tell the customer: \"I have passed your request to my colleague, who will contact you shortly.\"","حوّل المحادثة إلى الموظف المسؤول فوراً، وأرسل له ملخصاً من 3 أسطر (الزبون، الطلب، سبب التصعيد)، في هذه الحالات: شكوى أو طلب استرجاع، أو سؤال لا تجد إجابته في البيانات، أو زبون منزعج، أو طلب خصم خاص. وأخبر الزبون: «حوّلت طلبك لزميلي وسيتواصل معك قريباً»."],["7.C","Permission limits","حدود الصلاحيات","n8n · AI Agent node","Do not confirm an order or a payment, do not change prices, do not promise a delivery time that is not in the table, and never share another customer's data.","لا تؤكد طلباً أو دفعة، ولا تعدّل الأسعار، ولا تعد بموعد توصيل غير موجود في الجدول، ولا تشارك بيانات أي زبون آخر."]],rule:null},

 P:[["8.A","Shop questions skill","مهارة أسئلة المتجر","Hermes Agent · SKILL.md","Write a SKILL.md file for a skill called \"[Shop name] questions\": when to use it (price, availability and delivery questions), and the steps: search the product sheet first, reply in the customer's language in 3 lines, never invent a price, and hand complaints to a staff member with a summary.","اكتب ملف SKILL.md لمهارة اسمها «أسئلة متجر [اسم المتجر]»: متى تُستخدم (أسئلة الأسعار والتوفر والتوصيل)، والخطوات: ابحث في جدول المنتجات أولاً، ورد بلغة الزبون في 3 أسطر، ولا تخترع أي سعر، وحوّل الشكاوى لموظف مع ملخص."],["8.B","Daily scheduled report","التقرير اليومي المجدول","Hermes Agent · scheduled tasks","Every day at 9 am: summarise yesterday's customer chats: number of questions, the 3 most asked-about products, and the cases handed to a staff member. Send the summary to me on Telegram.","كل يوم الساعة 9 صباحاً: لخّص محادثات الزبائن أمس: عدد الأسئلة، وأكثر 3 منتجات سُئل عنها، والحالات التي حُوّلت لموظف. وأرسل الملخص لي على Telegram."],["8.C","n8n or Hermes?","n8n أم Hermes؟","Claude / ChatGPT","Compare building a customer service agent in n8n with running Hermes Agent for a small business: ease of starting, control over the steps, hosting, cost and maintenance. A table, then a two-line recommendation for my business [describe your business].","قارن بين بناء وكيل خدمة العملاء في n8n وتشغيل Hermes Agent لمشروع صغير: سهولة البدء، والتحكم في الخطوات، والاستضافة، والتكلفة، والصيانة. جدول، ثم توصية في سطرين لمشروعي [صف مشروعك]."]],rule:null},
