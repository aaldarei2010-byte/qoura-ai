<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الذكاء الاصطناعي | مؤسسة الإمارات · أهل الشغف</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#163832;--c:#A8703F;--rope:#C9A27A;--bg:#F6F1E8;--card:#FFFFFF;--ink:#16211F;--muted:#6B7A76;--line:#E3DACB;--ok:#2F7A4E;--soft:#EFE7DA;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A}}
:root[data-theme="dark"]{--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,system-ui,sans-serif;line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.logo{background:#fff;border-radius:12px;padding:6px 10px;cursor:default}.logo img{height:46px;display:block}
.ht{flex:1;min-width:220px}.ht small{color:var(--c);font-weight:600}.ht h1{margin:0;font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.15}.ht p{margin:2px 0 0;color:var(--muted)}
.lang{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.narrow{max-width:640px;margin-inline:auto}
h2{margin:0 0 6px;font-size:1.3rem}.sub{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--g);color:#fff;text-decoration:none;width:100%;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.cu{background:var(--c)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;font-weight:600}
select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}.code b{font-size:1.7rem;letter-spacing:.08em}.code small{display:block;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
/* journey top */
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:6px}
@media (max-width:860px){.top{grid-template-columns:1fr}}
.here{background:var(--g);color:#F6F1E8;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.here .col{flex:1;min-width:120px}.here small{display:block;color:#E2B48A;font-size:.78rem}.here b{font-size:1.1rem}
.here .hn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--c);color:#fff;font-size:.85rem;margin-inline-end:8px;vertical-align:middle;padding:0 4px}
.here .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
.here button{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:1.1rem}
.here button.on{background:var(--c);border-color:var(--c)}
.prog{display:flex;align-items:center;gap:10px}.bar{flex:1;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pct{font-weight:700;font-size:1.2rem;min-width:3.4em;text-align:end}
.today{display:flex;flex-direction:column;gap:6px}
.today .row{display:flex;gap:8px;flex-wrap:wrap}.today .row .btn{width:auto;flex:1;margin-top:0;padding:10px 12px;font-size:.92rem}
.okline{color:var(--ok);font-weight:700;font-size:.88rem}
.mats a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;color:var(--ink);text-decoration:none;font-weight:600;background:var(--bg)}
.mats a span:last-child{color:var(--c)}
/* map desktop */
.map{position:relative;width:100%;aspect-ratio:1200/1310;container-type:inline-size;margin-top:6px}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;transform:translate(-50%,-50%);width:11.8cqw;display:flex;justify-content:center}
.st .ttl{position:absolute;bottom:calc(50% + 3.8cqw);left:50%;transform:translateX(-50%);width:11.8cqw;text-align:center}
.st .ttl b{display:block;font-size:1.5cqw;line-height:1.15;color:var(--ink)}
.st .ttl span{display:block;font-size:.95cqw;color:var(--muted)}
.st.wide .ttl{width:19cqw}
.st .ttl span.here-tag{display:inline-block;color:#fff;font-size:1.05cqw;margin:0 0 .4cqw !important}
.st.dim .ttl b{color:var(--muted)}
.here-tag{display:table;margin:0 auto .4cqw !important;background:var(--c);color:#fff;font-size:1cqw;font-weight:700;border-radius:999px;padding:.2cqw .8cqw;margin-bottom:.4cqw}
.dot{position:relative;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--card);border:.25cqw solid var(--rope);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.08)}
.dot img{width:3cqw;height:3cqw;object-fit:contain}
.dot svg{width:2.6cqw;height:2.6cqw;stroke:var(--ink)}
.dot .n{position:absolute;top:-.6cqw;inset-inline-end:-.6cqw;width:2cqw;height:2cqw;border-radius:50%;background:var(--c);color:#fff;font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.st.done .dot{border-color:var(--ok)}.st.done .dot .n{background:var(--ok)}
.st.cur .dot{border-color:var(--c);box-shadow:0 0 0 1cqw color-mix(in srgb,var(--c) 22%,transparent)}
.chips{position:absolute;top:calc(50% + 3.6cqw);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5cqw;width:11.4cqw}
.chips.grid{display:grid;grid-template-columns:repeat(3,1fr);width:34cqw}
.chips.logos{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;width:26cqw;background:var(--card);border:1px solid var(--line);border-radius:1.2cqw;padding:.8cqw}
.chip{display:flex;align-items:center;justify-content:center;gap:.5cqw;width:100%;background:var(--card);border:1px solid var(--line);border-radius:.7cqw;padding:.45cqw .6cqw;font-size:1cqw;font-weight:600;white-space:nowrap}
.chips.logos .chip{width:auto;border-radius:999px;font-size:1cqw;padding:.3cqw .8cqw}
.chip img{width:1.4cqw;height:1.4cqw;object-fit:contain}
.st.cur .chip{border-color:var(--c)}
.dayl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.dayl b{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:.3cqw 1.2cqw;font-size:1.25cqw}
.dayl span{display:block;color:var(--c);font-weight:600;font-size:1.15cqw;margin-top:.3cqw}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
/* mobile list */
.list{display:none}
@media (max-width:760px){.map{display:none}.list{display:block}}
.lday{margin:16px 0 6px;display:flex;align-items:baseline;gap:8px}.lday b{background:var(--g);color:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}.lday span{color:var(--c);font-weight:600;font-size:.85rem}
.li{display:flex;gap:12px;align-items:flex-start;position:relative;padding:8px 0 14px;cursor:pointer;width:100%;text-align:start;background:none;border:0}
.li::before{content:"";position:absolute;inset-inline-start:25px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,color-mix(in srgb,var(--rope) 70%,#000) 6px 9px);border-radius:4px;opacity:.85}
.li.done::before{background:repeating-linear-gradient(45deg,#2F5D4E 0 6px,#183A32 6px 9px)}
.li .dot{width:58px;height:58px;flex:0 0 58px;z-index:1;border-width:3px}
.li .dot img{width:30px;height:30px}.li .dot svg{width:26px;height:26px}
.li .dot .n{width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px;border-width:2px}
.li .tx b{display:block;font-size:1.05rem}.li .tx span{color:var(--muted);font-size:.85rem}
.li .tx .cl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.li .tx .cl i{font-style:normal;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--card)}
.li .tg{font-size:.72rem;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
/* drawer */
.dr{position:fixed;inset:0;background:rgba(15,26,24,.45);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);width:min(480px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;border-radius:18px 18px 0 0;width:100%}}
.dh{display:flex;align-items:center;gap:12px;position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));background:var(--card);z-index:2;margin:calc(-16px - env(safe-area-inset-top,0px)) -18px 0;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--line)}.dh .dot{width:56px;height:56px;flex:0 0 56px;cursor:default;border-width:3px}.dh .dot img{width:30px;height:30px}.dh .dot svg{width:26px;height:26px}.dh .dot .n{width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px}
.dh h2{margin:0}.dh .meta{color:var(--muted);font-size:.85rem}
.dclose{margin-inline-start:auto}
.task{margin-top:12px;background:var(--soft);border-radius:10px;padding:10px 12px}.task small{display:block;color:var(--muted);font-weight:600}
h3{font-size:.95rem;margin:16px 0 6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchips span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600}
.tchips img{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:4px}
.tchips.br span{border-style:dashed}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);margin-bottom:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;font-size:.8rem}
.ob{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;text-decoration:none;color:var(--ink);font-size:.88rem;font-weight:600}
.ob span:last-child{color:var(--c);white-space:nowrap}
ol.steps{margin:0;padding-inline-start:20px}ol.steps li{margin:3px 0}
.tick{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px;border-radius:12px;background:var(--soft);font-weight:600;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.dfoot{display:flex;gap:8px;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--line)}.dfoot .btn{margin-top:0;flex:1;padding:10px 12px;font-size:.9rem}
.tick.off{cursor:default;opacity:.7}
.lock{font-size:.85rem;color:var(--muted)}
/* surveys */
.q{border-top:1px solid var(--line);padding:12px 0}.q p{margin:0 0 8px;font-weight:600}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sc label{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.72rem;text-align:center;color:var(--muted)}
.sc input{position:absolute;opacity:0}.sc label b{font-size:1.1rem;color:var(--ink)}
.sc label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sc label:has(input:focus-visible){outline:3px solid var(--c)}
textarea{width:100%;min-height:90px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.tmode{background:#FFF4D6;color:#5A4300;border:1.5px dashed #B98A00;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.tmode .r{display:flex;justify-content:space-between;align-items:center}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}
.big{font-size:3rem;text-align:center}
.dot .l2{position:absolute;bottom:-.5cqw;inset-inline-start:-.5cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}.dot .l2 img{width:1.5cqw!important;height:1.5cqw!important}
.li .dot .l2,.dh .dot .l2{width:24px;height:24px;bottom:-5px;inset-inline-start:-5px;border-width:1.5px}.li .dot .l2 img,.dh .dot .l2 img{width:16px!important;height:16px!important}
.logo.client{padding:4px 8px}.logo.client img{height:50px}
.gsteps{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600}
.gsteps li i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--card);border:2px solid var(--rope);font-size:.85rem}
.gsteps li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.gsteps li.go{background:color-mix(in srgb,var(--ok) 14%,transparent);outline:2px solid var(--ok)}.gsteps li.go i{border-color:var(--ok);color:var(--ok)}
.btn.gr{background:var(--g);color:#fff}:root[data-theme="dark"] .btn.gr{background:#2F7A4E}
.btn.cu{background:var(--c);color:#fff}:root[data-theme="dark"] .btn.cu{color:#1A120B}
.btn.cu{background:var(--c);color:#fff}
details.kit{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}details.kit summary{cursor:pointer}
.mats a[aria-disabled]{opacity:.55}
.chips.logos{width:34cqw}
.postcard{border:2px solid var(--c);box-shadow:0 6px 24px color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:16px}.postcard h2{color:var(--c)}
.logo{border:1px solid var(--line)}.logo img{height:62px}
.hbtns{display:flex;gap:8px}.thm{min-width:44px;font-size:1.05rem;line-height:1}
</style></head><body>

اعي التوليدي بلغة بسيطة لموظف في مؤسسة الإمارات، مع مثال واحد لكل نوع من العمل التطوعي والمجتمعي. ثم افرز هذه المهام العشر من التجربة التشغيلية لمبادرة «أهل الشغف» إلى الأنواع الثلاثة، مع سبب من سطر واحد لكل مهمة:\n1. عدّ الطلبات حسب الإمارة\n2. إرسال بريد تأكيد تلقائي عند إرسال النموذج\n3. توقّع المتطوعين المعرّضين للانسحاب\n4. كتابة رسالة ترحيب شخصية لكل عضو جديد\n5. ترشيح مجتمع الشغف المناسب للمتقدم\n6. تلخيص 500 إجابة مكتوبة عن «أخبرنا عن شغفك»\n7. حساب ساعات كل متطوع\n8. تصميم ملصق إطلاق لأحد المجتمعات\n9. اكتشاف الطلبات المكررة\n10. صياغة موجز تحدٍّ لجهة شريكة من ملاحظات اجتماع\nالصيغة: شرح قصير، ثم جدول."]],"id":"1","wide":false},{"day":1,"h":20,"ic":"history","nm":{"ar":"التاريخ","en":"History"},"sub":{"ar":"من 1956 حتى اليوم","en":"From 1956 to today"},"tools":{"en":["Timeline"],"ar":["خط زمني"]},"en":["The history of AI, from the start to today","AI timeline in five milestones",["Five milestones from 1956 to today","What each wave made possible","Where community work met each wave"],"Build a five-milestone AI timeline and add where volunteering and community work met each wave.","",""],"ar":["تاريخ الذكاء الاصطناعي من البداية حتى اليوم","خط زمني للذكاء الاصطناعي في خمس محطات",["خمس محطات من 1956 حتى اليوم","ما أتاحته كل موجة","أين التقى العمل المجتمعي بكل موجة"],"ابنِ خطاً زمنياً من خمس محطات للذكاء الاصطناعي، وأضف أين التقى العمل التطوعي والمجتمعي بكل موجة.","",""],"P":[["2.A","AI history in five milestones","تاريخ الذكاء الاصطناعي في خمس محطات","ChatGPT","Build a five-milestone timeline of AI from its beginnings to today's large language models: year, milestone, what it made possible, and one example of what it changed or could change for volunteering and community initiatives. Keep each row to one line and say which dates are approximate.","ابنِ خطاً زمنياً من خمس محطات لتاريخ الذكاء الاصطناعي من بدايته حتى النماذج اللغوية الكبيرة اليوم: السنة، والمحطة، وما أتاحته، ومثال واحد على ما غيّرته أو يمكن أن تغيّره في العمل التطوعي والمبادرات المجتمعية. اجعل كل صف في سطر واحد، ووضّح أي التواريخ تقريبية."]],"id":"2","wide":false},{"day":1,"h":15,"ic":"shield","nm":{"ar":"احمِ البيانات","en":"Protect the data"},"sub":{"ar":"ما يُشارك وما لا يُشارك","en":"What to share, what not to"},"tools":{"en":["ChatGPT"],"ar":["ChatGPT"]},"en":["Protecting volunteers' data before using any AI tool","A safe-to-share version of applicant data, and a one-page rule card",["Classify the data before using any tool","Replace names, phones and emails before sharing","Check the output's accuracy before relying on it","The final decision always stays with a person"],"Turn three real-looking applications into a safe version you can share with an AI tool, then write the team's data rule card.","",""],"ar":["حماية بيانات المتطوعين قبل استخدام أي أداة","نسخة آمنة للمشاركة من بيانات المتقدمين، وبطاقة قواعد من صفحة واحدة",["تصنيف البيانات قبل استخدام أي أداة","استبدال الأسماء والهواتف والبريد قبل المشاركة","التحقق من دقة المخرجات قبل اعتمادها","القرار النهائي دائماً للإنسان"],"حوّل ثلاثة طلبات انضمام تبدو حقيقية إلى نسخة آمنة يمكن مشاركتها مع أداة ذكاء اصطناعي، ثم اكتب بطاقة قواعد البيانات للفريق.","",""],"P":[["3.A","Make applicant data safe to share","تجهيز بيانات المتقدمين للمشاركة الآمنة","ChatGPT","Here are three rows from the Ahl Al Shaghaf applications file (synthetic): [paste the rows]. Make a version that is safe to share with an AI tool: replace full names with Applicant 1, 2, 3; remove email, phone, LinkedIn and CV links; keep age group, emirate, education, passion area, skills and availability. Then list every field you removed or changed and why.","هذه ثلاثة صفوف من ملف طلبات الانضمام إلى «أهل الشغف» (افتراضية): [الصق الصفوف]. أعدّ نسخة آمنة للمشاركة مع أداة ذكاء اصطناعي: استبدل الأسماء الكاملة بـ«متقدم 1، 2، 3»، واحذف البريد الإلكتروني والهاتف وروابط LinkedIn والسيرة الذاتية، وأبقِ الفئة العمرية والإمارة والتعليم ومجال الشغف والمهارات والتوفر. ثم اذكر كل حقل حذفته أو غيّرته وسبب ذلك."],["3.B","The team's data rule card","بطاقة قواعد البيانات للفريق","ChatGPT","Write a one-page data rule card for the Ahl Al Shaghaf team when using AI tools: three columns (Share freely, Share only after anonymising, Never share), with examples from volunteer applications, partner challenges and internal approvals. Add three checks before relying on any AI output, and one line on who makes the final decision.","اكتب بطاقة قواعد من صفحة واحدة لفريق «أهل الشغف» عند استخدام أدوات الذكاء الاصطناعي: ثلاثة أعمدة (يُشارك بحرية، يُشارك بعد إخفاء الهوية فقط، لا يُشارك أبداً)، مع أمثلة من طلبات المتطوعين وتحديات الجهات الشريكة والموافقات الداخلية. أضف ثلاث خطوات تحقق قبل اعتماد أي مخرج، وسطراً واحداً عمّن يتخذ القرار النهائي."],["3.C","See a hallucination live","شاهد الهلوسة مباشرة","ChatGPT","Summarise the 2025 Ahl Al Shaghaf annual impact report in five bullets with its key numbers.\n\n(Trainer note: this report does not exist; the initiative is still a proposal. Compare the tools: which one invents numbers and which one says it cannot find the report?)","لخّص تقرير الأثر السنوي لمبادرة «أهل الشغف» لعام 2025 في خمس نقاط مع أبرز أرقامه.\n\n(ملاحظة للمدرب: هذا التقرير غير موجود، فالمبادرة ما زالت مقترحاً. قارن الأدوات: أيها يخترع أرقاماً، وأيها يقول إنه لا يجد التقرير؟)"]],"id":"3","wide":false},{"day":1,"h":55,"ic":"terminal","nm":{"ar":"هندسة الأوامر","en":"Prompt engineering"},"sub":{"ar":"كيف تكتب الأمر","en":"How to write a prompt"},"tools":{"en":["ChatGPT","SpeakApp"],"ar":["ChatGPT","SpeakApp"]},"en":["Prompt engineering","Personal prompt library v1",["The five parts: role, context, task, format, constraints","Turn a weak prompt into a strong one","Give the model the file, not your memory of it","Ask it to check itself, then iterate","Speak your prompt with SpeakApp, then structure it"],"Write the prompts that open the Ahl Al Shaghaf file and produce the one-page brief for the team.","",""],"ar":["هندسة الأوامر","مكتبة أوامرك الشخصية، الإصدار الأول",["الأجزاء الخمسة: الدور، والسياق، والمهمة، والصيغة، والقيود","تحويل أمر ضعيف إلى أمر قوي","أعطِ النموذج الملف، لا ما تتذكره منه","اطلب منه مراجعة نفسه، ثم كرّر","قل أمرك بصوتك عبر SpeakApp، ثم رتّبه"],"اكتب الأوامر التي تفتح ملف «أهل الشغف» وتُخرج موجزاً من صفحة واحدة للفريق.","",""],"P":[["4.A","Turn a weak prompt into a strong one","تحويل أمر ضعيف إلى قوي","ChatGPT","Here is a weak prompt: \"Write something about Ahl Al Shaghaf.\" Rewrite it as a strong prompt for [your department] using five parts: role, context, task, format, constraints. Show the rewritten prompt, then explain in one line what each part adds. Then save it as prompt 1 of my personal prompt library.","هذا أمر ضعيف: «اكتب شيئاً عن أهل الشغف.» أعد كتابته كأمر قوي لـ[إدارتك] بخمسة أجزاء: الدور، والسياق، والمهمة، والصيغة، والقيود. اعرض الأمر بعد إعادة كتابته، ثم اشرح في سطر واحد ما يضيفه كل جزء، واحفظه كأول أمر في مكتبة أوامري الشخصية."],["4.B","The one-page initiative brief","موجز المبادرة في صفحة واحدة","ChatGPT + Initiative File","Act as a senior strategy officer at Emirates Foundation. Using only the attached Ahl Al Shaghaf Initiative File, write a one-page brief for a new team member: the idea in one sentence, the problem it solves, the four parts of the model, the proposed pilot numbers (clearly labelled as proposed, not approved), the four phases, and the seven decisions requested from the CEO. Use short headings and bullets. Do not add any number or date that is not in the file.","تصرّف كمسؤول استراتيجية أول في مؤسسة الإمارات. اعتماداً على ملف مبادرة «أهل الشغف» المرفق فقط، اكتب موجزاً من صفحة واحدة لعضو جديد في الفريق: الفكرة في جملة واحدة، والمشكلة التي تعالجها، والعناصر الأربعة للنموذج، وأرقام التجربة المقترحة (مع التوضيح أنها مقترحة وغير معتمدة)، والمراحل الأربع، والقرارات السبعة المطلوبة من الرئيس التنفيذي. استخدم عناوين قصيرة ونقاطاً. لا تضف أي رقم أو تاريخ غير موجود في الملف."],["4.C","Ask before you answer","اسأل قبل أن تجيب","ChatGPT","I need a 12-week activity plan for one Ahl Al Shaghaf community. Before you write anything, ask me the five questions you need answered to do this well, one at a time. Then write the plan as a week-by-week table.","أحتاج خطة أنشطة من 12 أسبوعاً لمجتمع واحد من مجتمعات «أهل الشغف». قبل أن تكتب أي شيء، اسألني الأسئلة الخمسة التي تحتاج إجاباتها لتنجز هذا جيداً، سؤالاً واحداً في كل مرة. ثم اكتب الخطة في جدول أسبوعي."],["4.D","Self-check and improve","المراجعة الذاتية والتحسين","ChatGPT","Review the brief you just wrote against the Initiative File. List every sentence that is not supported by the file, every number that is missing its \"proposed\" label, and anything a CEO would ask that is not answered. Then give me the corrected version.","راجع الموجز الذي كتبته للتو مقابل ملف المبادرة. اذكر كل جملة لا يدعمها الملف، وكل رقم ينقصه وصف «مقترح»، وأي سؤال قد يطرحه الرئيس التنفيذي ولا يجيب عنه الموجز. ثم أعطني النسخة المصححة."],["4.E","Speak it, then structure it (SpeakApp)","قلها بصوتك ثم رتّبها (SpeakApp)","SpeakApp, then ChatGPT","Open SpeakApp and say, in your own words and in Arabic, what you need from the Ahl Al Shaghaf brief, as if you were explaining it to a colleague (about one minute). SpeakApp turns your voice into text. Paste the text into ChatGPT and add:\nTurn what I said into a strong prompt with five parts: role, context, task, format, constraints. Keep my intent, remove repetition, and list anything I did not say that you need.","افتح SpeakApp وقل بكلماتك وبالعربية ما تحتاجه من موجز «أهل الشغف»، كأنك تشرحه لزميل (نحو دقيقة). يحوّل SpeakApp صوتك إلى نص. الصق النص في ChatGPT وأضف:\nحوّل ما قلته إلى أمر قوي من خمسة أجزاء: الدور، والسياق، والمهمة، والصيغة، والقيود. حافظ على قصدي، واحذف التكرار، واذكر أي معلومة لم أقلها وتحتاجها."]],"id":"4","wide":false},{"day":1,"h":105,"ic":"map","logos":true,"nm":{"ar":"خريطة الأدوات","en":"Tools map"},"sub":{"ar":"الأدوات وأمثلتها","en":"The tools and their examples"},"tools":{"en":["ChatGPT","Claude","Gemini","Microsoft Copilot","Grok","Perplexity","Manus","ElevenLabs","Kling AI","Higgsfield","SpeakApp"],"ar":["ChatGPT","Claude","Gemini","Microsoft Copilot","Grok","Perplexity","Manus","ElevenLabs","Kling AI","Higgsfield","SpeakApp"]},"en":["The tools at a glance","A tool-choice card, plus a hands-on example with each tool",["A quick tour of the main tools and when to use each","Perplexity and Grok: research with sources and public conversation","Gemini: a concept video with Veo and a YouTube summary","Manus: a ready deck and a landing page","ElevenLabs and Kling AI: voice-over and video","Higgsfield: image to video (in the ChatGPT station)","SpeakApp: voice to text"],"Match each Ahl Al Shaghaf job to the best tool, then try one example with Gemini, Manus, ElevenLabs and Kling AI.","",""],"ar":["الأدوات في لمحة","بطاقة اختيار الأداة، ومثال تطبيقي على كل أداة",["جولة سريعة على أهم الأدوات ومتى تُستخدم كل أداة","Perplexity وGrok: بحث بمصادر ونقاش عام","Gemini: فيديو تعريفي بـ Veo وتلخيص يوتيوب","Manus: عرض جاهز وصفحة تعريفية","ElevenLabs وKling AI: تعليق صوتي وفيديو","Higgsfield: من صورة إلى فيديو (في محطة ChatGPT)","SpeakApp: تحويل الصوت إلى نص"],"طابق كل مهمة في «أهل الشغف» بالأداة الأنسب، ثم جرّب مثالاً واحداً على الأقل بـ Gemini وManus وElevenLabs وKling AI.","",""],"P":[["5.A","Which tool for which job?","أي أداة لأي مهمة؟","ChatGPT","Make a one-page tool-choice card for the Ahl Al Shaghaf team covering ChatGPT, Claude, Gemini, Microsoft Copilot, Grok, Perplexity, Manus, ElevenLabs, Kling AI, Higgsfield and SpeakApp: what each is best at, one job in the pilot it fits (brief, research, images, launch video, voice-over, voice to text, deck, website), and one thing not to use it for. Format: a table, one row per tool.","أعدّ بطاقة اختيار أدوات من صفحة واحدة لفريق «أهل الشغف» تشمل ChatGPT وClaude وGemini وMicrosoft Copilot وGrok وPerplexity وManus وElevenLabs وKling AI وHiggsfield وSpeakApp: أفضل ما تجيده كل أداة، ومهمة واحدة في التجربة تناسبها (موجز، بحث، صور، فيديو إطلاق، تعليق صوتي، تحويل الصوت إلى نص، عرض، موقع)، وشيء واحد لا تُستخدم له. الصيغة: جدول، صف لكل أداة."],["5.B","Research with sources (Perplexity)","بحث بمصادر (Perplexity)","Perplexity","Find five examples from the last three years of skills-based volunteering programmes or volunteer communities (in the UAE, the GCC or worldwide) that kept volunteers engaged beyond one event. For each: name, country, how the community is organised, one result they report, and the source link. Mark anything you could not verify.","ابحث عن خمسة أمثلة خلال السنوات الثلاث الأخيرة لبرامج تطوع قائم على المهارات أو مجتمعات تطوعية (في الإمارات أو الخليج أو العالم) نجحت في إبقاء المتطوعين مشاركين بعد الفعالية الأولى. لكل مثال: الاسم، والدولة، وكيف يُنظَّم المجتمع، ونتيجة واحدة يعلنونها، ورابط المصدر. ميّز أي معلومة لم تتحقق منها."],["5.C","What people are saying (Grok)","ماذا يقول الناس؟ (Grok)","Grok","Summarise what people in the UAE are saying publicly this month about volunteering, skills-based volunteering and youth community work: three themes, two concerns, and two ideas Ahl Al Shaghaf could use in its launch message. Give the posts or sources you used.","لخّص ما يقوله الناس علناً في الإمارات هذا الشهر عن التطوع، والتطوع القائم على المهارات، والعمل المجتمعي للشباب: ثلاثة محاور، ومخاوف اثنتين، وفكرتين يمكن أن تستخدمهما «أهل الشغف» في رسالة الإطلاق. اذكر المنشورات أو المصادر التي استخدمتها."],["5.D","Ahl Al Shaghaf concept video (Gemini / Veo)","الفيديو التعريفي لأهل الشغف (Gemini / Veo)","Gemini (Veo)","Create a cinematic 8–10 second video titled \"Ahl Al Shaghaf – Passion that brings us together\".\n\nScene: early morning in Abu Dhabi. Three short moments cut together: a young Emirati woman sketching a design on a tablet, a young man coding on a laptop, and an older mentor guiding a small team at a community table. Each moment ends with a small golden spark that floats up and joins the others into one glowing drop shape.\n\nCamera: slow dolly-in, shallow depth of field, natural light. Colours: deep navy, mint green, sky blue, gold sparks, ivory light. Calm, hopeful mood, soft ambient music, no dialogue.\n\nDo not use real logos or famous people. Fictional training scenario.","أنشئ فيديو سينمائياً مدته 8 إلى 10 ثوانٍ بعنوان «أهل الشغف – شغف يجمعنا».\n\nالمشهد: صباح باكر في أبوظبي. ثلاث لقطات قصيرة متتالية: شابة إماراتية ترسم تصميماً على جهاز لوحي، وشاب يبرمج على حاسوبه، ومرشد أكبر سناً يوجّه فريقاً صغيراً حول طاولة مجتمعية. تنتهي كل لقطة بشرارة ذهبية صغيرة ترتفع وتلتقي بالأخريات لتكوّن شكل قطرة مضيئة واحدة.\n\nالكاميرا: اقتراب بطيء، وعمق ميدان ضحل، وإضاءة طبيعية. الألوان: كحلي داكن، وأخضر نعناعي، وأزرق فاتح، وشرارات ذهبية، وضوء عاجي. أجواء هادئة ومتفائلة، وموسيقى خلفية ناعمة، دون حوار.\n\nلا تستخدم شعارات حقيقية أو مشاهير. سيناريو تدريبي افتراضي."],["5.E","Summarise a public video (YouTube)","تلخيص فيديو عام (يوتيوب)","Gemini","Summarise this public YouTube video on volunteering or community building: [paste the link]. Give: the five main ideas, two quotes worth sharing with the team (with timestamps), and three practical ideas Ahl Al Shaghaf could test in its 12-week pilot.","لخّص هذا الفيديو العام على يوتيوب عن التطوع أو بناء المجتمعات: [الصق الرابط]. أعطني: الأفكار الخمس الرئيسية، واقتباسين يستحقان المشاركة مع الفريق (مع التوقيت)، وثلاث أفكار عملية يمكن أن تختبرها «أهل الشغف» في تجربتها ذات الأسابيع الاثني عشر."],["5.F","Video script, scene by scene","نص الفيديو مشهداً بمشهد","Gemini","Write a 45-second launch video script for Ahl Al Shaghaf in Arabic: five scenes, each with what we see, the voice-over line, and on-screen text. Close with the line \"لكل شخص شغف، ولكل شغف مكان، وعندما يجتمع أهل الشغف يبدأ الأثر\". Then give me one Veo prompt per scene.","اكتب نص فيديو إطلاق لـ«أهل الشغف» مدته 45 ثانية بالعربية: خمسة مشاهد، لكل مشهد ما نراه، وجملة التعليق الصوتي، والنص على الشاشة. اختم بعبارة «لكل شخص شغف، ولكل شغف مكان، وعندما يجتمع أهل الشغف يبدأ الأثر». ثم أعطني أمراً لـ Veo لكل مشهد."],["5.G","Turn the brief into a deck","حوّل الموجز إلى عرض","Manus","Turn this Ahl Al Shaghaf brief into a 10-slide pilot briefing in the initiative's identity (deep navy #173A5E, mint #7FBE9C, sky blue #82B6DC, gold #F2C14E, ivory #FAF6EC, right-to-left Arabic): cover with the tagline; from temporary opportunity to lasting community; the problem; the four-part model; the volunteer journey from explorer to mentor; the three pilot communities; the pilot in numbers as big numbers labelled \"proposed\"; the four phases; success measures; the decisions requested. One idea per slide, speaker notes on each.","حوّل موجز «أهل الشغف» هذا إلى عرض إحاطة من 10 شرائح بهوية المبادرة (الكحلي #173A5E، والنعناعي #7FBE9C، والأزرق الفاتح #82B6DC، والذهبي #F2C14E، والعاجي #FAF6EC، وبالعربية من اليمين إلى اليسار): الغلاف مع العبارة التعريفية؛ من الفرصة المؤقتة إلى المجتمع المستدام؛ المشكلة؛ النموذج بعناصره الأربعة؛ رحلة المتطوع من مستكشف إلى خبير ومرشد؛ مجتمعات التجربة الثلاثة؛ التجربة بالأرقام كأرقام كبيرة موصوفة بأنها «مقترحة»؛ المراحل الأربع؛ مؤشرات النجاح؛ القرارات المطلوبة. فكرة واحدة لكل شريحة، مع ملاحظات المتحدث لكل شريحة."],["5.H","Build the landing page","ابنِ الصفحة التعريفية","Manus","Build a one-page bilingual (Arabic first, right-to-left, with an English switch) landing page for Ahl Al Shaghaf: hero with the logo area and the tagline; what the initiative is; the ten passion communities as cards; the volunteer journey as seven steps; a \"Join the interest list\" form (name, email, emirate, passion area) that shows a thank-you message; footer with info@ahlalshaghaf.org. Use the initiative's colours and the label \"Training scenario. The initiative is a proposal.\"","ابنِ صفحة تعريفية من صفحة واحدة ثنائية اللغة (العربية أولاً من اليمين إلى اليسار، مع زر للإنجليزية) لمبادرة «أهل الشغف»: واجهة فيها مساحة الشعار والعبارة التعريفية؛ ما المبادرة؛ مجتمعات الشغف العشرة كبطاقات؛ رحلة المتطوع في سبع خطوات؛ نموذج «انضم إلى قائمة الاهتمام» (الاسم، والبريد، والإمارة، ومجال الشغف) يُظهر رسالة شكر؛ وتذييل فيه info@ahlalshaghaf.org. استخدم ألوان المبادرة وعبارة «سيناريو تدريبي. المبادرة مقترح»."],["5.I","Improve it with follow-ups","حسّنه بطلبات متتالية","Manus","Improve the page in three rounds: (1) make the communities section filterable by interest; (2) add a short FAQ with the six most common applicant questions, answered only from the Initiative File; (3) check the page on a phone screen and fix anything that breaks.","حسّن الصفحة على ثلاث جولات: (1) اجعل قسم المجتمعات قابلاً للتصفية حسب الاهتمام؛ (2) أضف أسئلة شائعة قصيرة بأكثر ستة أسئلة يطرحها المتقدمون، بإجابات من ملف المبادرة فقط؛ (3) افحص الصفحة على شاشة الهاتف وأصلح أي خلل."],["5.J","Arabic voice-over (ElevenLabs)","التعليق الصوتي العربي (ElevenLabs)","ElevenLabs","Choose a warm, clear Arabic voice. Text to read, calmly and with short pauses:\n«لكل شخص شغف… ولكل شغف مكان. في أهل الشغف، لا نربطك بفرصة تنتهي، بل بمجتمع يكبر معك، ومسار تصنع فيه الأثر. شغف يجمعنا، وأثر نصنعه.»\nExport it as MP3 and place it under the reel.","اختر صوتاً عربياً دافئاً وواضحاً. النص المقروء بهدوء ومع وقفات قصيرة:\n«لكل شخص شغف… ولكل شغف مكان. في أهل الشغف، لا نربطك بفرصة تنتهي، بل بمجتمع يكبر معك، ومسار تصنع فيه الأثر. شغف يجمعنا، وأثر نصنعه.»\nصدّره بصيغة MP3 وضعه تحت المقطع."],["5.K","Same shot in Kling AI","اللقطة نفسها في Kling AI","Kling AI","Upload the same image to Kling AI with the same Higgsfield prompt from the ChatGPT station. Compare the two results on four points: realism of faces and hands, smoothness of motion, respect for the initiative's colours, and time to generate. Which would you use for the launch, and why?","ارفع الصورة نفسها إلى Kling AI بأمر Higgsfield نفسه في محطة ChatGPT. قارن النتيجتين في أربع نقاط: واقعية الوجوه والأيدي، وسلاسة الحركة، والالتزام بألوان المبادرة، ووقت الإنشاء. أيهما ستستخدم في الإطلاق، ولماذا؟"]],"id":"5","wide":false},{"day":1,"h":60,"nochips":true,"nm":{"ar":"ChatGPT","en":"ChatGPT"},"sub":{"ar":"أدواته واستخداماته","en":"Its tools and uses"},"tools":{"en":["ChatGPT","Higgsfield"],"ar":["ChatGPT","Higgsfield"]},"br":{"en":["Chat and files","Image generation","Data analysis","Voice","Image to video (Higgsfield)"],"ar":["المحادثة والملفات","توليد الصور","تحليل البيانات","الصوت","من صورة إلى فيديو (Higgsfield)"]},"en":["ChatGPT","Community visuals, a short launch video, a launch post and the pilot KPIs",["Create a community launch image in the initiative's colours","Bring the image to life as a short video in Higgsfield","Write the launch post for Instagram and LinkedIn","Define the pilot success measures"],"Use ChatGPT to create the launch visual for one passion community, turn it into a short video with Higgsfield, write its launch post and define the pilot KPIs.","",""],"ar":["ChatGPT","صور المجتمعات ومقطع إطلاق قصير ومنشور الإطلاق ومؤشرات التجربة",["إنشاء صورة إطلاق لأحد المجتمعات بألوان المبادرة","تحويل الصورة إلى مقطع فيديو قصير في Higgsfield","كتابة منشور الإطلاق لإنستغرام ولينكدإن","تحديد مؤشرات نجاح التجربة"],"استخدم ChatGPT لإنشاء الصورة التعريفية لأحد مجتمعات الشغف، وحوّلها إلى مقطع قصير بـ Higgsfield، واكتب منشور إطلاقه، وحدّد مؤشرات التجربة.","",""],"P":[["6.A","Community launch image (ChatGPT images)","صورة إطلاق المجتمع (صور ChatGPT)","ChatGPT (image generation)","Act as a professional visual designer and a documentary photographer who specialises in community initiatives.\n\nCreate a highly realistic image for a fictional training scenario titled \"Launching the AI for Good community – Ahl Al Shaghaf\".\n\nScene: a bright, modern community space in Abu Dhabi. A small mixed team of young Emirati men and women and two older experts work together around a table with laptops, sticky notes and a printed poster; one person presents an idea on a screen while the others listen and smile. The men wear the kandura, the women the abaya and shayla; the experts look like mentors. Natural daylight, warm and human, not staged.\n\nStyle: photorealistic, documentary community photography, realistic hands and faces, natural proportions, 16:9, 4K.\n\nColours of the initiative: deep navy #173A5E, mint green #7FBE9C, sky blue #82B6DC, a touch of gold #F2C14E, ivory background tones #FAF6EC.\n\nAvoid: stock-photo hands and hearts, crowds, real logos, famous people, distorted hands, too much text.","خذ دور مصمم بصري محترف ومصور وثائقي متخصص في المبادرات المجتمعية.\n\nأريد صورة واقعية جداً لسيناريو تدريبي افتراضي بعنوان «إطلاق مجتمع الذكاء الاصطناعي للخير – أهل الشغف».\n\nالمشهد: مساحة مجتمعية حديثة ومشرقة في أبوظبي. فريق صغير من شباب وشابات إماراتيين وخبيرين أكبر سناً يعملون معاً حول طاولة عليها حواسيب وأوراق ملاحظات وملصق مطبوع؛ أحدهم يعرض فكرة على شاشة والبقية يستمعون ويبتسمون. يرتدي الرجال الكندورة، والنساء العباءة والشيلة، ويبدو الخبيران كمرشدين. إضاءة نهارية طبيعية، دافئة وإنسانية وغير متكلفة.\n\nالأسلوب: Photorealistic, documentary community photography, realistic hands and faces, natural proportions, 16:9, 4K.\n\nألوان المبادرة: الكحلي الداكن #173A5E، والأخضر النعناعي #7FBE9C، والأزرق الفاتح #82B6DC، ولمسة ذهبية #F2C14E، ودرجات عاجية في الخلفية #FAF6EC.\n\nتجنب: صور الأيدي والقلوب النمطية، والزحام، والشعارات الحقيقية، والمشاهير، والأيدي المشوهة، والنصوص الكثيرة."],["6.B","Edit the image with one sentence","عدّل الصورة بجملة واحدة","ChatGPT (image editing)","Keep the same scene and people. Change the screen to show a simple slide titled \"شغف يجمعنا، وأثر نصنعه\", and make it evening with warm indoor light.","أبقِ المشهد والأشخاص كما هم. اجعل الشاشة تعرض شريحة بسيطة عنوانها «شغف يجمعنا، وأثر نصنعه»، واجعل الوقت مساءً بإضاءة داخلية دافئة."],["6.C","Turn the image into a video (Higgsfield)","حوّل الصورة إلى فيديو (Higgsfield)","Higgsfield (image to video)","Upload the community launch image you made in ChatGPT. Prompt:\nSlow cinematic push-in towards the person presenting at the screen; the team turns slightly and smiles; soft golden light particles drift upward; natural movement, realistic faces and hands, 5 seconds, 16:9.\nTry it with two camera presets (for example a slow dolly-in and an orbit) and keep the one that feels calmer and more human.","ارفع صورة إطلاق المجتمع التي أنشأتها في ChatGPT. الأمر:\nSlow cinematic push-in towards the person presenting at the screen; the team turns slightly and smiles; soft golden light particles drift upward; natural movement, realistic faces and hands, 5 seconds, 16:9.\nجرّبه بحركتين مختلفتين للكاميرا (مثل الاقتراب البطيء والدوران) واحتفظ بالأهدأ والأكثر إنسانية."],["6.D","Launch post for one community","منشور إطلاق لمجتمع واحد","ChatGPT","Write a launch post for the Ahl Al Shaghaf AI for Good community in two versions: Instagram (Arabic, up to 80 words, warm, three hashtags) and LinkedIn (Arabic and English, up to 150 words, professional). Use the tagline \"شغف يجمعنا، وأثر نصنعه\". Make clear the initiative is in its pilot phase and do not promise dates, seats or certificates.","اكتب منشور إطلاق لمجتمع الذكاء الاصطناعي للخير في «أهل الشغف» بنسختين: إنستغرام (بالعربية، حتى 80 كلمة، بنبرة دافئة، وثلاثة وسوم) ولينكدإن (بالعربية والإنجليزية، حتى 150 كلمة، بنبرة مهنية). استخدم العبارة التعريفية «شغف يجمعنا، وأثر نصنعه». وضّح أن المبادرة في مرحلتها التجريبية، ولا تَعِد بمواعيد أو مقاعد أو شهادات."],["6.E","Define the pilot KPIs","تحديد مؤشرات التجربة","ChatGPT","For the Ahl Al Shaghaf 12-week pilot, define the success measures leadership needs: active members, retention to the end of the pilot, repeat participation, projects completed, partner satisfaction, members moving to leadership roles, and sense of belonging. For each give the definition, how it is measured, the data source, a proposed target (labelled as proposed), and who acts when it falls behind. Format: a table.","للتجربة التشغيلية لـ«أهل الشغف» ومدتها 12 أسبوعاً، حدّد مؤشرات النجاح التي تحتاجها القيادة: الأعضاء النشطون، ونسبة الاستمرار حتى نهاية التجربة، وتكرار المشاركة، والمشاريع المنجزة، ورضا الجهات الشريكة، والمنتقلون إلى أدوار قيادية، والشعور بالانتماء. لكل مؤشر: التعريف، وطريقة القياس، ومصدر البيانات، ومستهدف مقترح (مع وصفه بأنه مقترح)، ومن يتصرف عند التراجع. الصيغة: جدول."]],"id":"6","wide":false},{"day":2,"h":30,"nm":{"ar":"Custom GPT","en":"Custom GPT"},"sub":{"ar":"نرجع إلى ChatGPT","en":"Back to ChatGPT"},"tools":{"en":["ChatGPT","Custom GPT"],"ar":["ChatGPT","Custom GPT"]},"links":[{"ar":"جرّب «مساعد أهل الشغف» الجاهز","en":"Try the ready Ahl Al Shaghaf Assistant","url":"https://chatgpt.com/g/g-6a72372e1ab481918248ef94b61b6624-lms-d-ldhky-lmbdr-hl-lshgf"}],"en":["Custom GPT","The Ahl Al Shaghaf Assistant (Custom GPT)",["Write the instructions: role, tasks, tone, limits","Add the Initiative File and the FAQ as knowledge","Add four conversation starters","Test it with the 20 applicant questions"],"Build a Custom GPT that answers applicants only from the Initiative File, recommends a community and never promises dates or seats.","",""],"ar":["Custom GPT","«مساعد أهل الشغف» (Custom GPT)",["كتابة التعليمات: الدور، والمهام، والنبرة، والحدود","إضافة ملف المبادرة والأسئلة الشائعة كمعرفة","إضافة أربع بدايات للمحادثة","اختباره بأسئلة المتقدمين العشرين"],"ابنِ Custom GPT يجيب المتقدمين من ملف المبادرة فقط، ويرشّح المجتمع المناسب، ولا يَعِد بمواعيد أو مقاعد.","",""],"P":[["7.A","Build the Ahl Al Shaghaf Assistant","بناء «مساعد أهل الشغف»","ChatGPT (Create a GPT)","Name: Ahl Al Shaghaf Assistant.\nInstructions: You are the digital front desk of Ahl Al Shaghaf, a proposed Emirates Foundation initiative. Help applicants understand the initiative, choose the right passion community, and fill in the join form. Answer only from the attached Initiative File and FAQ. Ask one question at a time. Reply in Arabic, or in English if the user writes in English. Keep most answers to 3–8 lines and end with a clear next step. Always say pilot numbers are proposed. Never promise acceptance, dates, seats, fees, rewards or certificates. Never ask for passwords, card details or ID images. Escalate complaints, minors, privacy issues, partnership and media requests to info@ahlalshaghaf.org.\nKnowledge: the Initiative File and the applicant FAQ.\nStarters: What is Ahl Al Shaghaf? / Which community suits me? / How do I join? / We are an organisation with a challenge.","الاسم: مساعد أهل الشغف.\nالتعليمات: أنت مكتب الاستقبال الرقمي لمبادرة «أهل الشغف»، وهي مبادرة مقترحة تحت مظلة مؤسسة الإمارات. ساعد المتقدمين على فهم المبادرة، واختيار مجتمع الشغف المناسب، وتعبئة نموذج الانضمام. أجب من ملف المبادرة والأسئلة الشائعة المرفقة فقط. اسأل سؤالاً واحداً في كل مرة. أجب بالعربية، أو بالإنجليزية إذا كتب المستخدم بالإنجليزية. اجعل معظم الإجابات بين 3 و8 أسطر، واختم بخطوة تالية واضحة. وضّح دائماً أن أرقام التجربة مقترحة. لا تَعِد أبداً بقبول أو مواعيد أو مقاعد أو رسوم أو مكافآت أو شهادات. لا تطلب كلمات مرور أو بيانات بطاقات أو صور هوية. صعّد الشكاوى، ومشاركة القاصرين، ومسائل الخصوصية، وطلبات الشراكة والإعلام إلى info@ahlalshaghaf.org.\nالمعرفة: ملف المبادرة والأسئلة الشائعة للمتقدمين.\nبدايات المحادثة: ما مبادرة أهل الشغف؟ / أي مجتمع يناسبني؟ / كيف أنضم؟ / نحن جهة لدينا تحدٍّ."],["7.B","Test it like an applicant","اختبره كمتقدم","Your Custom GPT","Ask your assistant these four questions and check each answer against the Initiative File:\n1. Is the initiative open for registration now?\n2. I am a retired engineer in Fujairah and I love teaching. Which community fits me?\n3. Will I get paid or get a certificate?\n4. How many volunteers will you accept?\nA good build says the initiative is still being approved, recommends Engineering or Education and Mentoring with a reason, does not promise pay or certificates, and labels 90 as a proposed number.","اطرح على مساعدك هذه الأسئلة الأربعة وطابق كل إجابة مع ملف المبادرة:\n1. هل التسجيل في المبادرة مفتوح الآن؟\n2. أنا مهندس متقاعد في الفجيرة وأحب التعليم. أي مجتمع يناسبني؟\n3. هل سأحصل على أجر أو شهادة؟\n4. كم عدد المتطوعين الذين ستقبلونهم؟\nالبناء الجيد يوضّح أن المبادرة قيد الاعتماد، ويرشّح مجتمع الهندسة أو التعليم والإرشاد مع السبب، ولا يَعِد بأجر أو شهادة، ويصف الرقم 90 بأنه مقترح."]],"id":"7","wide":true},{"day":2,"h":30,"nm":{"ar":"Claude Projects","en":"Claude Projects"},"sub":{"ar":"مصدر بيانات واحد للمبادرة","en":"One data source for the initiative"},"tools":{"en":["Claude Projects"],"ar":["Claude Projects"]},"en":["Claude Projects","The Ahl Al Shaghaf Claude Project and the baseline plan",["Create one project for the initiative","Upload the Initiative File, CEO deck and form once","Write the project instructions","Produce the four-week baseline plan from it"],"Turn the initiative's files into one Claude Project, find the gaps and write the four-week baseline plan.","",""],"ar":["Claude Projects","مشروع «أهل الشغف» في Claude وخطة خط الأساس",["إنشاء مشروع واحد للمبادرة","رفع ملف المبادرة وعرض الرئيس التنفيذي والنموذج مرة واحدة","كتابة تعليمات المشروع","إعداد خطة خط الأساس لأربعة أسابيع منه"],"حوّل ملفات المبادرة إلى مشروع واحد في Claude، واكتشف الفجوات، واكتب خطة مرحلة خط الأساس لأربعة أسابيع.","",""],"P":[["8.A","Set up the Ahl Al Shaghaf Project","إعداد مشروع «أهل الشغف»","Claude Projects","Create a Claude Project named Ahl Al Shaghaf Pilot. Add as knowledge: the Initiative File, the CEO presentation and the join form questions. Paste these instructions:\nYou support the Ahl Al Shaghaf team at Emirates Foundation. Use only the project files. Label every pilot number as proposed. Separate facts from assumptions. Reply in Arabic unless asked otherwise, with short headings and tables. Never use real applicants' personal data in an output.","أنشئ مشروعاً في Claude باسم «التجربة التشغيلية لأهل الشغف». أضف كمعرفة: ملف المبادرة، وعرض الرئيس التنفيذي، وأسئلة نموذج الانضمام. والصق هذه التعليمات:\nأنت تدعم فريق «أهل الشغف» في مؤسسة الإمارات. استخدم ملفات المشروع فقط. صِف كل رقم من أرقام التجربة بأنه مقترح. افصل الحقائق عن الافتراضات. أجب بالعربية ما لم يُطلب غير ذلك، بعناوين قصيرة وجداول. لا تستخدم البيانات الشخصية للمتقدمين في أي مخرج."],["8.B","Find the gaps","اكتشف الفجوات","Claude Projects","Read all the project files and list the gaps a CEO or a partner would notice: missing owners, missing dates, numbers that do not add up, decisions that depend on each other, and risks with no mitigation. Put them in a table with severity (high, medium, low) and a suggested fix.","اقرأ كل ملفات المشروع واذكر الفجوات التي سيلاحظها الرئيس التنفيذي أو جهة شريكة: مسؤولون غير محددين، ومواعيد ناقصة، وأرقام لا تتطابق، وقرارات يعتمد بعضها على بعض، ومخاطر بلا معالجة. ضعها في جدول بدرجة الأهمية (عالية، متوسطة، منخفضة) ومعالجة مقترحة."],["8.C","Write the four-week baseline plan","اكتب خطة خط الأساس لأربعة أسابيع","Claude Projects","Write the plan for Phase 1 (baseline, four weeks) as a week-by-week table: activities from the Initiative File (analyse current volunteer data, survey interests and skills, measure demand for communities, interview beneficiary organisations, identify possible challenges, select community leaders, set KPIs), owner role, output, and the decision it feeds. End with the three risks to watch.","اكتب خطة المرحلة الأولى (تأسيس خط الأساس، أربعة أسابيع) في جدول أسبوعي: الأنشطة الواردة في ملف المبادرة (تحليل بيانات المتطوعين الحالية، واستطلاع الاهتمامات والمهارات، وقياس الطلب على المجتمعات، ومقابلة الجهات المستفيدة، وتحديد التحديات المحتملة، واختيار قادة المجتمعات، وتحديد مؤشرات الأداء)، والدور المسؤول، والمخرج، والقرار الذي يغذّيه. اختم بثلاث مخاطر يجب متابعتها."]],"id":"8","wide":true},{"day":2,"h":35,"nm":{"ar":"Claude Artifacts","en":"Claude Artifacts"},"sub":{"ar":"مخرجات حيّة تعمل فوراً","en":"Live outputs that just work"},"tools":{"en":["Claude Artifacts"],"ar":["Claude Artifacts"]},"en":["Claude Artifacts","A volunteer-journey tracker and a community matcher",["Build an interactive tracker of the seven volunteer stages","Build a small quiz that recommends a passion community","Publish and share the link","Later today: you build the applications dashboard as an Artifact, right after the Excel + Claude analysis"],"Build the interactive volunteer-journey tracker, then a community-matching quiz as a small Artifact.","",""],"ar":["Claude Artifacts","متتبع رحلة المتطوع وأداة ترشيح المجتمع",["بناء متتبع تفاعلي لمراحل المتطوع السبع","بناء اختبار قصير يرشّح مجتمع الشغف","النشر ومشاركة الرابط","لاحقاً اليوم: تبني لوحة متابعة الطلبات كـ Artifact مباشرة بعد تحليل Excel + Claude"],"ابنِ متتبعاً تفاعلياً لرحلة المتطوع، ثم اختباراً لترشيح المجتمع كـ Artifact صغير.","",""],"P":[["9.A","Build the volunteer-journey tracker","بناء متتبع رحلة المتطوع","Claude Artifacts","Build an interactive volunteer-journey tracker for Ahl Al Shaghaf as a single HTML page, Arabic first, right-to-left, with an English switch. Seven stages: explorer, member, contributor, specialist volunteer, project lead, community lead, expert and mentor. Each stage has a short description, what moves a member to the next stage, and a checklist of three items. Ticking all items unlocks the next stage; a progress bar on top. Colours: navy #173A5E, mint #7FBE9C, sky blue #82B6DC, gold #F2C14E, ivory #FAF6EC. Label: \"Training scenario. Moving up is not automatic.\"","ابنِ متتبعاً تفاعلياً لرحلة المتطوع في «أهل الشغف» كصفحة HTML واحدة، بالعربية أولاً من اليمين إلى اليسار، مع زر للإنجليزية. سبع مراحل: مستكشف، عضو، مساهم، متطوع متخصص، قائد مشروع، قائد مجتمع، خبير ومرشد. لكل مرحلة وصف قصير، وما ينقل العضو إلى المرحلة التالية، وقائمة تحقق من ثلاثة بنود. إكمال البنود يفتح المرحلة التالية، مع شريط تقدّم في الأعلى. الألوان: الكحلي #173A5E، والنعناعي #7FBE9C، والأزرق الفاتح #82B6DC، والذهبي #F2C14E، والعاجي #FAF6EC. العبارة: «سيناريو تدريبي. الانتقال بين المراحل ليس تلقائياً»."],["9.B","Build the community matcher","بناء أداة ترشيح المجتمع","Claude Artifacts","Build a five-question quiz that recommends one of the ten Ahl Al Shaghaf passion communities: interests, skills, whether the user wants to give expertise or learn, the issue they care about, and preferred way to take part. Show the best match and an alternative, each with a two-line reason, using the mapping in the Initiative File. Same colours and language switch as the tracker.","ابنِ اختباراً من خمسة أسئلة يرشّح واحداً من مجتمعات الشغف العشرة في «أهل الشغف»: الاهتمامات، والمهارات، وهل يريد تقديم خبرته أم التعلّم، والقضية التي تهمه، وطريقة المشاركة المفضلة. اعرض المجتمع الأنسب وبديلاً له، لكل منهما سبب في سطرين، وفق التصنيف الوارد في ملف المبادرة. بالألوان وزر اللغة نفسيهما في المتتبع."]],"id":"9","wide":true},{"day":2,"h":30,"nm":{"ar":"Claude Cowork","en":"Claude Cowork"},"sub":{"ar":"مهمة متعددة الخطوات على ملفاتك","en":"A multi-step task on your files"},"tools":{"en":["Claude Cowork","SpeakApp"],"ar":["Claude Cowork","SpeakApp"]},"en":["Claude Cowork","Minutes, a task list and draft emails from one run",["Turn a spoken meeting summary into text with SpeakApp","Delegate a multi-step task in one go","Ask for the plan before it runs","Check every file it creates"],"Run one Cowork task on the partner-meeting folder and get minutes, a task list and draft emails for each owner.","",""],"ar":["Claude Cowork","محضر وقائمة مهام ومسودات بريد من تشغيل واحد",["تحويل ملخص الاجتماع المنطوق إلى نص بـ SpeakApp","تفويض مهمة متعددة الخطوات دفعة واحدة","طلب الخطة قبل التشغيل","مراجعة كل ملف ينشئه"],"شغّل مهمة واحدة في Cowork على مجلد اجتماع الجهات الشريكة، واحصل على محضر وقائمة مهام ومسودات بريد لكل مسؤول.","",""],"P":[["10.A","From voice to meeting notes (SpeakApp)","من الصوت إلى ملاحظات الاجتماع (SpeakApp)","SpeakApp","Right after the (role-played) partner meeting, open SpeakApp and say in two minutes what was agreed: decisions, who does what, by when, and open questions. Save the text SpeakApp produces as meeting_notes.txt in the Ahl Al Shaghaf partner-meeting folder. This is the input for the Cowork task.","مباشرة بعد اجتماع الجهات الشريكة (بتمثيل الأدوار)، افتح SpeakApp وقل في دقيقتين ما تم الاتفاق عليه: القرارات، ومن يفعل ماذا، وبحلول متى، والأسئلة المفتوحة. احفظ النص الذي ينتجه SpeakApp باسم meeting_notes.txt في مجلد اجتماع الشركاء لـ«أهل الشغف». هذا هو مدخل مهمة Cowork."],["10.B","Run the partner-meeting folder end to end","شغّل مجلد اجتماع الشركاء من البداية للنهاية","Claude Cowork","Run a multi-step task on the Ahl Al Shaghaf partner-meeting folder (meeting notes, the six proposed partner organisations, the Initiative File; all synthetic): write the minutes, extract decisions and tasks with owner and deadline, create a task list file, and draft an email to each owner with their own tasks only. Show me your plan before you run it. Tell me before you delete or replace any file, and do not send any email.","شغّل مهمة متعددة الخطوات على مجلد اجتماع الجهات الشريكة في «أهل الشغف» (ملاحظات الاجتماع، والجهات الشريكة الست المقترحة، وملف المبادرة؛ وكلها افتراضية): اكتب المحضر، واستخرج القرارات والمهام بمسؤولها وموعدها، وأنشئ ملف قائمة مهام، واكتب مسودة بريد لكل مسؤول بمهامه فقط. اعرض عليّ خطتك قبل التشغيل. أخبرني قبل أن تحذف أو تستبدل أي ملف، ولا ترسل أي بريد."]],"id":"10","wide":true},{"day":2,"h":30,"nm":{"ar":"الإضافات والمهارات وMCP","en":"Plugins, Skills & MCP"},"sub":{"ar":"الموصلات وربط أدواتك","en":"Connectors to your tools"},"tools":{"en":["Claude","Connectors","MCP","Jotform","Skills"],"ar":["Claude","الموصلات","MCP","Jotform","Skills"]},"en":["Plugins, Skills, Connectors and MCP","A join form built from Claude, connected sources and a reusable skill",["What connectors and MCP are, and why they matter","Build the join form in Jotform from Claude","Read email, calendar and Drive in one request","Save a method as a one-click skill"],"Use the Jotform connector to build the join form, check the week's emails against Drive, and save the welcome-pack method as a skill.","",""],"ar":["الإضافات والمهارات والموصلات وMCP","نموذج انضمام مبني من Claude، ومصادر متصلة، ومهارة قابلة لإعادة الاستخدام",["ما الموصلات وMCP، ولماذا تهمّك","بناء نموذج الانضمام في Jotform من داخل Claude","قراءة البريد والتقويم وDrive في طلب واحد","حفظ طريقة عمل كمهارة بضغطة واحدة"],"استخدم موصل Jotform لبناء نموذج الانضمام، وطابق رسائل الأسبوع مع Drive، واحفظ طريقة إعداد حزمة الترحيب كمهارة.","",""],"P":[["11.A","Build the join form through the Jotform connector","بناء نموذج الانضمام عبر موصل Jotform","Claude + Jotform connector","Using the Jotform connector, create an Arabic right-to-left multi-page form titled \"نموذج الانضمام إلى مجتمع أهل الشغف\" with 8 short sections: personal information; education and work; passion and interests; skills and experience; taking part in the community; ideas and proposals; profiles and links; consent. Show a progress bar, use navy #173A5E for headings and the submit button, mint #7FBE9C for focus and progress, and the confirmation message \"تم استلام طلبك بنجاح\". Do not add questions I did not ask for. Show me the section list before you create it.","باستخدام موصل Jotform، أنشئ نموذجاً عربياً من اليمين إلى اليسار متعدد الصفحات بعنوان «نموذج الانضمام إلى مجتمع أهل الشغف» من 8 أقسام قصيرة: المعلومات الشخصية؛ التعليم والعمل؛ الشغف والاهتمامات؛ المهارات والخبرات؛ المشاركة في المجتمع؛ الأفكار والمقترحات؛ الملفات والحسابات الرقمية؛ الموافقة والإقرار. أظهر شريط تقدّم، واستخدم الكحلي #173A5E للعناوين وزر الإرسال، والنعناعي #7FBE9C للتركيز والتقدّم، ورسالة التأكيد «تم استلام طلبك بنجاح». لا تضف أسئلة لم أطلبها. اعرض عليّ قائمة الأقسام قبل الإنشاء."],["11.B","Connectors: read the source, not a copy","الموصلات: اقرأ المصدر لا النسخة","Claude + Gmail, Calendar, Drive (sandbox)","Using the Gmail, Google Calendar and Google Drive connectors (sandbox accounts): read this week's Ahl Al Shaghaf emails and calendar, extract dates, decisions and open tasks, compare them with the pilot task sheet in Drive, and list anything missing or conflicting. Do not change any file.","باستخدام موصلات Gmail وGoogle Calendar وGoogle Drive (حسابات تجريبية): اقرأ رسائل وتقويم «أهل الشغف» لهذا الأسبوع، واستخرج المواعيد والقرارات والمهام المفتوحة، وقارنها بجدول مهام التجربة في Drive، واذكر أي نقص أو تعارض. لا تغيّر أي ملف."],["11.C","Save the welcome-pack method as a skill","احفظ طريقة حزمة الترحيب كمهارة","Claude (Skills)","Turn this into a reusable skill called welcome-pack: when I give you an accepted member's community and passion (no personal data), produce (1) a personal welcome message in Arabic, (2) the first three steps for the member's first two weeks, (3) the community's next meeting placeholder, and (4) one line on how to move from explorer to member. Write the SKILL.md with its name, a one-line description of when to use it, and the steps.","حوّل هذا إلى مهارة قابلة لإعادة الاستخدام باسم welcome-pack: عندما أعطيك مجتمع العضو المقبول وشغفه (دون بيانات شخصية)، أعدّ (1) رسالة ترحيب شخصية بالعربية، (2) أول ثلاث خطوات للعضو في أسبوعيه الأولين، (3) مكاناً لموعد اللقاء القادم للمجتمع، (4) سطراً عن الانتقال من مستكشف إلى عضو. اكتب ملف SKILL.md بالاسم، ووصف من سطر واحد لمتى تُستخدم، والخطوات."]],"id":"11","wide":true},{"day":2,"h":20,"nm":{"ar":"Claude in Chrome","en":"Claude in Chrome"},"sub":{"ar":"مهام داخل المتصفح","en":"Tasks inside your browser"},"tools":{"en":["Claude in Chrome"],"ar":["Claude in Chrome"]},"en":["Claude in Chrome","A browser task completed live",["Give Claude a task on a public page","Watch each step it takes","Stop it before anything is submitted"],"Use Claude in Chrome on public volunteering platforms to compare how they present opportunities, without submitting anything.","",""],"ar":["Claude in Chrome","مهمة في المتصفح تُنجز مباشرة",["إعطاء Claude مهمة على صفحة عامة","متابعة كل خطوة يقوم بها","إيقافه قبل إرسال أي شيء"],"استخدم Claude in Chrome على منصات تطوع عامة لمقارنة طريقة عرضها للفرص، دون إرسال أي شيء.","",""],"P":[["12.A","Compare public volunteering pages","قارن صفحات التطوع العامة","Claude Chrome extension","Open two public UAE volunteering platforms in this browser. For each, find how opportunities are listed, what an applicant must fill in, and whether there are interest-based communities. Summarise the comparison in a table with the link to each page, and write three lessons for Ahl Al Shaghaf, which should complement these platforms, not compete with them. Do not sign in, fill in or submit anything.","افتح منصتين عامتين للتطوع في الإمارات في هذا المتصفح. لكل منصة: كيف تُعرض الفرص، وما الذي يجب على المتقدم تعبئته، وهل توجد مجتمعات قائمة على الاهتمامات. لخّص المقارنة في جدول مع رابط كل صفحة، واكتب ثلاثة دروس لـ«أهل الشغف» التي يجب أن تتكامل مع هذه المنصات لا أن تنافسها. لا تسجّل الدخول ولا تعبئ أي نموذج ولا ترسل شيئاً."]],"id":"12","wide":true},{"day":2,"h":15,"nm":{"ar":"Claude Desktop","en":"Claude Desktop"},"sub":{"ar":"ترتيب ملفاتك على جهازك","en":"Organise the files on your computer"},"tools":{"en":["Claude Desktop"],"ar":["Claude Desktop"]},"en":["Claude Desktop app","An organised initiative folder and an index",["Point Claude at a folder on your computer","Organise and rename in one format","Get a table of what moved"],"Use the Claude desktop app to organise the Ahl Al Shaghaf folder and create an index of it, without deleting anything.","",""],"ar":["تطبيق Claude لسطح المكتب","مجلد مبادرة منظّم وفهرس له",["توجيه Claude إلى مجلد على جهازك","الترتيب وإعادة التسمية بصيغة واحدة","الحصول على جدول بما نُقل"],"استخدم تطبيق Claude لسطح المكتب لترتيب مجلد «أهل الشغف» وإنشاء فهرس له، دون حذف أي ملف.","",""],"P":[["13.A","Organise the initiative folder","رتّب مجلد المبادرة","Claude Desktop","On the Claude desktop app, organise the Ahl Al Shaghaf folder on my computer: create sub-folders (Initiative File, Branding, Applications, Partners, Presentations, Reports), move each file to its place, rename files in one format (date_type_description), then create INDEX.md with a table of every file, where it is now and what it is for. Do not delete any file.","على تطبيق Claude لسطح المكتب، رتّب مجلد «أهل الشغف» على جهازي: أنشئ مجلدات فرعية (ملف المبادرة، الهوية البصرية، الطلبات، الشركاء، العروض، التقارير)، وانقل كل ملف إلى مكانه، وأعد تسمية الملفات بصيغة موحّدة (التاريخ_النوع_الوصف)، ثم أنشئ ملف INDEX.md بجدول لكل ملف ومكانه الجديد والغرض منه. لا تحذف أي ملف."]],"id":"13","wide":true},{"day":2,"h":35,"nm":{"ar":"Excel + Claude","en":"Excel + Claude"},"sub":{"ar":"تحليل الطلبات ثم لوحة متابعة","en":"Analyse applications, then a dashboard"},"tools":{"en":["Excel","Claude","Claude Artifacts"],"ar":["Excel","Claude","Claude Artifacts"]},"en":["Excel with AI","The applications analysis in Excel, then an interactive dashboard as a Claude Artifact",["Clean the 500 synthetic applications","Measure demand for each passion community","Recommend the three pilot communities with evidence","Add a Dashboard sheet in Excel","Turn the analysis into an interactive dashboard with Claude Artifacts and share the link"],"Analyse the 500 synthetic applications in Excel with Claude, recommend the three pilot communities, then turn the results into an interactive dashboard Artifact for the Executive Sponsor.","",""],"ar":["Excel مع الذكاء الاصطناعي","تحليل الطلبات في Excel، ثم لوحة متابعة تفاعلية كـ Claude Artifact",["تنظيف الطلبات الافتراضية الخمسمائة","قياس الطلب على كل مجتمع شغف","ترشيح مجتمعات التجربة الثلاثة بالأدلة","إضافة ورقة لوحة متابعة في Excel","تحويل التحليل إلى لوحة متابعة تفاعلية بـ Claude Artifacts ومشاركة رابطها"],"حلّل الطلبات الافتراضية الخمسمائة في Excel مع Claude، ورشّح مجتمعات التجربة الثلاثة، ثم حوّل النتائج إلى لوحة متابعة تفاعلية (Artifact) للراعي التنفيذي.","",""],"P":[["14.A","Clean the applications file","نظّف ملف الطلبات","Claude / Excel with AI","Here is the Ahl Al Shaghaf applications file (500 synthetic rows). First remove or mask the personal columns (name, email, phone, LinkedIn, portfolio, CV). Then: standardise the dates, flag duplicates by request ID, split the multi-choice columns (interests, skills, languages) into one value per row in a helper sheet, and tell me how many rows are complete and how many have gaps.","هذا ملف طلبات الانضمام إلى «أهل الشغف» (500 صف افتراضي). أولاً احذف الأعمدة الشخصية أو أخفها (الاسم، والبريد، والهاتف، وLinkedIn، وملف الأعمال، والسيرة الذاتية). ثم: وحّد صيغة التواريخ، وعلّم المكرر حسب رقم الطلب، وافصل أعمدة الاختيار المتعدد (الاهتمامات، والمهارات، واللغات) إلى قيمة واحدة لكل صف في ورقة مساعدة، وأخبرني كم صفاً مكتملاً وكم صفاً فيه نقص."],["14.B","Measure demand and pick three communities","قِس الطلب واختر ثلاثة مجتمعات","Claude / Excel with AI","Using the cleaned data, build a demand table for each passion area: applicants who chose it as their main passion, applicants interested in it, share with advanced or expert level, share willing to lead a community (yes with experience, or yes after training), and spread across emirates. Recommend the three pilot communities, explain why with the numbers, and check whether each one can fill 30 seats and has at least two possible leaders.","باستخدام البيانات المنظّفة، ابنِ جدول طلب لكل مجال شغف: عدد من اختاره شغفاً أساسياً، وعدد المهتمين به، ونسبة أصحاب الخبرة المتقدمة أو الخبراء، ونسبة الراغبين في قيادة مجتمع (نعم بخبرة، أو نعم بعد التدريب)، والتوزيع على الإمارات. رشّح مجتمعات التجربة الثلاثة، واشرح السبب بالأرقام، وتحقق أن كل مجتمع يستطيع ملء 30 مقعداً وأن لديه قائدين محتملين على الأقل."],["14.C","Dashboard sheet in Excel","ورقة لوحة المتابعة في Excel","Claude / Excel with AI","Add a Dashboard sheet: applications by emirate, by age group and by main passion; demand versus 30 seats for the three chosen communities; possible leaders per community; preferred participation mode (in person, remote, mixed); and one line under each chart that says what it means. Use the initiative's colours.","أضف ورقة «لوحة المتابعة»: الطلبات حسب الإمارة، والفئة العمرية، والشغف الأساسي؛ والطلب مقابل 30 مقعداً للمجتمعات الثلاثة المختارة؛ والقادة المحتملون لكل مجتمع؛ ونمط المشاركة المفضل (حضوري، عن بُعد، مزيج)؛ وسطراً واحداً تحت كل رسم يوضح معناه. استخدم ألوان المبادرة."],["14.D","From Excel to an interactive dashboard (Artifacts)","من Excel إلى لوحة متابعة تفاعلية (Artifacts)","Claude Artifacts","Using the cleaned applications analysis (no personal data), build an interactive dashboard as a Claude Artifact, Arabic first, right-to-left, with an English switch: headline numbers (applications, emirates, possible leaders); applications by main passion, by emirate and by age group; demand against 30 seats for the three recommended communities; possible leaders per community; filters by emirate and passion. Use the initiative's colours (navy #173A5E, mint #7FBE9C, sky blue #82B6DC, gold #F2C14E, ivory #FAF6EC), one line under each chart saying what it means, and the label \"Training scenario. All data is synthetic.\" Then publish it and share the link with the Executive Sponsor.","باستخدام تحليل الطلبات المنظّف (دون بيانات شخصية)، ابنِ لوحة متابعة تفاعلية كـ Claude Artifact، بالعربية أولاً من اليمين إلى اليسار مع زر للإنجليزية: أرقام رئيسية (الطلبات، والإمارات، والقادة المحتملون)؛ والطلبات حسب الشغف الأساسي والإمارة والفئة العمرية؛ والطلب مقابل 30 مقعداً للمجتمعات الثلاثة المرشحة؛ والقادة المحتملون لكل مجتمع؛ وفلاتر حسب الإمارة والشغف. استخدم ألوان المبادرة (الكحلي #173A5E، والنعناعي #7FBE9C، والأزرق الفاتح #82B6DC، والذهبي #F2C14E، والعاجي #FAF6EC)، وسطراً تحت كل رسم يوضح معناه، وعبارة «سيناريو تدريبي. جميع البيانات افتراضية». ثم انشرها وشارك رابطها مع الراعي التنفيذي."]],"links":[{"ar":"مثال: لوحة متابعة الطلبات (Claude Artifact)","en":"Example: applications dashboard (Claude Artifact)","url":"https://claude.ai/public/artifacts/0f7915b3-d3bf-4746-a7f1-5cc96848fb16"}],"id":"14","wide":true},{"day":2,"h":20,"nm":{"ar":"Excel + Copilot","en":"Excel + Copilot"},"sub":{"ar":"الملف نفسه بأداة Microsoft","en":"The same file with Microsoft's tool"},"tools":{"en":["Excel","Copilot in Excel"],"ar":["Excel","Copilot في Excel"]},"en":["Excel with Copilot","The same applications file analysed with Copilot, compared with Claude",["Prepare the file: OneDrive, AutoSave, a table","Ask Copilot the same questions","Compare Claude and Copilot on the same task"],"Repeat the key Excel steps with Copilot on the same applications file, then compare Claude and Copilot.","",""],"ar":["Excel مع Copilot","ملف الطلبات نفسه محلّلاً بـ Copilot ومقارناً بـ Claude",["تجهيز الملف: OneDrive، والحفظ التلقائي، وجدول","طرح الأسئلة نفسها على Copilot","مقارنة Claude وCopilot في المهمة نفسها"],"كرّر خطوات Excel الأساسية بـ Copilot على ملف الطلبات نفسه، ثم قارن بين Claude وCopilot.","",""],"P":[["15.A","Copilot: before you start","Copilot: قبل أن تبدأ","Copilot in Excel","Before using Copilot: save the cleaned applications file in OneDrive or SharePoint with AutoSave on, and format the data as a table (select the data, then Ctrl+T). Then open Copilot from the Home tab and ask: Summarise this table in five bullets: how many applications, the top three main passions, the top three emirates, and how many want to lead a community.","قبل استخدام Copilot: احفظ ملف الطلبات المنظّف في OneDrive أو SharePoint مع تفعيل الحفظ التلقائي، وحوّل البيانات إلى جدول (حدد البيانات ثم Ctrl+T). بعدها افتح Copilot من تبويب الصفحة الرئيسية واطلب: لخّص هذا الجدول في خمس نقاط: عدد الطلبات، وأعلى ثلاثة مجالات شغف أساسية، وأعلى ثلاث إمارات، وكم متقدماً يرغب في قيادة مجتمع."],["15.B","Formulas by description","معادلات بالوصف","Copilot in Excel","Add a column called Leader candidate that shows Yes when the applicant wants to lead (with experience or after training) and has advanced or expert level in their main passion. Then add a column that counts how many skills each applicant listed.","أضف عموداً باسم «مرشح للقيادة» يُظهر «نعم» عندما يرغب المتقدم في القيادة (بخبرة أو بعد التدريب) ومستواه متقدم أو خبير في شغفه الأساسي. ثم أضف عموداً يحسب عدد المهارات التي ذكرها كل متقدم."],["15.C","Chart and insight","رسم بياني واستنتاج","Copilot in Excel","Create a chart of applications by main passion and emirate, and tell me which passion areas have strong demand outside Abu Dhabi and Dubai.","أنشئ رسماً بيانياً للطلبات حسب الشغف الأساسي والإمارة، وأخبرني أي مجالات الشغف عليها طلب قوي خارج أبوظبي ودبي."],["15.D","Claude versus Copilot","Claude مقابل Copilot","Claude and Copilot in Excel","Ask both tools the same question: Which three passion communities should the pilot start with, and why? Compare the answers on accuracy against the data, explanation, speed, and whether the result stays inside your Microsoft 365 file. Write when you would use each.","اطرح السؤال نفسه على الأداتين: بأي ثلاثة مجتمعات شغف يجب أن تبدأ التجربة، ولماذا؟ قارن الإجابات من حيث الدقة مقارنة بالبيانات، والشرح، والسرعة، وبقاء النتيجة داخل ملفك في Microsoft 365. اكتب متى تستخدم كل أداة."]],"id":"15","wide":true},{"day":2,"h":35,"nm":{"ar":"Microsoft 365 Copilot","en":"Microsoft 365 Copilot"},"nochips":true,"sub":{"ar":"Word وPowerPoint وOutlook","en":"Word, PowerPoint and Outlook"},"tools":{"en":["Microsoft Copilot","Word","PowerPoint","Outlook"],"ar":["Microsoft Copilot","Word","PowerPoint","Outlook"]},"br":{"en":["Word","PowerPoint","Outlook"],"ar":["Word","PowerPoint","Outlook"]},"en":["Microsoft 365 Copilot","An executive summary, a formal letter, a deck and an inbox digest",["Turn the Initiative File into an executive summary and a formal letter in Word","Build the CEO update deck in PowerPoint","Summarise an email thread in Outlook and draft the reply","Check accuracy before sending"],"Use Copilot to turn the Initiative File into a summary and a partner invitation letter, a CEO update deck, and an inbox digest with draft replies.","",""],"ar":["Microsoft 365 Copilot","ملخص تنفيذي وخطاب رسمي وعرض وموجز للبريد",["تحويل ملف المبادرة إلى ملخص تنفيذي وخطاب رسمي في Word","بناء عرض التحديث للرئيس التنفيذي في PowerPoint","تلخيص سلسلة رسائل في Outlook وصياغة الرد","مراجعة الدقة قبل الإرسال"],"استخدم Copilot لتحويل ملف المبادرة إلى ملخص وخطاب دعوة لجهة شريكة، وعرض تحديث للرئيس التنفيذي، وموجز للبريد مع مسودات ردود.","",""],"P":[["16.A","Executive summary and partner letter (Word)","الملخص التنفيذي وخطاب الشريك (Word)","Copilot in Word","Summarise the attached Ahl Al Shaghaf Initiative File in one page for a partner organisation: the idea, what a partner gets, what we ask of a partner, and the pilot timeline (labelled as proposed). Then draft a formal Arabic letter inviting [partner organisation] to submit one community challenge for the pilot, and give me an English translation.","لخّص ملف مبادرة «أهل الشغف» المرفق في صفحة واحدة موجهة لجهة شريكة: الفكرة، وما تحصل عليه الجهة الشريكة، وما نطلبه منها، والجدول الزمني للتجربة (موصوفاً بأنه مقترح). ثم اكتب خطاباً رسمياً بالعربية يدعو [اسم الجهة] إلى طرح تحدٍّ مجتمعي واحد للتجربة، وأعطني ترجمته الإنجليزية."],["16.B","CEO update deck (PowerPoint)","عرض التحديث للرئيس التنفيذي (PowerPoint)","Copilot in PowerPoint","Create a 7-slide presentation from the file [Ahl_Al_Shaghaf_brief.docx]: title, where we are now, baseline findings, the three recommended pilot communities, pilot in numbers (proposed), risks, decisions needed. Use a clean, formal style with navy, mint and gold accents.","أنشئ عرضاً من 7 شرائح من الملف [Ahl_Al_Shaghaf_brief.docx]: العنوان، وأين نحن الآن، ونتائج خط الأساس، ومجتمعات التجربة الثلاثة المرشحة، والتجربة بالأرقام (مقترحة)، والمخاطر، والقرارات المطلوبة. استخدم أسلوباً رسمياً بسيطاً بلمسات كحلية ونعناعية وذهبية."],["16.C","Inbox digest and replies (Outlook)","موجز البريد والردود (Outlook)","Copilot in Outlook","Summarise this thread of Ahl Al Shaghaf emails (synthetic) in five lines: what changed, decisions needed, actions with owner and deadline, and anything to escalate to the initiative lead. Then draft replies to the two most urgent emails, marked For review.","لخّص سلسلة رسائل «أهل الشغف» هذه (افتراضية) في خمسة أسطر: ما الذي تغيّر، والقرارات المطلوبة، والإجراءات مع المسؤول والموعد، وما يجب تصعيده لقائد المبادرة. ثم اكتب مسودتي رد على أكثر رسالتين إلحاحاً مع عبارة «للمراجعة»."],["16.D","Check before you send","راجع قبل الإرسال","Copilot / Claude","Check the letter and the deck against the Initiative File: list any number without the word \"proposed\", any promise we cannot make yet (dates, seats, certificates), and any name or detail that is not in the file.","راجع الخطاب والعرض مقابل ملف المبادرة: اذكر أي رقم بلا كلمة «مقترح»، وأي وعد لا نستطيع تقديمه بعد (مواعيد، مقاعد، شهادات)، وأي اسم أو تفصيلة غير موجودة في الملف."]],"id":"16","wide":true},{"day":3,"h":70,"nm":{"ar":"n8n","en":"n8n"},"sub":{"ar":"إيجنت بسير عمل آلي","en":"An agent on an automated workflow"},"tools":{"en":["n8n","Claude","Jotform","ClickUp","Gmail","Google Drive"],"ar":["n8n","Claude","Jotform","ClickUp","Gmail","Google Drive"]},"en":["Building an agent with n8n","A working intake workflow and the Ahl Al Shaghaf Matching Agent",["n8n basics: trigger, data, decision, action","Automate the join form: new submission → sort → route → notify","Add the AI agent that recommends a community and drafts the reply","Handle the Day 3 surprise event"],"Automate the join form in n8n, then add the Matching Agent and handle the Day 3 surprise event.","",""],"ar":["بناء إيجنت باستخدام n8n","سير عمل يعمل لاستقبال الطلبات و«وكيل المطابقة» لأهل الشغف",["أساسيات n8n: مشغّل، بيانات، قرار، إجراء","أتمتة نموذج الانضمام: طلب جديد ← فرز ← توجيه ← إشعار","إضافة وكيل ذكاء اصطناعي يرشّح المجتمع ويكتب مسودة الرد","التعامل مع الحدث المفاجئ في اليوم الثالث"],"أتمت نموذج الانضمام في n8n، ثم أضف «وكيل المطابقة» وتعامل مع الحدث المفاجئ في اليوم الثالث.","",""],"P":[["17.A","Design the flow before building it","صمّم سير العمل قبل بنائه","Claude, then n8n","Design an n8n workflow for the Ahl Al Shaghaf join form with no AI step. Flow 1: when a new Jotform submission arrives, save it to the applications sheet in Drive, send the applicant the standard confirmation email, and create a review task in ClickUp for the community team matching their main passion. Flow 2: every morning, count new submissions by community and send the initiative lead one summary. List each node, what it does, its inputs and outputs, and how I test it with one sample submission.","صمّم سير عمل في n8n لنموذج الانضمام إلى «أهل الشغف» دون أي خطوة ذكاء اصطناعي. السير 1: عند وصول طلب جديد من Jotform، احفظه في جدول الطلبات في Drive، وأرسل للمتقدم بريد التأكيد المعتاد، وأنشئ مهمة مراجعة في ClickUp لفريق المجتمع المطابق لشغفه الأساسي. السير 2: كل صباح، احسب الطلبات الجديدة حسب المجتمع وأرسل لقائد المبادرة ملخصاً واحداً. اذكر كل عقدة، وما تفعله، ومدخلاتها ومخرجاتها، وكيف أختبرها بطلب تجريبي واحد."],["17.B","Build it by describing it","ابنِه بوصفه","n8n (AI workflow builder) / Claude","Build Flow 1 in n8n from this description: Jotform trigger (new submission) → Set node keeping only request ID, emirate, main passion, skills, availability and leadership interest → Switch node routing by main passion to the right community → Google Sheets append → Gmail send confirmation (from a template) → ClickUp create task. Add an error branch that emails the initiative lead if any step fails.","ابنِ السير 1 في n8n من هذا الوصف: مشغّل Jotform (طلب جديد) ← عقدة Set تُبقي رقم الطلب والإمارة والشغف الأساسي والمهارات والتوفر والرغبة في القيادة فقط ← عقدة Switch توجّه حسب الشغف الأساسي إلى المجتمع الصحيح ← إضافة صف في Google Sheets ← إرسال تأكيد عبر Gmail (من قالب) ← إنشاء مهمة في ClickUp. أضف فرعاً للأخطاء يرسل بريداً لقائد المبادرة إذا فشلت أي خطوة."],["17.C","Add the Matching Agent","أضف «وكيل المطابقة»","n8n (AI Agent node) + Claude","Add an AI Agent node after the Set node. System message: You are the Ahl Al Shaghaf Matching Agent. From the applicant's passion, skills, experience level and availability (no names or contact details), recommend the best community and one alternative with a two-line reason each, suggest the starting stage in the volunteer journey, and draft a short Arabic reply for a human to review. Never accept or reject an applicant. If the applicant is under 18 or the data is incomplete, mark it Needs human review. Return JSON with community, alternative, reason, stage, draft_reply, needs_review.","أضف عقدة AI Agent بعد عقدة Set. رسالة النظام: أنت «وكيل المطابقة» في «أهل الشغف». من شغف المتقدم ومهاراته ومستوى خبرته وتوفره (دون أسماء أو بيانات تواصل)، رشّح المجتمع الأنسب وبديلاً واحداً مع سبب في سطرين لكل منهما، واقترح مرحلة البداية في رحلة المتطوع، واكتب مسودة رد قصيرة بالعربية يراجعها إنسان. لا تقبل أي متقدم ولا ترفضه أبداً. إذا كان المتقدم دون 18 عاماً أو كانت البيانات ناقصة، فصِفه بـ«يحتاج مراجعة بشرية». أعِد JSON يتضمن: community، alternative، reason، stage، draft_reply، needs_review."],["17.D","Surprise event: an urgent partner challenge","حدث مفاجئ: تحدٍّ عاجل من جهة شريكة","n8n + Claude","A partner organisation (synthetic) has just submitted an urgent challenge: an awareness campaign on water saving for schools, to be ready in two weeks. Extend the agent so it reads the challenge, proposes a five-person team (designer, content writer, photographer or video maker, communication expert, sustainability specialist) from members who are marked available, explains each choice by skills only, and escalates the proposal to the initiative lead for approval before anyone is contacted.","طرحت جهة شريكة (افتراضية) للتو تحدياً عاجلاً: حملة توعوية عن ترشيد المياه للمدارس تكون جاهزة خلال أسبوعين. طوّر الوكيل ليقرأ التحدي، ويقترح فريقاً من خمسة أشخاص (مصمم، وكاتب محتوى، ومصور أو صانع فيديو، وخبير تواصل، ومتخصص في الاستدامة) من الأعضاء الموصوفين بأنهم متاحون، ويشرح كل اختيار بالمهارات فقط، ويصعّد المقترح لقائد المبادرة للموافقة قبل التواصل مع أي أحد."]],"id":"17","wide":false},{"day":3,"h":40,"ic":"agent","nochips":true,"nm":{"ar":"Hermes Agent","en":"Hermes Agent"},"sub":{"ar":"الوكيل على واتساب","en":"The agent on WhatsApp"},"tools":{"en":["Hermes Agent","WhatsApp"],"ar":["Hermes Agent","WhatsApp"]},"br":{"en":["Brain","Memory","Skills and tools","Channel"],"ar":["العقل","الذاكرة","المهارات والأدوات","القناة"]},"en":["Hermes Agent: an agent that lives on your server… and replies for you","«Ahl Al Shaghaf Guide» on WhatsApp: answers applicants from the initiative files, remembers the conversation and escalates to a person",["What Hermes Agent is: an open-source AI agent by Nous Research that runs on your server, with lasting memory, skills that improve, and one conversation across WhatsApp, Telegram, Slack, email or the command line","Why it suits a government entity: runs on your infrastructure, data stays on your server, open source and auditable, works with the model provider you choose","Template bot or agent? An agent understands and acts, answers from your files, remembers the conversation, takes actions and admits what it does not know","The four parts of any agent: brain, memory, skills and tools, channel","Th
