e case: «Ahl Al Shaghaf Guide» on WhatsApp: a question arrives, it reads the context, remembers the conversation, answers or acts, and escalates at the limit","Application A: the agent's instructions (role, limits, escalation)","Application B: what goes into the agent's memory, and what never does","Governance: a person in the loop, a full log, a stop switch","Set up on Hermes Cloud: sign in, create a new instance, choose the name, model and size, open the dashboard","Files: replace SOUL.md with the bot's instructions; Channels: enable WhatsApp and link it with the QR code of the number","System, then Restart; go back to WhatsApp and check it shows Connected","A real conversation: a question inside scope, then one outside it that ends with escalation"],"The same assistant we built yesterday for questions, but today it remembers, reads the files and acts: set up «Ahl Al Shaghaf Guide» on Hermes, connect it to WhatsApp, and test it with ten questions, five inside scope and five outside.","",""],"ar":["Hermes Agent: وكيل يسكن خادمك… ويردّ نيابة عنك","«مرشد أهل الشغف» على واتساب: يجيب المتقدمين من ملفات المبادرة، ويتذكر المحادثة، ويصعّد إلى الإنسان",["ما Hermes Agent: وكيل ذكاء اصطناعي مفتوح المصدر من Nous Research يعمل على خادمك أنت، بذاكرة مستمرة، ومهارات تُبنى وتتحسّن، ومحادثة واحدة عبر واتساب أو تيليجرام أو سلاك أو البريد أو سطر الأوامر","لماذا يناسب جهة حكومية: يعمل على بنيتك التحتية، والبيانات لا تغادر خادمك، ومفتوح المصدر وقابل للتدقيق، ويعمل مع مزوّد النموذج الذي تختاره","بوت قوالب أم وكيل؟ الوكيل يفهم ويتصرف، ويجيب من ملفاتك، ويتذكر المحادثة، وينفّذ إجراءات، ويعترف بجهله","الأجزاء الأربعة لأي وكيل: العقل، والذاكرة، والمهارات والأدوات، والقناة","الحالة العملية: «مرشد أهل الشغف» على واتساب: يصل سؤال، يقرأ السياق، يتذكر المحادثة، يجيب أو ينفّذ، ويصعّد عند الحد","التطبيق (أ): تعليمات الوكيل (الدور والحدود والتصعيد)","التطبيق (ب): ماذا نضع في ذاكرة الوكيل، وما لا يدخلها أبداً","الحوكمة: إنسان في الحلقة، وسجل كامل، وزر إيقاف","التشغيل على Hermes Cloud: الدخول، إنشاء Instance جديد، اختيار الاسم والنموذج والحجم، ثم لوحة التحكم","من Files: استبدال SOUL.md بتعليمات البوت؛ ومن Channels: تفعيل WhatsApp وربطه برمز QR للرقم المطلوب","من System ثم Restart؛ ثم العودة إلى WhatsApp والتأكد من علامة Connected","محادثة حقيقية: سؤال داخل النطاق، ثم سؤال خارجه ينتهي بتصعيد"],"نفس المساعد الذي بنيناه أمس للأسئلة، لكنه اليوم يتذكر ويقرأ الملفات وينفّذ: شغّل «مرشد أهل الشغف» على Hermes، واربطه بواتساب، واختبره بعشرة أسئلة، خمسة داخل النطاق وخمسة خارجه.","",""],"P":[["18.A","Application A: the agent's instructions","التطبيق (أ): تعليمات الوكيل","Hermes Agent (Files → SOUL.md)","You are «Ahl Al Shaghaf Guide», the initiative's official agent on WhatsApp.\nAnswer only from the attached files: the initiative brief, the membership path and the FAQ.\nAnswer in three sentences at most, in simple Arabic, with a warm institutional tone.\nIf you cannot find the answer in the files, say so clearly and never guess.\nEscalate to the coordinator immediately in these cases: a question about acceptance or rejection, a complaint, a request for an exception, or any request about another person's data.\nDo not promise anything on behalf of the foundation, and do not mention unconfirmed dates.\nLog every conversation in the follow-up sheet: number, topic and action.","أنت «مرشد أهل الشغف»، وكيل رسمي للمبادرة على واتساب.\nأجب فقط من الملفات المرفقة: نبذة المبادرة، مسار العضوية، والأسئلة الشائعة.\nأجب بثلاث جمل كحد أقصى، بالعربية المبسطة وبنبرة مؤسسية دافئة.\nإن لم تجد الإجابة في الملفات، قل ذلك صراحة ولا تخمّن أبداً.\nصعّد فوراً إلى المنسّق في هذه الحالات: سؤال عن قبول أو رفض، شكوى، طلب استثناء، أو أي طلب يتعلق ببيانات شخص آخر.\nلا تَعِد بأي شيء باسم المؤسسة، ولا تذكر مواعيد غير مؤكدة.\nسجّل كل محادثة في جدول المتابعة: الرقم، الموضوع، والإجراء."],["18.B","Application B: what goes into the agent's memory","التطبيق (ب): ماذا نضع في ذاكرة الوكيل؟","Hermes Agent (Files)","Memory is not everything you have, only what the agent needs to answer accurately; anything more adds risk.\nPut in:\n• Initiative files: the brief, the seven-stage membership path, joining conditions and the expected time commitment.\n• FAQ: the twenty most frequent questions with answers approved by corporate communication.\nNever put in: applicants' personal data, internal notes, or any file not approved for publication.\nPractical rule: if the whole memory leaked into a public group, would the entity be harmed? If yes, take it out.","الذاكرة ليست كل ما لديك، بل ما يحتاجه الوكيل للإجابة بدقة، وما عداه يزيد المخاطرة.\nيدخل الذاكرة:\n• ملفات المبادرة: النبذة، ومسار العضوية السبع، وشروط الانضمام، والالتزام الزمني المتوقع.\n• الأسئلة الشائعة: أكثر عشرين سؤالاً تكراراً بإجاباتها المعتمدة من الاتصال المؤسسي.\nلا يدخل أبداً: بيانات المتقدمين الشخصية، والملاحظات الداخلية، وأي ملف لم يُعتمد للنشر.\nقاعدة عملية: لو تسرّب محتوى الذاكرة كاملاً في مجموعة عامة، هل تتضرر الجهة؟ إن كان الجواب نعم فأخرجه."],["18.C","Test it on WhatsApp: ten questions","اختبره على واتساب: عشرة أسئلة","WhatsApp (the agent's number)","Send the agent these ten messages from your phone and tick each result:\nInside scope: 1. What is Ahl Al Shaghaf? 2. Which community suits someone who loves design? 3. What are the stages of the membership path? 4. Is volunteering paid? 5. How do I join?\nOutside scope or sensitive: 6. Was I accepted? 7. I want to complain about a coordinator. 8. Can you give me another applicant's phone number? 9. Can you make an exception to the age requirement for me? 10. When exactly is the next meeting?\nA good agent answers 1–5 from the files in three sentences or fewer, and for 6–10 says it does not know or escalates to the coordinator, without guessing.","أرسل للوكيل هذه الرسائل العشر من هاتفك وعلّم على كل نتيجة:\nداخل النطاق: 1. ما مبادرة أهل الشغف؟ 2. أي مجتمع يناسب شخصاً يحب التصميم؟ 3. ما مراحل مسار العضوية؟ 4. هل التطوع مدفوع؟ 5. كيف أنضم؟\nخارج النطاق أو حساس: 6. هل تم قبولي؟ 7. أريد تقديم شكوى على أحد المنسقين. 8. أعطني رقم هاتف متقدم آخر. 9. هل يمكن استثنائي من شرط العمر؟ 10. متى موعد اللقاء القادم بالضبط؟\nالوكيل الجيد يجيب عن 1 إلى 5 من الملفات في ثلاث جمل أو أقل، وفي 6 إلى 10 يقول إنه لا يعرف أو يصعّد إلى المنسّق، دون تخمين."],["18.D","Governance: three controls before running any agent","الحوكمة: ثلاثة ضوابط قبل تشغيل أي وكيل","Hermes Agent (Dashboard)","1. A person in the loop: define the actions that only happen with human approval: any promise, any decision, any message in the entity's name.\n2. A full log: every conversation and every action is recorded with its time, so it can be reviewed and any objection answered later.\n3. A stop switch: one clear way to stop the agent immediately, and a named person who holds that authority.\nStart with a monitoring week: the agent proposes the reply and the coordinator approves it before it is sent, then turn on automatic replies.","1. إنسان في الحلقة: حدد الأفعال التي لا تتم إلا بموافقة بشرية: أي وعد، أي قرار، أي تواصل باسم الجهة.\n2. سجل كامل: كل محادثة وكل إجراء يُسجَّل بوقته، ليمكن مراجعته والرد على أي اعتراض لاحقاً.\n3. زر إيقاف: طريقة واحدة واضحة لإيقاف الوكيل فوراً، ومسؤول معروف يملك صلاحية استخدامها.\nابدأ بأسبوع مراقبة: الوكيل يقترح الرد والمنسّق يعتمده قبل الإرسال، ثم افتح التشغيل التلقائي."]],"id":"18","wide":false},{"day":3,"h":60,"nm":{"ar":"Copilot Studio","en":"Copilot Studio"},"sub":{"ar":"إيجنت داخل Microsoft","en":"An agent inside Microsoft"},"tools":{"en":["Copilot Studio","Microsoft Copilot"],"ar":["Copilot Studio","Microsoft Copilot"]},"en":["Building an agent with Copilot","A Copilot agent for the initiative team, with its governance card",["Design the agent on paper: tasks, tools, limits, when it hands back to a person","Build it step by step in Copilot Studio","Test it on edge cases and improve","Write its governance card"],"Build a Copilot agent that answers the team's questions about the pilot from the Initiative File and escalates sensitive requests, then sign off its governance card.","",""],"ar":["بناء إيجنت باستخدام Copilot","وكيل Copilot لفريق المبادرة مع بطاقة الحوكمة",["تصميم الوكيل على الورق: مهامه، وأدواته، وحدوده، ومتى يرجع إلى الإنسان","بناؤه خطوة بخطوة في Copilot Studio","اختباره على حالات حدّية وتحسينه","كتابة بطاقة الحوكمة الخاصة به"],"ابنِ وكيل Copilot يجيب أسئلة الفريق عن التجربة من ملف المبادرة ويصعّد الطلبات الحساسة، ثم اعتمد بطاقة الحوكمة الخاصة به.","",""],"P":[["19.A","Design the agent","صمّم الوكيل","Claude","Design an agent for the Ahl Al Shaghaf team: goal, users, knowledge sources, tools, what it may do on its own, what it must never do, when it stops and returns to a person, and how we measure that it works. Then tell me whether this should be a fixed automation, a routine or an agent, and why.","صمّم وكيلاً لفريق «أهل الشغف»: هدفه، ومستخدموه، ومصادر معرفته، وأدواته، وما يجوز له فعله وحده، وما لا يفعله أبداً، ومتى يتوقف ويرجع إلى الإنسان، وكيف نقيس أنه يعمل. ثم أخبرني هل يجب أن يكون أتمتة ثابتة أم روتيناً أم وكيلاً، ولماذا."],["19.B","Build the Copilot agent","بناء وكيل Copilot","Copilot Studio","Create an agent called Ahl Al Shaghaf Team Assistant. Instructions: answer questions about the Ahl Al Shaghaf pilot only from the attached Initiative File and pilot task sheet; reply in the user's language; give the file section or task ID for every fact; label pilot numbers as proposed; for media, legal, complaints, minors or personal-data requests, do not answer and tell the user to contact the initiative lead. Add three starter prompts: Where are we in the pilot?, What are my open tasks?, What needs a decision this week?","أنشئ وكيلاً باسم «مساعد فريق أهل الشغف». التعليمات: أجب عن أسئلة التجربة التشغيلية لـ«أهل الشغف» من ملف المبادرة وجدول مهام التجربة المرفقين فقط؛ أجب بلغة المستخدم؛ اذكر قسم الملف أو رقم المهمة لكل معلومة؛ صِف أرقام التجربة بأنها مقترحة؛ في طلبات الإعلام أو الشؤون القانونية أو الشكاوى أو القاصرين أو البيانات الشخصية، لا تجب ووجّه المستخدم إلى قائد المبادرة. أضف ثلاثة أوامر بداية: أين وصلنا في التجربة؟ ما مهامي المفتوحة؟ ما الذي يحتاج قراراً هذا الأسبوع؟"],["19.C","Test it on edge cases","اختبره على حالات حدّية","Copilot Studio (Test pane)","Test your agent with these five questions and fix the instructions until every answer is right:\n1. How many volunteers will join each community?\n2. Can you give me the phone number of applicant AS-1049?\n3. A journalist wants a statement about the initiative. What should I say?\n4. When does registration open?\n5. What did the CEO decide?\nA good agent labels the numbers as proposed, refuses personal data, escalates the media request, and says the dates and the decision are not in the file.","اختبر وكيلك بهذه الأسئلة الخمسة وعدّل التعليمات حتى تصبح كل الإجابات صحيحة:\n1. كم متطوعاً سينضم إلى كل مجتمع؟\n2. هل تعطيني رقم هاتف المتقدم AS-1049؟\n3. صحفي يريد تصريحاً عن المبادرة، ماذا أقول؟\n4. متى يفتح التسجيل؟\n5. ماذا قرر الرئيس التنفيذي؟\nالوكيل الجيد يصف الأرقام بأنها مقترحة، ويرفض مشاركة البيانات الشخصية، ويصعّد طلب الإعلام، ويوضّح أن المواعيد والقرار غير موجودة في الملف."],["19.D","The governance card","بطاقة الحوكمة","Claude","Write a one-page governance card for my agent: name and purpose, accountable owner, data sources and permissions, what it never does, escalation point, logging, periodic review, and the stop switch with who holds it.","اكتب بطاقة حوكمة من صفحة واحدة لوكيلي: الاسم والغرض، والمسؤول المحاسَب، ومصادر البيانات والصلاحيات، وما لا يفعله أبداً، ونقطة التصعيد، والتسجيل، والمراجعة الدورية، ومفتاح الإيقاف ومن يملكه."]],"id":"19","wide":false},{"day":3,"h":35,"nm":{"ar":"Claude Scheduled Tasks","en":"Claude Scheduled Tasks"},"sub":{"ar":"مهام تتكرر في موعدها","en":"Tasks that repeat on time"},"tools":{"en":["Claude","Scheduled tasks"],"ar":["Claude","المهام المجدولة"]},"en":["Claude Scheduled Tasks","A recurring morning digest and a weekly pilot summary",["Decide what matters each morning","Schedule it to run on its own","Deliver as drafts for review"],"Schedule a daily morning digest of new applications and partner emails, and a weekly pilot summary, both delivered as drafts for review.","",""],"ar":["Claude Scheduled Tasks","موجز صباحي متكرر وملخص أسبوعي للتجربة",["تحديد ما يهمك كل صباح","جدولته ليعمل وحده","تسليمه كمسودات للمراجعة"],"جدول موجزاً صباحياً يومياً للطلبات الجديدة ورسائل الشركاء، وملخصاً أسبوعياً للتجربة، يصلان كمسودات للمراجعة.","",""],"P":[["20.A","Daily morning digest","الموجز الصباحي اليومي","Claude (scheduled task, daily 07:00)","Every working day at 07:00: read yesterday's new Ahl Al Shaghaf applications (count only, no personal data) and partner emails (sandbox accounts), and write a five-line digest: new applications by community, partner requests, decisions needed, actions due today with owner, and anything to escalate to the initiative lead. Save it as a draft for review. Do not send anything.","كل يوم عمل الساعة 07:00: اقرأ طلبات الانضمام الجديدة إلى «أهل الشغف» ليوم أمس (الأعداد فقط، دون بيانات شخصية) ورسائل الجهات الشريكة (حسابات تجريبية)، واكتب موجزاً من خمسة أسطر: الطلبات الجديدة حسب المجتمع، وطلبات الشركاء، والقرارات المطلوبة، والإجراءات المستحقة اليوم مع المسؤول، وما يجب تصعيده لقائد المبادرة. احفظه كمسودة للمراجعة. لا ترسل شيئاً."],["20.B","Weekly pilot summary","الملخص الأسبوعي للتجربة","Claude (scheduled task, Thursdays 15:00)","Every Thursday at 15:00: from the pilot task sheet and the week's emails, write a one-page weekly summary for the Executive Sponsor: week number of 12, active members per community, projects on track or at risk, retention so far, partner feedback, and the decisions needed next week. Save it as a dated draft. Do not send anything.","كل خميس الساعة 15:00: من جدول مهام التجربة ورسائل الأسبوع، اكتب ملخصاً أسبوعياً من صفحة واحدة للراعي التنفيذي: رقم الأسبوع من 12، والأعضاء النشطون في كل مجتمع، والمشاريع في المسار أو المعرّضة للتأخر، ونسبة الاستمرار حتى الآن، وملاحظات الجهات الشريكة، والقرارات المطلوبة الأسبوع القادم. احفظه كمسودة بتاريخها. لا ترسل شيئاً."],["20.C","Your own weekly digest","نشرتك الأسبوعية الخاصة","Claude (scheduled task, weekly)","Every Sunday at 08:00, send me a weekly digest of my own work: meetings this week, deadlines, emails waiting for my reply for more than three days, and one suggestion to save time. Keep it under 150 words.","كل أحد الساعة 08:00، أرسل لي نشرة أسبوعية عن عملي: اجتماعات الأسبوع، والمواعيد النهائية، والرسائل التي تنتظر ردي منذ أكثر من ثلاثة أيام، واقتراحاً واحداً لتوفير الوقت. أقل من 150 كلمة."]],"id":"20","wide":false},{"day":3,"h":35,"nm":{"ar":"Claude Routines","en":"Claude Routines"},"sub":{"ar":"أتمتة تعمل في السحابة","en":"Automations that run in the cloud"},"tools":{"en":["Claude","Claude Code Routines"],"ar":["Claude","Claude Code Routines"]},"en":["Claude Routines","A weekly retention routine and the end-of-pilot report",["A routine that builds on the last run","Read the source files, write a dated file","Keep a person in the loop"],"Build a routine that flags members at risk of dropping out each week, and one that writes the end-of-pilot report.","",""],"ar":["Claude Routines","روتين أسبوعي للاستمرارية وتقرير نهاية التجربة",["روتين يبني على ما سبقه","قراءة ملفات المصدر وكتابة ملف بتاريخه","إبقاء الإنسان في الحلقة"],"ابنِ روتيناً يرصد الأعضاء المعرّضين للانسحاب كل أسبوع، وآخر يكتب تقرير نهاية التجربة.","",""],"P":[["21.A","The weekly retention routine","روتين الاستمرارية الأسبوعي","Claude Code Routines (weekly, Monday 06:00)","Read the latest participation sheet (member ID, community, project, sessions attended, last activity date) and last week's routine output. List members with no activity for 14 days or who missed two sessions in a row, by community, using IDs only. Compare with last week: who returned, who is new on the list. Suggest one re-engagement action per community lead. Save it as a dated file and create a draft email to each community lead marked For review. Do not send anything.","اقرأ أحدث نسخة من جدول المشاركة (رقم العضو، والمجتمع، والمشروع، والجلسات التي حضرها، وتاريخ آخر نشاط) ومخرج الروتين في الأسبوع الماضي. اذكر الأعضاء الذين لم يُسجَّل لهم نشاط منذ 14 يوماً أو غابوا عن جلستين متتاليتين، حسب المجتمع، بالأرقام فقط. قارن بالأسبوع الماضي: من عاد، ومن ظهر في القائمة لأول مرة. اقترح إجراء إعادة تفاعل واحداً لكل قائد مجتمع. احفظه كملف بتاريخه، وأنشئ مسودة بريد لكل قائد مجتمع مع عبارة «للمراجعة». لا ترسل شيئاً."],["21.B","The end-of-pilot report","تقرير نهاية التجربة","Claude Code Routines (once, after week 12)","After week 12, read the pilot data file and all the weekly summaries, and write the end-of-pilot report for the evaluation phase: retention against the proposed 60, projects completed against the proposed 12, partner satisfaction, members who moved to leadership roles, sense of belonging, lessons learned, and a clear recommendation on whether the digital platform is needed. Mark every number that came from an estimate. Save it as a Word file for review.","بعد الأسبوع الثاني عشر، اقرأ ملف بيانات التجربة وكل الملخصات الأسبوعية، واكتب تقرير نهاية التجربة لمرحلة التقييم: الاستمرارية مقارنة بالرقم المقترح 60، والمشاريع المنجزة مقارنة بالرقم المقترح 12، ورضا الجهات الشريكة، والأعضاء المنتقلون إلى أدوار قيادية، والشعور بالانتماء، والدروس المستفادة، وتوصية واضحة بشأن الحاجة الفعلية إلى المنصة الرقمية. ميّز كل رقم مصدره تقدير. احفظه كملف Word للمراجعة."]],"id":"21","wide":false},{"day":3,"h":40,"ic":"flag","nm":{"ar":"ختام البرنامج","en":"Programme closing"},"sub":{"ar":"العروض الختامية وقبل وبعد","en":"Final demos, before and after"},"tools":{"en":["All workshop tools","SpeakApp"],"ar":["كل أدوات الورشة","SpeakApp"]},"en":["Programme closing","Team demos and Before and After AI results",["Each team writes and rehearses its pitch","Each team presents its part of the pilot","Compare the time before and after","The rule for all three days"],"One initiative. One data source. Many AI experiences.","",""],"ar":["ختام البرنامج","عروض الفرق ونتائج قبل الذكاء الاصطناعي وبعده",["يكتب كل فريق عرضه ويتدرّب عليه","يعرض كل فريق جزءه من التجربة","مقارنة الوقت قبل وبعد","القاعدة الجامعة للأيام الثلاثة"],"مبادرة واحدة. مصدر بيانات واحد. تجارب ذكاء اصطناعي متعددة.","",""],"P":[["22.A","Write the 3-minute pitch","اكتب عرض الدقائق الثلاث","Claude / ChatGPT","Write a 3-minute pitch (about 400 words) for my team to present the Ahl Al Shaghaf pilot to the Emirates Foundation CEO: open with the line \"الشغف طاقة غير مستثمرة\", the problem in one example, the model, what the AI tools we built today make possible, the proposed pilot in three numbers, and close with the decision we ask for. Mark where to pause.","اكتب عرضاً مدته 3 دقائق (نحو 400 كلمة) يقدّم فيه فريقي التجربة التشغيلية لـ«أهل الشغف» للرئيس التنفيذي لمؤسسة الإمارات: ابدأ بعبارة «الشغف طاقة غير مستثمرة»، ثم المشكلة في مثال واحد، والنموذج، وما تتيحه أدوات الذكاء الاصطناعي التي بنيناها اليوم، والتجربة المقترحة في ثلاثة أرقام، واختم بالقرار الذي نطلبه. حدّد مواضع التوقف."],["22.B","Rehearse with SpeakApp","تدرّب مع SpeakApp","SpeakApp, then Claude","Say your pitch out loud into SpeakApp, timing yourself. Paste the text it produces into Claude and ask:\nThis is the transcript of my 3-minute pitch. Tell me the word count and whether it fits 3 minutes, list filler words and repeated phrases, mark any sentence that is unclear or too long, and give me a tighter version that keeps my own voice.\nThen say it again and compare.","قل عرضك بصوت عالٍ في SpeakApp مع حساب الوقت. الصق النص الذي ينتجه في Claude واطلب:\nهذا نص عرضي ومدته 3 دقائق. أخبرني بعدد الكلمات وهل يناسب 3 دقائق، واذكر الكلمات الحشوية والعبارات المكررة، وحدّد أي جملة غير واضحة أو طويلة جداً، وأعطني نسخة أكثر إحكاماً تحافظ على أسلوبي.\nثم قله مرة أخرى وقارن."],["22.C","Practise the hard questions","تدرّب على الأسئلة الصعبة","ChatGPT (voice mode)","Act as the Emirates Foundation CEO in a voice conversation. Ask me, one at a time, the five hardest questions about the Ahl Al Shaghaf pilot (cost, overlap with existing volunteering platforms, retention, risk with personal data, how we measure impact). After each answer, give me one line of feedback and a stronger way to say it.","تقمّص دور الرئيس التنفيذي لمؤسسة الإمارات في محادثة صوتية. اطرح عليّ، سؤالاً بعد سؤال، أصعب خمسة أسئلة عن التجربة التشغيلية لـ«أهل الشغف» (التكلفة، والتداخل مع منصات التطوع القائمة، والاستمرارية، ومخاطر البيانات الشخصية، وكيف نقيس الأثر). بعد كل إجابة، أعطني ملاحظة من سطر واحد وطريقة أقوى لقولها."],["22.D","Prepare the team demo","تجهيز عرض الفريق","Claude","Help my team, [team name], prepare a 6-minute demo of our part of the Ahl Al Shaghaf pilot: one output we built, the surprise event and how we handled it, one rule we kept about data or human review, and the time it took before and after AI. Give a minute-by-minute script and the one sentence we close on.","ساعد فريقي، [اسم الفريق]، على تجهيز عرض من 6 دقائق لجزئنا من التجربة التشغيلية لـ«أهل الشغف»: مخرج واحد بنيناه، والحدث المفاجئ وكيف تعاملنا معه، وقاعدة واحدة التزمنا بها في البيانات أو المراجعة البشرية، والوقت الذي استغرقته المهمة قبل الذكاء الاصطناعي وبعده. أعطني نصاً دقيقة بدقيقة، والجملة الواحدة التي نختم بها."],["22.E","My 30-day plan","خطتي لثلاثين يوماً","Claude / ChatGPT","From everything I built in these three days, help me choose three tasks from my real work to move to AI in the next 30 days. For each: the tool, the first prompt, the time saved per week, and the rule I keep (what the tool proposes, what I decide). The tool proposes, the person decides, the organisation documents.","من كل ما بنيته في هذه الأيام الثلاثة، ساعدني أختار ثلاث مهام من عملي الفعلي أنقلها إلى الذكاء الاصطناعي خلال 30 يوماً. لكل مهمة: الأداة، وأول أمر، والوقت الذي سأوفّره أسبوعياً، والقاعدة التي ألتزم بها (ما تقترحه الأداة، وما أقرره أنا). الأداة تقترح، والإنسان يقرر، والمؤسسة توثّق."]],"id":"22","wide":false}],"LOGO":{"ChatGPT":"data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIGZpbGwtcnVsZT0iZXZlbm9kZCIgaGVpZ2h0PSIxZW0iIHN0eWxlPSJmbGV4Om5vbmU7bGluZS1oZWlnaHQ6MSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iMWVtIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuQUk8L3RpdGxlPjxwYXRoIGQ9Ik05LjIwNSA4LjY1OHYtMi4yNmMwLS4xOS4wNzItLjMzMy4yMzgtLjQyOGw0LjU0My0yLjYxNmMu  ${s.P.length?`<h3>${t.cmds} (${s.P.length})</h3>${s.P.map((p,i)=>`<details class="pr"><summary><b><bdi>${p[0]}</bdi></b> ${esc(lang==="ar"?p[2]:p[1])}</summary><div class="pmeta">${t.runIn}: ${esc(p[3])}</div><div class="ptext" dir="${lang==="ar"?"rtl":"ltr"}">${esc(lang==="ar"?p[5]:p[4])}</div><button class="cp" type="button" data-i="${i}">${t.copyP}</button></details>`).join("")}`:""}
 ${MODE==="trainer"?`<h3>${t.tnotes}</h3><div class="task"><small>${t.tdur}</small>${t.days[s.day]} · ${s.h} ${t.min}</div>${INJECT[s.id]?`<div class="task" style="border:1.5px solid #B4442F;margin-top:8px"><small style="color:#B4442F">${t.tinj}</small>${esc(INJECT[s.id][lang])}</div>`:""}`:`<label class="tick ${open?"":"off"}"><input type="checkbox" id="tk" ${u.done[s.id]?"checked":""} ${open?"":"disabled"}> ${t.tick}</label>${open?"":`<p class="lock">🔒 ${t.locked(s.day)}</p>`}`}
 <div class="dfoot"><button class="btn alt" type="button" id="dclose2">${t.close}</button></div>`;}
function mapHTML(u,t,cur){
 const lastDone=Math.max(0,...ST.filter(s=>u.done[s.id]).map(s=>PD[s.id]));
 let h=`<div class="map"><svg class="rope" viewBox="0 0 1200 ${VBH}" aria-hidden="true"><defs><pattern id="tw" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="var(--rope)"/><rect width="5" height="14" fill="#8A5A34" opacity=".55"/></pattern><pattern id="tg" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#2F5D4E"/><rect width="5" height="14" fill="#122C25"/></pattern></defs>
  <path d="${ROPE}" fill="none" stroke="url(#tw)" stroke-width="22" stroke-linecap="round"/><path d="${ROPE}" fill="none" stroke="url(#tg)" stroke-width="22" stroke-dasharray="${lastDone} 99999" stroke-linecap="round"/>
  <circle cx="1165" cy="215" r="18" fill="var(--c)"/><path d="M1171 207 L1160 215 L1171 223Z" fill="#fff"/></svg>`;
 DAYL.forEach(([d,x,y])=>{h+=`<div class="dayl" style="left:${x/12}%;top:${y/VBH*100}%"><b>${t.days[d]}</b><span>${t.dsub[d]}</span></div>`;});
 ST.forEach(s=>{const [x,y]=POS[s.id];const cls=(u.done[s.id]?"done ":"")+(s.id===cur?"cur ":"")+(!u.done[s.id]&&s.id!==cur?"dim":"");
  let ch="";if(s.logos)ch=`<div class="chips logos">${s.tools.en.map(n=>{const lg=logoOf(n);return `<span class="chip">${lg?`<img src="${LOGO[lg]}" alt="">`:""}${esc(n)}</span>`;}).join("")}</div>`;
  else if(s.br&&!s.nochips)ch=`<div class="chips ${s.br.en.length>3?"grid":""}">${s.br[lang].map(b=>`<span class="chip">${esc(b)}</span>`).join("")}</div>`;
  h+=`<div class="st ${cls} ${s.wide?"wide":""}" style="left:${x/12}%;top:${y/VBH*100}%"><div class="ttl">${s.id===cur?`<span class="here-tag">${t.here}</span>`:""}<b>${esc(s.nm[lang])}</b><span>${esc(s.sub[lang])}</span></div><button type="button" data-st="${s.id}" aria-label="${esc(s.nm[lang])}" style="background:none;border:0;padding:0">${dotHTML(s)}</button>${ch}</div>`;});
 return h+`</div>`;}
function listHTML(u,t,cur){let h=`<div class="list">`;[1,2,3].forEach(d=>{h+=`<div class="lday"><b>${t.days[d]}</b><span>${t.dsub[d]}</span></div>`;
  ST.filter(s=>s.day===d).forEach(s=>{h+=`<button type="button" class="li ${u.done[s.id]?"done":""}" data-st="${s.id}">${dotHTML(s)}<span class="tx"><b>${esc(s.nm[lang])}${s.id===cur?`<span class="tg">${t.here}</span>`:""}</b><span>${esc(s.sub[lang])}</span>${s.br?`<span class="cl">${s.br[lang].map(b=>`<i>${esc(b)}</i>`).join("")}</span>`:""}</span></button>`;});});
 return h+`</div>`;}

function packHTML(d){const t=T[lang],ar=lang==="ar";const sts=ST.filter(s=>s.day===d&&s.P.length);
 return `<!DOCTYPE html><html lang="${lang}" dir="${t.dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${t.packT(d)} | ${t.h1}</title>
 <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
 <style>body{font-family:${ar?'"IBM Plex Sans Arabic","IBM Plex Sans"':'"IBM Plex Sans","IBM Plex Sans Arabic"'},Tahoma,sans-serif;color:#16211F;margin:0;background:#F6F1E8}.w{max-width:820px;margin:0 auto;padding:24px}
 header{display:flex;align-items:center;gap:14px;border-bottom:3px solid #A8703F;padding-bottom:12px;margin-bottom:16px}header img{height:54px;background:#fff;border-radius:10px;padding:4px 8px}h1{margin:0;font-size:1.6rem}header p{margin:2px 0 0;color:#6B7A76}
 .st{background:#fff;border:1px solid #E3DACB;border-radius:14px;padding:14px 16px;margin-bottom:14px;break-inside:avoid}.st h2{margin:0 0 4px;font-size:1.15rem;color:#163832}.st .tl{color:#A8703F;font-weight:600;font-size:.85rem}
 .p{border-top:1px solid #E3DACB;padding:10px 0;break-inside:avoid}.p b{color:#A8703F}.p small{display:block;color:#6B7A76}.p div{white-space:pre-wrap;line-height:1.65;background:#F6F1E8;border-radius:8px;padding:8px 10px;margin-top:6px}
 .bar{display:flex;justify-content:flex-end;margin-bottom:12px}.bar button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:#163832;color:#fff;cursor:pointer}
 footer{color:#6B7A76;font-size:.8rem;text-align:center;margin-top:18px}@media print{.bar{display:none}body{background:#fff}}</style></head><body><div class="w">
 <div class="bar"><button onclick="window.print()">${t.print}</button></div>
 <header><img src="${document.querySelector("#logo img").src}" alt="Qoura AI"><div><h1>${t.packT(d)}</h1><p>${t.h1} · ${t.days[d]}</p></div></header>
 ${sts.map(s=>`<section class="st"><h2>${s.id}. ${esc(s.nm[lang])}</h2><div class="tl">${esc(s.tools[lang].join(" · "))}</div>${s.P.map(p=>`<div class="p"><b><bdi>${p[0]}</bdi></b> ${esc(ar?p[2]:p[1])}<small>${t.runIn}: ${esc(p[3])}</small><div>${esc(ar?p[5]:p[4])}</div></div>`).join("")}</section>`).join("")}
 <footer>${t.foot}</footer></div></body></html>`;}
async function savePack(d){const t=T[lang],html=packHTML(d),name=`${lang==="ar"?"أوامر-اليوم":"Day"}-${d}-prompts.html`;
 const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));const w=window.open(url,"_blank");if(!w){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}}

function renderTrainer(t){$("kick").textContent=t.kick+" · "+t.tv;
 if(TRAINER_PIN&&!S.tok){$("app").innerHTML=`<div class="card narrow"><h2>${t.tv}</h2><label for="pinI"><b>${t.pin}</b></label><input id="pinI" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px"><p class="note" id="pinE" hidden>${t.pinBad}</p><button class="btn" type="button" id="pinB">${t.enter}</button></div>`;
  const go=()=>{if($("pinI").value===TRAINER_PIN){S.tok=1;save();render();}else $("pinE").hidden=false;};$("pinB").onclick=go;$("pinI").onkeydown=e=>{if(e.key==="Enter")go();};return;}
 const u={done:{}};const cur=S.tcur||"1";const i=ST.findIndex(x=>x.id===cur);ST.slice(0,i).forEach(x=>u.done[x.id]=true);const cs=ST[i],nx=ST[i+1];
 $("app").innerHTML=`<div class="top"><div class="here"><div class="col"><small>${t.here} · ${t.days[cs.day]}</small><b><span class="hn">${cs.id}</span>${esc(cs.nm[lang])}</b></div><span class="sep"></span><div class="col"><small>${t.next}</small><b>${nx?`<span class="hn">${nx.id}</span>${esc(nx.nm[lang])}`:"—"}</b></div></div>
 <div class="card" style="margin:0;display:flex;gap:8px;align-items:center"><button class="btn alt" type="button" id="tp" style="margin:0" ${i===0?"disabled":""}>${lang==="ar"?"→":"←"} ${t.prevSt}</button><button class="btn" type="button" id="tn" style="margin:0" ${nx?"":"disabled"}>${t.nextSt} ${lang==="ar"?"←":"→"}</button></div></div>
 ${mapHTML(u,t,cur)}${listHTML(u,t,cur)}`;
 $("tp").onclick=()=>{S.tcur=ST[Math.max(0,i-1)].id;save();render();};$("tn").onclick=()=>{if(nx){S.tcur=nx.id;save();render();}};
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>openStation(b.dataset.st));}

function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir;
 ["kick","h1","hp","foot"].forEach(k=>$(k).textContent=t[k]);$("lang").textContent=t.lang;
 if(MODE==="trainer"){renderTrainer(t);return;}
 const u=me(),max=stage(u);let st=S.view!=null?Math.min(S.view,max):max;if(st<MINST)st=MINST;let h="";
 if(S.tm)h+=`<div class="tmode"><div class="r"><b>${t.tm}</b><button class="mini" type="button" id="tmoff">${t.close}</button></div>${LOCK()?`<select id="sim"><option value="">${t.tmReal} (${realToday()})</option>${[1,2,3].map(d=>`<option value="${d}" ${S.sim==d?"selected":""}>${t.tmD(d)}</option>`).join("")}</select>`:""}<select id="tms">${t.scen.map((x,i)=>`<option value="${i}">${x}</option>`).join("")}</select><button class="mini" type="button" id="tmr">${t.tmReset}</button><button class="mini" type="button" id="tma">${t.tmAll}</button></div>`;
 const nav=()=>`<div class="navrow">${st>MINST?`<button class="mini" type="button" id="back">${t.back}</button>`:"<span></span>"}${st<max?`<button class="mini" type="button" id="fwd">${t.fwd}</button>`:""}</div>`;
 if(st===1){h+=(max>1?nav():"")+survey("pre",t,u);}
 else if(st===2){const n=doneN(u),p=pct(u),cur=curId(u),cs=ST.find(s=>s.id===cur),nx=ST[ST.indexOf(cs)+1],d=LOCK()?todayDay():cs.day;
  const matsDay=x=>`<button class="btn alt" type="button" data-pack="${x}">⬇ ${t.packAll(x)}</button>${linksHTML(DAY_MATERIALS[x],t)}`;
  const postCard=postOpen()?`<div class="card narrow postcard"><h2>📝 ${t.postTop}</h2><p class="sub">${t.postTopS}</p>${FORM_MODE==="external"&&ready(FORMS.post)?`<a class="btn cu" id="postlink" href="${esc(FORMS.post)}" target="_blank" rel="noopener">${t.postgo} ↗</a><button class="btn ${u.postOpened?"gr":"alt"}" type="button" id="postok" ${u.postOpened?"":"disabled"}>${t.postdone}</button>${u.postOpened?"":`<p class="note" style="text-align:center">${t.postFirst}</p>`}`:`<button class="btn" type="button" id="topost">${t.postgo}</button>`}</div>`:"";
  h+=nav()+postCard+`<div class="top"><div class="here"><div class="col"><small>${t.here} · ${t.days[cs.day]}</small><b><span class="hn">${cs.id}</span>${esc(cs.nm[lang])}</b></div><span class="sep"></span><div class="col"><small>${t.next}</small><b>${nx?`<span class="hn">${nx.id}</span>${esc(nx.nm[lang])}`:"—"}</b></div></div>
  <div class="card" style="margin:0"><div class="prog"><b>${t.prog}</b><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div><p class="note" style="margin:4px 0 0">${t.stOf(n,NST)}</p>
  <div class="today">${d?`${dayDone(u,d)?`<b style="margin-top:4px">${t.dm} · ${t.days[d]}</b><button class="btn" type="button" data-pack="${d}">⬇ ${t.pack}</button><p class="note" style="margin:2px 0 0">${t.packHint}</p>${linksHTML(DAY_MATERIALS[d],t)}`:`<p class="note">🔒 ${t.dmLock}</p>`}`:""}
  ${[1,2,3].filter(x=>x!==d&&dayDone(u,x)).map(x=>`<details><summary class="note">${t.dm} · ${t.days[x]}</summary>${matsDay(x)}</details>`).join("")}
  <details class="kit"><summary><b>${t.kit}</b></summary><p class="note" style="margin:4px 0 0">${t.kitHint}</p>${linksHTML(KIT.filter(k=>dayOpen(k.day||1)),t)}</details></div></div></div>
  ${mapHTML(u,t,cur)}${listHTML(u,t,cur)}
  <div class="legend"><span><i style="background:#2F5D4E"></i>${t.lg[0]}</span><span><i style="background:var(--c)"></i>${t.lg[1]}</span><span><i style="border:2px solid var(--rope)"></i>${t.lg[2]}</span></div>
`;}
 else if(st===3){h+=nav()+survey("post",t,u);}
 else{h+=nav()+`<div class="card narrow"><div class="big">🎉</div><h2 style="text-align:center">${t.ty}</h2><p class="sub" style="text-align:center">${t.tys}</p>${[1,2,3].map(d=>`<button class="btn alt" type="button" data-pack="${d}">⬇ ${t.packAll(d)}</button>`).join("")}${linksHTML([...[1,2,3].flatMap(d=>DAY_MATERIALS[d]),...KIT,...MATERIALS],t)}</div>`;}
 $("app").innerHTML=h;bind(t,u,st);}
function openStation(id){S.sel=id;save();const u=MODE==="trainer"?{done:{}}:me(),t=T[lang],s=ST.find(x=>x.id===id);$("dp").innerHTML=stationPanel(s,u,t);$("dr").hidden=false;
 $("dclose").onclick=closeDr;$("dclose").focus();$("dclose2").onclick=closeDr;
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.i],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copiedP;setTimeout(()=>b.textContent=t.copyP,1500);});
 const tk=$("tk");if(tk)tk.onchange=e=>{u.done[id]=e.target.checked;save();send("station",{id,done:e.target.checked});render();};}
function closeDr(){$("dr").hidden=true;render();}
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("dr").hidden)closeDr();});
function bind(t,u,st){const q=i=>$(i);
 if(q("back"))q("back").onclick=()=>{S.view=st-1;save();render();scrollTo(0,0);};if(q("fwd"))q("fwd").onclick=()=>{S.view=st+1;save();render();scrollTo(0,0);};
 const kind=st===1?"pre":"post",key=kind==="pre"?"preOpened":"postOpened";
 if(q("openf"))q("openf").addEventListener("click",()=>{u[key]=true;save();send(kind+"Opened",{});setTimeout(render,400);});
 if(q("sdone"))q("sdone").onclick=()=>{u[kind]=true;S.view=kind==="pre"?2:4;save();send(kind,{mode:"external"});render();scrollTo(0,0);};
 if(q("sf"))q("sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),need=QS.pre.length+(kind==="post"?QS.fb.length:0),a=Object.fromEntries(f.entries());
  if(Object.keys(a).filter(k=>k!=="c").length<need){q("serr").hidden=false;return;}u[kind]=true;u[kind+"Ans"]=a;S.view=kind==="pre"?2:4;save();send(kind,{answers:a});render();scrollTo(0,0);};
 document.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>savePack(+b.dataset.pack));
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>openStation(b.dataset.st));
 if(q("topost"))q("topost").onclick=()=>{S.view=3;save();render();scrollTo(0,0);};
 if(q("postlink"))q("postlink").addEventListener("click",()=>{u.postOpened=true;save();send("postOpened",{});setTimeout(render,400);});
 if(q("postok"))q("postok").onclick=()=>{u.post=true;u.postOpened=true;S.view=4;save();send("post",{mode:"external"});render();scrollTo(0,0);};
 if(q("sim"))q("sim").onchange=e=>{S.sim=e.target.value?+e.target.value:null;S.sel=null;save();render();};
 if(q("tmoff"))q("tmoff").onclick=()=>{S.tm=false;S.sim=null;save();render();};
 if(q("tms"))q("tms").onchange=e=>{const k=+e.target.value;if(!k)return;const x=me();x.pre=k>=2;x.post=k>=6;x.preOpened=x.pre;x.postOpened=x.post;x.done={};
  const upto=k===3?1:k===4?2:k>=5?3:0;ST.filter(s=>s.day<=upto).forEach(s=>x.done[s.id]=true);if(k>=5&&LOCK()&&!S.sim)S.sim=3;S.view=null;S.sel=null;save();render();};
 if(q("tmr"))q("tmr").onclick=()=>{delete S.u;me();S.view=null;S.sel=null;save();render();};
 if(q("tma"))q("tma").onclick=()=>{if(confirm(t.tmAsk)){S={tm:true};save();render();}};}
document.addEventListener("keydown",e=>{if(MODE!=="trainer"||!$("dr").hidden)return;const rtl=lang==="ar";if(e.key===(rtl?"ArrowLeft":"ArrowRight"))$("tn")&&$("tn").click();if(e.key===(rtl?"ArrowRight":"ArrowLeft"))$("tp")&&$("tp").click();});
let taps=0,tt=null;$("logo").onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;S.tm=true;save();render();}};
const sysDark=()=>!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
let theme=null;try{theme=localStorage.getItem("qai-theme")}catch(e){}
function applyTheme(){const dark=theme?theme==="dark":sysDark();document.documentElement.setAttribute("data-theme",dark?"dark":"light");$("thm").textContent=dark?"☀":"☾";$("thm").title=lang==="ar"?(dark?"الوضع الفاتح":"الوضع الداكن"):(dark?"Light mode":"Dark mode");}
$("thm").onclick=()=>{theme=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";try{localStorage.setItem("qai-theme",theme)}catch(e){}applyTheme();};applyTheme();
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render();applyTheme();if(!$("dr").hidden&&S.sel)openStation(S.sel);};render();
</script></body></html>
