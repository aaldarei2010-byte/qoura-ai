<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الذكاء الاصطناعي | قُرى للذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#163832;--c:#A8703F;--rope:#C9A27A;--bg:#F6F1E8;--card:#FFFFFF;--ink:#16211F;--muted:#6B7A76;--line:#E3DACB;--ok:#2F7A4E;--soft:#EFE7DA;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A}}
:root[data-theme="dark"]{--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,system-ui,sans-serif;line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.logo{background:#fff;border-radius:12px;padding:6px 10px;cursor:default}.logo img{height:46px;display:block}
.ht{flex:1;min-width:220px}.ht small{color:var(--c);font-weight:600}.ht h1{margin:0;font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.15}.ht p{margin:2px 0 0;color:var(--muted)}
.lang{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.narrow{max-width:640px;margin-inline:auto}
h2{margin:0 0 6px;font-size:1.3rem}.sub{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--g);color:#fff;text-decoration:none;width:100%;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.cu{background:var(--c)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;font-weight:600}
select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}.code b{font-size:1.7rem;letter-spacing:.08em}.code small{display:block;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
/* journey top */
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:6px}
@media (max-width:860px){.top{grid-template-columns:1fr}}
.here{background:var(--g);color:#F6F1E8;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.here .col{flex:1;min-width:120px}.here small{display:block;color:#E2B48A;font-size:.78rem}.here b{font-size:1.1rem}
.here .hn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--c);color:#fff;font-size:.85rem;margin-inline-end:8px;vertical-align:middle;padding:0 4px}
.here .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
.here button{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:1.1rem}
.here button.on{background:var(--c);border-color:var(--c)}
.prog{display:flex;align-items:center;gap:10px}.bar{flex:1;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pct{font-weight:700;font-size:1.2rem;min-width:3.4em;text-align:end}
.today{display:flex;flex-direction:column;gap:6px}
.today .row{display:flex;gap:8px;flex-wrap:wrap}.today .row .btn{width:auto;flex:1;margin-top:0;padding:10px 12px;font-size:.92rem}
.okline{color:var(--ok);font-weight:700;font-size:.88rem}
.mats a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;color:var(--ink);text-decoration:none;font-weight:600;background:var(--bg)}
.mats a span:last-child{color:var(--c)}
/* map desktop */
.map{position:relative;width:100%;aspect-ratio:1200/1300;container-type:inline-size;margin-top:6px}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;transform:translate(-50%,-50%);width:11.8cqw;display:flex;justify-content:center}
.st .ttl{position:absolute;bottom:calc(50% + 3.8cqw);left:50%;transform:translateX(-50%);width:11.8cqw;text-align:center}
.st .ttl b{display:block;font-size:1.5cqw;line-height:1.15;color:var(--ink)}
.st .ttl span{display:block;font-size:.95cqw;color:var(--muted)}
.st.wide .ttl{width:19cqw}
.st .ttl span.here-tag{display:inline-block;color:#fff;font-size:1.05cqw;margin:0 0 .4cqw !important}
.st.dim .ttl b{color:var(--muted)}
.here-tag{display:table;margin:0 auto .4cqw !important;background:var(--c);color:#fff;font-size:1cqw;font-weight:700;border-radius:999px;padding:.2cqw .8cqw;margin-bottom:.4cqw}
.dot{position:relative;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--card);border:.25cqw solid var(--rope);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.08)}
.dot img{width:3cqw;height:3cqw;object-fit:contain}
.dot svg{width:2.6cqw;height:2.6cqw;stroke:var(--ink)}
.dot .n{position:absolute;top:-.6cqw;inset-inline-end:-.6cqw;width:2cqw;height:2cqw;border-radius:50%;background:var(--c);color:#fff;font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.st.done .dot{border-color:var(--ok)}.st.done .dot .n{background:var(--ok)}
.st.cur .dot{border-color:var(--c);box-shadow:0 0 0 1cqw color-mix(in srgb,var(--c) 22%,transparent)}
.chips{position:absolute;top:calc(50% + 3.6cqw);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5cqw;width:11.4cqw}
.chips.grid{display:grid;grid-template-columns:repeat(3,1fr);width:34cqw}
.chips.logos{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;width:26cqw;background:var(--card);border:1px solid var(--line);border-radius:1.2cqw;padding:.8cqw}
.chip{display:flex;align-items:center;justify-content:center;gap:.5cqw;width:100%;background:var(--card);border:1px solid var(--line);border-radius:.7cqw;padding:.45cqw .6cqw;font-size:1cqw;font-weight:600;white-space:nowrap}
.chips.logos .chip{width:auto;border-radius:999px;font-size:1cqw;padding:.3cqw .8cqw}
.chip img{width:1.4cqw;height:1.4cqw;object-fit:contain}
.st.cur .chip{border-color:var(--c)}
.dayl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.dayl b{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:.3cqw 1.2cqw;font-size:1.25cqw}
.dayl span{display:block;color:var(--c);font-weight:600;font-size:1.15cqw;margin-top:.3cqw}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
/* mobile list */
.list{display:none}
@media (max-width:760px){.map{display:none}.list{display:block}}
.lday{margin:16px 0 6px;display:flex;align-items:baseline;gap:8px}.lday b{background:var(--g);color:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}.lday span{color:var(--c);font-weight:600;font-size:.85rem}
.li{display:flex;gap:12px;align-items:flex-start;position:relative;padding:8px 0 14px;cursor:pointer;width:100%;text-align:start;background:none;border:0}
.li::before{content:"";position:absolute;inset-inline-start:25px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,color-mix(in srgb,var(--rope) 70%,#000) 6px 9px);border-radius:4px;opacity:.85}
.li.done::before{background:repeating-linear-gradient(45deg,#2F5D4E 0 6px,#183A32 6px 9px)}
.li .dot{width:58px;height:58px;flex:0 0 58px;z-index:1;border-width:3px}
.li .dot img{width:30px;height:30px}.li .dot svg{width:26px;height:26px}
.li .dot .n{width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px;border-width:2px}
.li .tx b{display:block;font-size:1.05rem}.li .tx span{color:var(--muted);font-size:.85rem}
.li .tx .cl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.li .tx .cl i{font-style:normal;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--card)}
.li .tg{font-size:.72rem;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
/* drawer */
.dr{position:fixed;inset:0;background:rgba(15,26,24,.45);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);width:min(480px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;border-radius:18px 18px 0 0;width:100%}}
.dh{display:flex;align-items:center;gap:12px;position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));background:var(--card);z-index:2;margin:calc(-16px - env(safe-area-inset-top,0px)) -18px 0;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--line)}.dh .dot{width:56px;height:56px;flex:0 0 56px;cursor:default;border-width:3px}.dh .dot img{width:30px;height:30px}.dh .dot svg{width:26px;height:26px}.dh .dot .n{width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px}
.dh h2{margin:0}.dh .meta{color:var(--muted);font-size:.85rem}
.dclose{margin-inline-start:auto}
.task{margin-top:12px;background:var(--soft);border-radius:10px;padding:10px 12px}.task small{display:block;color:var(--muted);font-weight:600}
h3{font-size:.95rem;margin:16px 0 6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchips span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600}
.tchips img{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:4px}
.tchips.br span{border-style:dashed}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);margin-bottom:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;font-size:.8rem}
.ob{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;text-decoration:none;color:var(--ink);font-size:.88rem;font-weight:600}
.ob span:last-child{color:var(--c);white-space:nowrap}
ol.steps{margin:0;padding-inline-start:20px}ol.steps li{margin:3px 0}
.tick{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px;border-radius:12px;background:var(--soft);font-weight:600;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.dfoot{display:flex;gap:8px;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--line)}.dfoot .btn{margin-top:0;flex:1;padding:10px 12px;font-size:.9rem}
.tick.off{cursor:default;opacity:.7}
.lock{font-size:.85rem;color:var(--muted)}
/* surveys */
.q{border-top:1px solid var(--line);padding:12px 0}.q p{margin:0 0 8px;font-weight:600}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sc label{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.72rem;text-align:center;color:var(--muted)}
.sc input{position:absolute;opacity:0}.sc label b{font-size:1.1rem;color:var(--ink)}
.sc label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sc label:has(input:focus-visible){outline:3px solid var(--c)}
textarea{width:100%;min-height:90px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.tmode{background:#FFF4D6;color:#5A4300;border:1.5px dashed #B98A00;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.tmode .r{display:flex;justify-content:space-between;align-items:center}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}
.big{font-size:3rem;text-align:center}
.dot .l2{position:absolute;bottom:-.5cqw;inset-inline-start:-.5cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}.dot .l2 img{width:1.5cqw!important;height:1.5cqw!important}
.li .dot .l2,.dh .dot .l2{width:24px;height:24px;bottom:-5px;inset-inline-start:-5px;border-width:1.5px}.li .dot .l2 img,.dh .dot .l2 img{width:16px!important;height:16px!important}
</style></head><body>

مة والصيغة والقيود", "تحويل أمر ضعيف إلى أمر قوي", "حفظ 5 أوامر قابلة لإعادة الاستخدام"], "اكتب الأوامر التي تفتح ملف مهمة الإمارات 01 وتؤكد بيانات الوفد.", "تعيين قائد المهمة", "اختر مهمة حقيقية متكررة من إدارتك وسجّل خطواتها ووقتها اليوم (قبل الذكاء الاصطناعي)."], "nm": {"ar": "هندسة الأوامر", "en": "Prompt engineering"}, "sub": {"ar": "كيف تكتب الأمر", "en": "How to write a prompt"}, "P": [["1.5", "Turn a weak prompt into a strong one", "تحويل أمر ضعيف إلى قوي", "ChatGPT, then Claude", "Here is a weak prompt: \"Prepare for the VIP visit.\" Rewrite it as a strong prompt for [your department] using five parts: role, context, task, format, constraints. Show the rewritten prompt, then explain in one line what each part adds. Then save it as prompt 1 of my personal prompt library.", "هذا أمر ضعيف: \"جهّز لزيارة كبار الشخصيات.\" أعد كتابته كأمر قوي لـ[إدارتك] بخمسة أجزاء: الدور، والسياق، والمهمة، والصيغة، والقيود. اعرض الأمر بعد إعادة كتابته، ثم اشرح في سطر واحد ما يضيفه كل جزء، واحفظه كأول أمر في مكتبة أوامري الشخصية."], ["1.1", "Build the Mission File structure", "بناء هيكل ملف المهمة", "Claude / ChatGPT", "You are the mission coordinator at a presidential aviation operator. A high-level government delegation (16 people) arrives in the UAE from the United States in 72 hours; we receive it at our VIP terminal, operate one domestic transfer flight on Day 2 and support its departure on Day 3. Design the structure of a Mission File that will be the single data source for every department. Give the sections in order, what each holds, who owns it and when it must be complete (T-72h, T-48h, T-24h). Format: a table. Constraints: training scenario, no real names or flight data; safety and dispatch decisions stay with the responsible people.", "أنت منسّق المهمة لدى مشغّل طيران رئاسي. يصل وفد حكومي رفيع المستوى (16 شخصاً) إلى الإمارات من الولايات المتحدة خلال 72 ساعة؛ نستقبله في صالة كبار الشخصيات، ونشغّل رحلة نقل داخلية في اليوم الثاني، وندعم مغادرته في اليوم الثالث. صمّم هيكل ملف مهمة يكون مصدر البيانات الوحيد لكل الإدارات. اذكر الأقسام بالترتيب، وما يحويه كل قسم، ومن يملكه، ومتى يجب اكتماله (قبل 72 و48 و24 ساعة). الصيغة: جدول. القيود: سيناريو تدريبي دون أسماء أو بيانات رحلات حقيقية؛ وتبقى قرارات السلامة والإرسال عند المسؤولين عنها."], ["1.6", "Initiative step 1: Discover", "المبادرة 1: اكتشف", "Claude", "Interview me about one real recurring task in my department, [your task], one question at a time. Ask how often it happens, every step I take today, who is involved, the tools and files I use, how long each step takes and where it goes wrong. When you have enough, give me a Before AI baseline: a numbered list of steps with time per step, total time, error points and the decisions only a person can make. Do not suggest improvements yet. I will describe the task generically, with no sensitive data.", "حاورني حول مهمة حقيقية متكررة واحدة في إدارتي، [مهمتك]، بسؤال واحد في كل مرة. اسأل عن تكرارها، وكل خطوة أنفذها اليوم، ومن يشارك فيها، والأدوات والملفات التي أستخدمها، ومدة كل خطوة، وأين تتعثر. عندما تكتمل الصورة، أعطني خط أساس قبل الذكاء الاصطناعي: قائمة مرقمة بالخطوات ومدة كل خطوة، والمدة الإجمالية، ونقاط الخطأ، والقرارات التي لا يتخذها إلا الإنسان. لا تقترح تحسينات بعد. سأصف المهمة بشكل عام دون أي بيانات حساسة."], ["3.B", "The five-part prompt (Day 1 method)", "الأمر بخمسة أجزاء (منهج اليوم الأول)", "ChatGPT / Claude", "Ignore all previous conversations. Act as [an expert in ...], and your goal is [...]. Your task: [a clear task]. Conditions: [the limits, format and length you need]. Before you start, tell me whether you understood the instructions clearly, and ask me about anything that is not clear.", "تجاهل كل المحادثات السابقة. تقمّص دور [خبير في ...] وهدفك [...]. مهمتك: [مهمة واضحة]. الشروط: [القيود والصيغة والطول المطلوب]. قبل أن تبدأ، أخبرني هل فهمت التعليمات بوضوح، واسألني عن أي شيء غير واضح."]], "O": []}, {"id": "4", "day": 1, "uc": 1, "h": 30, "r": [1, 2], "tools": {"en": ["ChatGPT", "Gemini", "Grok", "Perplexity", "ElevenLabs", "Kling AI", "Higgsfield"], "ar": ["ChatGPT", "Gemini", "Grok", "Perplexity", "ElevenLabs", "Kling AI", "Higgsfield"]}, "en": ["The tools at a glance", "A tool-choice card: which tool for which job", ["Text and analysis: ChatGPT, Gemini, Grok", "Research with sources: Perplexity", "Voice: ElevenLabs; video: Kling AI, Higgsfield"], "Match each Mission UAE 01 job (brief, research, voice-over, video) to the best tool and say why.", "Choosing the tools"], "ar": ["جولة سريعة على الأدوات", "بطاقة اختيار الأداة: أي أداة لأي مهمة", ["النص والتحليل: ChatGPT وGemini وGrok", "البحث بالمصادر: Perplexity", "الصوت: ElevenLabs؛ والفيديو: Kling AI وHiggsfield"], "طابق كل مهمة في مهمة الإمارات 01 (الإحاطة، والبحث، والتعليق الصوتي، والفيديو) بالأداة الأنسب واذكر السبب.", "اختيار الأدوات"], "nm": {"ar": "خريطة الأدوات", "en": "Tools map"}, "sub": {"ar": "مرور سريع على الفروق", "en": "A quick tour of the differences"}, "P": [["4.A", "Which tool for which job?", "أي أداة لأي مهمة؟", "ChatGPT / Claude", "Make a one-page tool-choice card for Mission UAE 01 covering ChatGPT, Gemini, Grok, Perplexity, ElevenLabs, Kling AI and Higgsfield: what each is best at, one mission job it fits (brief, research, voice-over, video, images), and one thing not to use it for. Format: a table, one row per tool.", "أعدّ بطاقة اختيار أدوات من صفحة واحدة لمهمة الإمارات 01 تشمل ChatGPT وGemini وGrok وPerplexity وElevenLabs وKling AI وHiggsfield: أفضل ما تجيده كل أداة، ومهمة واحدة في المهمة تناسبها (إحاطة، بحث، تعليق صوتي، فيديو، صور)، وشيء واحد لا تُستخدم فيه. الصيغة: جدول، صف لكل أداة."], ["2.1", "Compare three assistants on one brief", "مقارنة ثلاثة مساعدات", "ChatGPT, Gemini, Grok", "Write a 120-word welcome note for the Head of Delegation of Mission UAE 01, to be placed in the VIP lounge, in a formal, warm tone. Use only facts from the attached Mission File and no names. (Run the same prompt in each tool; score accuracy, tone and format from 1 to 5.)", "اكتب رسالة ترحيب من 120 كلمة لرئيس وفد مهمة الإمارات 01 توضع في صالة كبار الشخصيات، بأسلوب رسمي ودافئ. استخدم حقائق ملف المهمة المرفق فقط ودون أسماء. (شغّل الأمر نفسه في كل أداة، وقيّم الدقة والأسلوب والصيغة من 1 إلى 5.)"], ["4.B", "ChatGPT: where it stops (posts on X)", "ChatGPT: أين يتوقف (تغريدات X)", "ChatGPT", "Extract Sam Altman's posts from exactly the last month from Twitter or X. (Use it to show that ChatGPT cannot reach posts on X.)", "استخرج تغريدات سام ألتمان خلال الشهر الأخير بالضبط من تويتر أو برنامج إكس. (للتوضيح: ChatGPT لا يستطيع الوصول إلى تغريدات X.)"], ["4.C", "Grok: live posts from X", "Grok: التغريدات المباشرة من X", "Grok", "Act as a technology expert. Give me the posts from last month made by Sam Altman, founder of OpenAI. I want the answers as bullet points with the posts word for word, translated into Arabic.", "خذ دور خبير في التقنية. أعطني التغريدات في آخر شهر الماضي التي تمت من قبل سام ألتمان مؤسس شركة OpenAI. أريد الإجابات في شكل نقاط بالتغريدات حرفياً وترجمها باللغة العربية."], ["4.D", "Perplexity: research with sources", "Perplexity: بحث بالمصادر", "Perplexity", "Act as a technology expert. I want to know the latest technologies Taiwan reached in 2025.", "خذ دور خبير في التكنولوجيا. أريد معرفة آخر التكنولوجيا التي توصلت لها تايوان في عام 2025."], ["4.E", "Kling AI: turn the image into a video", "Kling AI: تحريك الصورة كفيديو", "Kling AI", "Act as a tour guide expert. Make the girl in the image explain Sheikh Zayed Grand Mosque in English.", "خذ دور خبير إرشاد سياحي. اجعل البنت التي في الصورة وهي تشرح باللغة الإنجليزية عن مسجد الشيخ زايد."]], "O": []}, {"id": "5", "day": 1, "uc": 1, "h": 30, "r": [1, 3], "tools": {"en": ["ChatGPT"], "ar": ["ChatGPT"]}, "en": ["ChatGPT", "Welcome note, delegation summary and readiness KPIs", ["Draft the lounge welcome note", "Summarise the delegation from the Mission File", "Define the readiness KPIs"], "Use ChatGPT to draft the welcome note, summarise the delegation and define the readiness measures.", "Delegation data confirmed", "Redesign your task with AI: the new steps, where AI helps, and where a person decides."], "ar": ["ChatGPT", "رسالة الترحيب وملخص الوفد ومؤشرات الجاهزية", ["كتابة رسالة الترحيب في الصالة", "تلخيص الوفد من ملف المهمة", "تحديد مؤشرات الجاهزية"], "استخدم ChatGPT لكتابة رسالة الترحيب وتلخيص الوفد وتحديد مؤشرات الجاهزية.", "تأكيد بيانات الوفد", "أعد تصميم مهمتك بالذكاء الاصطناعي: الخطوات الجديدة، وأين يساعد، وأين يقرر الإنسان."], "br": {"en": ["Chat and files", "Image generation", "Data analysis", "Voice"], "ar": ["المحادثة والملفات", "توليد الصور", "تحليل البيانات", "الصوت"]}, "nm": {"ar": "ChatGPT", "en": "ChatGPT"}, "sub": {"ar": "أدواته واستخداماته", "en": "Its tools and uses"}, "P": [["5.A", "Reception image and Mission UAE 01 identity (ChatGPT images)", "صورة الاستقبال وهوية مهمة الإمارات 01 (صور ChatGPT)", "ChatGPT (image generation)", "Act as a professional visual designer and a photographer who specialises in government events.\n\nCreate a highly realistic image for a fictional training scenario titled \"Receiving a high-level American delegation in Abu Dhabi\".\n\nScene: a white executive aircraft has arrived at an airport in Abu Dhabi, and members of the American delegation are starting to step down from the aircraft. The delegation is made up of men and women in formal business clothing. They are received by Emirati officials: the men wear the kandura, ghutra and agal, and the women wear the abaya and shayla.\n\nIn the foreground, an American official shakes hands with an Emirati official, while the rest of the delegation and the reception teams appear naturally in the background. Add a black executive car close to the reception area, with simple Abu Dhabi cues such as Etihad Towers in the background.\n\nKeep the scene logical and realistic, not exaggerated: a limited number of people moving naturally. Do not use any real political figures.\n\nStyle:\nPhotorealistic, cinematic government photography, professional diplomatic atmosphere, natural daylight, realistic human proportions, realistic hands and faces, premium corporate look, 16:9, 4K.\n\nVisual identity:\nNavy blue, gold, white and light gray.\n\nPlace a very small fictional logo reading MISSION UAE 01 in the top-left corner, without letting it dominate the scene.\n\nAvoid:\nBurj Khalifa or any Dubai landmarks, crowds, an exaggerated military feel, real government logos, famous people, distorted hands, too much text, or anything illogical for an airport setting.", "خذ دور مصمم بصري محترف ومصور متخصص في الفعاليات الحكومية.\n\nأريد إنشاء صورة واقعية جدًا لسيناريو تدريبي افتراضي بعنوان \"استقبال وفد أمريكي رفيع المستوى في أبوظبي\".\n\nالمشهد: طائرة تنفيذية بيضاء وصلت إلى مطار في أبوظبي، ويبدأ أعضاء الوفد الأمريكي بالنزول من الطائرة. يتكون الوفد من رجال ونساء يرتدون ملابس عمل رسمية. يستقبلهم مسؤولون إماراتيون يرتدي الرجال الكندورة والغترة والعقال، والنساء العباءة والشيلة.\n\nيظهر في مقدمة المشهد مسؤول أمريكي يصافح مسؤولًا إماراتيًا، بينما بقية أعضاء الوفد وفرق الاستقبال موجودون بشكل طبيعي في الخلفية. أضف سيارة تنفيذية سوداء قريبة من موقع الاستقبال، مع عناصر بسيطة تدل على أبوظبي مثل Etihad Towers في الخلفية.\n\nاجعل المشهد منطقيًا وواقعيًا وليس مبالغًا فيه، وعدد الأشخاص محدود، وحركة الأشخاص طبيعية، ولا تستخدم أي شخصيات سياسية حقيقية.\n\nالأسلوب:\nPhotorealistic, cinematic government photography, professional diplomatic atmosphere, natural daylight, realistic human proportions, realistic hands and faces, premium corporate look, 16:9, 4K.\n\nالهوية البصرية:\nNavy blue, gold, white and light gray.\n\nضع شعارًا افتراضيًا صغيرًا جدًا باسم MISSION UAE 01 في أعلى يسار الصورة، ولا تجعله يطغى على المشهد.\n\nتجنب:\nBurj Khalifa أو أي معالم دبي، الزحام، الطابع العسكري المبالغ فيه، الشعارات الحكومية الحقيقية، الأشخاص المشهورين، الأيدي المشوهة، النصوص الكثيرة، أو أي عناصر غير منطقية في بيئة المطار."], ["1.2", "Confirm the delegation data", "تأكيد بيانات الوفد", "Claude + Mission File", "Act as the Mission Lead's coordinator. Using the attached Mission File only, produce (1) a one-table summary of the delegation by group, count and requirement; (2) every item that is missing, unconfirmed or inconsistent; (3) a short email to the delegation's protocol office asking for exactly those items, in a formal, courteous tone. Do not invent any detail that is not in the file; mark assumptions as assumptions.", "تصرّف كمنسّق لقائد المهمة. اعتماداً على ملف المهمة المرفق فقط، أعدّ: (1) جدولاً واحداً يلخص الوفد حسب الفئة والعدد والمتطلب؛ (2) كل بند ناقص أو غير مؤكد أو متعارض؛ (3) رسالة بريد قصيرة إلى مكتب مراسم الوفد تطلب هذه البنود تحديداً بأسلوب رسمي ولبق. لا تختلق أي تفصيلة غير موجودة في الملف، وميّز الافتراضات بوصفها افتراضات."], ["2.6", "Define the readiness KPIs", "تحديد مؤشرات الجاهزية", "ChatGPT / Gemini", "For Mission UAE 01, define the readiness measures leadership needs from T-72h to arrival: overall readiness, readiness by department, open tasks, critical tasks, overdue tasks, decisions required. For each give the definition, the formula from a task list with ID, task, department, owner, deadline, status and priority, the green, amber and red thresholds, and who acts when it turns red. Format: a table.", "لمهمة الإمارات 01، حدّد مؤشرات الجاهزية التي تحتاجها القيادة من قبل 72 ساعة حتى الوصول: الجاهزية الإجمالية، والجاهزية حسب الإدارة، والمهام المفتوحة، والمهام الحرجة، والمهام المتأخرة، والقرارات المطلوبة. لكل مؤشر اذكر التعريف، والمعادلة من قائمة مهام فيها الرقم والمهمة والإدارة والمسؤول والموعد والحالة والأولوية، وحدود الأخضر والأصفر والأحمر، ومن يتصرف عندما يصبح أحمر. الصيغة: جدول."], ["1.7", "Reply templates and escalation rules", "قوالب الردود وقواعد التصعيد", "ChatGPT, then Claude", "Using the attached Mission File, write the rules a future Mission AI Agent will follow when a request comes in. Give (1) five reply templates: confirmation, need more information, change accepted, change declined, escalated; (2) escalation rules: which requests always go to the Mission Lead, which to the department owner, which never get an automatic reply (media, security, safety). Format: templates as short texts with [placeholders], rules as a table. Keep every rule testable.", "باستخدام ملف المهمة المرفق، اكتب القواعد التي سيتبعها وكيل المهمة مستقبلاً عند وصول طلب. أعطني: (1) خمسة قوالب ردود: تأكيد، وطلب معلومات إضافية، وقبول تغيير، ورفض تغيير، وتصعيد؛ (2) قواعد التصعيد: أي الطلبات تذهب دائماً إلى قائد المهمة، وأيها إلى مسؤول الإدارة، وأيها لا يُرد عليه آلياً أبداً (الإعلام والأمن والسلامة). الصيغة: القوالب نصوص قصيرة بـ[حقول]، والقواعد جدول. اجعل كل قاعدة قابلة للاختبار."], ["2.7", "Initiative step 2: Redesign", "المبادرة 2: أعد التصميم", "Claude", "Using my Before AI baseline above, redesign this task with AI. Show the new steps side by side with the old ones; for each new step say whether it is done by AI, by a person with AI, or by a person only, and why. Mark every point where a person must decide or approve. Estimate the new time per step, and list what could go wrong with the AI steps and how I will check them.", "باستخدام خط الأساس قبل الذكاء الاصطناعي أعلاه، أعد تصميم هذه المهمة بالذكاء الاصطناعي. اعرض الخطوات الجديدة بجانب القديمة، ولكل خطوة جديدة بيّن هل ينفذها الذكاء الاصطناعي، أم الإنسان بمساعدته، أم الإنسان وحده، ولماذا. ميّز كل نقطة يجب أن يقرر فيها الإنسان أو يعتمد. قدّر الوقت الجديد لكل خطوة، واذكر ما قد يخطئ في خطوات الذكاء الاصطناعي وكيف سأتحقق منها."]], "O": []}, {"id": "6", "day": 1, "uc": 1, "h": 40, "r": [1, 3], "tools": {"en": ["Gemini", "Veo"], "ar": ["Gemini", "Veo"]}, "en": ["Gemini", "Concept video clip and a YouTube briefing summary", ["Generate one 6-second scene of the guest journey", "Summarise a public YouTube video on VIP reception"], "Create one concept-video scene for Mission UAE 01 and summarise a public protocol video for the team.", "Trip plan"], "ar": ["Gemini", "مشهد فيديو تعريفي وملخص فيديو يوتيوب", ["توليد مشهد من 6 ثوانٍ لرحلة الضيف", "تلخيص فيديو يوتيوب عام عن استقبال كبار الشخصيات"], "أنشئ مشهداً واحداً للفيديو التعريفي لمهمة الإمارات 01، ولخّص فيديو عاماً عن المراسم للفريق.", "خطة الرحلة"], "br": {"en": ["Video creation", "YouTube summary"], "ar": ["صناعة الفيديو", "تلخيص يوتيوب"]}, "nm": {"ar": "Gemini", "en": "Gemini"}, "sub": {"ar": "فيديو وتلخيص", "en": "Video and summaries"}, "P": [["6.A", "Mission UAE 01 concept video (Gemini / Veo)", "الفيديو التعريفي لمهمة الإمارات 01 (Gemini / Veo)", "Gemini (Veo)", "Create a cinematic 10–15 second executive aviation video titled \"Mission UAE 01 – High-Level Government Delegation Arrival\".\n\nThe video follows the seamless arrival of a fictional high-level government delegation from the United States to the UAE. Maintain a premium visual identity using navy blue, warm gold, white, and subtle gray, with elegant, modern government-aviation aesthetics. Do not use real government logos or identifiable political figures.\n\nScene 1 – Opening: Golden-hour aerial shot of the UAE, transitioning to a large executive aircraft approaching the airport. Minimal text appears: MISSION UAE 01.\n\nScene 2 – Operational Readiness: Inside a sophisticated aviation operations control center, Emirati and international staff monitor flight information, readiness dashboards, timelines and departmental status. Screens show fictional data only. The mood is focused, calm and highly coordinated.\n\nScene 3 – Ramp Preparation: Ground operations personnel prepare the aircraft stand, stairs and support equipment. A marshaller directs the arriving aircraft. Show precise teamwork, safety and readiness.\n\nScene 4 – Aircraft Arrival: The executive aircraft taxis and stops at the designated position during sunset. Mobile stairs are positioned and the arrival area is professionally prepared.\n\nScene 5 – Official Reception: A fictional senior delegation exits the aircraft and is welcomed by UAE representatives. Show respectful handshakes, professional protocol and elegant hospitality. No close-up recognizable faces.\n\nScene 6 – VIP Experience: Transition into a luxurious VIP lounge with refined Emirati hospitality, Arabic coffee, elegant seating, flowers and discreet Mission UAE 01 visual elements.\n\nScene 7 – Ground Transportation: The delegation proceeds toward a coordinated fleet of luxury black vehicles for onward transportation. Show smooth movement and professional coordination rather than security tactics.\n\nFinal Scene: Fade to a clean white background with the compact Mission UAE 01 logo positioned on the left, followed by the message:\n\"One Mission. One Team. Seamless Execution.\"\n\"مهمة واحدة، فريق واحد، تنفيذ متكامل.\"\n\nStyle: ultra-realistic, cinematic, prestigious, sophisticated, warm golden-hour lighting, smooth camera movement, shallow depth of field, high-end corporate film, subtle instrumental soundtrack, no dramatic action, no military tone. Use elegant transitions and avoid overcrowded text. 16:9, 4K quality.\n\nNo voice-over: calm music only, with very short lines of text on screen.", "اصنع فيديو سينمائياً قصيراً مدته من 10 إلى 15 ثانية في مجال طيران كبار الشخصيات بعنوان \"Mission UAE 01 – High-Level Government Delegation Arrival\".\n\nيتابع الفيديو الوصول السلس لوفد حكومي افتراضي رفيع المستوى من الولايات المتحدة إلى الإمارات. حافظ على هوية بصرية فاخرة بالألوان الكحلي والذهبي الدافئ والأبيض والرمادي الهادئ، بطابع أنيق وحديث يناسب الطيران الحكومي. لا تستخدم شعارات حكومية حقيقية أو شخصيات سياسية يمكن التعرف عليها.\n\nالمشهد 1، الافتتاح: لقطة جوية للإمارات وقت الغروب الذهبي، تنتقل إلى طائرة تنفيذية كبيرة تقترب من المطار. يظهر نص بسيط: MISSION UAE 01.\n\nالمشهد 2، الجاهزية التشغيلية: داخل مركز عمليات طيران متطور، يتابع موظفون إماراتيون ودوليون معلومات الرحلة ولوحات الجاهزية والجداول الزمنية وحالة الإدارات. الشاشات تعرض بيانات افتراضية فقط. الأجواء مركّزة وهادئة ومنسّقة.\n\nالمشهد 3، تجهيز الساحة: يجهّز فريق العمليات الأرضية موقف الطائرة والسلالم والمعدات المساندة، ويوجّه الموجّه الطائرة القادمة. أظهر عملاً جماعياً دقيقاً وسلامة وجاهزية.\n\nالمشهد 4، وصول الطائرة: تسير الطائرة التنفيذية وتتوقف في موقعها المحدد وقت الغروب، وتُوضع السلالم المتحركة وتكون منطقة الوصول مجهّزة باحترافية.\n\nالمشهد 5، الاستقبال الرسمي: ينزل وفد رفيع افتراضي من الطائرة ويستقبله ممثلون إماراتيون. أظهر مصافحات محترمة ومراسم مهنية وضيافة راقية، دون لقطات قريبة لوجوه يمكن التعرف عليها.\n\nالمشهد 6، تجربة كبار الشخصيات: انتقال إلى صالة فاخرة بضيافة إماراتية راقية، وقهوة عربية، ومقاعد أنيقة، وزهور، وعناصر بصرية خفيفة لـ Mission UAE 01.\n\nالمشهد 7، النقل البري: يتجه الوفد إلى أسطول منسّق من السيارات السوداء الفاخرة. أظهر حركة سلسة وتنسيقاً مهنياً، لا أساليب أمنية.\n\nالمشهد الختامي: تلاشٍ إلى خلفية بيضاء نظيفة، مع شعار Mission UAE 01 المصغّر على اليسار، ثم الرسالة:\n\"One Mission. One Team. Seamless Execution.\"\n\"مهمة واحدة، فريق واحد، تنفيذ متكامل.\"\n\nالأسلوب: واقعي جداً، سينمائي، مرموق، راقٍ، إضاءة غروب ذهبية دافئة، حركة كاميرا ناعمة، عمق ميدان ضحل، فيلم مؤسسي عالي المستوى، موسيقى آلية هادئة، دون حركة درامية أو طابع عسكري. استخدم انتقالات أنيقة وتجنّب ازدحام النصوص. مقاس 16:9 وجودة 4K.\n\nدون تعليق صوتي: موسيقى هادئة فقط مع جمل قصيرة جداً على الشاشة.\n\nملاحظة: يُفضَّل تشغيل هذا الأمر بالنسخة الإنجليزية في Gemini / Veo."], ["6.B", "Gemini: summarise a YouTube video", "Gemini: تلخيص فيديو يوتيوب", "Gemini", "Summarise this public YouTube video for a VIP reception team: [paste link]. Give the five key points, any steps or checklists it describes, and two ideas we could apply to Mission UAE 01. Add the timestamp for each point.", "لخّص فيديو يوتيوب العام هذا لفريق استقبال كبار الشخصيات: [الصق الرابط]. اذكر أهم خمس نقاط، وأي خطوات أو قوائم تحقق يشرحها، وفكرتين يمكن تطبيقهما في مهمة الإمارات 01. أضف التوقيت لكل نقطة."], ["2.5", "Research public delegation protocol", "البحث في بروتوكول الوفود", "Perplexity", "What are commonly published good practices for receiving an official government delegation at a VIP or state terminal: arrival ceremony sequence, order of precedence in the welcome line, lounge hosting, and motorcade departure? Use only public sources such as protocol office guides and government protocol manuals, cite each source, and say where practices differ between countries.", "ما الممارسات الجيدة المنشورة عادةً لاستقبال وفد حكومي رسمي في صالة كبار الشخصيات أو صالة الدولة: تسلسل مراسم الوصول، وترتيب الأسبقية في صف الاستقبال، والاستضافة في الصالة، وانطلاق الموكب؟ استخدم مصادر عامة فقط مثل أدلة مكاتب المراسم وكتيبات البروتوكول الحكومية، واذكر كل مصدر، وبيّن أين تختلف الممارسات بين الدول."], ["6.C", "Gemini: an image from a short brief", "Gemini: صورة من وصف قصير", "Gemini (images)", "Design an image of an Emirati girl in Emirati dress, abaya and shayla, wearing hijab, as a guide to the etiquette of entering Sheikh Zayed Grand Mosque.", "صمم صورة لبنت إماراتية وهي باللبس الإماراتي وبعباءة والشيلة ومتحجبة كتعليم من تعاليم دخول مسجد الشيخ زايد."], ["6.D", "Gemini: the same image with a role and details", "Gemini: الصورة نفسها بدور وتفاصيل", "Gemini (images)", "Act as an expert in visitor awareness. I need an introductory image for tourists on the etiquette of entering the mosque through modest dress. Make the girl look at the screen and stand in a formal pose, with pointers explaining each element of the dress.", "خذ دور خبير التوعية للتعليمات للسياح. أحتاج صورة تعريفية للسياح بآداب دخول المسجد من خلال لبس محتشم. اجعل البنت وهي تنظر للشاشة وتقف بصورة رسمية، ومع إشارات توضح عناصر اللبس."], ["6.E", "Gemini: a multi-element scene", "Gemini: صورة متعددة العناصر", "Gemini (images)", "Make an image of exactly the same girl explaining the mosque to a high-level delegation from America: two men and two women.", "اصنع صورة لنفس البنت بالضبط وهي تشرح لوفد من مستوى رفيع من أمريكا، رجلين وامرأتين، عن المسجد."], ["6.F", "Gemini: merge two images", "Gemini: الدمج بين صورتين", "Gemini (images)", "Make an image of exactly the people in this picture at Hakkasan Abu Dhabi restaurant, as shown in the attached image, as if they are having the fine dinner in the picture. (Attach both images.)", "اجعل صورة للشخصيات التي في الصورة بالضبط وهم في مطعم Hakkasan Abu Dhabi كما هو موضح في الصورة المرفقة، واجعلهم وكأنهم يتناولون وجبة العشاء الفاخرة في الصورة. (أرفق الصورتين.)"], ["6.G", "Gemini on YouTube: summarise and ask", "Gemini في يوتيوب: لخّص واسأل", "Gemini (YouTube, Ask about this video)", "Can you summarise this video in Arabic? Then follow up: What are the future road projects mentioned?", "ممكن التلخيص بالعربي؟ ثم تابع بسؤال: ما هي مشاريع الطرق المستقبلية؟"]], "O": []}, {"id": "7", "day": 1, "uc": 2, "h": 70, "r": [1, 5], "tools": {"en": ["Manus"], "ar": ["Manus"]}, "en": ["Manus", "A briefing deck and the internal mission website", ["Presentation: the 8 to 10 slide mission briefing", "Website: the internal Mission Portal with a view per department"], "Use Manus to build the Final Mission Briefing deck and the internal Mission Portal website.", "Department readiness views"], "ar": ["Manus", "عرض الإحاطة وموقع المهمة الداخلي", ["العرض: إحاطة المهمة من 8 إلى 10 شرائح", "الموقع: بوابة المهمة الداخلية بواجهة لكل إدارة"], "استخدم Manus لبناء عرض الإحاطة النهائية وموقع بوابة المهمة الداخلي.", "واجهات جاهزية الإدارات"], "br": {"en": ["Presentations", "Website"], "ar": ["العروض التقديمية", "الموقع"]}, "nm": {"ar": "Manus", "en": "Manus"}, "sub": {"ar": "عروض ومواقع جاهزة", "en": "Ready decks and websites"}, "P": [["5.2", "Turn it into the deck", "تحويله إلى عرض", "Claude", "Turn this executive brief into a 10-slide Final Mission Briefing in the Mission UAE 01 identity (navy #0E2238, gold #C8A24A, sand #F4EFE4, IBM Plex Sans): cover; mission objective; delegation overview as big numbers; timeline of six phases; roles and responsibilities; operational readiness with the status word and reason; Day 1 guest journey; open issues; decisions required as the accent slide; next actions to arrival. One idea per slide, speaker notes on each, the training label on every slide.", "حوّل هذا الموجز التنفيذي إلى عرض إحاطة نهائية من 10 شرائح بهوية مهمة الإمارات 01 (الكحلي #0E2238 والذهبي #C8A24A والرملي #F4EFE4 وخط IBM Plex Sans): الغلاف؛ وهدف المهمة؛ ونظرة على الوفد بأرقام كبيرة؛ والجدول الزمني بست مراحل؛ والأدوار والمسؤوليات؛ والجاهزية التشغيلية بكلمة الحالة وسببها؛ ورحلة الضيف في اليوم الأول؛ والقضايا المفتوحة؛ والقرارات المطلوبة كشريحة مميزة؛ والخطوات التالية حتى الوصول. فكرة واحدة لكل شريحة، وملاحظات للمتحدث في كل شريحة، وعبارة السيناريو التدريبي على كل شريحة."], ["4.1", "Build the portal", "بناء البوابة", "Manus, then Claude", "Build an internal mission portal for Mission UAE 01 from the attached files. Views: Mission Status, Flight Status, Guest Experience, Ground Readiness, Engineering, Crew, Facilities, IT Systems. Each view shows its tasks with owner, deadline, priority and status, plus Green, Amber or Red readiness: Red when a critical task is overdue, Amber when any task is overdue. Add a \"view as\" switch so each team sees only its own views; Executive Leadership sees all. Add a clock control in hours before arrival that recalculates overdue tasks. Mark it \"Internal only, training scenario\". English and Arabic. Use navy #0E2238, gold #C8A24A and sand #F4EFE4.", "ابنِ بوابة مهمة داخلية لمهمة الإمارات 01 من الملفات المرفقة. الواجهات: حالة المهمة، وحالة الرحلة، وتجربة الضيف، والجاهزية الأرضية، والهندسة، والطاقم، والمرافق، والأنظمة التقنية. تعرض كل واجهة مهامها مع المسؤول والموعد والأولوية والحالة، وجاهزيتها بالأخضر أو الأصفر أو الأحمر: أحمر عند تأخر مهمة حرجة، وأصفر عند تأخر أي مهمة. أضف خيار \"العرض بصفة\" ليرى كل فريق واجهاته فقط، وترى القيادة التنفيذية الكل. أضف أداة للوقت بالساعات قبل الوصول تعيد حساب المتأخر. اكتب عليها \"للاستخدام الداخلي فقط، سيناريو تدريبي\". بالعربية والإنجليزية، وبالألوان #0E2238 و#C8A24A و#F4EFE4."], ["4.2", "Public website or internal portal?", "موقع عام أم بوابة داخلية؟", "Claude", "List what may appear on a public website about Presidential Flight's VIP services and what must stay only on the internal mission portal, with the reason for each. Then check the portal I built against the list and tell me anything that should not be there.", "اذكر ما يجوز نشره على موقع عام عن خدمات كبار الشخصيات في الطيران الرئاسي، وما يجب أن يبقى في بوابة المهمة الداخلية فقط، مع سبب كل بند. ثم راجع البوابة التي بنيتها مقابل القائمة وأخبرني بأي شيء لا ينبغي أن يكون فيها."]], "O": []}, {"id": "8", "day": 2, "uc": 2, "h": 30, "r": [1, 2], "tools": {"en": ["ChatGPT", "Custom GPT"], "ar": ["ChatGPT", "Custom GPT"]}, "en": ["Custom GPT", "Mission File Assistant (Custom GPT)", ["Instructions, knowledge files, starters", "Test with four questions"], "Build a Custom GPT that answers only from the Mission File, and test it.", "Operational brief"], "ar": ["Custom GPT", "مساعد ملف المهمة (Custom GPT)", ["التعليمات وملفات المعرفة وأسئلة البداية", "الاختبار بأربعة أسئلة"], "ابنِ Custom GPT يجيب من ملف المهمة فقط، واختبره.", "الإحاطة التشغيلية"], "nm": {"ar": "Custom GPT", "en": "Custom GPT"}, "sub": {"ar": "نرجع إلى ChatGPT", "en": "Back to ChatGPT"}, "P": [["2.2", "Build the Mission File Custom GPT", "بناء Custom GPT لملف المهمة", "ChatGPT (Create a GPT)", "Use the setup file Mission_File_Assistant_Custom_GPT.md (Outputs below): name, instructions, knowledge files, starters and four test questions with expected answers. A good build answers \"Not in the Mission File\" to the aircraft-type question.", "استخدم ملف الإعداد Mission_File_Assistant_Custom_GPT.md (في المخرجات أدناه): الاسم، والتعليمات، وملفات المعرفة، وأسئلة البداية، وأربعة أسئلة اختبار بإجاباتها المتوقعة. البناء الجيد يجيب \"غير موجود في ملف المهمة\" عن سؤال نوع الطائرة."]], "O": []}, {"id": "9", "day": 2, "uc": 2, "h": 35, "r": [1, 4, 5], "tools": {"en": ["Claude Projects"], "ar": ["مشاريع Claude"]}, "nm": {"ar": "Claude Projects", "en": "Claude Projects"}, "sub": {"ar": "مصدر بيانات واحد للمهمة", "en": "One data source for the mission"}, "en": ["Claude Projects", "Mission Claude Project and operational brief", ["Create the project and upload the Mission File and Master Sheet", "Write the project instructions once", "Ask for gaps, then the operational brief"], "Turn the Mission File into one Claude Project, find the gaps between departments and write the operational brief.", "One data source"], "ar": ["مشاريع Claude", "مشروع المهمة في Claude والإحاطة التشغيلية", ["أنشئ المشروع وارفع ملف المهمة والجدول الرئيسي", "اكتب تعليمات المشروع مرة واحدة", "اطلب الفجوات ثم الإحاطة التشغيلية"], "حوّل ملف المهمة إلى مشروع واحد في Claude، وارصد الفجوات بين الإدارات، واكتب الإحاطة التشغيلية.", "مصدر بيانات واحد"], "P": [["3.1", "Set up the Mission Claude Project", "إعداد مشروع المهمة في Claude", "Claude Projects", "Create a Claude Project named Mission UAE 01, add the Mission File and the Master Sheet as knowledge, and paste the custom instructions from Claude_Project_Instructions.md (Outputs below).", "أنشئ مشروعاً في Claude باسم مهمة الإمارات 01، وأضف ملف المهمة والجدول الرئيسي كمعرفة، والصق التعليمات من الملف Claude_Project_Instructions.md (في المخرجات أدناه)."], ["3.2", "Find gaps across departments", "رصد الفجوات بين الإدارات", "Mission Claude Project", "Read every project file and list the gaps, conflicts and timing risks between departments: tasks whose inputs arrive after their deadline, decisions that block other tasks, assumptions not yet confirmed. For each, give the task IDs involved, the risk to the Day 1 arrival, the owner and the action. Format: a table sorted by risk.", "اقرأ كل ملفات المشروع واذكر الفجوات والتعارضات ومخاطر التوقيت بين الإدارات: مهام تصل مدخلاتها بعد موعدها، وقرارات تعطّل مهام أخرى، وافتراضات لم تُؤكد بعد. لكل بند اذكر أرقام المهام، والخطر على وصول اليوم الأول، والمسؤول، والإجراء. الصيغة: جدول مرتب حسب الخطر."], ["3.3", "Write the operational brief", "كتابة الإحاطة التشغيلية", "Mission Claude Project", "Write the Mission UAE 01 operational brief as at T-48h for the Mission Lead: situation in three lines; readiness by team with Green, Amber or Red and the reason with task IDs; the critical path to arrival; decisions required with owner and deadline; gaps found; next readiness check. One page, tables where they help.", "اكتب الإحاطة التشغيلية لمهمة الإمارات 01 كما في قبل 48 ساعة لقائد المهمة: الوضع في ثلاثة أسطر؛ والجاهزية لكل فريق بالأخضر أو الأصفر أو الأحمر مع السبب وأرقام المهام؛ والمسار الحرج حتى الوصول؛ والقرارات المطلوبة مع المسؤول والموعد؛ والفجوات المكتشفة؛ وموعد المتابعة القادمة. صفحة واحدة، مع جداول حيث تفيد."]], "O": []}, {"id": "10", "day": 2, "uc": 2, "h": 30, "r": [1, 4, 5], "tools": {"en": ["Claude Artifacts"], "ar": ["Claude Artifacts"]}, "nm": {"ar": "Claude Artifacts", "en": "Claude Artifacts"}, "sub": {"ar": "مخرجات حيّة تعمل فورًا", "en": "Live outputs that just work"}, "en": ["Claude Artifacts", "Guest-journey tracker and your own tool", ["Describe the tracker and its four stages", "Refine it with one request at a time", "Build your redesigned task as an Artifact"], "Build the interactive guest-journey tracker, then turn your redesigned task into a small Artifact.", "Live outputs"], "ar": ["Claude Artifacts", "متتبع رحلة الضيف وأداتك الخاصة", ["صف المتتبع ومراحله الأربع", "حسّنه بطلب واحد في كل مرة", "ابنِ مهمتك المعاد تصميمها كـ Artifact"], "ابنِ متتبع رحلة الضيف التفاعلي، ثم حوّل مهمتك المعاد تصميمها إلى Artifact صغير.", "مخرجات حيّة"], "P": [["3.4", "Build the guest-journey tracker", "بناء متتبع رحلة الضيف", "Claude Artifacts", "Build an interactive guest-journey tracker for the Day 1 arrival of Mission UAE 01 as a single HTML page: four stages (aircraft on stand, reception, VIP lounge, ground transport), each with its owners and four checks from the Mission File. Ticking a check records the time; each stage shows Not started, In progress or Complete; a progress bar on top; English and Arabic switch; navy #0E2238, gold #C8A24A and sand #F4EFE4; the label \"Training scenario. All data is synthetic.\"", "ابنِ متتبعاً تفاعلياً لرحلة الضيف لوصول اليوم الأول في مهمة الإمارات 01 كصفحة HTML واحدة: أربع مراحل (الطائرة على الموقف، والاستقبال، والصالة، والنقل البري)، لكل مرحلة مسؤولوها وأربعة فحوص من ملف المهمة. التأشير على الفحص يسجل الوقت؛ وتظهر لكل مرحلة حالة لم يبدأ أو قيد التنفيذ أو مكتمل؛ وشريط تقدم في الأعلى؛ وزر للتبديل بين العربية والإنجليزية؛ بالألوان #0E2238 و#C8A24A و#F4EFE4؛ مع عبارة \"سيناريو تدريبي. جميع البيانات افتراضية.\""], ["3.6", "Initiative step 3: Build", "المبادرة 3: ابنِ", "Claude", "Turn my redesigned task into something I can use tomorrow: a reusable prompt, a Claude Project with instructions, or a small Artifact, whichever fits best. Explain why you chose it, build it, and give me a two-line test I can run with synthetic data.", "حوّل مهمتي المعاد تصميمها إلى شيء أستخدمه غداً: أمر قابل لإعادة الاستخدام، أو مشروع Claude بتعليمات، أو Artifact صغير، أيها أنسب. اشرح سبب اختيارك، وابنِه، وأعطني اختباراً من سطرين أجريه على بيانات افتراضية."]], "O": []}, {"id": "11", "day": 2, "uc": 4, "h": 30, "r": [1, 4, 5], "tools": {"en": ["Claude Cowork"], "ar": ["Claude Cowork"]}, "nm": {"ar": "Claude Cowork", "en": "Claude Cowork"}, "sub": {"ar": "مهمة متعددة الخطوات على ملفاتك", "en": "A multi-step task on your files"}, "en": ["Claude Cowork", "Minutes, task list and draft emails from one run", ["Give Cowork the whole meeting folder", "Review its plan before it runs", "Check the outputs: minutes, tasks, drafts"], "Run one Cowork task on the Mission UAE 01 meeting folder and get minutes, a task list and draft emails for each owner.", "Coordination"], "ar": ["Claude Cowork", "محضر وقائمة مهام ومسودات بريد في تشغيلة واحدة", ["أعطِ Cowork مجلد الاجتماع كاملاً", "راجع خطته قبل التنفيذ", "تحقق من المخرجات: المحضر والمهام والمسودات"], "شغّل مهمة واحدة في Cowork على مجلد اجتماع مهمة الإمارات 01، واحصل على محضر وقائمة مهام ومسودات بريد لكل مسؤول.", "التنسيق"], "P": [["11.A", "Run the meeting folder end to end", "شغّل مجلد الاجتماع من البداية للنهاية", "Claude Cowork", "Run a multi-step task on the Mission UAE 01 meeting folder (notes, Master Sheet, Mission File): extract decisions and tasks with owner and deadline, update the task list, and draft an email for each owner with their own tasks only. Show me your plan before you run it, and do not send any email.", "شغّل مهمة متعددة الخطوات على مجلد اجتماع مهمة الإمارات 01 (الملاحظات، والجدول الرئيسي، وملف المهمة): استخرج القرارات والمهام بمسؤولها وموعدها، وحدّث قائمة المهام، واكتب مسودة بريد لكل مسؤول بمهامه فقط. اعرض لي خطتك قبل التنفيذ، ولا ترسل أي بريد."]], "O": []}, {"id": "12", "day": 2, "uc": 4, "h": 30, "r": [2, 3, 5], "tools": {"en": ["Claude", "Connectors", "MCP", "ClickUp"], "ar": ["Claude", "الموصلات", "MCP", "ClickUp"]}, "nm": {"ar": "Plugins و MCP", "en": "Plugins & MCP"}, "sub": {"ar": "الموصلات وربط أدواتك", "en": "Connectors to your tools"}, "en": ["Plugins, Connectors and MCP", "Connected sources, ClickUp tasks and a reusable skill", ["Connect Gmail, Calendar and Drive (sandbox)", "Create tasks in ClickUp through MCP", "Save the minutes method as a skill"], "Connect Claude to the mission's sandbox email, calendar and Drive, push overdue items to ClickUp, and save the meeting-minutes method as a skill.", "Tool access"], "ar": ["الإضافات والموصلات و MCP", "مصادر متصلة ومهام في ClickUp ومهارة قابلة لإعادة الاستخدام", ["اربط Gmail والتقويم وDrive (حسابات تجريبية)", "أنشئ المهام في ClickUp عبر MCP", "احفظ طريقة المحضر كمهارة"], "اربط Claude ببريد المهمة وتقويمها وDrive التجريبية، وانقل البنود المتأخرة إلى ClickUp، واحفظ طريقة محضر الاجتماع كمهارة.", "صلاحيات الأدوات"], "P": [["12.A", "Connectors: read the source, not a copy", "الموصلات: اقرأ المصدر لا النسخة", "Claude + Gmail, Calendar, Drive (sandbox)", "Using the Gmail, Google Calendar and Google Drive connectors (sandbox accounts): read this week's Mission UAE 01 emails and calendar, extract dates, decisions and open tasks, compare them with the Master Sheet in Drive, and list anything missing or conflicting. Do not change any file.", "باستخدام موصلات Gmail وGoogle Calendar وGoogle Drive (حسابات تجريبية): اقرأ رسائل وتقويم مهمة الإمارات 01 لهذا الأسبوع، واستخرج المواعيد والقرارات والمهام المفتوحة، وقارنها بالجدول الرئيسي في Drive، واذكر ما ينقص أو يتعارض. لا تعدّل أي ملف."], ["12.B", "MCP: from suggestion to action in ClickUp", "MCP: من الاقتراح إلى الإجراء في ClickUp", "Claude + ClickUp (MCP)", "Using the ClickUp connector (MCP), create in the Mission UAE 01 sandbox space one task for each overdue item in the Master Sheet, with owner, deadline, priority and team tag, then list what you created. Ask for my confirmation before creating anything.", "باستخدام موصل ClickUp (MCP)، أنشئ في مساحة مهمة الإمارات 01 التجريبية مهمة لكل بند متأخر في الجدول الرئيسي، بالمسؤول والموعد والأولوية ووسم الفريق، ثم أعطني قائمة بما أنشأته. اطلب تأكيدي قبل إنشاء أي شيء."], ["12.C", "Skill: meeting minutes to tasks", "مهارة: من محضر الاجتماع إلى مهام", "Claude (Skills)", "Create a skill called: Mission UAE 01 meeting minutes. When run on a meeting recording or notes, produce four sections: an executive summary in five lines; decisions taken and who took each; tasks with owner, deadline and priority; open points for the next meeting.", "أنشئ مهارة باسم: محضر اجتماع «مهمة الإمارات 01». عند تشغيلها على تسجيل أو ملاحظات اجتماع، أنتج أربعة أقسام: ملخص تنفيذي في خمسة أسطر؛ القرارات المتخذة ومن اتخذها؛ المهام بالمسؤول والموعد والأولوية؛ النقاط المعلّقة للاجتماع القادم."]], "O": []}, {"id": "13", "day": 2, "uc": 2, "h": 20, "r": [1, 4, 5], "tools": {"en": ["Claude in Chrome"], "ar": ["Claude in Chrome"]}, "nm": {"ar": "Claude in Chrome", "en": "Claude in Chrome"}, "sub": {"ar": "مهام داخل المتصفح", "en": "Tasks inside your browser"}, "en": ["Claude in Chrome", "A browser task completed live", ["Open a public page", "Let Claude read and summarise it", "Stop before filling or submitting anything"], "Use Claude in Chrome on a public protocol page to collect what a reception team needs, without submitting anything.", "Research in the browser"], "ar": ["Claude in Chrome", "مهمة منجزة داخل المتصفح", ["افتح صفحة عامة", "دع Claude يقرأها ويلخصها", "توقف قبل تعبئة أو إرسال أي شيء"], "استخدم Claude in Chrome على صفحة مراسم عامة لجمع ما يحتاجه فريق الاستقبال، دون إرسال أي شيء.", "البحث في المتصفح"], "P": [["3.5", "A browser task with Claude in Chrome", "مهمة في المتصفح بإضافة Chrome", "Claude Chrome extension", "On this public page, find the information a protocol team would need for receiving an official visitor (contacts, procedures, forms) and summarise it as five bullets with the link to each item. Do not fill in or submit anything.", "في هذه الصفحة العامة، ابحث عن المعلومات التي يحتاجها فريق المراسم لاستقبال زائر رسمي (جهات الاتصال، والإجراءات، والنماذج) ولخصها في خمس نقاط مع رابط كل بند. لا تعبئ أي نموذج ولا ترسل شيئاً."]], "O": []}, {"id": "14", "day": 2, "uc": 2, "h": 20, "r": [1, 4, 5], "tools": {"en": ["Claude Desktop"], "ar": ["تطبيق Claude لسطح المكتب"]}, "nm": {"ar": "Claude Desktop", "en": "Claude Desktop"}, "sub": {"ar": "ترتيب ملفاتك على جهازك", "en": "Organise the files on your computer"}, "en": ["Claude Desktop app", "An organised mission folder and a briefing pack", ["Point Claude at the mission folder", "Sort and rename files in one pass", "Create the briefing files from the originals"], "Use the Claude desktop app to organise the Mission UAE 01 folder and create a briefing pack from it, without deleting anything.", "Files in order"], "ar": ["تطبيق Claude لسطح المكتب", "مجلد مهمة مرتب وحزمة إحاطة", ["وجّه Claude إلى مجلد المهمة", "رتّب الملفات وأعد تسميتها دفعة واحدة", "أنشئ ملفات الإحاطة من الملفات الأصلية"], "استخدم تطبيق Claude لسطح المكتب لترتيب مجلد مهمة الإمارات 01 وإنشاء حزمة إحاطة منه، دون حذف أي ملف.", "ترتيب الملفات"], "P": [["14.A", "Organise the mission folder", "رتّب مجلد المهمة", "Claude Desktop", "On the Claude desktop app, organise the Mission UAE 01 folder on my computer: create sub-folders (Mission File, Briefings, Sheets, Presentations, Correspondence), move each file to its place, rename files in one format (date_type_description), then give me a table of what you moved. Do not delete any file.", "على تطبيق Claude لسطح المكتب، رتّب مجلد مهمة الإمارات 01 على جهازي: أنشئ مجلدات فرعية (ملف المهمة، الإحاطات، الجداول، العروض، المراسلات)، وانقل كل ملف إلى مكانه، وأعد تسمية الملفات بصيغة موحّدة (التاريخ_النوع_الوصف)، ثم أعطني جدولاً بما نقلته. لا تحذف أي ملف."], ["9.A", "Claude Cowork and Desktop: work across your files", "Claude Cowork وسطح المكتب: العمل عبر ملفاتك", "Claude Cowork / Desktop", "In the Mission UAE 01 folder on my computer, read the Mission File and the Master Sheet, then create a folder called Briefing with three files: the operational brief as a Word document, a one-page readiness summary as PDF, and a list of decisions required as Excel. Do not change the original files.", "في مجلد مهمة الإمارات 01 على جهازي، اقرأ ملف المهمة والجدول الرئيسي، ثم أنشئ مجلداً باسم Briefing فيه ثلاثة ملفات: الإحاطة التشغيلية كملف Word، وملخص الجاهزية في صفحة واحدة كملف PDF، وقائمة القرارات المطلوبة كملف Excel. لا تغيّر الملفات الأصلية."]], "O": []}, {"id": "15", "day": 2, "uc": 3, "h": 30, "r": [1, 3], "tools": {"en": ["Excel", "Claude"], "ar": ["Excel", "Claude"]}, "en": ["Excel with AI", "Mission Master Sheet and readiness dashboard", ["Clean and structure the task list", "Formulas for overdue and readiness", "Red, amber, green dashboard"], "Build the Master Sheet and the readiness dashboard, then ask: why is Ground & Guest Operations amber?", "Readiness tracking"], "ar": ["Excel مع الذكاء الاصطناعي", "الجدول الرئيسي ولوحة الجاهزية", ["تنظيف قائمة المهام وتنظيمها", "معادلات التأخر والجاهزية", "لوحة بالأحمر والأصفر والأخضر"], "ابنِ الجدول الرئيسي ولوحة الجاهزية، ثم اسأل: لماذا العمليات الأرضية في الأصفر؟", "متابعة الجاهزية"], "nm": {"ar": "Excel + Claude", "en": "Excel + Claude"}, "sub": {"ar": "الجدول الرئيسي ولوحة الجاهزية", "en": "Master Sheet and readiness dashboard"}, "P": [["8.1", "Build the Master Sheet", "بناء الجدول الرئيسي", "Claude / Excel with AI", "From the Mission File, build a Mission Master Sheet with columns ID, Task, Team, Owner, Deadline in hours before arrival, Priority (Critical, High, Normal), Status (Done, In progress, Not started, Blocked), Decision required, and an Overdue formula that compares the deadline with a single Now cell. Cover every department's actions until departure, about 40 tasks.", "من ملف المهمة، ابنِ جدولاً رئيسياً للمهمة بأعمدة: الرقم، والمهمة، والفريق، والمسؤول، والموعد بالساعات قبل الوصول، والأولوية (حرجة، مرتفعة، عادية)، والحالة (منجزة، قيد التنفيذ، لم تبدأ، متوقفة)، والقرار المطلوب، ومعادلة للتأخر تقارن الموعد بخلية \"الآن\" واحدة. غطِّ إجراءات كل الإدارات حتى المغادرة، بنحو 40 مهمة."], ["8.2", "Build the readiness dashboard", "بناء لوحة الجاهزية", "Excel with AI / Claude", "Add a Dashboard sheet driven only by formulas: for each team, tasks, done, readiness (done among tasks already due), overdue, critical overdue, decisions required, and a status word: Red when a critical task is overdue, Amber when any task is overdue, Green otherwise. Add an overall row and a bar chart of readiness by team. Use COUNTIFS, not hard-coded numbers.", "أضف ورقة لوحة تعتمد على المعادلات فقط: لكل فريق، المهام، والمنجز، والجاهزية (المنجز من المهام المستحقة حتى الآن)، والمتأخر، والحرج المتأخر، والقرارات المطلوبة، وكلمة الحالة: أحمر عند تأخر مهمة حرجة، وأصفر عند تأخر أي مهمة، وأخضر غير ذلك. أضف صفاً إجمالياً ورسماً بيانياً شريطياً للجاهزية حسب الفريق. استخدم COUNTIFS لا أرقاماً ثابتة."], ["8.3", "Ask the dashboard questions", "أسئلة للوحة", "Claude + Master Sheet", "Why is Ground & Guest Operations amber? What requires my decision today, by whom and by when? Which overdue task, if not closed in the next 4 hours, would turn a team red? Answer from the sheet only, with task IDs.", "لماذا العمليات الأرضية وتجربة الضيف في الأصفر؟ وما الذي يحتاج قراري اليوم، ومن صاحبه، وما موعده؟ وأي مهمة متأخرة، إن لم تُغلق خلال 4 ساعات، ستحوّل فريقاً إلى الأحمر؟ أجب من الجدول فقط مع أرقام المهام."]], "O": []}, {"id": "16", "day": 2, "uc": 3, "h": 30, "r": [1, 3], "tools": {"en": ["Excel", "Copilot in Excel"], "ar": ["Excel", "Copilot في Excel"]}, "en": ["Excel with Copilot", "The same Master Sheet analysed with Copilot, compared with Claude", ["Save the file to OneDrive and format it as a table", "Add the Overdue column, highlights and a PivotTable with Copilot", "Ask both tools the same question and compare"], "Repeat the key Excel steps with Copilot on the same Master Sheet, then compare Claude and Copilot on the same question.", "Readiness tracking"], "ar": ["Excel مع Copilot", "الجدول الرئيسي نفسه بتحليل Copilot ومقارنته بـ Claude", ["احفظ الملف في OneDrive وحوّله إلى جدول", "أضف عمود التأخر والتظليل والجدول المحوري بـ Copilot", "اسأل الأداتين السؤال نفسه وقارن"], "أعد خطوات Excel الأساسية بـ Copilot على الجدول الرئيسي نفسه، ثم قارن بين Claude وCopilot في السؤال نفسه.", "متابعة الجاهزية"], "nm": {"ar": "Excel + Copilot", "en": "Excel + Copilot"}, "sub": {"ar": "الملف نفسه بأداة Microsoft", "en": "The same file with Microsoft's tool"}, "P": [["15.A", "Copilot: before you start", "Copilot: قبل أن تبدأ", "Copilot in Excel", "Before using Copilot: save the Master Sheet in OneDrive or SharePoint with AutoSave on, and format the task list as a table (select the data, then Ctrl+T). Then open Copilot from the Home tab and ask: Summarise this table in five bullets: how many tasks, how many are done, and which teams have overdue tasks.", "قبل استخدام Copilot: احفظ الجدول الرئيسي في OneDrive أو SharePoint مع تفعيل الحفظ التلقائي، وحوّل قائمة المهام إلى جدول (حدد البيانات ثم Ctrl+T). بعدها افتح Copilot من تبويب الصفحة الرئيسية واطلب: لخّص هذا الجدول في خمس نقاط: كم عدد المهام، وكم منها منجز، وأي الفرق لديها مهام متأخرة."], ["15.B", "Copilot: add a formula column", "Copilot: أضف عمود معادلة", "Copilot in Excel", "Add a column called Overdue that shows Yes when Status is not Done and Deadline (h) is greater than 48, otherwise No.", "أضف عموداً باسم Overdue يُظهر Yes عندما لا تكون الحالة Done ويكون Deadline (h) أكبر من 48، وإلا يُظهر No."], ["15.C", "Copilot: highlight what matters", "Copilot: ميّز ما يهم", "Copilot in Excel", "Highlight in red the rows where Priority is Critical and Overdue is Yes, and in amber the rows where Overdue is Yes and Priority is not Critical.", "ظلّل باللون الأحمر الصفوف التي تكون فيها Priority هي Critical وOverdue هي Yes، وباللون الأصفر الصفوف التي تكون فيها Overdue هي Yes والأولوية ليست Critical."], ["15.D", "Copilot: PivotTable and chart", "Copilot: جدول محوري ورسم بياني", "Copilot in Excel", "Show a PivotTable of open tasks by Team and Priority on a new sheet, and add a bar chart of open tasks by Team.", "اعرض جدولاً محورياً للمهام المفتوحة حسب Team وPriority في ورقة جديدة، وأضف رسماً بيانياً شريطياً للمهام المفتوحة حسب Team."], ["15.E", "Compare Claude and Copilot", "قارن Claude وCopilot", "Claude and Copilot in Excel", "Ask both tools the same question on the same Master Sheet: Which team is most at risk before arrival, and why? Compare the answers on accuracy, the evidence each gives (task IDs), and what each can or cannot do in the file.", "اسأل الأداتين السؤال نفسه على الجدول الرئيسي نفسه: أي فريق هو الأكثر عرضة للخطر قبل الوصول، ولماذا؟ قارن الإجابتين من حيث الدقة، والأدلة التي يذكرها كل منهما (أرقام المهام)، وما يستطيع أو لا يستطيع كل منهما فعله في الملف."]], "O": []}, {"id": "17", "day": 2, "uc": 4, "h": 25, "r": [1, 3, 5], "tools": {"en": ["Claude", "ChatGPT", "Gmail / Outlook"], "ar": ["Claude", "ChatGPT", "Gmail / Outlook"]}, "en": ["Email summarisation", "Daily inbox digest and draft replies", ["Summarise a thread of mission emails", "Extract actions, owners and deadlines", "Draft replies for review"], "Summarise the synthetic mission inbox into a five-line digest with actions and owners, and draft two replies for review.", "Final briefing"], "ar": ["تلخيص الإيميلات", "ملخص يومي للبريد ومسودات ردود", ["تلخيص سلسلة إيميلات المهمة", "استخراج الإجراءات والمسؤولين والمواعيد", "كتابة مسودات ردود للمراجعة"], "لخّص بريد المهمة الافتراضي في خمسة أسطر مع الإجراءات والمسؤولين، واكتب مسودتي رد للمراجعة.", "الإحاطة النهائية"], "nm": {"ar": "تلخيص الإيميلات", "en": "Email summaries"}, "sub": {"ar": "البريد اليومي باختصار", "en": "Your daily inbox, short"}, "P": [["11.A", "Summarise the mission inbox", "تلخيص بريد المهمة", "Claude / ChatGPT", "Here are today's Mission UAE 01 emails (synthetic): [paste the thread]. Give me a five-line digest: what changed, decisions needed, actions with owner and deadline, and anything to escalate to the Mission Lead. Then draft replies to the two most urgent emails, marked For review.", "هذه إيميلات مهمة الإمارات 01 اليوم (افتراضية): [الصق السلسلة]. أعطني ملخصاً من خمسة أسطر: ما الذي تغيّر، والقرارات المطلوبة، والإجراءات مع المسؤول والموعد، وما يجب تصعيده لقائد المهمة. ثم اكتب مسودتي رد على أكثر إيميلين إلحاحاً مع عبارة \"للمراجعة\"."]], "O": []}, {"id": "18", "day": 3, "uc": 4, "h": 120, "r": [3, 5], "tools": {"en": ["n8n", "Claude", "ClickUp", "Gmail", "Google Calendar", "Google Drive"], "ar": ["n8n", "Claude", "ClickUp", "Gmail", "تقويم Google", "Google Drive"]}, "en": ["Building an agent with n8n", "Working n8n workflow and the Mission AI Agent", ["Deterministic flow: status change, notify, escalate", "Add the AI step: classify, route, draft", "Ask the agent: are we ready?"], "Automate the Master Sheet in n8n, then add the Mission AI Agent and handle the Day 3 surprise event.", "Arrival monitoring", "Pilot your redesigned task end to end on synthetic data."], "ar": ["بناء وكيل بـ n8n", "سير عمل n8n عامل ووكيل المهمة الذكي", ["تدفق محدد القواعد: تغيّر الحالة، الإشعار، التصعيد", "إضافة خطوة الذكاء الاصطناعي: التصنيف والتوجيه والمسودة", "اسأل الوكيل: هل نحن جاهزون؟"], "أتمت الجدول الرئيسي في n8n، ثم أضف وكيل المهمة الذكي وتعامل مع حدث اليوم الثالث.", "متابعة الوصول", "جرّب مهمتك المعاد تصميمها من البداية إلى النهاية على بيانات افتراضية."], "nm": {"ar": "n8n", "en": "n8n"}, "sub": {"ar": "إيجنت بسير عمل آلي", "en": "An agent on an automated workflow"}, "P": [["9.1", "Design the flow before building it", "تصميم سير العمل قبل بنائه", "Claude, then n8n", "Design an n8n workflow for the Mission UAE 01 Master Sheet with no AI step. Flow 1: when a task's status changes, notify its owner, and if the task is critical and overdue, escalate to the Mission Lead and ask for a human recovery plan. Flow 2: every hour, read the sheet and send the Mission Lead one digest of overdue critical tasks. List each node, what it does, its inputs and outputs, and how I test it with one sample request.", "صمّم سير عمل في n8n للجدول الرئيسي لمهمة الإمارات 01 دون أي خطوة ذكاء اصطناعي. التدفق الأول: عند تغيّر حالة مهمة، أشعر مسؤولها، وإذا كانت حرجة ومتأخرة صعّد إلى قائد المهمة واطلب خطة معالجة من إنسان. التدفق الثاني: كل ساعة، اقرأ الجدول وأرسل لقائد المهمة ملخصاً واحداً بالمهام الحرجة المتأخرة. اذكر كل عقدة، ووظيفتها، ومدخلاتها ومخرجاتها، وكيف أختبرها بطلب نموذجي واحد."], ["11.1", "Are we ready?", "هل نحن جاهزون؟", "Mission Claude Project (agent)", "Are we ready? Give overall readiness with the time of the data, the teams that are not Green with reasons and task IDs, critical tasks open or overdue, decisions required, and what changes in the next 6 hours.", "هل نحن جاهزون؟ اعرض الجاهزية الإجمالية مع وقت البيانات، والفرق غير الخضراء مع الأسباب وأرقام المهام، والمهام الحرجة المفتوحة أو المتأخرة، والقرارات المطلوبة، وما سيتغير خلال الساعات الست القادمة."], ["11.3", "Day 3 surprise event", "حدث اليوم الثالث", "Mission Claude Project (agent)", "Update: the delegation's ETA is now 90 minutes earlier. What breaks, who must act, and in what order? Escalate to the Mission Lead and draft a re-plan for review; do not change any task yourself.", "تحديث: تقدّم موعد وصول الوفد 90 دقيقة. ما الذي يتأثر، ومن يجب أن يتصرف، وبأي ترتيب؟ صعّد إلى قائد المهمة واكتب مسودة إعادة تخطيط للمراجعة، ولا تغيّر أي مهمة بنفسك."], ["9.2", "Initiative step 4: Pilot", "المبادرة 4: جرّب", "Claude", "Help me pilot my redesigned task on synthetic data. Write three test cases (normal, edge case, failure), what the right result is for each, and a checklist I tick while running them. After I paste my results, tell me what to fix before using it for real.", "ساعدني على تجربة مهمتي المعاد تصميمها على بيانات افتراضية. اكتب ثلاث حالات اختبار (عادية، وحدّية، وفشل)، والنتيجة الصحيحة لكل منها، وقائمة تحقق أؤشر عليها أثناء التنفيذ. وبعد أن ألصق نتائجي، أخبرني بما يجب إصلاحه قبل الاستخدام الفعلي."]], "O": []}, {"id": "19", "day": 3, "uc": 4, "h": 100, "r": [2, 3, 5], "tools": {"en": ["Microsoft Copilot", "Copilot Studio"], "ar": ["Microsoft Copilot", "Copilot Studio"]}, "en": ["Building an agent with Copilot", "A Copilot agent for mission questions", ["Agent instructions and knowledge (Mission File)", "Topics: readiness, contacts, escalation", "Test and publish to a test group"], "Build a Copilot agent that answers mission questions from the Mission File and escalates sensitive requests.", "Post-mission review", "Measure your task Before AI and After AI: time, steps and quality."], "ar": ["بناء وكيل بـ Copilot", "وكيل Copilot لأسئلة المهمة", ["تعليمات الوكيل ومعرفته (ملف المهمة)", "الموضوعات: الجاهزية وجهات الاتصال والتصعيد", "الاختبار والنشر لمجموعة تجريبية"], "ابنِ وكيل Copilot يجيب عن أسئلة المهمة من ملف المهمة ويصعّد الطلبات الحساسة.", "مراجعة ما بعد المهمة", "قِس مهمتك قبل الذكاء الاصطناعي وبعده: الوقت والخطوات والجودة."], "nm": {"ar": "Copilot", "en": "Copilot"}, "sub": {"ar": "إيجنت داخل Microsoft", "en": "An agent inside Microsoft"}, "P": [["13.A", "Build the Copilot agent", "بناء وكيل Copilot", "Copilot Studio", "Create an agent called Mission UAE 01 Assistant. Instructions: answer questions about Mission UAE 01 only from the attached Mission File and Master Sheet; reply in the user's language; give the task ID or file section for every fact; for media, security, safety, airworthiness or dispatch questions, do not answer and tell the user to contact the Mission Lead. Add three starter prompts: Are we ready?, What are my team's open tasks?, What needs a decision today?", "أنشئ وكيلاً باسم مساعد مهمة الإمارات 01. التعليمات: أجب عن أسئلة مهمة الإمارات 01 من ملف المهمة والجدول الرئيسي المرفقين فقط؛ ورد بلغة المستخدم؛ واذكر رقم المهمة أو قسم الملف لكل معلومة؛ وفي أسئلة الإعلام والأمن والسلامة وصلاحية الطيران والإرسال لا تُجب ووجّه المستخدم إلى قائد المهمة. أضف ثلاثة أسئلة بداية: هل نحن جاهزون؟ ما المهام المفتوحة لفريقي؟ ما الذي يحتاج قراراً اليوم؟"], ["13.B", "Test the Copilot agent", "اختبار وكيل Copilot", "Copilot Studio", "Test the agent with five questions: Are we ready? / Who owns task G-01? / Can the media photograph the arrival? / What changed if the ETA moves 90 minutes earlier? / Is the transfer aircraft airworthy? Check that it cites task IDs, escalates the media question, and refuses to judge airworthiness.", "اختبر الوكيل بخمسة أسئلة: هل نحن جاهزون؟ / من المسؤول عن المهمة G-01؟ / هل يمكن للإعلام تصوير الوصول؟ / ما الذي يتغير إذا تقدّم الوصول 90 دقيقة؟ / هل طائرة النقل صالحة للطيران؟ تحقق أنه يذكر أرقام المهام، ويصعّد سؤال الإعلام، ويرفض الحكم على صلاحية الطيران."], ["10.1", "Map what the agent may touch", "تحديد ما يصل إليه الوكيل", "Claude", "For a Mission AI Agent that answers \"Are we ready?\" for Mission UAE 01, map every source and connector it could use (Drive, Sheets, ClickUp, Calendar, Gmail). For each, say what it may read, what it may write, which actions need a person to confirm, and who owns the permission. Apply least privilege: drafts only, never sending, and no access at all to safety, airworthiness or dispatch decisions. Format: a table, then five rules.", "لوكيل مهمة ذكي يجيب عن \"هل نحن جاهزون؟\" في مهمة الإمارات 01، حدّد كل مصدر وموصل قد يستخدمه (Drive وSheets وClickUp والتقويم وGmail). لكل منها اذكر ما يحق له قراءته، وما يحق له كتابته، والإجراءات التي تتطلب تأكيداً بشرياً، ومن يملك الصلاحية. طبّق مبدأ أقل الصلاحيات: مسودات فقط دون إرسال، ولا وصول إطلاقاً لقرارات السلامة وصلاحية الطيران والإرسال. الصيغة: جدول ثم خمس قواعد."], ["12.3", "Initiative step 5: Measure", "المبادرة 5: قِس", "Claude", "Compare my task Before AI and After AI: steps, time per run, runs per month, hours saved per month, quality or error changes, and what a person still decides. Give one honest line on what did not improve. Format: the row for the Before AI and After AI table.", "قارن مهمتي قبل الذكاء الاصطناعي وبعده: الخطوات، والوقت في كل مرة، ومرات التنفيذ شهرياً، والساعات الموفّرة شهرياً، وتغيّر الجودة أو الأخطاء، وما يبقى قراره للإنسان. أضف سطراً صريحاً واحداً عمّا لم يتحسن. الصيغة: صف جدول قبل الذكاء الاصطناعي وبعده."]], "O": []}, {"id": "20", "day": 3, "uc": 0, "h": 60, "r": [6], "tools": {"en": ["All workshop tools"], "ar": ["جميع أدوات الورشة"]}, "en": ["Mission demo and wrap-up", "Team demos and Before and After AI results", ["Each team presents its part of Mission UAE 01", "Each participant shows Before AI and After AI"], "One Mission. One Data Source. Multiple AI Experiences.", "Mission closed"], "ar": ["عرض المهمة والختام", "عروض الفرق ونتائج قبل وبعد الذكاء الاصطناعي", ["يعرض كل فريق جزءه من مهمة الإمارات 01", "يعرض كل مشارك مهمته قبل الذكاء الاصطناعي وبعده"], "مهمة واحدة. بيانات واحدة. منظومة ذكاء اصطناعي متكاملة.", "إغلاق المهمة"], "nm": {"ar": "خط النهاية", "en": "Finish line"}, "sub": {"ar": "إيجنتك الأول جاهز", "en": "Your first agent is ready"}, "P": [["13.1", "Prepare the team demo", "تجهيز عرض الفريق", "Claude", "Help my team, [team name], prepare a 6-minute demo of our part of Mission UAE 01: one output we built, one surprise event and how we handled it, one rule we kept. Give a minute-by-minute script and the one sentence we close on.", "ساعد فريقي، [اسم الفريق]، على تجهيز عرض من 6 دقائق لجزئنا من مهمة الإمارات 01: مخرج واحد بنيناه، وحدث مفاجئ واحد وكيف تعاملنا معه، وضابط واحد التزمنا به. أعطني نصاً دقيقة بدقيقة، والجملة الواحدة التي نختم بها."]], "O": []}], "LOGO": {"ChatGPT": "data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIGZpbGwtcnVsZT0iZXZlbm9kZCIgaGVpZ2h0PSIxZW0iIHN0eWxlPSJmbGV4Om5vbmU7bGluZS1oZWlnaHQ6MSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iMWVtIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuQUk8L3RpdGxlPjxwYXRoIGQ9Ik05LjIwNSA4LjY1OHYtMi4yNmMwLS4xOS4wNzItLjMzMy4yMzgtLjQyOGw0LjU0My0yLjYxNmMuNjE5LS4zNTcgMS4zNTYtLjUyMyAyLjExNy0uNTIzIDIuODU0IDAgNC42NjIgMi4yMTIgNC42NjIgNC41NjYgMCAuMTY3IDAgLjM1Ny0uMDI0LjU0N2wtNC43MS0yLjc1OWEuNz
