  h+=who(t)+`<div class="top"><div class="here"><div class="col"><small>${t.here} · ${t.days[cs.day]}</small><b><span class="hn">${cs.id}</span>${esc(cs.nm[lang])}</b></div><span class="sep"></span><div class="col"><small>${t.next}</small><b>${nx?`<span class="hn">${nx.id}</span>${esc(nx.nm[lang])}`:"—"}</b></div></div>
  <div class="card" style="margin:0"><div class="prog"><b>${t.prog}</b><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div>
  <div class="today">${d?`${dayDone(u,d)?`<b style="margin-top:4px">${t.dm}</b><button class="btn" type="button" data-pack="${d}">⬇ ${t.pack}</button><p class="note" style="margin:2px 0 0">${t.packHint}</p><div class="mats">${DAY_MATERIALS[d].map(m=>ready(m.url)?`<a href="${esc(m.url)}" target="_blank" rel="noopener"><span>${esc(m[lang])}</span><span>${t.dl} ↗</span></a>`:`<a aria-disabled="true"><span>${esc(m[lang])}</span><span>${t.soon}</span></a>`).join("")}</div>`:`<p class="note">🔒 ${t.dmLock}</p>`}`:`<p class="note">${t.noday}</p>`}
  ${[1,2,3].filter(x=>x!==d&&dayDone(u,x)).map(x=>`<details><summary class="note">${t.dm} · ${t.days[x]}</summary><button class="btn alt" type="button" data-pack="${x}">⬇ ${t.packAll(x)}</button><div class="mats">${DAY_MATERIALS[x].map(m=>ready(m.url)?`<a href="${esc(m.url)}" target="_blank" rel="noopener"><span>${esc(m[lang])}</span><span>${t.dl} ↗</span></a>`:`<a aria-disabled="true"><span>${esc(m[lang])}</span><span>${t.soon}</span></a>`).join("")}</div></details>`).join("")}</div></div></div>
  ${mapHTML(u,t,cur)}${listHTML(u,t,cur)}
  <div class="legend"><span><i style="background:#2F5D4E"></i>${t.lg[0]}</span><span><i style="background:var(--c)"></i>${t.lg[1]}</span><span><i style="border:2px solid var(--rope)"></i>${t.lg[2]}</span></div>
  ${postOpen()?`<div class="card narrow" style="margin-top:14px">${p<100?`<p class="note">${t.missing(ST.filter(s=>!u.done[s.id]).length)}</p>`:""}<button class="btn" type="button" id="topost">${t.postgo}</button></div>`:`<p class="note" style="text-align:center">${t.postSoon}</p>`}`;}
 else if(st===3){h+=who(t)+nav()+survey("post",t,u);}
 else{h+=who(t)+nav()+`<div class="card narrow"><div class="big">🎉</div><h2 style="text-align:center">${t.ty}</h2><p class="sub" style="text-align:center">${t.tys}</p>${[1,2,3].map(d=>`<button class="btn alt" type="button" data-pack="${d}">⬇ ${t.packAll(d)}</button>`).join("")}<div class="mats">${[...[1,2,3].flatMap(d=>DAY_MATERIALS[d]),...MATERIALS].map(m=>ready(m.url)?`<a href="${esc(m.url)}" target="_blank" rel="noopener"><span>${esc(m[lang])}</span><span>${t.dl} ↗</span></a>`:`<a aria-disabled="true"><span>${esc(m[lang])}</span><span>${t.soon}</span></a>`).join("")}</div></div>`;}
 $("app").innerHTML=h;bind(t,u,st);}
function openStation(id){S.sel=id;save();const u=MODE==="trainer"?{done:{}}:me(),t=T[lang],s=ST.find(x=>x.id===id);$("dp").innerHTML=stationPanel(s,u,t);$("dr").hidden=false;
 $("dclose").onclick=closeDr;$("dclose").focus();$("dclose2").onclick=closeDr;
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.i],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copiedP;setTimeout(()=>b.textContent=t.copyP,1500);});
 const tk=$("tk");if(tk)tk.onchange=e=>{u.done[id]=e.target.checked;save();send("station",{id,done:e.target.checked});render();};}
function closeDr(){$("dr").hidden=true;render();}
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("dr").hidden)closeDr();});
function bind(t,u,st){const q=i=>$(i);
 if(q("sel"))q("sel").onchange=e=>{S.pending=e.target.value||null;save();render();};
 if(q("go"))q("go").onclick=()=>{S.code=S.pending;S.pending=null;me();save();send("login",{});render();};
 if(q("cp"))q("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(S.code||S.pending);q("cp").textContent=t.copied;};
 if(q("back"))q("back").onclick=()=>{S.view=st-1;save();render();};if(q("fwd"))q("fwd").onclick=()=>{S.view=st+1;save();render();};
 const kind=st===1?"pre":"post",key=kind==="pre"?"preOpened":"postOpened";
 if(q("openf"))q("openf").addEventListener("click",()=>{PENDING={k:key,u};clearTimeout(PT);PT=setTimeout(finish,20000);});
 if(q("sdone"))q("sdone").onclick=()=>{u[kind]=true;S.view=kind==="pre"?2:4;save();send(kind,{mode:"external"});render();scrollTo(0,0);};
 if(q("sf"))q("sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),need=QS.pre.length+(kind==="post"?QS.fb.length:0),a=Object.fromEntries(f.entries());
  if(Object.keys(a).filter(k=>k!=="c").length<need){q("serr").hidden=false;return;}u[kind]=true;u[kind+"Ans"]=a;S.view=kind==="pre"?2:4;save();send(kind,{answers:a});render();scrollTo(0,0);};
 document.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>savePack(+b.dataset.pack));
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>openStation(b.dataset.st));

 if(q("att"))q("att").onclick=()=>{const d=[1,2,3].find(isToday);u.att[d]=new Intl.DateTimeFormat(lang==="ar"?"ar-AE":"en-GB",{timeZone:"Asia/Dubai",hour:"2-digit",minute:"2-digit"}).format(new Date());save();send("attendance",{day:d});if(FORM_MODE==="external"&&ready(FORMS.attendance))window.open(FORMS.attendance,"_blank","noopener");render();};
 if(q("ck"))q("ck").onclick=()=>{const d=[1,2,3].find(isToday);u.checkin[d]=pct(u);save();send("checkin",{day:d,pct:pct(u)});if(FORM_MODE==="external"&&ready(FORMS.daily))window.open(FORMS.daily,"_blank","noopener");render();};
 if(q("topost"))q("topost").onclick=()=>{S.view=3;save();render();scrollTo(0,0);};
 if(q("sim"))q("sim").onchange=e=>{S.sim=e.target.value?+e.target.value:null;S.sel=null;save();render();};
 if(q("tmoff"))q("tmoff").onclick=()=>{S.tm=false;S.sim=null;save();render();};
 if(q("tmu"))q("tmu").onchange=e=>{S.code=e.target.value||null;S.view=null;S.sel=null;if(S.code)me();save();render();};
 if(q("tms"))q("tms").onchange=e=>{const k=+e.target.value;if(!k)return;const x=me();x.pre=k>=2;x.post=k>=6;x.preOpened=x.pre;x.postOpened=x.post;x.done={};x.checkin={};x.att={};
  const upto=k===3?1:k===4?2:k>=5?3:0;ST.filter(s=>s.day<=upto).forEach(s=>x.done[s.id]=true);for(let d=1;d<=upto;d++){x.att[d]="09:00";x.checkin[d]=pct(x);}if(k>=5&&!S.sim)S.sim=3;S.view=null;S.sel=null;save();render();};
 if(q("tmr"))q("tmr").onclick=()=>{if(S.users)delete S.users[S.code];me();S.view=null;save();render();};
 if(q("tma"))q("tma").onclick=()=>{if(confirm(t.tmAsk)){S={tm:true};save();render();}};}
document.addEventListener("keydown",e=>{if(MODE!=="trainer"||!S.tok||!$("dr").hidden)return;const rtl=lang==="ar";if(e.key===(rtl?"ArrowLeft":"ArrowRight"))$("tn")&&$("tn").click();if(e.key===(rtl?"ArrowRight":"ArrowLeft"))$("tp")&&$("tp").click();});
let taps=0,tt=null;$("logo").onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;S.tm=true;save();render();}};
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render();if(!$("dr").hidden&&S.sel)openStation(S.sel);};render();
</script></body></html>
