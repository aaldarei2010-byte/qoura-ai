<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#163832;--c:#A8703F;--rope:#C9A27A;--bg:#F6F1E8;--card:#FFFFFF;--ink:#16211F;--muted:#6B7A76;--line:#E3DACB;--ok:#2F7A4E;--soft:#EFE7DA;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A}}
:root[data-theme="dark"]{--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,system-ui,sans-serif;line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.logo{background:#fff;border-radius:12px;padding:6px 10px;cursor:default}.logo img{height:46px;display:block}
.ht{flex:1;min-width:220px}.ht small{color:var(--c);font-weight:600}.ht h1{margin:0;font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.15}.ht p{margin:2px 0 0;color:var(--muted)}
.lang{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.narrow{max-width:640px;margin-inline:auto}
h2{margin:0 0 6px;font-size:1.3rem}.sub{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--g);color:#fff;text-decoration:none;width:100%;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.cu{background:var(--c)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;font-weight:600}
select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}.code b{font-size:1.7rem;letter-spacing:.08em}.code small{display:block;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
/* journey top */
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:6px}
@media (max-width:860px){.top{grid-template-columns:1fr}}
.here{background:var(--g);color:#F6F1E8;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.here .col{flex:1;min-width:120px}.here small{display:block;color:#E2B48A;font-size:.78rem}.here b{font-size:1.1rem}
.here .hn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--c);color:#fff;font-size:.85rem;margin-inline-end:8px;vertical-align:middle;padding:0 4px}
.here .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
.here button{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:1.1rem}
.here button.on{background:var(--c);border-color:var(--c)}
.prog{display:flex;align-items:center;gap:10px}.bar{flex:1;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pct{font-weight:700;font-size:1.2rem;min-width:3.4em;text-align:end}
.today{display:flex;flex-direction:column;gap:6px}
.today .row{display:flex;gap:8px;flex-wrap:wrap}.today .row .btn{width:auto;flex:1;margin-top:0;padding:10px 12px;font-size:.92rem}
.okline{color:var(--ok);font-weight:700;font-size:.88rem}
.mats a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;color:var(--ink);text-decoration:none;font-weight:600;background:var(--bg)}
.mats a span:last-child{color:var(--c)}
/* map desktop */
.map{position:relative;width:100%;aspect-ratio:1200/1000;container-type:inline-size;margin-top:6px}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;transform:translate(-50%,-50%);width:11.8cqw;display:flex;justify-content:center}
.st .ttl{position:absolute;bottom:calc(50% + 3.8cqw);left:50%;transform:translateX(-50%);width:11.8cqw;text-align:center}
.st .ttl b{display:block;font-size:1.5cqw;line-height:1.15;color:var(--ink)}
.st .ttl span{display:block;font-size:.95cqw;color:var(--muted)}
.st.wide .ttl{width:19cqw}
.st .ttl span.here-tag{display:inline-block;color:#fff;font-size:1.05cqw;margin:0 0 .4cqw !important}
.st.dim .ttl b{color:var(--muted)}
.here-tag{display:table;margin:0 auto .4cqw !important;background:var(--c);color:#fff;font-size:1cqw;font-weight:700;border-radius:999px;padding:.2cqw .8cqw;margin-bottom:.4cqw}
.dot{position:relative;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--card);border:.25cqw solid var(--rope);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.08)}
.dot img{width:3cqw;height:3cqw;object-fit:contain}
.dot svg{width:2.6cqw;height:2.6cqw;stroke:var(--ink)}
.dot .n{position:absolute;top:-.6cqw;inset-inline-end:-.6cqw;width:2cqw;height:2cqw;border-radius:50%;background:var(--c);color:#fff;font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.st.done .dot{border-color:var(--ok)}.st.done .dot .n{background:var(--ok)}
.st.cur .dot{border-color:var(--c);box-shadow:0 0 0 1cqw color-mix(in srgb,var(--c) 22%,transparent)}
.chips{position:absolute;top:calc(50% + 3.6cqw);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5cqw;width:11.4cqw}
.chips.grid{display:grid;grid-template-columns:repeat(3,1fr);width:34cqw}
.chips.logos{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;width:26cqw;background:var(--card);border:1px solid var(--line);border-radius:1.2cqw;padding:.8cqw}
.chip{display:flex;align-items:center;justify-content:center;gap:.5cqw;width:100%;background:var(--card);border:1px solid var(--line);border-radius:.7cqw;padding:.45cqw .6cqw;font-size:1cqw;font-weight:600;white-space:nowrap}
.chips.logos .chip{width:auto;border-radius:999px;font-size:1cqw;padding:.3cqw .8cqw}
.chip img{width:1.4cqw;height:1.4cqw;object-fit:contain}
.st.cur .chip{border-color:var(--c)}
.dayl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.dayl b{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:.3cqw 1.2cqw;font-size:1.25cqw}
.dayl span{display:block;color:var(--c);font-weight:600;font-size:1.15cqw;margin-top:.3cqw}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
/* mobile list */
.list{display:none}
@media (max-width:760px){.map{display:none}.list{display:block}}
.lday{margin:16px 0 6px;display:flex;align-items:baseline;gap:8px}.lday b{background:var(--g);color:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}.lday span{color:var(--c);font-weight:600;font-size:.85rem}
.li{display:flex;gap:12px;align-items:flex-start;position:relative;padding:8px 0 14px;cursor:pointer;width:100%;text-align:start;background:none;border:0}
.li::before{content:"";position:absolute;inset-inline-start:25px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,color-mix(in srgb,var(--rope) 70%,#000) 6px 9px);border-radius:4px;opacity:.85}
.li.done::before{background:repeating-linear-gradient(45deg,#2F5D4E 0 6px,#183A32 6px 9px)}
.li .dot{width:58px;height:58px;flex:0 0 58px;z-index:1;border-width:3px}
.li .dot img{width:30px;height:30px}.li .dot svg{width:26px;height:26px}
.li .dot .n{width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px;border-width:2px}
.li .tx b{display:block;font-size:1.05rem}.li .tx span{color:var(--muted);font-size:.85rem}
.li .tx .cl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.li .tx .cl i{font-style:normal;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--card)}
.li .tg{font-size:.72rem;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
/* drawer */
.dr{position:fixed;inset:0;background:rgba(15,26,24,.45);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);width:min(480px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;border-radius:18px 18px 0 0;width:100%}}
.dh{display:flex;align-items:center;gap:12px;position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));background:var(--card);z-index:2;margin:calc(-16px - env(safe-area-inset-top,0px)) -18px 0;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--line)}.dh .dot{width:56px;height:56px;flex:0 0 56px;cursor:default;border-width:3px}.dh .dot img{width:30px;height:30px}.dh .dot svg{width:26px;height:26px}.dh .dot .n{width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px}
.dh h2{margin:0}.dh .meta{color:var(--muted);font-size:.85rem}
.dclose{margin-inline-start:auto}
.task{margin-top:12px;background:var(--soft);border-radius:10px;padding:10px 12px}.task small{display:block;color:var(--muted);font-weight:600}
h3{font-size:.95rem;margin:16px 0 6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchips span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600}
.tchips img{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:4px}
.tchips.br span{border-style:dashed}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);margin-bottom:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;font-size:.8rem}
.ob{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;text-decoration:none;color:var(--ink);font-size:.88rem;font-weight:600}
.ob span:last-child{color:var(--c);white-space:nowrap}
ol.steps{margin:0;padding-inline-start:20px}ol.steps li{margin:3px 0}
.tick{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px;border-radius:12px;background:var(--soft);font-weight:600;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--ok)}
.dfoot{display:flex;gap:8px;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--line)}.dfoot .btn{margin-top:0;flex:1;padding:10px 12px;font-size:.9rem}
.tick.off{cursor:default;opacity:.7}
.lock{font-size:.85rem;color:var(--muted)}
/* surveys */
.q{border-top:1px solid var(--line);padding:12px 0}.q p{margin:0 0 8px;font-weight:600}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sc label{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.72rem;text-align:center;color:var(--muted)}
.sc input{position:absolute;opacity:0}.sc label b{font-size:1.1rem;color:var(--ink)}
.sc label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sc label:has(input:focus-visible){outline:3px solid var(--c)}
textarea{width:100%;min-height:90px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.tmode{background:#FFF4D6;color:#5A4300;border:1.5px dashed #B98A00;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.tmode .r{display:flex;justify-content:space-between;align-items:center}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}
.big{font-size:3rem;text-align:center}
.dot .l2{position:absolute;bottom:-.5cqw;inset-inline-start:-.5cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}.dot .l2 img{width:1.5cqw!important;height:1.5cqw!important}
.li .dot .l2,.dh .dot .l2{width:24px;height:24px;bottom:-5px;inset-inline-start:-5px;border-width:1.5px}.li .dot .l2 img,.dh .dot .l2 img{width:16px!important;height:16px!important}
.logo.client{padding:4px 8px}.logo.client img{height:50px}
.gsteps{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600}
.gsteps li i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--card);border:2px solid var(--rope);font-size:.85rem}
.gsteps li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.gsteps li.go{background:color-mix(in srgb,var(--ok) 14%,transparent);outline:2px solid var(--ok)}.gsteps li.go i{border-color:var(--ok);color:var(--ok)}
.btn.gr{background:var(--g);color:#fff}:root[data-theme="dark"] .btn.gr{background:#2F7A4E}
.btn.cu{background:var(--c);color:#fff}:root[data-theme="dark"] .btn.cu{color:#1A120B}
.btn.cu{background:var(--c);color:#fff}
details.kit{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}details.kit summary{cursor:pointer}
.mats a[aria-disabled]{opacity:.55}
.chips.logos{width:34cqw}
.postcard{border:2px solid var(--c);box-shadow:0 6px 24px color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:16px}.postcard h2{color:var(--c)}
.logo{border:1px solid var(--line)}.logo img{height:62px}
.hbtns{display:flex;gap:8px}.thm{min-width:44px;font-size:1.05rem;line-height:1}
</style></head><body>

const DATA={"ST": [{"day": 1, "h": 0, "nm": {"ar": "الذكاء التوليدي", "en": "Generative AI"}, "sub": {"ar": "مركز الخريطة", "en": "The centre of the map"}, "tools": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}, "en": ["Generative AI", "It creates new content quickly and helps you produce and get things done", ["Watch the journey video: our day, through a small screen", "The five things it creates: text, image, voice, video, code", "The four things that extend it: Connector, Skill, Extension, Co-worker", "The Agent that uses all of them; and the rule: an advisor to consult, not to obey"], "Ask ChatGPT and Claude the same question about your job, and compare the two answers.", "", ""], "ar": ["الذكاء الاصطناعي التوليدي", "ينشئ محتوى جديداً بسرعة ويساعدك على الإنتاج والإنجاز", ["شاهد فيديو الرحلة: «يومنا… عبر شاشة صغيرة»", "الأشياء الخمسة التي ينشئها: النص، والصورة، والصوت، والفيديو، والكود", "الأمور الأربعة التي توسّعه: Connector وSkill وExtension وCo-worker", "الـ Agent الذي يستخدمها كلها؛ والقاعدة: «مساعدٌ يُستشار… ولا يُطاع»"], "اسأل ChatGPT وClaude السؤال نفسه عن عملك، وقارن الإجابتين.", "", ""], "P": [["1.A", "ChatGPT: generative AI in my job", "ChatGPT: الذكاء التوليدي في عملي", "ChatGPT", "I am [your role] in [your field]. Explain generative AI to me in three sentences without technical terms. Then give me one example from my own work for each thing it can create: text, image, voice, video and code.", "أنا [منصبك] في [مجالك]. اشرح لي الذكاء الاصطناعي التوليدي في ثلاث جمل دون مصطلحات تقنية. ثم أعطني مثالاً واحداً من عملي لكل شيء يستطيع إنشاءه: النص، والصورة، والصوت، والفيديو، والكود."], ["1.B", "Claude: the same question", "Claude: السؤال نفسه", "Claude", "Paste the same prompt into Claude. Then compare: which answer is clearer, which is closer to your work, and which one asked you a question before answering?", "الصق الأمر نفسه في Claude. ثم قارن: أي إجابة أوضح، وأيها أقرب إلى عملك، وأيها سألك سؤالاً قبل أن يجيب؟"]], "id": "1", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 1, "h": 0, "nm": {"ar": "هندسة الأوامر", "en": "Prompt engineering"}, "sub": {"ar": "التوجيه = «برومبت»", "en": "Your instruction = a prompt"}, "tools": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}, "en": ["Prompt engineering", "Every instruction you give your office is a prompt", ["The five parts: role, goal, details, output, tone", "Say it by voice instead of typing it", "Tell the assistant once who you are and how you like replies", "Ask it to ask you questions before it answers"], "Say one prompt by voice in ChatGPT, then save who you are in your personalization in ChatGPT and Claude.", "", ""], "ar": ["هندسة الأوامر (البرومبت)", "كل توجيه تعطيه لمكتبك هو «برومبت»", ["العناصر الخمسة: الدور، والهدف، والتفاصيل، والمخرجات، والنبرة", "قله بصوتك بدل أن تكتبه", "أخبر المساعد مرة واحدة من أنت وكيف تحب الرد", "اطلب منه أن يسألك قبل أن يجيب"], "قل توجيهاً واحداً بصوتك في ChatGPT، ثم احفظ «من أنا وكيف أحب الرد» في تخصيص ChatGPT وClaude.", "", ""], "P": [["2.A", "The five parts", "العناصر الخمسة", "—", "1 Role: who is the assistant? → You are an expert family travel coordinator\n2 Goal: what do I want? → A comfortable 5-day trip to London\n3 Details: the context → 6 people including two children; we love museums and parks, and dislike long walks\n4 Output: in what form? → A day-by-day table + what to book early + a packing list\n5 Tone: in what style? → Briefly, and ask me 3 questions before you start", "١ الدور: من يكون المساعد؟ ← أنت منسق رحلات خبير للعائلات\n٢ الهدف: ماذا أريد؟ ← رحلة مريحة ٥ أيام في لندن\n٣ التفاصيل: ما السياق؟ ← ٦ أشخاص منهم طفلان، نحب المتاحف والحدائق، ولا نحب المشي الطويل\n٤ المخرجات: بأي شكل؟ ← جدول يوماً بيوم + ما يُحجز مبكراً + قائمة أغراض\n٥ النبرة: بأي أسلوب؟ ← باختصار، واسألني ٣ أسئلة قبل أن تبدأ"], ["2.B", "ChatGPT: a prompt by voice", "ChatGPT: توجيه بصوتك", "ChatGPT (microphone)", "Tap the microphone and say:\nYou are an expert family travel coordinator. Plan a comfortable 5-day trip to London, day by day. We are 6 people including two children; we love museums and parks and dislike long walks. Give me a table, what to book early, and a packing list. Briefly, and ask me 3 questions before you start.", "اضغط الميكروفون وقل:\nأنت منسق رحلات خبير للعائلات. رتّب لي رحلة مريحة ٥ أيام في لندن، يوماً بيوم. نحن ٦ أشخاص منهم طفلان، نحب المتاحف والحدائق ولا نحب المشي الطويل. أعطني جدولاً، وما يُحجز مبكراً، وقائمة أغراض. باختصار، واسألني ٣ أسئلة قبل أن تبدأ."], ["2.C", "ChatGPT and Claude: who I am", "ChatGPT وClaude: من أنا وكيف أحب الرد", "ChatGPT → Personalization · Claude → Settings → Profile", "Write this once in ChatGPT (Settings → Personalization) and in Claude (Settings → Profile); it then applies to every chat:\nI am [your role] at [your organisation]. Write to me in Arabic, briefly, starting with the conclusion, then the details. If I ask for a formal letter, write it in Arabic and English. Do not invent numbers or sources; if you are not sure, say so.", "اكتب هذا مرة واحدة في ChatGPT (الإعدادات ← التخصيص) وفي Claude (الإعدادات ← الملف الشخصي)، فيُطبَّق في كل المحادثات:\nأنا [منصبك] في [جهتك]. اكتب لي بالعربية باختصار، وابدأ بالخلاصة ثم التفاصيل. إذا طلبت رسالة رسمية فاكتبها بالعربية والإنجليزية. لا تخترع أرقاماً أو مصادر، وإن لم تتأكد فقل ذلك."]], "id": "2", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 1, "h": 0, "nm": {"ar": "النص", "en": "Text"}, "sub": {"ar": "خطاب ← رد جاهز", "en": "A letter → a ready reply"}, "tools": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}, "en": ["Text", "Write, summarise and translate", ["The camera is the assistant's eye: photograph a letter", "Get the summary and a ready reply in Arabic and English", "Formal writing and long documents in Claude", "Verify every piece of information; ask for the source first"], "Photograph a non-confidential letter in ChatGPT and get a ready reply, then polish it in Claude.", "", ""], "ar": ["النص", "كتابة وتلخيص وترجمة", ["الكاميرا عين المساعد: صوّر خطاباً", "احصل على الخلاصة ورد جاهز بالعربية والإنجليزية", "الكتابة الرصينة والمستندات الطويلة في Claude", "تحقّق من كل معلومة؛ المصدر قبل الثقة"], "صوّر خطاباً غير سري في ChatGPT واحصل على رد جاهز، ثم حسّنه في Claude.", "", ""], "P": [["3.A", "ChatGPT: letter → ready reply", "ChatGPT: خطاب ← رد جاهز", "ChatGPT (camera)", "Photograph a non-confidential letter, then:\nYou are an expert executive office manager. Summarise this letter in 3 points, then what is required of me, then a short draft reply in Arabic and English. Formal and brief; ask me if any information is missing.", "صوّر خطاباً غير سري، ثم:\nأنت مدير مكتب تنفيذي خبير. لخّص هذا الخطاب في ٣ نقاط، ثم المطلوب مني، ثم مسودة رد قصيرة بالعربية والإنجليزية. رسمي ومختصر، واسألني إذا نقصتك معلومة."], ["3.B", "Claude: polish and translate", "Claude: حسّن وترجم", "Claude", "Here is a draft reply: [paste the reply]. Make it more measured and concise for a senior government partner, keep the meaning exactly, then give me the English version and list any word that could be understood differently.", "هذه مسودة رد: [الصق الرد]. اجعلها أكثر رصانة وإيجازاً لشريك حكومي رفيع، وحافظ على المعنى تماماً، ثم أعطني النسخة الإنجليزية واذكر أي كلمة قد تُفهم بشكل مختلف."], ["3.C", "Verify", "تحقّق من كل معلومة", "ChatGPT · Claude", "Give me a quotation by Al-Aqqad about reading, with its exact source: the book, the edition and the page. If you are not sure of the source, say so clearly.\n(Run it in both tools and compare. Then check the source yourself.)", "أعطني اقتباساً للعقاد عن القراءة مع مصدره الدقيق: الكتاب والطبعة والصفحة. وإن لم تتأكد من المصدر فقل ذلك بوضوح.\n(شغّله في الأداتين وقارن، ثم تحقّق من المصدر بنفسك.)"]], "id": "3", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 1, "h": 0, "nm": {"ar": "الصورة", "en": "Image"}, "sub": {"ar": "ملصق وجناح وشرح في لحظة", "en": "A poster, a pavilion, an instant explanation"}, "tools": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}, "en": ["Image", "Design images, and understand any image in a moment", ["Design a cultural evening poster in ChatGPT", "A concept for a pavilion at the book fair", "Photograph a painting or a sign: an explanation in a moment", "Claude writes the image brief; ChatGPT draws it. No real faces"], "Let Claude write the brief, then let ChatGPT design the poster.", "", ""], "ar": ["الصورة", "تصميم الصور، وفهم أي صورة في لحظة", ["ملصق أمسية ثقافية في ChatGPT", "تصوّر لجناح في معرض الكتاب", "صوّر لوحة أو لافتة: شرح في لحظة", "Claude يكتب وصف التصميم، وChatGPT يرسمه. لا وجوه حقيقية"], "دع Claude يكتب وصف التصميم، ثم دع ChatGPT يصمم الملصق.", "", ""], "P": [["4.A", "Claude: write the design brief", "Claude: اكتب وصف التصميم", "Claude", "Write me a detailed image prompt for a poster for a cultural evening titled «[title]» on [date] at [place]: the scene, the colours, the Arabic type feel, where the title and date go, and the size (4:5). No people or faces, no real logos. Give me the prompt only, ready to paste into ChatGPT.", "اكتب لي وصفاً تفصيلياً لصورة ملصق أمسية ثقافية بعنوان «[العنوان]» بتاريخ [التاريخ] في [المكان]: المشهد، والألوان، وطابع الخط العربي، وموضع العنوان والتاريخ، والمقاس (4:5). دون أشخاص أو وجوه، ودون شعارات حقيقية. أعطني الوصف فقط، جاهزاً للصقه في ChatGPT."], ["4.B", "ChatGPT: design the poster and the pavilion", "ChatGPT: صمّم الملصق والجناح", "ChatGPT (images)", "Paste Claude's prompt to create the poster. Then:\nCreate a realistic concept of a cultural institution's pavilion at the book fair: wooden bookshelves, a reading corner, an area for author conversations, warm light, an Arabic identity in [your colours]. No people, no real logos.", "الصق وصف Claude لإنشاء الملصق. ثم:\nأنشئ تصوّراً واقعياً لجناح مؤسسة ثقافية في معرض الكتاب: رفوف كتب خشبية، وركن قراءة، ومساحة لحوارات الكتّاب، وإضاءة دافئة، وهوية عربية بألوان [ألوانك]. دون أشخاص ودون شعارات حقيقية."], ["4.C", "An explanation in a moment", "شرح في لحظة", "ChatGPT (camera) · Claude (photo)", "Photograph a painting in a museum or a sign in another language, then ask:\nExplain this to me briefly in Arabic, and translate any text in it.\n(Try it in ChatGPT with the camera, and in Claude by attaching the photo.)", "صوّر لوحة في متحف أو لافتة بلغة أخرى، ثم اسأل:\nاشرح لي هذا باختصار بالعربية، وترجم أي نص فيه.\n(جرّبه في ChatGPT بالكاميرا، وفي Claude بإرفاق الصورة.)"]], "id": "4", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 1, "h": 0, "nm": {"ar": "الصوت", "en": "Voice"}, "sub": {"ar": "صوت ← مهام", "en": "Voice → tasks"}, "tools": {"en": ["ChatGPT", "Claude", "ElevenLabs"], "ar": ["ChatGPT", "Claude", "ElevenLabs"]}, "en": ["Voice", "Generate and improve voice", ["By voice, the way you talk to your office manager", "A voice note after a meeting → tasks with owners and dates", "\"This voice… is not a human voice\": a voice-over with ElevenLabs", "30 seconds are enough to clone a voice: verify any urgent voice request"], "Speak a voice note after a meeting and turn it into tasks, in ChatGPT and in Claude.", "", ""], "ar": ["الصوت", "توليد وتحسين الصوت", ["بالصوت… كما تحدّث مدير المكتب", "ملاحظة صوتية بعد اجتماع ← مهام بأصحابها ومواعيدها", "«هذا الصوت… ليس صوت إنسان»: تعليق صوتي بـ ElevenLabs", "٣٠ ثانية تكفي لاستنساخ صوت: تحقّق من أي طلب صوتي عاجل"], "قل ملاحظة صوتية بعد اجتماع وحوّلها إلى مهام، في ChatGPT وفي Claude.", "", ""], "P": [["5.A", "ChatGPT: voice → tasks", "ChatGPT: صوت ← مهام", "ChatGPT (voice)", "Tap the voice button and speak for a minute about a meeting you just had. Then say:\nTurn what I said into points, then a list of tasks with the owner and deadline of each.", "اضغط زر الصوت وتحدث دقيقة عن اجتماع انتهى للتو. ثم قل:\nحوّل ما قلته إلى نقاط، ثم قائمة مهام بأصحابها ومواعيدها."], ["5.B", "Claude: dictate and organise", "Claude: أملِ ورتّب", "Claude (keyboard microphone)", "Dictate the same note through the keyboard microphone in Claude, then add:\nOrganise this into a short meeting summary with decisions, tasks and owners, and write a follow-up message to the team.", "أملِ الملاحظة نفسها عبر ميكروفون لوحة المفاتيح في Claude، ثم أضف:\nرتّب هذا في ملخص اجتماع قصير فيه القرارات والمهام وأصحابها، واكتب رسالة متابعة للفريق."], ["5.C", "A voice-over (ElevenLabs)", "تعليق صوتي (ElevenLabs)", "ElevenLabs", "Ask Claude or ChatGPT for a 20-second script about your department, then paste it into ElevenLabs with a calm Arabic voice and export it as MP3.\nNever clone a real person's voice without their consent.", "اطلب من Claude أو ChatGPT نصاً مدته 20 ثانية عن إدارتك، ثم الصقه في ElevenLabs بصوت عربي هادئ وصدّره بصيغة MP3.\nلا تستنسخ صوت شخص حقيقي دون موافقته."]], "id": "5", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 1, "h": 0, "nm": {"ar": "الفيديو", "en": "Video"}, "sub": {"ar": "كيف صُنع هذا الفيديو؟", "en": "How was this video made?"}, "tools": {"en": ["ChatGPT", "Claude", "Higgsfield"], "ar": ["ChatGPT", "Claude", "Higgsfield"]}, "en": ["Video", "Create and explain with video", ["How the journey video was made: script, voice, motion, music", "Claude writes the scenes, ChatGPT makes the images", "Higgsfield or Veo brings the images to life", "A person reviews every video before it is shown"], "Write a 30-second video scene by scene with Claude, then make its first image with ChatGPT.", "", ""], "ar": ["الفيديو", "إنشاء وشرح بالفيديو", ["كيف صُنع فيديو الرحلة: النص، فالصوت، فالحركة، فالموسيقى", "Claude يكتب المشاهد، وChatGPT يصنع الصور", "Higgsfield أو Veo يحرّك الصور", "شخص يراجع كل فيديو قبل عرضه"], "اكتب فيديو مدته 30 ثانية مشهداً بمشهد مع Claude، ثم اصنع صورته الأولى مع ChatGPT.", "", ""], "P": [["6.A", "Claude: the script, scene by scene", "Claude: النص مشهداً بمشهد", "Claude", "Write a 30-second video about [your initiative or department] in 5 scenes. For each scene: what we see, the on-screen Arabic line, the voice-over line, and the motion. End with a short closing line. Calm, elegant style.", "اكتب فيديو مدته 30 ثانية عن [مبادرتك أو إدارتك] في ٥ مشاهد. لكل مشهد: ما نراه، والسطر العربي على الشاشة، وجملة التعليق الصوتي، والحركة. واختم بجملة ختامية قصيرة. أسلوب هادئ أنيق."], ["6.B", "ChatGPT: the first frame", "ChatGPT: الصورة الأولى", "ChatGPT (images)", "Create the image for scene 1 of this script: [paste scene 1]. 16:9, cinematic light, no real faces or logos.", "أنشئ صورة المشهد الأول من هذا النص: [الصق المشهد الأول]. 16:9، وإضاءة سينمائية، دون وجوه أو شعارات حقيقية."], ["6.C", "Bring it to life", "حرّكها", "Higgsfield / Gemini Veo", "Upload the image and use the motion line from Claude's script, for example:\nSlow cinematic push-in, soft light, gentle movement, 5 seconds.\nThen add the ElevenLabs voice from station 5, and music.", "ارفع الصورة واستخدم سطر الحركة من نص Claude، مثلاً:\nSlow cinematic push-in, soft light, gentle movement, 5 seconds.\nثم أضف صوت ElevenLabs من المحطة 5، والموسيقى."]], "id": "6", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 1, "h": 0, "nm": {"ar": "الكود", "en": "Code"}, "sub": {"ar": "برمجة وبناء حلول", "en": "Program and build solutions"}, "tools": {"en": ["Claude", "ChatGPT"], "ar": ["Claude", "ChatGPT"]}, "en": ["Code", "Program and build solutions, without being a programmer", ["Describe the tool you need in plain language", "Claude builds it and shows it working as a page", "ChatGPT Canvas builds and previews it too", "Improve it with short follow-up requests"], "Build the same small tool in Claude and in ChatGPT, and keep the better one.", "", ""], "ar": ["الكود", "برمجة وبناء حلول، دون أن تكون مبرمجاً", ["صِف الأداة التي تحتاجها بلغة عادية", "Claude يبنيها ويعرضها تعمل كصفحة", "ChatGPT Canvas يبنيها ويعرضها أيضاً", "حسّنها بطلبات قصيرة متتالية"], "ابنِ الأداة الصغيرة نفسها في Claude وفي ChatGPT، واحتفظ بالأفضل.", "", ""], "P": [["7.A", "Claude: build a small tool", "Claude: ابنِ أداة صغيرة", "Claude (Artifacts)", "Build me a simple Arabic page, right-to-left, to track my team's weekly tasks: task, owner, due date and status (not started, in progress, done). Add a filter by status, a counter at the top, and five example tasks. Make it work well on a phone.", "ابنِ لي صفحة عربية بسيطة من اليمين إلى اليسار لمتابعة مهام فريقي الأسبوعية: المهمة، والمسؤول، والموعد، والحالة (لم تبدأ، قيد التنفيذ، منجزة). أضف فلتراً حسب الحالة، وعدّاداً في الأعلى، وخمس مهام كمثال. واجعلها تعمل جيداً على الجوال."], ["7.B", "ChatGPT: the same tool in Canvas", "ChatGPT: الأداة نفسها في Canvas", "ChatGPT (Canvas)", "Paste the same prompt into ChatGPT and choose Canvas, then preview the code. Compare it with Claude's on design, accuracy and how easy it is to change.", "الصق الأمر نفسه في ChatGPT واختر Canvas، ثم اعرض الكود. قارنه بنتيجة Claude في التصميم والدقة وسهولة التعديل."]], "id": "7", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 2, "h": 0, "nm": {"ar": "Connector", "en": "Connector"}, "sub": {"ar": "ربط الذكاء بأنظمتك", "en": "Connect AI to your systems"}, "tools": {"en": ["ChatGPT", "Claude", "Gmail", "Google Drive"], "ar": ["ChatGPT", "Claude", "Gmail", "Google Drive"]}, "en": ["Connector", "Connects AI to systems and data such as email, ERP and CRM", ["The assistant reads from the source instead of a copy you paste", "Calendar, email and Drive in both ChatGPT and Claude", "Claude on iPhone: an appointment or a reminder in one sentence", "Never send: names, IDs and contracts stay out"], "Connect your calendar and ask a question only your calendar can answer.", "", ""], "ar": ["Connector", "يربط الذكاء الاصطناعي بالأنظمة والبيانات مثل البريد وCRM وERP", ["المساعد يقرأ من المصدر بدل نسخة تلصقها", "التقويم والبريد وDrive في ChatGPT وClaude", "Claude على الآيفون: موعد أو تذكير بجملة واحدة", "لا يُرسل أبداً: الأسماء والهويات والعقود"], "اربط تقويمك واسأل سؤالاً لا يجيب عنه إلا تقويمك.", "", ""], "P": [["8.A", "Claude: connect and ask", "Claude: اربط واسأل", "Claude → Settings → Connectors", "Connect your calendar or email in Settings → Connectors, then ask:\nFrom my calendar this week, list my meetings, what I need to prepare for each, and which two I could shorten.\nOn iPhone, try: \"Remind me on Thursday at 9 to…\". Claude asks for your approval before every action.", "اربط التقويم أو البريد من الإعدادات ← Connectors، ثم اسأل:\nمن تقويمي هذا الأسبوع، اذكر اجتماعاتي، وما يلزم تحضيره لكل اجتماع، وأي اجتماعين يمكن اختصارهما.\nوعلى الآيفون جرّب: «ذكّرني الخميس الساعة ٩ بـ…». Claude يطلب موافقتك قبل كل إجراء."], ["8.B", "ChatGPT: connect and ask", "ChatGPT: اربط واسأل", "ChatGPT → Settings → Apps / Connectors", "Connect Google Drive or your calendar in ChatGPT, then ask:\nFrom the file [file name] in my Drive, give me the three most important numbers and the date each was last updated. If something is not in the file, say so.", "اربط Google Drive أو التقويم في ChatGPT، ثم اسأل:\nمن الملف [اسم الملف] في Drive، أعطني أهم ثلاثة أرقام وتاريخ آخر تحديث لكل رقم. وإن لم تجد شيئاً في الملف فقل ذلك."]], "id": "8", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 2, "h": 0, "nm": {"ar": "Skill", "en": "Skill"}, "sub": {"ar": "مهارة جاهزة لمهمة محددة", "en": "A ready ability for one task"}, "tools": {"en": ["Claude", "ChatGPT"], "ar": ["Claude", "ChatGPT"]}, "en": ["Skill", "A ready ability for a specific task, such as summarising or analysing data", ["Explain your method once, use it every time", "Claude: built-in skills (Excel, PowerPoint, Word, PDF) and your own skills", "ChatGPT: a Custom GPT or a Project with fixed instructions", "The result comes out the same way every time"], "Turn a task you repeat every week into a Claude skill and a ChatGPT project.", "", ""], "ar": ["Skill", "قدرة أو مهارة جاهزة لمهمة محددة مثل التلخيص أو تحليل البيانات", ["اشرح طريقتك مرة واحدة واستخدمها كل مرة", "Claude: مهارات جاهزة (Excel وPowerPoint وWord وPDF) ومهاراتك أنت", "ChatGPT: GPT مخصص أو مشروع (Project) بتعليمات ثابتة", "النتيجة تخرج بالطريقة نفسها كل مرة"], "حوّل مهمة تكررها كل أسبوع إلى مهارة في Claude ومشروع في ChatGPT.", "", ""], "P": [["9.A", "Claude: build your own skill", "Claude: ابنِ مهارتك", "Claude (Skills)", "I write a weekly report for my manager every Thursday. Turn my method into a skill called weekly-report: a one-line description of when to use it, the sections in order (achievements, numbers, risks, next week), the maximum length, the tone, and three things never to do. Write it as a SKILL.md, then I will save it under Settings → Skills.", "أكتب تقريراً أسبوعياً لمديري كل خميس. حوّل طريقتي إلى مهارة باسم weekly-report: وصف من سطر واحد لمتى تُستخدم، والأقسام بالترتيب (الإنجازات، والأرقام، والمخاطر، والأسبوع القادم)، والحد الأقصى للطول، والنبرة، وثلاثة أشياء لا تُفعل أبداً. اكتبها كملف SKILL.md، ثم سأحفظها من الإعدادات ← Skills."], ["9.B", "ChatGPT: the same method as a Project", "ChatGPT: الطريقة نفسها كمشروع", "ChatGPT (Projects)", "Create a Project called \"Weekly report\" and paste the same rules into its instructions. Every Thursday, open the project and say: \"Here are this week's notes: [notes]. Write the report.\"", "أنشئ مشروعاً باسم «التقرير الأسبوعي» والصق القواعد نفسها في تعليماته. وكل خميس افتح المشروع وقل: «هذه ملاحظات الأسبوع: [الملاحظات]. اكتب التقرير.»"]], "id": "9", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 2, "h": 0, "nm": {"ar": "Extension", "en": "Extension"}, "sub": {"ar": "داخل المتصفح وOffice", "en": "In the browser and in Office"}, "tools": {"en": ["Claude", "ChatGPT"], "ar": ["Claude", "ChatGPT"]}, "en": ["Extension / Cloud Extension", "Adds to a tool's abilities and links it to cloud services and apps", ["Claude in Chrome: the assistant inside your browser", "ChatGPT's browser and agent work on websites too", "Claude inside Excel and PowerPoint", "It acts only on the sites and files you allow"], "Compare three public pages with the assistant working inside the browser.", "", ""], "ar": ["Extension / Cloud Extension", "إضافة توسّع قدرات الأداة وتربطها بخدمات وتطبيقات سحابية", ["Claude in Chrome: المساعد داخل متصفحك", "متصفح ChatGPT ووكيله يعملان على المواقع أيضاً", "Claude داخل Excel وPowerPoint", "يتصرف فقط في المواقع والملفات التي تسمح بها"], "قارن ثلاث صفحات عامة والمساعد يعمل داخل المتصفح.", "", ""], "P": [["10.A", "Claude in Chrome", "Claude in Chrome", "Claude in Chrome", "Open three public pages about [topic] in separate tabs, then ask:\nCompare these three pages in a table: what each offers, for whom, and the cost if mentioned. Then tell me which one fits [my need].", "افتح ثلاث صفحات عامة عن [الموضوع] في تبويبات منفصلة، ثم اسأل:\nقارن هذه الصفحات الثلاث في جدول: ماذا تقدّم كل صفحة، ولمن، والتكلفة إن ذُكرت. ثم أخبرني أيها يناسب [حاجتي]."], ["10.B", "ChatGPT in the browser", "ChatGPT في المتصفح", "ChatGPT (browser / agent)", "Give ChatGPT the same task with its browser or agent mode, and watch it open the pages itself. Compare the two tables: which is more accurate, and which cited its sources?", "أعطِ ChatGPT المهمة نفسها عبر متصفحه أو وضع الوكيل، وشاهده يفتح الصفحات بنفسه. قارن الجدولين: أيهما أدق، وأيهما ذكر مصادره؟"]], "id": "10", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 2, "h": 0, "nm": {"ar": "Co-worker", "en": "Co-worker"}, "sub": {"ar": "زميل ذكي يصل لملفاتك", "en": "A colleague with access to your files"}, "tools": {"en": ["Claude", "ChatGPT"], "ar": ["Claude", "ChatGPT"]}, "en": ["Co-worker", "An AI assistant that works with you and reaches the files and information you allow", ["Give it a folder and a goal, not one question", "Claude Cowork reads the files and produces the output", "ChatGPT: a Project with your files and its instructions", "It shows you the plan first; you approve"], "Give the co-worker one folder and ask for a ready meeting pack.", "", ""], "ar": ["Co-worker", "مساعد ذكي يتعاون معك ويصل إلى الملفات والمعلومات المسموح بها", ["أعطه مجلداً وهدفاً، لا سؤالاً واحداً", "Claude Cowork يقرأ الملفات ويُخرج النتيجة", "ChatGPT: مشروع (Project) فيه ملفاتك وتعليماته", "يعرض عليك الخطة أولاً، وأنت توافق"], "أعطِ الزميل الذكي مجلداً واحداً واطلب حزمة اجتماع جاهزة.", "", ""], "P": [["11.A", "Claude Cowork: the meeting pack", "Claude Cowork: حزمة الاجتماع", "Claude (Cowork)", "In the folder [folder name] are the documents for next week's meeting with [the partner]. Read them and prepare: a one-page brief, the five decisions needed, the open questions, and a short agenda. Show me your plan before you start, and do not delete or change any original file.", "في المجلد [اسم المجلد] مستندات اجتماع الأسبوع القادم مع [الشريك]. اقرأها وأعدّ: موجزاً من صفحة واحدة، والقرارات الخمسة المطلوبة، والأسئلة المفتوحة، وجدول أعمال قصيراً. اعرض عليّ خطتك قبل البدء، ولا تحذف أو تغيّر أي ملف أصلي."], ["11.B", "ChatGPT: a Project with your files", "ChatGPT: مشروع بملفاتك", "ChatGPT (Projects)", "Create a Project for the partner, upload the same non-confidential documents, and ask the same request. Which result needed fewer corrections?", "أنشئ مشروعاً للشريك، وارفع المستندات نفسها غير السرية، واطلب الطلب نفسه. أي نتيجة احتاجت تعديلات أقل؟"]], "id": "11", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 3, "h": 0, "nm": {"ar": "الـ Agent", "en": "The Agent"}, "sub": {"ar": "مساعدٌ لا ينام", "en": "An assistant that never sleeps"}, "tools": {"en": ["ChatGPT", "Claude", "Manus"], "ar": ["ChatGPT", "Claude", "Manus"]}, "en": ["The Agent", "Understands the goal, chooses the right tool, executes the steps and follows up on the result", ["1 Understands  2 Plans  3 Executes  4 Follows up and improves", "Give it one goal with several steps", "An assistant that never sleeps: \"every day at 7 a.m.…\"", "It stops and asks before any purchase or message in your name"], "Give an agent one multi-step goal, then schedule a task that reaches you tomorrow at 7 a.m.", "", ""], "ar": ["الـ Agent", "يفهم الهدف، ويختار الأداة المناسبة، وينفّذ الخطوات، ويتابع النتيجة", ["١ يفهم المطلوب  ٢ يخطط  ٣ ينفّذ  ٤ يتابع ويحسّن", "أعطه هدفاً واحداً بعدة خطوات", "مساعدٌ لا ينام: «كل يوم في السابعة صباحاً…»", "يتوقف ويسألك قبل أي شراء أو رسالة باسمك"], "أعطِ الوكيل هدفاً بعدة خطوات، ثم جدول مهمة تصلك غداً في السابعة صباحاً.", "", ""], "P": [["12.A", "ChatGPT agent: one goal, many steps", "وكيل ChatGPT: هدف بعدة خطوات", "ChatGPT (agent mode)", "Goal: prepare a benchmark of five AI training programmes for government employees in the GCC.\n1. Tell me what you understood and ask me two questions.\n2. Show me your plan in steps.\n3. Search, collect and compare: name, country, duration, topics, delivery method, source link.\n4. Deliver a table and three recommendations, marking anything you could not verify.\nStop and ask me before any purchase, sign-up or message sent on my behalf.", "الهدف: إعداد مقارنة لخمسة برامج تدريبية في الذكاء الاصطناعي لموظفي الحكومات في الخليج.\n١. أخبرني بما فهمته واسألني سؤالين.\n٢. اعرض عليّ خطتك بالخطوات.\n٣. ابحث واجمع وقارن: الاسم، والدولة، والمدة، والمحاور، وطريقة التقديم، ورابط المصدر.\n٤. سلّم جدولاً وثلاث توصيات، وميّز ما لم تتحقق منه.\nتوقف واسألني قبل أي شراء أو تسجيل أو رسالة تُرسل باسمي."], ["12.B", "Claude: follow up and improve", "Claude: تابع وحسّن", "Claude (research)", "Give Claude the same goal with research on. Then ask it: which source is weakest, which comparison is unfair, and what would you change with one more hour? Produce the improved version.", "أعطِ Claude الهدف نفسه مع تفعيل البحث. ثم اسأله: أي مصدر هو الأضعف، وأي مقارنة غير عادلة، وماذا ستغيّر لو كان لديك ساعة إضافية؟ وأخرج النسخة المحسّنة."], ["12.C", "An assistant that never sleeps", "مساعدٌ لا ينام", "ChatGPT (Tasks) · Claude (scheduled tasks)", "In ChatGPT: \"Every day at 7 a.m., send me a brief of the most important news in [my field] in 5 points, with their sources.\" It arrives as a notification (Plus or higher).\nIn Claude: create the same as a scheduled task, or on iPhone say: \"Remind me on Thursday at 9 to…\"", "في ChatGPT: «كل يوم الساعة ٧ صباحاً أرسل لي موجزاً بأهم أخبار [مجالي] في ٥ نقاط مع مصادرها.» يصلك إشعاراً (Plus أو أعلى).\nفي Claude: أنشئ الشيء نفسه كمهمة مجدولة، أو قل على الآيفون: «ذكّرني الخميس الساعة ٩ بـ…»"]], "id": "12", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}, {"day": 3, "h": 0, "nm": {"ar": "كيف تستفيد أنت؟", "en": "How do you benefit?"}, "sub": {"ar": "التحدي والخطة", "en": "The challenge and the plan"}, "tools": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}, "en": ["How do you benefit?", "Faster, less effort, higher quality, connected tools, smart solutions", ["The challenge: a real task from your day, start to finish", "You leave with four things: an assistant that knows you, 5 saved prompts, a reminder, a daily habit", "One task a day for 30 days", "AI does not read for us; it gives us back the time to read more"], "Finish one real task from your day with ChatGPT or Claude, then set your 30-day plan.", "", ""], "ar": ["كيف تستفيد أنت؟", "تنجز أسرع، وتقلل الجهد، وترفع الجودة، وتربط أدواتك، وتبني حلولاً ذكية", ["التحدي: مهمة حقيقية من يومك، من أولها لآخرها", "تخرج بأربعة أشياء: مساعد يعرفك، و٥ توجيهات محفوظة، وتذكير، وعادة يومية", "مهمة واحدة يومياً لمدة ٣٠ يوماً", "«لا يقرأ عنّا… بل يردّ إلينا الوقت لنقرأ أكثر»"], "أنجز مهمة حقيقية من يومك مع ChatGPT أو Claude، ثم ضع خطتك لثلاثين يوماً.", "", ""], "P": [["13.A", "The challenge", "التحدي", "ChatGPT · Claude", "1. Choose a task waiting for you this week.\n2. Say it in the five parts, by voice, in ChatGPT or Claude.\n3. Add a photo or a file if you need to.\n4. Save the result, and set a reminder for the next step.", "١. اختر مهمة تنتظرك هذا الأسبوع.\n٢. قلها بالعناصر الخمسة بصوتك في ChatGPT أو Claude.\n٣. أضف صورة أو ملفاً إن احتجت.\n٤. احفظ النتيجة، وضع تذكيراً للخطوة التالية."], ["13.B", "My 30-day plan", "خطتي لثلاثين يوماً", "Claude / ChatGPT", "Today I went through the map: prompts, text, image, voice, video, code, Connector, Skill, Extension, Co-worker and Agent. Ask me about my role first. Then help me choose three tasks from my real work to move to AI in the next 30 days. For each: which part of the map, ChatGPT or Claude, the first prompt, the time I expect to save per week, and what I will always check myself. Finally, write my five most useful prompts, ready to save in my phone notes.", "اليوم مررت على الخريطة: الأوامر، والنص، والصورة، والصوت، والفيديو، والكود، وConnector، وSkill، وExtension، وCo-worker، والـ Agent. اسألني عن دوري أولاً. ثم ساعدني أختار ثلاث مهام من عملي الفعلي أنقلها إلى الذكاء الاصطناعي خلال 30 يوماً. لكل مهمة: أي جزء من الخريطة، وChatGPT أم Claude، وأول أمر، والوقت المتوقع توفيره أسبوعياً، وما سأراجعه بنفسي دائماً. وأخيراً اكتب توجيهاتي الخمسة الأكثر فائدة جاهزة للحفظ في ملاحظات جوالي."]], "id": "13", "wide": false, "br": {"en": ["ChatGPT", "Claude"], "ar": ["ChatGPT", "Claude"]}}], "LOGO": {"ChatGPT": "data:image/svg+xml;base64,PHN2ZyBmaWxsPSJjdXJyZW50Q29sb3IiIGZpbGwtcnVsZT0iZXZlbm9kZCIgaGVpZ2h0PSIxZW0iIHN0eWxlPSJmbGV4Om5vbmU7bGluZS1oZWlnaHQ6MSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iMWVtIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuQUk8L3RpdGxlPjxwYXRoIGQ9Ik05LjIwNSA4LjY1OHYtMi4yNmMwLS4xOS4wNzItLjMzMy4yMzgtLjQyOGw0LjU0My0yLjYxNmMuNjE5LS4zNTcgMS4zNTYtLjUyMyAyLjExNy0uNTIzIDIuODU0IDAgNC42NjIgMi4yMTIgNC42NjIgNC41NjYgMCAuMTY3IDAgLjM1Ny0uMDI0LjU0N2wtNC43MS0yLjc1OWEuNzk3Ljc5NyAwIDAwLS44NTYgMGwtNS45NyAzLjQ3M3ptMTAuNjA5IDguOFYxMi4wNmMwLS4zMzMtLjE0My0uNTctLjQyOS0uNzM3bC01Ljk3LTMuNDczIDEuOTUtMS4xMThhLjQzMy40MzMgMCAwMS40NzYgMGw0LjU0MyAyLjYxN2MxLjMwOS43NiAyLjE4OSAyLjM3OCAyLjE4OSAzLjk0OCAwIDEuODA4LTEuMDcgMy40NzMtMi43NiA0LjE2M3pNNy44MDIgMTIuNzAzbC0xLjk1LTEuMTQyYy0uMTY3LS4wOTUtLjIzOS0uMjM4LS4yMzktLjQyOFY1Ljg5OWMwLTIuNTQ1IDEuOTUtNC40NzIgNC41OTEtNC40NzIgMSAwIDEuOTI3LjMzMyAyLjcxMi45MjhMOC4yMyA1LjA2N2MtLjI4NS4xNjYtLjQyOC40MDQtLjQyOC43Mzd2Ni44OTh6TTEyIDE1LjEyOGwtMi43OTUtMS41N3YtMy4zM0wxMiA4LjY1OGwyLjc5NSAxLjU3djMuMzNMMTIgMTUuMTI4em0xLjc5NiA3LjIzYy0xIDAtMS45MjctLjMzMi0yLjcxMi0uOTI3bDQuNjg2LTIuNzEyYy4   h+=`<div class="st ${cls} ${s.wide?"wide":""}" style="left:${x/12}%;top:${y/VBH*100}%"><div class="ttl">${s.id===cur?`<span class="here-tag">${t.here}</span>`:""}<b>${esc(s.nm[lang])}</b><span>${esc(s.sub[lang])}</span></div><button type="button" data-st="${s.id}" aria-label="${esc(s.nm[lang])}" style="background:none;border:0;padding:0">${dotHTML(s)}</button>${ch}</div>`;});
 return h+`</div>`;}
function listHTML(u,t,cur){let h=`<div class="list">`;[1,2,3].forEach(d=>{h+=`<div class="lday"><b>${t.days[d]}</b><span>${t.dsub[d]}</span></div>`;
  ST.filter(s=>s.day===d).forEach(s=>{h+=`<button type="button" class="li ${u.done[s.id]?"done":""}" data-st="${s.id}">${dotHTML(s)}<span class="tx"><b>${esc(s.nm[lang])}${s.id===cur?`<span class="tg">${t.here}</span>`:""}</b><span>${esc(s.sub[lang])}</span>${s.br?`<span class="cl">${s.br[lang].map(b=>`<i>${esc(b)}</i>`).join("")}</span>`:""}</span></button>`;});});
 return h+`</div>`;}

function packHTML(d){const t=T[lang],ar=lang==="ar";const sts=ST.filter(s=>s.day===d&&s.P.length);
 return `<!DOCTYPE html><html lang="${lang}" dir="${t.dir}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${t.packT(d)} | ${t.h1}</title>
 <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
 <style>body{font-family:${ar?'"IBM Plex Sans Arabic","IBM Plex Sans"':'"IBM Plex Sans","IBM Plex Sans Arabic"'},Tahoma,sans-serif;color:#16211F;margin:0;background:#F6F1E8}.w{max-width:820px;margin:0 auto;padding:24px}
 header{display:flex;align-items:center;gap:14px;border-bottom:3px solid #A8703F;padding-bottom:12px;margin-bottom:16px}header img{height:54px;background:#fff;border-radius:10px;padding:4px 8px}h1{margin:0;font-size:1.6rem}header p{margin:2px 0 0;color:#6B7A76}
 .st{background:#fff;border:1px solid #E3DACB;border-radius:14px;padding:14px 16px;margin-bottom:14px;break-inside:avoid}.st h2{margin:0 0 4px;font-size:1.15rem;color:#163832}.st .tl{color:#A8703F;font-weight:600;font-size:.85rem}
 .p{border-top:1px solid #E3DACB;padding:10px 0;break-inside:avoid}.p b{color:#A8703F}.p small{display:block;color:#6B7A76}.p div{white-space:pre-wrap;line-height:1.65;background:#F6F1E8;border-radius:8px;padding:8px 10px;margin-top:6px}
 .bar{display:flex;justify-content:flex-end;margin-bottom:12px}.bar button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:#163832;color:#fff;cursor:pointer}
 footer{color:#6B7A76;font-size:.8rem;text-align:center;margin-top:18px}@media print{.bar{display:none}body{background:#fff}}</style></head><body><div class="w">
 <div class="bar"><button onclick="window.print()">${t.print}</button></div>
 <header><img src="${document.querySelector("#logo img").src}" alt="Qoura AI"><div><h1>${t.packT(d)}</h1><p>${t.h1} · ${t.days[d]}</p></div></header>
 ${sts.map(s=>`<section class="st"><h2>${s.id}. ${esc(s.nm[lang])}</h2><div class="tl">${esc(s.tools[lang].join(" · "))}</div>${s.P.map(p=>`<div class="p"><b><bdi>${p[0]}</bdi></b> ${esc(ar?p[2]:p[1])}<small>${t.runIn}: ${esc(p[3])}</small><div>${esc(ar?p[5]:p[4])}</div></div>`).join("")}</section>`).join("")}
 <footer>${t.foot}</footer></div></body></html>`;}
async function savePack(d){const t=T[lang],html=packHTML(d),name=`${lang==="ar"?"أوامر-اليوم":"Day"}-${d}-prompts.html`;
 const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));const w=window.open(url,"_blank");if(!w){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}}

function renderTrainer(t){$("kick").textContent=t.kick+" · "+t.tv;
 if(TRAINER_PIN&&!S.tok){$("app").innerHTML=`<div class="card narrow"><h2>${t.tv}</h2><label for="pinI"><b>${t.pin}</b></label><input id="pinI" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px"><p class="note" id="pinE" hidden>${t.pinBad}</p><button class="btn" type="button" id="pinB">${t.enter}</button></div>`;
  const go=()=>{if($("pinI").value===TRAINER_PIN){S.tok=1;save();render();}else $("pinE").hidden=false;};$("pinB").onclick=go;$("pinI").onkeydown=e=>{if(e.key==="Enter")go();};return;}
 const u={done:{}};const cur=S.tcur||"1";const i=ST.findIndex(x=>x.id===cur);ST.slice(0,i).forEach(x=>u.done[x.id]=true);const cs=ST[i],nx=ST[i+1];
 $("app").innerHTML=`<div class="top"><div class="here"><div class="col"><small>${t.here} · ${t.days[cs.day]}</small><b><span class="hn">${cs.id}</span>${esc(cs.nm[lang])}</b></div><span class="sep"></span><div class="col"><small>${t.next}</small><b>${nx?`<span class="hn">${nx.id}</span>${esc(nx.nm[lang])}`:"—"}</b></div></div>
 <div class="card" style="margin:0;display:flex;gap:8px;align-items:center"><button class="btn alt" type="button" id="tp" style="margin:0" ${i===0?"disabled":""}>${lang==="ar"?"→":"←"} ${t.prevSt}</button><button class="btn" type="button" id="tn" style="margin:0" ${nx?"":"disabled"}>${t.nextSt} ${lang==="ar"?"←":"→"}</button></div></div>
 ${mapHTML(u,t,cur)}${listHTML(u,t,cur)}`;
 $("tp").onclick=()=>{S.tcur=ST[Math.max(0,i-1)].id;save();render();};$("tn").onclick=()=>{if(nx){S.tcur=nx.id;save();render();}};
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>openStation(b.dataset.st));}

function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir;
 ["kick","h1","hp","foot"].forEach(k=>$(k).textContent=t[k]);$("lang").textContent=t.lang;
 if(MODE==="trainer"){renderTrainer(t);return;}
 const u=me(),max=stage(u);let st=S.view!=null?Math.min(S.view,max):max;if(st<MINST())st=MINST();let h="";
 if(S.tm)h+=`<div class="tmode"><div class="r"><b>${t.tm}</b><button class="mini" type="button" id="tmoff">${t.close}</button></div>${LOCK()?`<select id="sim"><option value="">${t.tmReal} (${realToday()})</option>${[1,2,3].map(d=>`<option value="${d}" ${S.sim==d?"selected":""}>${t.tmD(d)}</option>`).join("")}</select>`:""}<select id="tms">${t.scen.map((x,i)=>`<option value="${i}">${x}</option>`).join("")}</select><button class="mini" type="button" id="tmr">${t.tmReset}</button><button class="mini" type="button" id="tma">${t.tmAll}</button></div>`;
 const nav=()=>`<div class="navrow">${st>MINST()?`<button class="mini" type="button" id="back">${t.back}</button>`:"<span></span>"}${st<max?`<button class="mini" type="button" id="fwd">${t.fwd}</button>`:""}</div>`;
 if(st===1){h+=(max>1?nav():"")+survey("pre",t,u);}
 else if(st===2){const n=doneN(u),p=pct(u),cur=curId(u),cs=ST.find(s=>s.id===cur),nx=ST[ST.indexOf(cs)+1],d=LOCK()?todayDay():cs.day;
  const matsDay=x=>`<button class="btn alt" type="button" data-pack="${x}">⬇ ${t.packAll(x)}</button>${linksHTML(DAY_MATERIALS[x],t)}`;
  const postCard=postOpen()?`<div class="card narrow postcard"><h2>📝 ${t.postTop}</h2><p class="sub">${t.postTopS}</p>${FORM_MODE==="external"&&ready(FORMS.post)?`<a class="btn cu" id="postlink" href="${esc(FORMS.post)}" target="_blank" rel="noopener">${t.postgo} ↗</a><button class="btn ${u.postOpened?"gr":"alt"}" type="button" id="postok" ${u.postOpened?"":"disabled"}>${t.postdone}</button>${u.postOpened?"":`<p class="note" style="text-align:center">${t.postFirst}</p>`}`:`<button class="btn" type="button" id="topost">${t.postgo}</button>`}</div>`:"";
  h+=nav()+postCard+`<div class="top"><div class="here"><div class="col"><small>${t.here} · ${t.days[cs.day]}</small><b><span class="hn">${cs.id}</span>${esc(cs.nm[lang])}</b></div><span class="sep"></span><div class="col"><small>${t.next}</small><b>${nx?`<span class="hn">${nx.id}</span>${esc(nx.nm[lang])}`:"—"}</b></div></div>
  <div class="card" style="margin:0"><div class="prog"><b>${t.prog}</b><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div><p class="note" style="margin:4px 0 0">${t.stOf(n,NST)}</p>
  <div class="today">${d?`${dayDone(u,d)?`<b style="margin-top:4px">${t.dm} · ${t.days[d]}</b><button class="btn" type="button" data-pack="${d}">⬇ ${t.pack}</button><p class="note" style="margin:2px 0 0">${t.packHint}</p>${linksHTML(DAY_MATERIALS[d],t)}`:`<p class="note">🔒 ${t.dmLock}</p>`}`:""}
  ${[1,2,3].filter(x=>x!==d&&dayDone(u,x)).map(x=>`<details><summary class="note">${t.dm} · ${t.days[x]}</summary>${matsDay(x)}</details>`).join("")}
  ${KIT.length?`<details class="kit"><summary><b>${t.kit}</b></summary><p class="note" style="margin:4px 0 0">${t.kitHint}</p>${linksHTML(KIT.filter(k=>dayOpen(k.day||1)),t)}</details>`:""}</div></div></div>
  ${mapHTML(u,t,cur)}${listHTML(u,t,cur)}
  <div class="legend"><span><i style="background:#2F5D4E"></i>${t.lg[0]}</span><span><i style="background:var(--c)"></i>${t.lg[1]}</span><span><i style="border:2px solid var(--rope)"></i>${t.lg[2]}</span></div>
`;}
 else if(st===3){h+=nav()+survey("post",t,u);}
 else{h+=nav()+`<div class="card narrow"><div class="big">🎉</div><h2 style="text-align:center">${t.ty}</h2><p class="sub" style="text-align:center">${t.tys}</p>${[1,2,3].map(d=>`<button class="btn alt" type="button" data-pack="${d}">⬇ ${t.packAll(d)}</button>`).join("")}${linksHTML([...[1,2,3].flatMap(d=>DAY_MATERIALS[d]),...KIT,...MATERIALS],t)}</div>`;}
 $("app").innerHTML=h;bind(t,u,st);}
function openStation(id){S.sel=id;save();const u=MODE==="trainer"?{done:{}}:me(),t=T[lang],s=ST.find(x=>x.id===id);$("dp").innerHTML=stationPanel(s,u,t);$("dr").hidden=false;
 $("dclose").onclick=closeDr;$("dclose").focus();$("dclose2").onclick=closeDr;
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.i],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copiedP;setTimeout(()=>b.textContent=t.copyP,1500);});
 const tk=$("tk");if(tk)tk.onchange=e=>{u.done[id]=e.target.checked;save();send("station",{id,done:e.target.checked});render();};}
function closeDr(){$("dr").hidden=true;render();}
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("dr").hidden)closeDr();});
function bind(t,u,st){const q=i=>$(i);
 if(q("back"))q("back").onclick=()=>{S.view=st-1;save();render();scrollTo(0,0);};if(q("fwd"))q("fwd").onclick=()=>{S.view=st+1;save();render();scrollTo(0,0);};
 const kind=st===1?"pre":"post",key=kind==="pre"?"preOpened":"postOpened";
 if(q("openf"))q("openf").addEventListener("click",()=>{u[key]=true;save();send(kind+"Opened",{});setTimeout(render,400);});
 if(q("sdone"))q("sdone").onclick=()=>{u[kind]=true;S.view=kind==="pre"?2:4;save();send(kind,{mode:"external"});render();scrollTo(0,0);};
 if(q("sf"))q("sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),need=QS.pre.length+(kind==="post"?QS.fb.length:0),a=Object.fromEntries(f.entries());
  if(Object.keys(a).filter(k=>k!=="c").length<need){q("serr").hidden=false;return;}u[kind]=true;u[kind+"Ans"]=a;S.view=kind==="pre"?2:4;save();send(kind,{answers:a});render();scrollTo(0,0);};
 document.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>savePack(+b.dataset.pack));
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>openStation(b.dataset.st));
 if(q("topost"))q("topost").onclick=()=>{S.view=3;save();render();scrollTo(0,0);};
 if(q("postlink"))q("postlink").addEventListener("click",()=>{u.postOpened=true;save();send("postOpened",{});setTimeout(render,400);});
 if(q("postok"))q("postok").onclick=()=>{u.post=true;u.postOpened=true;S.view=4;save();send("post",{mode:"external"});render();scrollTo(0,0);};
 if(q("sim"))q("sim").onchange=e=>{S.sim=e.target.value?+e.target.value:null;S.sel=null;save();render();};
 if(q("tmoff"))q("tmoff").onclick=()=>{S.tm=false;S.sim=null;save();render();};
 if(q("tms"))q("tms").onchange=e=>{const k=+e.target.value;if(!k)return;const x=me();x.pre=k>=2;x.post=k>=6;x.preOpened=x.pre;x.postOpened=x.post;x.done={};
  const upto=k===3?1:k===4?2:k>=5?3:0;ST.filter(s=>s.day<=upto).forEach(s=>x.done[s.id]=true);if(k>=5&&LOCK()&&!S.sim)S.sim=3;S.view=null;S.sel=null;save();render();};
 if(q("tmr"))q("tmr").onclick=()=>{delete S.u;me();S.view=null;S.sel=null;save();render();};
 if(q("tma"))q("tma").onclick=()=>{if(confirm(t.tmAsk)){S={tm:true};save();render();}};}
document.addEventListener("keydown",e=>{if(MODE!=="trainer"||!$("dr").hidden)return;const rtl=lang==="ar";if(e.key===(rtl?"ArrowLeft":"ArrowRight"))$("tn")&&$("tn").click();if(e.key===(rtl?"ArrowRight":"ArrowLeft"))$("tp")&&$("tp").click();});
let taps=0,tt=null;$("logo").onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;S.tm=true;save();render();}};
const sysDark=()=>!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
let theme=null;try{theme=localStorage.getItem("qai-theme")}catch(e){}
function applyTheme(){const dark=theme?theme==="dark":sysDark();document.documentElement.setAttribute("data-theme",dark?"dark":"light");$("thm").textContent=dark?"☀":"☾";$("thm").title=lang==="ar"?(dark?"الوضع الفاتح":"الوضع الداكن"):(dark?"Light mode":"Dark mode");}
$("thm").onclick=()=>{theme=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";try{localStorage.setItem("qai-theme",theme)}catch(e){}applyTheme();};applyTheme();
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render();applyTheme();if(!$("dr").hidden&&S.sel)openStation(S.sel);};render();
let wasPost=postOpen();setInterval(()=>{const n=postOpen();if(n!==wasPost){wasPost=n;if($("dr").hidden)render();}},30000);
</script>
</body></html>
