<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhatsApp (offline test page)</title>
<!--
  Offline stand-in for WhatsApp Web used by `wa-watch selftest` and the tests.
  It mimics the parts of the real DOM the reader relies on (#side, #pane-side,
  role="listitem" rows, span[title], unread badges, filters, #main bubbles with
  data-pre-plain-text, the right-click menu). No network, no real data.
  ?state=qr shows the login page, ?state=loading never finishes loading.
-->
<style>
  body { margin: 0; font: 14px -apple-system, Segoe UI, Arial, sans-serif; background: #f0f2f5; }
  #app { display: flex; height: 100vh; }
  #side { width: 420px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #ddd; }
  .filters { display: flex; gap: 8px; padding: 10px; }
  .filters button { border: 0; border-radius: 16px; padding: 6px 12px; background: #eee; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: #d9fdd3; }
  #pane-side { flex: 1; overflow-y: auto; position: relative; }
  .grid { position: relative; }
  .row { position: absolute; left: 0; right: 0; height: 72px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
  .avatar { width: 49px; height: 49px; border-radius: 50%; background: #ccc; margin: 0 12px; flex: none; }
  .body { flex: 1; min-width: 0; padding-right: 12px; }
  .line1, .line2 { display: flex; justify-content: space-between; align-items: center; }
  .name { font-size: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .time { font-size: 12px; color: #667781; }
  .preview { color: #667781; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
  .badge { background: #25d366; color: #fff; border-radius: 10px; padding: 0 6px; font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; background: #25d366; border-radius: 50%; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #main header { padding: 12px; background: #fff; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; }
  .message-in, .message-out { margin: 6px 0; padding: 6px 10px; border-radius: 8px; max-width: 70%; }
  .message-in { background: #fff; }
  .message-out { background: #d9fdd3; margin-left: auto; }
  #menu { position: fixed; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #menu ul { list-style: none; margin: 0; padding: 6px 0; }
  #menu li { padding: 8px 20px; cursor: pointer; }
  .landing { margin: 60px auto; width: 600px; background: #fff; padding: 40px; }
</style>
</head>
<body>
<div id="root"><div class="loading">Loading your chats…</div></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const mode = params.get('state') || 'app';
  const ROW = 72;

  // name, time, unread, marked, muted, pinned, group, fromMe, sender, preview, messages
  const C = (o) => Object.assign({ unread: 0, marked: false, muted: false, pinned: false, group: false,
                                    fromMe: false, sender: '', icon: false, messages: [] }, o);
  const chats = [
    C({ name: 'Mom', time: 'Monday', pinned: true, preview: 'الله يحفظك' }),
    C({ name: 'Project Team', time: '2:05 AM', unread: 12, group: true, sender: 'Ali',
        preview: 'الاجتماع بكرة الساعة 10 صباحاً',
        messages: [['Ali', '1:50 AM', 'تذكير: الاجتماع بكرة الساعة 10 صباحاً'], ['Ali', '2:05 AM', 'الاجتماع بكرة الساعة 10 صباحاً']] }),
    C({ name: 'Khalid', time: '1:58 AM', unread: 3,
        preview: 'ضروري نتكلم بخصوص العقد قبل الساعة 10 الصبح',
        messages: [['Khalid', '1:40 AM', 'السلام عليكم، شلونك؟'], ['Khalid', '1:45 AM', 'وصلتني ملاحظات على العقد'],
                   ['Khalid', '1:58 AM', 'ضروري نتكلم بخصوص العقد قبل الساعة 10 الصبح']] }),
    C({ name: 'Neighbourhood Council', time: '1:10 AM', unread: 30, group: true, muted: true, sender: 'Hassan', preview: 'صور الفعالية' }),
    C({ name: 'Majid', time: '12:40 AM', unread: 1, preview: 'تم إرسال الملف، شيك عليه لو سمحت',
        messages: [['Majid', '12:40 AM', 'تم إرسال الملف، شيك عليه لو سمحت']] }),
    C({ name: 'Program Cohort', time: '11:50 PM', unread: 5, group: true, sender: 'Noura',
        preview: '@Abdulla نحتاج موافقتك على جدول الإرشاد' }),
    C({ name: '+971 50 123 4567', time: '11:15 PM', unread: 2,
        preview: "Hello Mr. Abdulla, I'd like to book a meeting about AI training for our team",
        messages: [['+971 50 123 4567', '11:14 PM', 'Hello Mr. Abdulla'], ['+971 50 123 4567', '11:15 PM', "I'd like to book a meeting about AI training for our team"]] }),
    C({ name: 'Hackathon Team', time: '10:45 PM', unread: 2, group: true, icon: true, preview: 'رفعنا العرض النهائي للمشروع' }),
    C({ name: 'Reem', time: '10:05 PM', unread: 1, preview: 'هل نعتمد العرض بصيغته الحالية؟',
        messages: [['Reem', '10:05 PM', 'هل نعتمد العرض بصيغته الحالية؟']] }),
    C({ name: 'Saif', time: '9:30 PM', marked: true, preview: 'تمام، نتواصل' }),
    C({ name: 'Maryam', time: '8:40 PM', preview: 'ننتظر ردك على العرض' }),
    C({ name: "Yousef (Office)", time: '7:15 PM', preview: 'متى نقدر نجتمع؟' }),
    C({ name: 'Noura', time: '6:20 PM', fromMe: true, preview: 'أرسلت لك التفاصيل' }),
    C({ name: 'Clients Group', time: '5:00 PM', group: true, sender: 'Huda', preview: 'شكراً على الورشة' }),
    C({ name: 'Faisal', time: 'Yesterday', unread: 4, preview: 'الدفعة الثانية جاهزة للتحويل، أحتاج توقيعك',
        messages: [['Faisal', '6:02 PM', 'الدفعة الثانية جاهزة للتحويل، أحتاج توقيعك']] }),
    C({ name: 'Family Group', time: 'Yesterday', unread: 9, group: true, muted: true, sender: '~ Fatima', preview: '😂😂' }),
    C({ name: 'Partner Org', time: 'Yesterday', fromMe: true, preview: 'أكيد، أشوفكم الأحد' }),
    C({ name: 'Old Friend', time: 'Monday', unread: 1, preview: 'وينك يا رجال 😄' }),
  ];
  const filler = ['Sunday', 'Sunday', 'Saturday', 'Saturday', 'Friday', 'Friday', 'Thursday', 'Thursday',
                  '11/11/2026', '11/10/2026', '11/9/2026', '11/8/2026', '11/7/2026', '11/6/2026', '11/5/2026',
                  '11/4/2026', '11/3/2026', '11/2/2026'];
  filler.forEach((t, i) => chats.push(C({ name: `Contact ${i + 1}`, time: t, fromMe: i % 2 === 0,
                                           group: i % 3 === 0, sender: i % 3 === 0 ? 'Someone' : '',
                                           preview: `older message ${i + 1}` })));

  let filter = 'all';
  let openChat = null;
  const root = document.getElementById('root');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function visibleChats() {
    if (filter === 'unread') return chats.filter((c) => c.unread > 0 || c.marked || c === openChat);
    if (filter === 'groups') return chats.filter((c) => c.group);
    return chats;
  }

  function rowHtml(c, i) {
    const status = c.fromMe ? '<span data-icon="status-dblcheck" aria-label=" Read "></span>' : '';
    const sender = c.sender ? `<span dir="auto">${esc(c.sender)}</span><span>: </span>` : '';
    const badge = c.unread ? `<span aria-label="${c.unread} unread message${c.unread > 1 ? 's' : ''}"><span class="badge">${c.unread}</span></span>`
                           : (c.marked ? '<span aria-label="Unread" class="dot"></span>' : '');
    return `<div role="listitem" class="row" data-i="${chats.indexOf(c)}" style="transform: translateY(${i * ROW}px)">
      <div class="avatar">${c.icon ? '<span data-icon="default-group"></span>' : ''}</div>
      <div class="body">
        <div class="line1"><div class="name"><span dir="auto" title="${esc(c.name)}">${esc(c.name)}</span></div>
          <div class="time">${esc(c.time)}</div></div>
        <div class="line2"><div class="preview">${status}${sender}<span dir="auto" title="${esc(c.preview)}">${esc(c.preview)}</span></div>
          <div>${c.muted ? '<span data-icon="muted"></span>' : ''}${c.pinned ? '<span data-icon="pinned2"></span>' : ''}${badge}</div></div>
      </div></div>`;
  }

  function renderList() {
    const pane = document.getElementById('pane-side');
    const grid = pane.querySelector('.grid');
    const list = visibleChats();
    grid.style.height = (list.length * ROW) + 'px';
    const top = pane.scrollTop - 150, bottom = pane.scrollTop + pane.clientHeight + 150;
    grid.innerHTML = list.map((c, i) => [c, i]).filter(([, i]) => i * ROW + ROW >= top && i * ROW <= bottom)
      .map(([c, i]) => rowHtml(c, i)).join('') || (filter === 'unread' ? '<div class="empty">No unread chats</div>' : '');
  }

  function renderMain() {
    const main = document.getElementById('main');
    if (!openChat) { main.innerHTML = ''; return; }
    const c = openChat;
    const msgs = (c.messages.length ? c.messages : [[c.sender || c.name, c.time, c.preview]]).map(([who, t, text]) =>
      `<div class="${c.fromMe ? 'message-out' : 'message-in'}"><div class="copyable-text" data-pre-plain-text="[${esc(t)}, 11/18/2026] ${esc(who)}: ">
         <span class="selectable-text copyable-text"><span>${esc(text)}</span></span></div></div>`).join('');
    main.innerHTML = `<header><span dir="auto" title="${esc(c.name)}">${esc(c.name)}</span></header><div class="msgs" role="application">${msgs}</div>`;
  }

  function closeMenu() { const m = document.getElementById('menu'); if (m) m.remove(); }

  function showApp() {
    root.innerHTML = `<div id="app"><div id="side">
        <div class="filters"><button aria-pressed="true">All</button><button>Unread</button><button>Favourites</button><button>Groups</button></div>
        <div id="pane-side"><div role="grid" aria-label="Chat list" class="grid"></div></div>
      </div><div id="main"></div></div>`;
    const pane = document.getElementById('pane-side');
    pane.addEventListener('scroll', renderList);
    document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
      filter = b.textContent.trim().toLowerCase();
      if (filter === 'favourites') filter = 'all';
      document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      pane.scrollTop = 0;
      renderList();
    }));
    pane.addEventListener('click', (e) => {
      const row = e.target.closest('[role="listitem"]');
      if (!row) return;
      closeMenu();
      openChat = chats[Number(row.dataset.i)];
      openChat.unread = 0; openChat.marked = false;
      renderMain(); renderList();
    });
    pane.addEventListener('contextmenu', (e) => {
      const row = e.target.closest('[role="listitem"]');
      if (!row) return;
      e.preventDefault();
      closeMenu();
      const chat = chats[Number(row.dataset.i)];
      const menu = document.createElement('div');
      menu.id = 'menu';
      menu.setAttribute('role', 'application');
      menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px';
      menu.innerHTML = '<ul>' + ['Archive chat', 'Mute notifications', 'Pin chat', 'Mark as unread', 'Delete chat']
        .map((t) => `<li role="button"><div>${t}</div></li>`).join('') + '</ul>';
      menu.addEventListener('click', (ev) => {
        const li = ev.target.closest('li');
        if (li && li.textContent.trim() === 'Mark as unread') { chat.marked = true; }
        closeMenu(); renderList();
      });
      document.body.appendChild(menu);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeMenu(); openChat = null; renderMain(); renderList(); }
    });
    renderList();
  }

  function showLogin() {
    root.innerHTML = `<div class="landing"><h1>Steps to log in</h1>
      <div data-ref="2@offline-test"><canvas aria-label="Scan this QR code to link a device!" width="200" height="200"></canvas></div>
      <button id="phone-login">Log in with phone number</button></div>`;
    const ctx = root.querySelector('canvas').getContext('2d');
    for (let x = 0; x < 20; x++) for (let y = 0; y < 20; y++) if ((x * 7 + y * 3) % 5 < 2) ctx.fillRect(x * 10, y * 10, 10, 10);
    document.getElementById('phone-login').addEventListener('click', () => {
      root.innerHTML = `<div class="landing"><h1>Enter phone number</h1><form onsubmit="return false">
        <input type="text" aria-label="Type your phone number."><button id="next">Next</button></form></div>`;
      document.getElementById('next').addEventListener('click', () => {
        root.innerHTML = `<div class="landing"><h1>Enter code on phone</h1>
          <div data-link-code="Q,R,A,1,K,7,Z,9">QRA1-K7Z9</div></div>`;
      });
    });
  }

  setTimeout(() => {
    if (mode === 'loading') return;
    if (mode === 'qr') showLogin(); else showApp();
  }, 400);
})();
</script>
</body>
</html>
