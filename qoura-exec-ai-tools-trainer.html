<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جلسة أدوات الذكاء الاصطناعي التنفيذية | نسخة المدرب | قُرى للذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#163832;--c:#A8703F;--rope:#C9A27A;--bg:#F6F1E8;--card:#FFFFFF;--ink:#16211F;--muted:#6B7A76;--line:#E3DACB;--ok:#2F7A4E;--soft:#EFE7DA;--late:#B4442F;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A;--late:#E07A63}}
:root[data-theme="dark"]{--bg:#0F1A18;--card:#172623;--ink:#E7EEEC;--muted:#A3B5B0;--line:#2C3E3A;--soft:#20322E;--c:#D39A68;--ok:#5DBB86;--rope:#8C6B4A;--late:#E07A63}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,system-ui,sans-serif;line-height:1.5}
html[lang=en] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.logo{background:#fff;border-radius:12px;padding:6px 10px}.logo img{height:46px;display:block}
.ht{flex:1;min-width:220px}.ht small{color:var(--c);font-weight:600}.ht h1{margin:0;font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.15}.ht p{margin:2px 0 0;color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center}
.lang{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.narrow{max-width:640px;margin-inline:auto}
h2{margin:0 0 6px;font-size:1.3rem}.sub{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--g);color:#fff;text-decoration:none;width:100%;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.cu{background:var(--c)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;font-weight:600}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
/* top */
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:860px){.top{grid-template-columns:1fr}}
.here{background:var(--g);color:#F6F1E8;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.here .col{flex:1;min-width:120px}.here small{display:block;color:#E2B48A;font-size:.78rem}.here b{font-size:1.1rem}
.here .hn{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;background:var(--c);color:#fff;font-size:.85rem;margin-inline-end:8px;vertical-align:middle;padding:0 4px}
.here .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
.here .sl{display:block;font-size:.8rem;color:#CFE0DA;margin-top:2px}
.ctrl{display:flex;flex-direction:column;gap:8px;margin:0}
.ctrl .row{display:flex;gap:8px}.ctrl .row .btn{margin:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:8px 10px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
/* timer */
.timer{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:12px 16px}
@media (max-width:860px){.timer{grid-template-columns:auto 1fr;}.timer .tst{grid-column:1/-1}.timer .tdel{justify-self:start}}
.tbtns{display:flex;gap:6px}
.tbtns button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
.tbtns button.go{background:var(--g);border-color:var(--g);color:#fff}
.tses small,.tst small{display:block;color:var(--muted);font-size:.78rem}
.tses b{font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}.tses span{color:var(--muted);font-size:.9rem}
.tst .bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}.tst .bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.tst.over .bar i{background:var(--late)}
.tst b{font-variant-numeric:tabular-nums}
.tdel{border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;background:var(--soft);white-space:nowrap}
.tdel.late{background:color-mix(in srgb,var(--late) 16%,transparent);color:var(--late)}.tdel.early{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
/* map */
.map{position:relative;width:100%;aspect-ratio:1200/1730;container-type:inline-size;margin-top:6px}
.map svg.rope{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;transform:translate(-50%,-50%);width:11.6cqw;display:flex;justify-content:center}
.st .ttl{position:absolute;bottom:calc(50% + 3.8cqw);left:50%;transform:translateX(-50%);width:11.6cqw;text-align:center}
.st .ttl b{display:block;font-size:1.45cqw;line-height:1.15;color:var(--ink)}
.st .ttl span{display:block;font-size:.95cqw;color:var(--muted)}
.st.dim .ttl b{color:var(--muted)}
.here-tag{display:table!important;margin:0 auto .4cqw!important;background:var(--c);color:#fff!important;font-size:1cqw!important;font-weight:700;border-radius:999px;padding:.2cqw .8cqw}
.opt-tag{display:table!important;margin:0 auto .4cqw!important;border:1px dashed var(--muted);color:var(--muted)!important;font-size:.9cqw!important;border-radius:999px;padding:.1cqw .7cqw}
.dot{position:relative;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--card);border:.25cqw solid var(--rope);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.08)}
.dot img{width:3cqw;height:3cqw;object-fit:contain}
.dot svg{width:2.6cqw;height:2.6cqw;stroke:var(--ink)}
.dot .n{position:absolute;top:-.6cqw;inset-inline-end:-.6cqw;min-width:2cqw;height:2cqw;border-radius:50%;background:var(--c);color:#fff;font-size:1.05cqw;font-weight:700;display:grid;place-items:center;border:.2cqw solid var(--card)}
.st.done .dot{border-color:var(--ok)}.st.done .dot .n{background:var(--ok)}
.st.cur .dot{border-color:var(--c);box-shadow:0 0 0 1cqw color-mix(in srgb,var(--c) 22%,transparent)}
.st.skip .dot{border-style:dashed;opacity:.6}
.dot .l2{position:absolute;bottom:-.5cqw;inset-inline-start:-.5cqw;width:2.3cqw;height:2.3cqw;border-radius:50%;background:#fff;border:.15cqw solid var(--line);display:grid;place-items:center}.dot .l2 img{width:1.5cqw!important;height:1.5cqw!important}
.dpill{position:absolute;top:calc(50% + 3.4cqw);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.95cqw;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:0 .6cqw}
.st.cur .dpill{color:var(--c)}.st.skip .dpill{border:1px dashed var(--muted)}
.chips{position:absolute;top:calc(50% + 5.4cqw);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5cqw;width:11.4cqw}
.chips.two{display:grid;grid-template-columns:1fr 1fr;width:17cqw;gap:.35cqw}.chips.two .chip{font-size:.85cqw;padding:.25cqw .5cqw}
.chips.logos{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;width:22cqw;background:var(--card);border:1px solid var(--line);border-radius:1.2cqw;padding:.8cqw}
.chip{display:flex;align-items:center;justify-content:center;gap:.5cqw;width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35cqw .7cqw;font-size:.95cqw;font-weight:600;white-space:nowrap;box-shadow:0 .15cqw .4cqw rgba(0,0,0,.05)}
.chip img{background:#fff;border-radius:.3cqw}
.chips.logos .chip{width:auto;border-radius:999px;padding:.3cqw .8cqw}
.chip img{width:1.4cqw;height:1.4cqw;object-fit:contain}
.st.cur .chip{border-color:var(--c)}
.modl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.modl b{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:.3cqw 1.2cqw;font-size:1.15cqw}
.modl b i{font-style:normal;color:#E2B48A;margin-inline-start:.6cqw}
.modl.cur b{background:var(--c)}.modl.cur b i{color:#fff}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
/* mobile list */
.list{display:none}
@media (max-width:760px){.map{display:none}.list{display:block}}
.lday{margin:16px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.lday b{background:var(--g);color:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}.lday span{color:var(--c);font-weight:600;font-size:.85rem}
.li{display:flex;gap:12px;align-items:flex-start;position:relative;padding:8px 0 14px;cursor:pointer;width:100%;text-align:start;background:none;border:0}
.li::before{content:"";position:absolute;inset-inline-start:25px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--rope) 0 6px,color-mix(in srgb,var(--rope) 70%,#000) 6px 9px);border-radius:4px;opacity:.85}
.li.done::before{background:repeating-linear-gradient(45deg,#2F5D4E 0 6px,#183A32 6px 9px)}
.li .dot{width:58px;height:58px;flex:0 0 58px;z-index:1;border-width:3px}
.li .dot img{width:30px;height:30px}.li .dot svg{width:26px;height:26px}
.li .dot .n{min-width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px;border-width:2px}
.li.cur .dot{border-color:var(--c)}.li.skip .dot{border-style:dashed;opacity:.6}
.li .tx b{display:block;font-size:1.05rem}.li .tx span{color:var(--muted);font-size:.85rem}
.li .tg{font-size:.72rem;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.li .tg.o{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.li .dot .l2,.dh .dot .l2{width:24px;height:24px;bottom:-5px;inset-inline-start:-5px;border-width:1.5px}.li .dot .l2 img,.dh .dot .l2 img{width:16px!important;height:16px!important}
/* drawer */
.dr{position:fixed;inset:0;background:rgba(15,26,24,.45);display:flex;justify-content:flex-start;z-index:20}
.dr[hidden]{display:none}
.dp{background:var(--card);width:min(500px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.dr{align-items:flex-end}.dp{height:88%;border-radius:18px 18px 0 0;width:100%}}
.dh{display:flex;align-items:center;gap:12px;position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));background:var(--card);z-index:2;margin:calc(-16px - env(safe-area-inset-top,0px)) -18px 0;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;border-bottom:1px solid var(--line)}
.dh .dot{width:56px;height:56px;flex:0 0 56px;cursor:default;border-width:3px}.dh .dot img{width:30px;height:30px}.dh .dot svg{width:26px;height:26px}.dh .dot .n{min-width:22px;height:22px;font-size:.72rem;top:-6px;inset-inline-end:-6px;border-width:2px}
.dh h2{margin:0}.dh .meta{color:var(--muted);font-size:.85rem}
.dclose{margin-inline-start:auto}
.task{margin-top:12px;background:var(--soft);border-radius:10px;padding:10px 12px}.task small{display:block;color:var(--muted);font-weight:600}
.task.tn{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--card))}.task.tn small{color:var(--c)}
h3{font-size:.95rem;margin:16px 0 6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchips span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600}
.tchips img{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:4px}
.tchips.br span{border-style:dashed}
details.pr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);margin-bottom:6px}
details.pr summary{cursor:pointer;font-size:.9rem}details.pr summary b{color:var(--c);margin-inline-end:4px}
.pmeta{font-size:.76rem;color:var(--muted);margin:6px 0 4px}
.ptext{font-size:.88rem;line-height:1.6;white-space:pre-wrap;background:var(--card);border-radius:8px;padding:8px 10px}
.cp{margin-top:6px;border:0;border-radius:8px;padding:5px 12px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;font-size:.8rem}
ol.steps{margin:0;padding-inline-start:20px}ol.steps li{margin:3px 0}
.dfoot{display:flex;gap:8px;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--line)}.dfoot .btn{margin-top:0;flex:1;padding:10px 12px;font-size:.9rem}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}
.foot a{color:var(--c)}
</style></head><body>

const ICON={play:'<path d="M7 4v16l13-8z"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',prompt:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M12 15h5"/>',
 agent:'<rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4"/><circle cx="12" cy="3.5" r="1"/><path d="M9 13h.01M15 13h.01"/><path d="M9.5 16.5h5"/>',
 server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/><path d="M15 7.5h3M15 16.5h3"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'};
const T={ar:{dir:"rtl",lang:"English",kick:"قُرى للذكاء الاصطناعي · جلسة تنفيذية · نسخة المدرب",h1:"جلسة أدوات الذكاء الاصطناعي",hp:"للقيادات التنفيذية · سبع مراحل · من خريطة الأدوات إلى بناء وكيلك الأول",
 tv:"نسخة المدرب",pin:"أدخل الرقم السري للمدرب",pinBad:"الرقم غير صحيح",enter:"دخول",
 here:"المحطة الحالية",next:"التالية",prevSt:"السابقة",nextSt:"التالية",mod:"المرحلة",min:"د",
 plan:"الجلسة: ساعتان · 120 دقيقة · 20 محطة",opt:"اختياري في نسخة الساعتين",optS:"اختياري",
 ses:"زمن الجلسة",of:"من",stt:"هذه المحطة",start:"ابدأ المؤقت",pause:"إيقاف مؤقت",reset:"تصفير المؤقت",resetAsk:"تصفير مؤقت الجلسة؟",
 onTime:"في الموعد",late:m=>`متأخر ${m} د`,early:m=>`متقدم ${m} د`,idle:"المؤقت متوقف",left:m=>`متبقٍ ${m} د`,
 goal:"الهدف",tools:"الأدوات",brs:"المحاور",steps:"خطوات العرض",cmds:"الأوامر",runIn:"الأداة",copyP:"نسخ",copiedP:"تم النسخ",
 tnotes:"ملاحظات المدرب",close:"إغلاق",
 lg:["تمّت","المحطة الحالية","قادمة","اختيارية (ساعتان)"],
 foot:"قُرى للذكاء الاصطناعي · أداة المدرب لجلسة أدوات الذكاء الاصطناعي للقيادات التنفيذية"},
 en:{dir:"ltr",lang:"عربي",kick:"Qoura AI · Executive session · Trainer version",h1:"AI Tools Session",hp:"For senior leaders · seven milestones · from the tools map to building an agent",
 tv:"Trainer version",pin:"Enter the trainer PIN",pinBad:"Wrong PIN",enter:"Enter",
 here:"Current station",next:"Next",prevSt:"Previous",nextSt:"Next",mod:"Milestone",min:"min",
 plan:"Session: 2 hours · 120 minutes · 20 stations",opt:"Optional in the 2-hour version",optS:"Optional",
 ses:"Session time",of:"of",stt:"This station",start:"Start timer",pause:"Pause",reset:"Reset timer",resetAsk:"Reset the session timer?",
 onTime:"On time",late:m=>`${m} min behind`,early:m=>`${m} min ahead`,idle:"Timer stopped",left:m=>`${m} min left`,
 goal:"Goal",tools:"Tools",brs:"Focus areas",steps:"Demo steps",cmds:"Prompts",runIn:"Run in",copyP:"Copy",copiedP:"Copied",
 tnotes:"Trainer notes",close:"Close",
 lg:["Done","Current","Upcoming","Optional (2 hours)"],
 foot:"Qoura AI · Trainer tool for the AI Tools Session for senior leaders"}};
const K="qai-exec-tools-trainer";let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")||{}}catch(e){S={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let lang=S.lang||"ar";S.mode="2h";if(!S.cur)S.cur="0";
const $=i=>document.getElementById(i);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=s=>S.mode==="2h"?s.h2:s.h3;
const skip=s=>S.mode==="2h"&&s.h2===0;
const active=()=>ST.filter(s=>!skip(s));
const total=()=>ST.reduce((a,s)=>a+dur(s),0);
const modDur=m=>ST.filter(s=>s.mod===m).reduce((a,s)=>a+dur(s),0);
const plannedStart=id=>{let a=0;for(const s of ST){if(s.id===id)return a;a+=dur(s);}return a;};
const now=()=>Date.now();
const elapsed=()=>(S.acc||0)+(S.run?now()-(S.since||now()):0);
const fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(s).padStart(2,"0");};
const logoOf=n=>LOGO[n]?n:null;
const dotHTML=s=>{const lg=s.icon?null:logoOf(s.tools[0]||"");const l2=lg==="Excel"&&s.tools[1]?logoOf(s.tools[1]):null;
 return `<span class="dot">${l2?`<span class="l2"><img src="${LOGO[l2]}" alt=""></span>`:""}${lg?`<img src="${LOGO[lg]}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[s.icon||"layers"]}</svg>`}<span class="n">${s.id==="19"?"✓":s.id==="0"?"▶":s.id}</span></span>`;};
const modName=m=>MODS[m][lang];
const modLabel=m=>modName(m);

function setCur(id){S.cur=id;S.enterEl=elapsed();save();render();}
function step(dir){const a=active();let i=a.findIndex(s=>s.id===S.cur);if(i<0){const all=ST.findIndex(s=>s.id===S.cur);i=a.findIndex(s=>+s.id>all)-(dir>0?1:0);}
 const j=Math.min(a.length-1,Math.max(0,i+dir));if(a[j]&&a[j].id!==S.cur)setCur(a[j].id);}

function mapHTML(t){const cur=S.cur,ci=ST.findIndex(s=>s.id===cur);const lastDone=ci>0?pdist(ST[ci-1].id):0;
 let h=`<div class="map"><svg class="rope" viewBox="0 0 1200 1730" aria-hidden="true"><defs><pattern id="tw" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="var(--rope)"/><rect width="5" height="14" fill="#8A5A34" opacity=".55"/></pattern><pattern id="tg" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#2F5D4E"/><rect width="5" height="14" fill="#122C25"/></pattern></defs>
  <path d="${ROPE}" fill="none" stroke="url(#tw)" stroke-width="22" stroke-linecap="round"/><path d="${ROPE}" fill="none" stroke="url(#tg)" stroke-width="22" stroke-dasharray="${lastDone} 99999" stroke-linecap="round"/>
  <circle cx="1165" cy="215" r="18" fill="var(--c)"/><path d="M1171 207 L1160 215 L1171 223Z" fill="#fff"/></svg>`;
 const curMod=ST[ci].mod;
 MODL.forEach(([m,x,y])=>{const md=modDur(m);h+=`<div class="modl ${m===curMod?"cur":""}" style="left:${x/12}%;top:${y/17.3}%"><b><bdi dir="${lang==="ar"?"rtl":"ltr"}">${esc(modName(m))}</bdi> <i><bdi>${md?md+" "+t.min:t.optS}</bdi></i></b></div>`;});
 ST.forEach((s,k)=>{const [x,y]=POS[s.id];const L=s[lang];const cls=(k<ci?"done ":"")+(s.id===cur?"cur ":"")+(k>ci?"dim ":"")+(skip(s)?"skip":"");
  const ch=s.chips&&s.chips.length?`<div class="chips ${s.id==="1"?"two":""}">${s.chips.map(([lb,lk])=>`<span class="chip">${LOGO[lk]?`<img src="${LOGO[lk]}" alt="">`:""}<bdi>${esc(lb)}</bdi></span>`).join("")}</div>`:"";
  const tag=s.id===cur?`<span class="here-tag">${t.here}</span>`:"";
  const dp=`<span class="dpill">${skip(s)?t.optS:`<bdi>${dur(s)} ${t.min}</bdi>`}</span>`;
  h+=`<div class="st ${cls}" style="left:${x/12}%;top:${y/17.3}%"><div class="ttl">${tag}<b>${esc(L.nm)}</b><span><bdi>${esc(L.sub)}</bdi></span></div><button type="button" data-st="${s.id}" aria-label="${esc(L.nm)}" style="background:none;border:0;padding:0">${dotHTML(s)}</button>${dp}${ch}</div>`;});
 return h+`</div>`;}
function listHTML(t){const ci=ST.findIndex(s=>s.id===S.cur);let h=`<div class="list">`;MODS.forEach(m=>{const sts=ST.filter(s=>s.mod===m.id);if(!sts.length)return;
  h+=`<div class="lday"><b><bdi dir="${lang==="ar"?"rtl":"ltr"}">${esc(modName(m.id))}</bdi></b><span><bdi>${modDur(m.id)?modDur(m.id)+" "+t.min:t.optS}</bdi></span></div>`;
  sts.forEach(s=>{const k=ST.indexOf(s),L=s[lang];h+=`<button type="button" class="li ${k<ci?"done":""} ${s.id===S.cur?"cur":""} ${skip(s)?"skip":""}" data-st="${s.id}">${dotHTML(s)}<span class="tx"><b>${esc(L.nm)}${s.id===S.cur?`<span class="tg">${t.here}</span>`:skip(s)?`<span class="tg o">${t.optS}</span>`:""}</b><span><bdi>${esc(L.sub)}</bdi> · <bdi>${dur(s)||s.h3} ${t.min}</bdi></span></span></button>`;});});
 return h+`</div>`;}

function timerHTML(t){return `<div class="card timer" id="timer">
 <div class="tbtns"><button type="button" id="tgo" class="${S.run?"":"go"}" aria-label="${S.run?t.pause:t.start}" title="${S.run?t.pause:t.start}">${S.run?"❚❚":"▶"}</button><button type="button" id="trs" aria-label="${t.reset}" title="${t.reset}">↺</button></div>
 <div class="tses"><small>${t.ses}</small><b id="tel">0:00</b> <span>${t.of} ${total()} ${t.min}</span></div>
 <div class="tst" id="tstw"><small id="tstl"></small><div class="bar"><i id="tbar" style="width:0%"></i></div></div>
 <div class="tdel" id="tdel"></div></div>`;}
function tick(){if(!$("tel"))return;const t=T[lang],el=elapsed(),cs=ST.find(s=>s.id===S.cur),d=dur(cs)||cs.h3,enter=S.enterEl||0,se=Math.max(0,el-enter);
 $("tel").textContent=fmt(el);
 $("tstl").textContent=`${t.stt}: ${fmt(se)} ${t.of} ${d} ${t.min}`;
 const p=Math.min(100,se/(d*60000)*100);$("tbar").style.width=p+"%";$("tstw").classList.toggle("over",se>d*60000);
 const del=$("tdel");del.className="tdel";
 if(!S.run&&!el){del.textContent=t.idle;return;}
 const delta=Math.round(((enter-plannedStart(S.cur)*60000)+Math.max(0,se-d*60000))/60000);
 if(delta>0){del.textContent=t.late(delta);del.classList.add("late");}else if(delta<0){del.textContent=t.early(-delta);del.classList.add("early");}else del.textContent=t.onTime;}
setInterval(tick,1000);

function renderTrainer(t){
 if(TRAINER_PIN&&!S.tok){$("app").innerHTML=`<div class="card narrow"><h2>${t.tv}</h2><label for="pinI"><b>${t.pin}</b></label><input id="pinI" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px"><p class="note" id="pinE" hidden>${t.pinBad}</p><button class="btn" type="button" id="pinB">${t.enter}</button></div>`;
  const go=()=>{if($("pinI").value===TRAINER_PIN){S.tok=1;save();render();}else $("pinE").hidden=false;};$("pinB").onclick=go;$("pinI").onkeydown=e=>{if(e.key==="Enter")go();};return;}
 const a=active(),cs=ST.find(s=>s.id===S.cur),ai=a.findIndex(s=>s.id===S.cur);
 const nx=ai>=0?a[ai+1]:a.find(s=>+s.id>+S.cur);const L=cs[lang];
 $("app").innerHTML=`<div class="top"><div class="here"><div class="col"><small>${t.here} · <bdi dir="${lang==="ar"?"rtl":"ltr"}">${esc(modName(cs.mod))}</bdi></small><b><span class="hn">${cs.id==="0"?"▶":cs.id}</span>${esc(L.nm)}</b><span class="sl"><bdi>${dur(cs)||cs.h3} ${t.min}</bdi></span></div><span class="sep"></span><div class="col"><small>${t.next}</small><b>${nx?`<span class="hn">${nx.id}</span>${esc(nx[lang].nm)}`:"—"}</b>${nx?`<span class="sl"><bdi>${dur(nx)||nx.h3} ${t.min}</bdi></span>`:""}</div></div>
 <div class="card ctrl"><div class="row"><button class="btn alt" type="button" id="tp" ${ai<=0&&S.cur==="0"?"disabled":""}>${lang==="ar"?"→":"←"} ${t.prevSt}</button><button class="btn" type="button" id="tn" ${nx?"":"disabled"}>${t.nextSt} ${lang==="ar"?"←":"→"}</button></div>
 <p class="note" style="margin:0;text-align:center">${t.plan}</p></div></div>
 ${timerHTML(t)}
 ${mapHTML(t)}${listHTML(t)}
 <div class="legend"><span><i style="background:#2F5D4E"></i>${t.lg[0]}</span><span><i style="background:var(--c)"></i>${t.lg[1]}</span><span><i style="border:2px solid var(--rope)"></i>${t.lg[2]}</span></div>`;
 $("tp").onclick=()=>step(-1);$("tn").onclick=()=>step(1);
 $("tgo").onclick=()=>{if(S.run){S.acc=elapsed();S.run=false;}else{S.since=now();S.run=true;if(S.enterEl==null)S.enterEl=S.acc||0;}save();render();};
 $("trs").onclick=()=>{if(confirm(t.resetAsk)){S.acc=0;S.run=false;S.since=null;S.enterEl=0;save();render();}};
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>openStation(b.dataset.st));tick();}

function stationPanel(s,t){const L=s[lang];
 return `<div class="dh">${dotHTML(s)}<div><h2>${esc(L.nm)}</h2><div class="meta"><bdi dir="${lang==="ar"?"rtl":"ltr"}">${esc(modName(s.mod))}</bdi> · <bdi>${dur(s)||s.h3} ${t.min}</bdi></div></div><button class="mini dclose" type="button" id="dclose">${t.close}</button></div>
 <div class="task"><small>${t.goal}</small>${esc(L.goal)}</div>
 ${skip(s)?`<p class="note">◌ ${t.opt}</p>`:""}
 ${s.br?`<h3>${t.brs}</h3><div class="tchips br">${s.br[lang].map(b=>`<span>${esc(b)}</span>`).join("")}</div>`:""}
 ${s.chips&&s.chips.length?`<h3>${t.tools}</h3><div class="tchips">${s.chips.map(([lb,lk])=>`<span>${LOGO[lk]?`<img src="${LOGO[lk]}" alt="">`:""}<bdi>${esc(lb)}</bdi></span>`).join("")}</div>`:""}
 <h3>${t.steps}</h3><ol class="steps">${L.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
 ${s.P.length?`<h3>${t.cmds} (${s.P.length})</h3>${s.P.map((p,i)=>`<details class="pr" ${i===0?"open":""}><summary><b><bdi>${p[0]}</bdi></b> ${esc(lang==="ar"?p[2]:p[1])}</summary><div class="pmeta">${t.runIn}: <bdi>${esc(p[3])}</bdi></div><div class="ptext" dir="${lang==="ar"?"rtl":"ltr"}">${esc(lang==="ar"?p[5]:p[4])}</div><button class="cp" type="button" data-i="${i}">${t.copyP}</button></details>`).join("")}`:""}
 <div class="task tn"><small>${t.tnotes}</small>${esc(L.notes).replace(/(\d+\.[A-Z])/g,'<bdi dir="ltr">$1</bdi>')}</div>
 <div class="dfoot"><button class="btn alt" type="button" id="dclose2">${t.close}</button></div>`;}
function openStation(id){S.sel=id;const t=T[lang],s=ST.find(x=>x.id===id);$("dp").innerHTML=stationPanel(s,t);$("dr").hidden=false;
 $("dclose").onclick=closeDr;$("dclose").focus();$("dclose2").onclick=closeDr;
 $("dp").querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const p=s.P[+b.dataset.i],x=lang==="ar"?p[5]:p[4];try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove();}b.textContent=t.copiedP;setTimeout(()=>b.textContent=t.copyP,1500);});}
function closeDr(){$("dr").hidden=true;S.sel=null;render();}
$("dr").addEventListener("click",e=>{if(e.target.id==="dr")closeDr();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("dr").hidden){closeDr();return;}if(!$("dr").hidden||(TRAINER_PIN&&!S.tok))return;if(e.target.closest&&e.target.closest("input,textarea"))return;
 const rtl=lang==="ar";if(e.key===(rtl?"ArrowLeft":"ArrowRight"))step(1);if(e.key===(rtl?"ArrowRight":"ArrowLeft"))step(-1);});
function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir;
 ["kick","h1","hp"].forEach(k=>$(k).textContent=t[k]);$("lang").textContent=t.lang;
 $("foot").textContent=t.foot;
 renderTrainer(t);}
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";S.lang=lang;save();render();if(!$("dr").hidden&&S.sel)openStation(S.sel);};
render();
</script></body></html>
